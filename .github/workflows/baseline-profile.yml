name: baseline-profile (emulator)

# perf-smooth-4: generate the ART baseline profile on the KVM emulator and
# commit it. Every later release build embeds the profile, so a FRESH INSTALL
# starts with AOT-compiled hot paths instead of cold-JIT lag for its first
# sessions — the single biggest real-device smoothness lever left.
#
# Dispatch-only. Generator: :benchmark BaselineProfileGenerator (cold start,
# onboarding exit, composer+typing, transcript fling, drawer).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baseline-profile-emulator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Add adb to PATH
        run: echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install emulator + system image
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64"

      - name: Enable KVM
        run: |
          ls -la /dev/kvm || true
          sudo chmod 666 /dev/kvm || true

      # Same hardened boot as smooth-check.yml (see the notes there: pinned
      # ANDROID_AVD_HOME, bounded waits, -feature -Vulkan).
      - name: Boot emulator
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n perf -k "system-images;android-34;google_apis;x86_64" -d pixel_6 --force
          nohup "$ANDROID_HOME/emulator/emulator" -avd perf \
            -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -accel on \
            -feature -Vulkan -no-metrics \
            -memory 4096 -cores 4 -no-snapshot \
            -camera-back none -camera-front none \
            > /tmp/emulator.log 2>&1 &
          sleep 20
          pgrep -f qemu >/dev/null || { echo "::error::emulator process died at launch"; tail -60 /tmp/emulator.log; exit 1; }
          timeout 240 adb wait-for-device || { echo "::error::adb never saw the device"; tail -60 /tmp/emulator.log; exit 1; }
          timeout 300 bash -c 'while [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" != "1" ]; do sleep 3; done' \
            || { echo "::error::boot_completed never reached 1"; tail -60 /tmp/emulator.log; exit 1; }
          adb shell input keyevent 82 || true
          sleep 8
          adb devices

      - name: Diagnose registered baseline tasks
        working-directory: android
        run: |
          gradle --no-build-cache --max-workers=2 :app:tasks --all 2>/dev/null | grep -iE "baseline|profile" || echo "NO baseline/profile tasks in :app"
          gradle --no-build-cache --max-workers=2 :benchmark:tasks --all 2>/dev/null | grep -iE "baseline|profile" || echo "NO baseline/profile tasks in :benchmark"

      - name: Generate baseline profile
        working-directory: android
        run: gradle --no-build-cache --max-workers=2 :app:generateReleaseBaselineProfile --stacktrace

      - name: Show generated profile
        run: |
          find android/app/src -name "*baseline*" -type f | sed -n '1,10p'
          for f in $(find android/app/src -name "*.txt" -path "*aseline*" -type f); do
            echo "--- $f ($(wc -l < "$f") rules) ---"
            head -20 "$f"
          done

      - name: Commit generated profile
        run: |
          git config user.name "perf-bot"
          git config user.email "perf-bot@users.noreply.github.com"
          git add android/app/src
          if git diff --cached --quiet; then
            echo "no profile changes"
          else
            git commit -m "perf: baseline profile generated on emulator [skip ci]"
            git push origin main
          fi

      - name: Upload profile artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: android/app/src/**/baselineProfiles/**
          if-no-files-found: warn
