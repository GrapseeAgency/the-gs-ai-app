name: android-native

# Cross-compiles libgs_ffi.so for the four Android ABIs and attaches one
# artifact per ABI. Binaries are artifacts, never git: the repo carries source
# only.
#
# The mobile build is PORTABLE-ONLY by design. ONNX Runtime, llama.cpp and
# Tesseract have no drop-in prebuilts for arm64 Android, and a 300 MB decode
# engine inside a phone binary is not the product. gs-ffi detects an Android
# target in build.rs and links only the portable C++ surface, whose
# backend-dependent entry points report GS_ERR_UNAVAILABLE with a reason.
# That is what the host app's local-first routing checks.

on:
  workflow_dispatch:
  push:
    branches: [native-runtime]
    paths:
      - 'native/**'
      - '.github/workflows/android-native.yml'
      - '.cargo/config.toml'

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMDLINE_VERSION: 11076708
  NDK_VERSION: 25.2.9519653
  # Consumed by gs-ffi/build.rs on the desktop only; the Android target path
  # ignores it and compiles portable-only.
  GS_ALLOW_MISSING_ONNX: "1"

jobs:
  build:
    name: ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triple: aarch64-linux-android
            target: aarch64-linux-android
          - abi: armeabi-v7a
            triple: armv7a-linux-androideabi
            target: armv7-linux-androideabi
          - abi: x86_64
            triple: x86_64-linux-android
            target: x86_64-linux-android
          - abi: x86
            triple: i686-linux-android
            target: i686-linux-android

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The JNI bridge is `#[cfg(target_os = "android")]` by default, so a type
      # error in it is invisible to `cargo test` and to `cargo build` on a host.
      # That is not theoretical: nine E0308 errors sat in src/jni.rs until the
      # arm64 build ran (run 36374643605). This step is the fix for the blind
      # spot — a few seconds of host compilation, before the NDK is even
      # installed. It needs no ONNX and no llama.cpp, so it is the cheapest
      # possible place to catch the class of error that was invisible.
      - name: Type-check the JNI bridge on the host
        working-directory: native
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo check -p gs-ffi --features jni-typecheck

      - name: Install Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add ${{ matrix.target }}
          rustc --version

      # ATTEMPT 1 FAILED HERE. Raw error from run 36345064039, job arm64-v8a:
      #   /home/runner/work/_temp/f7d0910b-....sh: line 6: sdkmanager: command not found
      #   ##[error]Process completed with exit code 127.
      # The image ships an ANDROID_HOME with no command-line tools, so sdkmanager
      # is absent and every one of the four ABIs failed identically. Installed
      # from the Google zip rather than assuming the image provides it.
      - name: Install Android command-line tools and NDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd /tmp
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_VERSION}_latest.zip"
          unzip -q "commandlinetools-linux-${CMDLINE_VERSION}_latest.zip"
          # The zip unpacks cmdline-tools/, but the SDK requires the
          # *latest/* layout or every sdkmanager invocation fails.
          mv cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          echo "ANDROID_HOME=$SDK_ROOT"   >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          # Both names, same path. The image ships NDK 27.3.13750724 and
          # cargo-ndk 4 resolves the disagreement by preferring whichever
          # variable it sees, which silently built against an NDK this job did
          # not install:
          #   warning: Environment variable `ANDROID_NDK_HOME =
          #     "/home/runner/android-sdk/ndk/25.2.9519653"` doesn't match
          #     `ANDROID_NDK_ROOT = "/usr/local/lib/android/sdk/ndk/27.3.13750724"`
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          # Assert the tool exists BEFORE relying on it. The previous failure
          # was a missing binary discovered three steps later.
          command -v sdkmanager
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "ndk;$NDK_VERSION" "platform-tools" >/dev/null
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" >/dev/null

          test -d "$SDK_ROOT/ndk/$NDK_VERSION" || {
            echo "NDK $NDK_VERSION missing"; exit 1; }
          ls "$SDK_ROOT/ndk/$NDK_VERSION/toolchains/llvm/prebuilt"

      - name: Install cargo-ndk
        run: |
          set -euo pipefail
          cargo install cargo-ndk --locked
          cargo ndk --version

      - name: Build libgs_ffi.so
        working-directory: native
        run: |
          set -euo pipefail
          # cargo-ndk sets CC_*_ANDROID_LINKER and friends for the targets it is
          # given. There is no `cargo ndk env` subcommand and no ndk-env file to
          # source: attempt 2 failed with
          #     error: no such command: `env`
          #     help: a command with a similar name exists: `new`
          cargo ndk \
            -t ${{ matrix.target }} \
            -o "$GITHUB_WORKSPACE/dist/android/${{ matrix.abi }}" \
            build --release -p gs-ffi --lib

          # ATTEMPT 5. cargo-ndk printed
          #     Copying libraries to .../dist/android/arm64-v8a
          # and then copied NOTHING, so the verify step died on
          #     MISSING: .../dist/android/arm64-v8a/libgs_ffi.so
          # with no indication of where the library actually went. Rather than
          # trust the copy, find the artifact and place it explicitly -- and say
          # which path it came from, so the next failure is diagnosable from the
          # log instead of requiring a re-run.
          # SHIP THE COMPANION. Raw, run 36425439967, the first run to execute a
          # test with the library actually in the APK:
          #     java.lang.UnsatisfiedLinkError: dlopen failed: library
          #     "libc++_shared.so" not found: needed by
          #     .../base.apk!/lib/x86_64/libgs_ffi.so
          #
          # Attempt 1 was `-C link-arg=-static-libstdc++`, which does not even
          # parse here:
          #     error: unexpected argument '-C' found
          # cargo ndk has no `--` passthrough for rustc flags.
          #
          # Shipping it is the correct answer anyway, not a fallback: this app
          # links onnxruntime, Tesseract/Leptonica and stable-diffusion.cpp, all
          # of which are C++ and all of which will need libc++_shared.so. An APK
          # for this product carries it regardless of what gs-ffi does.
          DIST="$GITHUB_WORKSPACE/dist/android/${{ matrix.abi }}"
          CPP="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.triple }}/libc++_shared.so"
          if [ ! -f "$CPP" ]; then
            echo "::error::no libc++_shared.so at $CPP"
            exit 1
          fi
          cp "$CPP" "$DIST/libc++_shared.so"
          ls -l "$DIST/"

          # COMPLETENESS, NOT A GUESS. A JNI library that will not dlopen without
          # a second .so is not self-contained, and the missing companion is
          # invisible until System.loadLibrary on a device: the APK builds, the
          # install succeeds, the ELF machine is right, and only dlopen reveals
          # it. So read the DT_NEEDED of what was just built and require that
          # every non-system dependency is physically present beside it.
          #
          # This is deliberately not "is libc++_shared there" -- that was the
          # previous assertion and it would have passed a library missing some
          # other companion. Anything dlopen would need must be in this directory.
          echo "=== DT_NEEDED completeness check ==="
          MISSING=""
          for NEED in $(readelf -d "$DIST/libgs_ffi.so" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p'); do
            case "$NEED" in
              libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libz.so|libjnigraphics.so|libEGL.so|libGLESv2.so|libOpenSLES.so|libnativewindow.so)
                echo "  system  $NEED" ;;
              *)
                if [ -f "$DIST/$NEED" ]; then
                  echo "  present $NEED"
                else
                  echo "  MISSING $NEED"
                  MISSING="$MISSING $NEED"
                fi ;;
            esac
          done
          if [ -n "$MISSING" ]; then
            echo "::error::libgs_ffi.so needs$MISSING and none is in $DIST."
            echo "The APK would build, install, and then fail at System.loadLibrary."
            exit 1
          fi
          echo "  every dlopen dependency is accounted for"

          TRI="${{ matrix.target }}"
          DEST="$GITHUB_WORKSPACE/dist/android/${{ matrix.abi }}"
          mkdir -p "$DEST"
          FOUND=""
          for CANDIDATE in \
            "$DEST/libgs_ffi.so" \
            "target/$TRI/release/libgs_ffi.so" \
            "target/$TRI/release/deps/libgs_ffi.so"; do
            if [ -f "$CANDIDATE" ]; then FOUND="$CANDIDATE"; break; fi
          done
          if [ -z "$FOUND" ]; then
            echo "MISSING: libgs_ffi.so for $TRI. What is actually there:"
            find target -name 'libgs_ffi*' -o -name '*.so' | sed -n '1,40p' || true
            echo "--- and the crate types gs-ffi declares ---"
            sed -n '/^\[lib\]/,/^\[/p' crates/gs-ffi/Cargo.toml
            exit 1
          fi
          echo "found: $FOUND"
          if [ "$FOUND" != "$DEST/libgs_ffi.so" ]; then
            cp "$FOUND" "$DEST/libgs_ffi.so"
            echo "copied to $DEST/libgs_ffi.so"
          fi
          file "$DEST/libgs_ffi.so"
          # A cdylib that exists but exports nothing loads and fails at the
          # first call, so the ABI is asserted, not assumed.
          N=$(nm -D --defined-only "$DEST/libgs_ffi.so" | grep -c 'gs_ffi_mobile_' || true)
          echo "gs_ffi_mobile_* exported: $N"
          [ "$N" -ge 8 ] || {
            echo "FAIL: expected >=8 gs_ffi_mobile_* exports, got $N"; exit 1; }

      - name: Verify the artifact
        run: |
          set -euo pipefail
          SO="$GITHUB_WORKSPACE/dist/android/${{ matrix.abi }}/libgs_ffi.so"
          test -f "$SO" || { echo "MISSING: $SO"; exit 1; }
          echo "=== file ==="
          file "$SO"
          stat -c '%s bytes' "$SO"
          # A .so with no exported symbols loads and fails at the first call, so
          # the ABI is asserted, not assumed.
          echo "=== exported ABI ==="
          nm -D --defined-only "$SO" | grep -oE 'gs_[A-Za-z_0-9]+' | sort -u
          COUNT=$(nm -D --defined-only "$SO" | grep -c 'gs_ffi_mobile_' || true)
          echo "gs_ffi_mobile_* exported: $COUNT"
          [ "$COUNT" -ge 8 ] || {
            echo "FAIL: expected >=8 gs_ffi_mobile_* exports, found $COUNT"; exit 1; }
          # The JNI entry points must be present or the Kotlin bridge cannot
          # bind at all.
          JNI=$(nm -D --defined-only "$SO" | grep -c 'Java_com_grapsee_gsai_native_GsNative_' || true)
          echo "JNI entry points: $JNI"
          case "${{ matrix.abi }}" in
            arm64-v8a)   ARCH="aarch64" ;;
            armeabi-v7a) ARCH="ARM" ;;
            x86_64)      ARCH="x86-64" ;;
            x86)         ARCH="Intel 80386" ;;
          esac
          file "$SO" | grep -q "$ARCH" || {
            echo "FAIL: $ARCH not in: $(file "$SO")"; exit 1; }
          echo "VERIFIED: ${{ matrix.abi }} = $ARCH with the mobile ABI"

      - name: Upload libgs_ffi.so
        uses: actions/upload-artifact@v4
        with:
          name: libgs_ffi-${{ matrix.abi }}
          path: dist/android/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 14
