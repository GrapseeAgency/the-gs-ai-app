name: android-app

# Compiles the Android app module and runs its unit tests.
#
# WHY THIS EXISTS
#
# Three defects in a row shipped in Kotlin that no compiler on any machine had
# looked at, because there is no Kotlin compilation anywhere in this repo's CI:
#
#   * LocalContext.current read inside a coroutine lambda (composable-only value)
#   * a property assigned from outside the object that declares it (private set)
#   * a key constant referenced but never declared
#
# The same class of defect already cost the JNI bridge nine type errors, for the
# same reason: code guarded behind a cfg or a directory that nothing builds. The
# fix then and here is the same one -- make the compiler see it.
#
# The native library is NOT built here. android-native.yml produces the four
# .so artifacts; this job compiles and tests the Kotlin against the module's
# existing configuration, so a failure is a Kotlin failure and not a native one.
#
# There is no gradle wrapper JAR in the repo (only gradle-wrapper.properties),
# so the runner's gradle is used. That is a real limitation of the repo and is
# recorded rather than papered over: a wrapper would make builds reproducible
# across machines, and its absence is a follow-up, not a solved problem.

on:
  workflow_dispatch:
  push:
    branches: [native-runtime]
    paths:
      - 'android/**'
      # THE LINT JOB IN HERE INSPECTS THESE PATHS, SO THESE PATHS MUST TRIGGER IT.
      #
      # The filter was `android/**` alone, which meant the five lints added to this
      # workflow -- two of which read .github/workflows/*.yml and all of which read
      # .github/scripts/ -- could only ever run in response to a commit that had
      # ALREADY broken something they inspect. Wiring a lint into a workflow whose
      # trigger excludes the lint's own inputs is the same defect as not writing the
      # lint: a check that cannot run cannot fail.
      #
      # Found by reading the trigger AFTER wiring the lints, which is the order that
      # made it visible. Writing them and assuming they were now enforced is exactly
      # the assumption this repository keeps having to unpick.
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'native/cpp/**'
      - 'native/crates/**'
      # The render step below blocks on this script's verdict, so the script is
      # as much a part of this job as the Kotlin it compiles.
      - 'scripts/check_home_render.py'
      - 'scripts/check_explore_render.py'
      - 'shared-contracts/explore-geometry.json'
      # The adversarial suite and the artwork manifest are part of the gate's
      # evidence, so a commit to either has to run the job that uses them.
      - 'scripts/test_home_render_gate.py'
      - 'scripts/prepare_home_art.py'
      - 'scripts/check_home_dark.py'
      - 'scripts/check_font_faces.py'
      - 'scripts/check_drawer_render.py'
      - 'scripts/check_drawer_structure.py'
      - 'scripts/check_icon_catalogue.py'
      - 'scripts/test-conversation-title.ts'
      - 'src/lib/conversation-title.ts'
      - 'scripts/test_drawer_render_gate.py'
      - '.github/scripts/check_drawer_type_parity.py'
      - 'assets/reference/drawer-reference.png'
      - 'shared-contracts/drawer-geometry.json'
  pull_request:
    branches: [native-runtime]
    paths:
      - 'android/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'native/cpp/**'
      - 'native/crates/**'
      - 'scripts/check_home_render.py'
      - 'scripts/check_explore_render.py'
      - 'shared-contracts/explore-geometry.json'
      # The adversarial suite and the artwork manifest are part of the gate's
      # evidence, so a commit to either has to run the job that uses them.
      - 'scripts/test_home_render_gate.py'
      - 'scripts/prepare_home_art.py'
      - 'scripts/check_home_dark.py'
      - 'scripts/check_font_faces.py'

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: 8.9

jobs:
  compile:
    name: compile + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Braces balance, which sounds like something the compiler does and does.
      # It does -- but three separate attempts to check one Kotlin file's balance
      # by hand each gave a DIFFERENT WRONG ANSWER first:
      #
      #   s.count('{') vs s.count('}')     IMBALANCED on a file the build had
      #                                    compiled, because a JSON spec inside
      #                                    a string contributes one of each and
      #                                    the totals land differently
      #   a per-line scanner               still wrong, because a Kotlin "..."
      #                                    literal may span LINES
      #   no /* */ or 'c' handling        still wrong
      #
      # So the only way to hand-count a 1500-line file with JSON in it is to read
      # it, and "I read it and it looks fine" is a guess wearing the costume of a
      # check. The scanner is verified in BOTH directions against fixtures, and
      # reports a file the compiler accepted as the SCANNER's failure -- because
      # a 1500-line Kotlin file with JSON in it is not exactly short, and an
      # automated check that is never wrong about clean files is a check nobody
      # has watched fail.
      #
      # It does not replace the compiler. Ten seconds here against a build that
      # would find the same thing in five minutes, and the value is that the
      # wrong answer never gets acted on.
      - name: Braces balance in every Kotlin source
        run: |
          set -euo pipefail
          mapfile -t KT < <(
            find android/app/src ios -name '*.kt' -o -name '*.kts' 2>/dev/null | sort
          )
          echo "checking ${#KT[@]} Kotlin source(s)"
          test "${#KT[@]}" -gt 0 || {
            echo "FAIL: found no Kotlin sources; the find pattern is wrong and this"
            echo "FAIL: step would pass by checking nothing."
            exit 1
          }
          python3 .github/scripts/check_kt_braces.py "${KT[@]}"

      # The one escape with no legitimate use in Kotlin. Narrow on purpose: a
      # general "unsupported escape" scan reports 64 false positives across this
      # tree, because backslashes are literal inside raw strings and inside
      # comments, and this tree is full of regexes written both ways.
      #
      # Added after android-release 37229157857 failed on
      #   SendFailureNoticeTest.kt:67:14 Unsupported escape sequence
      # from a "\\`accumulated\\`" written into a string literal. Verified by
      # reintroducing that exact token and confirming this reports it at 67:14
      # and 67:27 -- the same position the Kotlin compiler gave.
      - name: No escaped backticks in Kotlin string literals
        run: |
          set -euo pipefail
          mapfile -t KTB < <(
            find android/app/src -name '*.kt' 2>/dev/null | sort
          )
          echo "checking ${#KTB[@]} Kotlin source(s)"
          test "${#KTB[@]}" -gt 0 || {
            echo "FAIL: found no Kotlin sources; the find pattern is wrong and"
            echo "FAIL: this step would pass by checking nothing."
            exit 1
          }
          python3 .github/scripts/check_kt_escaped_backtick.py "${KTB[@]}"

      # Guards the v0.71.2 perf fix: the local path replayed a FINISHED answer
      # with delay(26) per word, ~4.9s of dead air per reply. The engine returns
      # a completed String, so any delay in ChatRepository is simulated
      # streaming. Scoped to that one file on purpose -- real retry backoff is
      # legitimate and lives in ApiClient.
      #
      # Verified non-vacuously: restoring the typewriter makes this exit 1, and
      # it stays 0 on the fix's own comment, which quotes `delay(26)` to explain
      # what was removed. Comments are exempt for that reason.
      - name: No artificial per-chunk delay in the chat send path
        run: |
          set -euo pipefail
          CR=android/app/src/main/java/com/grapsee/gsai/data/repository/ChatRepository.kt
          test -f "$CR" || {
            echo "FAIL: $CR is gone; this step would pass by checking nothing."
            exit 1
          }
          python3 .github/scripts/check_no_fake_streaming_delay.py "$CR"

      # A brace counter cannot see a missing field name, and a file-wide
      # "is this field declared anywhere?" cannot either -- `ttft` IS declared,
      # by two other row classes in the same file. The read has to be bound to
      # the class in the scope that reads it, which is what this does.
      #
      # Added after android-app 36956809627 failed on
      #   DeviceVerificationTest.kt:2089:39 Unresolved reference 'ttft'
      # where BRow's field is ttftMs. Kotlin is the authority and it caught this
      # in five minutes; this catches it without a round trip, and was itself
      # verified by reintroducing the exact bug on a copy and confirming the
      # script rejects it.
      # FIVE LINTS THAT WERE FILES AND NOTHING ELSE.
      #
      # Each of these was written during this session to stop a defect class from
      # recurring, and each was run BY HAND from a shell. None of them was invoked
      # by any workflow. A lint nothing executes is a comment with a shebang: it
      # cannot fail a build, cannot stop a commit, and cannot tell anyone it exists
      # except the person who wrote it.
      #
      # That is the same defect as the three CI gates found in the audit -- a check
      # that cannot fail -- arrived at from the other direction. It was also caught
      # by a NAIVE CHECK, which is worth recording: the first audit of this asked
      # `grep -l <lint> .github/workflows/*.yml | wc -l` and reported
      # check_workflow_var_scope as wired, because the string appears in a COMMENT
      # in android-release.yml. Five were unwired, not four, and the extra one was
      # found by a substring match standing in for an invocation.
      #
      # All five run here, in the job that already lints, so there is one place to
      # look. Each was verified non-vacuous by re-injecting the defect it was
      # written for.
      - name: Lints that only existed as files until now
        run: |
          set -euo pipefail
          mapfile -t KTL < <(find android/app/src -name '*.kt' 2>/dev/null | sort)
          test "${#KTL[@]}" -gt 0 || {
            echo "FAIL: no Kotlin sources found; the find pattern is wrong and these"
            echo "FAIL:lints would pass by checking nothing."
            exit 1
          }
          mapfile -t WFL < <(ls .github/workflows/*.yml)
          test "${#WFL[@]}" -gt 0 || {
            echo "FAIL: no workflow files found."
            exit 1
          }
          mapfile -t CPPS < <(find native/cpp -name '*.cpp' -o -name '*.h' 2>/dev/null | sort)
          test "${#CPPS[@]}" -gt 0 || {
            echo "FAIL: no C++ sources found; check_error_code_conventions would pass"
            echo "FAIL:by checking nothing."
            exit 1
          }
          echo "  ${#KTL[@]} Kotlin, ${#WFL[@]} workflow, ${#CPPS[@]} C++ file(s)"

          echo "--- format specifiers match argument counts"
          python3 .github/scripts/check_kt_format_specs.py "${KTL[@]}"

          echo "--- imports resolve, none unused, no unimported framework type"
          # ALL THREE SOURCE SETS, not just main. Test files import test-local
          # helpers (WireServer, Elf64) and the benchmark suite lives under
          # src/test; resolving against main alone reported 23 unresolvable imports
          # that were all resolvable in their own source set.
          python3 .github/scripts/check_kt_imports.py "${KTL[@]}" \
            --src android/app/src/main/java/com/grapsee/gsai \
            --src android/app/src/androidTest/java/com/grapsee/gsai \
            --src android/app/src/test/java/com/grapsee/gsai

          echo "--- bool results are not consumed as ABI error codes"
          python3 .github/scripts/check_error_code_conventions.py "${CPPS[@]}"

          echo "--- every run: block's variables are in scope"
          python3 .github/scripts/check_workflow_var_scope.py "${WFL[@]}"

          echo "--- no comment between backslash-continued lines"
          python3 .github/scripts/check_shell_continuations.py "${WFL[@]}"

          echo "--- every workflow that runs a script is triggered by changes to it"
          python3 .github/scripts/check_workflow_trigger_covers_scripts.py "${WFL[@]}"

      # `grep` EXITS 1 WHEN IT MATCHES NOTHING. That is an answer, not an error, and
      # under `set -e` an unguarded grep that correctly finds nothing kills the script.
      #
      # This is not theoretical. The device suite's test-count gate never executed
      # across three ~70-minute runs:
      #
      #     set -e                                                    # line 393
      #     IGNORED=$(grep -rhcE '^[[:space:]]*@Ignore\b' .../*.kt | awk '{s+=$1} ...')
      #
      # This repository has ZERO @Ignore annotations, so grep correctly exited 1,
      # pipefail promoted it, set -e killed the script on the assignment -- one line
      # before the gate's first echo -- and every run reported only:
      #
      #     connectedDebugAndroidTest exit: 1
      #     === dumping logcat (test exit was 2) ===
      #
      # Reproduced without a runner, and it is the SAME SHAPE as the `grep -q` SIGPIPE
      # trap this repository has hit three times, inverted: there a grep that
      # SUCCEEDED killed the step, here a grep that correctly found NOTHING does.
      #
      # Swept over every .sh under .github/scripts and every workflow run block, so
      # the blast radius is measured rather than assumed: 9 sites, of which one was
      # `GOT=$(nm -D ... | grep -oE 'gs_ffi_mobile_...')` -- a .so exporting none of
      # those symbols is the defect the step exists to catch, and it died silently on
      # the assignment instead of reaching the comparison that names the shortfall.
      #
      # NOTE (deliberately not silenced): the lint reports bare pipelines ending in
      # grep as ::warning::, not ::error::. In those the grep may BE the assertion, and
      # wrapping it in `|| true` would disable a real check. They are surfaced so the
      # missing diagnostic is visible, not so they can be suppressed.
      - name: No unguarded `grep` after `set -e`
        run: |
          set -euo pipefail
          mapfile -t SHL < <(ls .github/scripts/*.sh)
          test "${#SHL[@]}" -gt 0 || {
            echo "FAIL: no .github/scripts/*.sh found, so half this check would pass"
            echo "FAIL:by inspecting nothing."
            exit 1
          }
          # WFL IS BUILT HERE, NOT INHERITED. The first version of this step read
          # ${WFL[@]} from the other lint step, and check_workflow_var_scope.py -- my
          # own lint -- flagged it: each `run:` block is its own shell. Caught before
          # dispatch by the lint that exists for exactly this, which is the first time
          # in this session one of these lints has caught the step that added it.
          mapfile -t WFL < <(ls .github/workflows/*.yml)
          test "${#WFL[@]}" -gt 0 || {
            echo "FAIL: no workflow files found, so the other half of this check"
            echo "FAIL:would pass by inspecting nothing."
            exit 1
          }
          python3 .github/scripts/check_set_e_grep_traps.py "${SHL[@]}" "${WFL[@]}"

      - name: Row field reads name fields the row declares
        run: |
          set -euo pipefail
          mapfile -t KTT < <(
            find android/app/src -name '*.kt' 2>/dev/null | sort
          )
          echo "checking ${#KTT[@]} Kotlin source(s) for unbound row field reads"
          test "${#KTT[@]}" -gt 0 || {
            echo "FAIL: found no Kotlin sources; the find pattern is wrong and this"
            echo "FAIL: step would pass by checking nothing."
            exit 1
          }
          python3 .github/scripts/check_row_fields.py "${KTT[@]}"

      # The ABI is written down in TWO places that are not the same list on
      # purpose: the full set in .github/scripts/gs_mobile_abi.txt, and an
      # eleven-symbol non-diffusion subset inline in ios-native.yml, because the
      # iOS device slice is not required to carry the sd_* entry points.
      #
      # "They are supposed to agree" was not enforced by anything, and the
      # android-native floor was a hand-written `-ge 17` with a comment claiming
      # it matched the ABI. It did not: it would have kept passing at 17 while the
      # ABI was 18, because a floor cannot notice a set growing. The floor and the
      # per-symbol comparison now both read the .txt, and this lint checks that
      # the iOS subset is a real, non-empty subset of it.
      # CAN A GREEN IN THIS SUITE MEAN ANYTHING?
      #
      # Two narrow checks, each verified by PLANTING the defect it exists for and
      # watching it get caught. A @Test with no assertion that can fail is a test
      # that cannot fail; an assertion whose condition cannot be false is not an
      # assertion. Both were worth writing because both had already been true in
      # this repository's history in a different form -- two tests skipped
      # precisely because the library was broken (run 36971941114), which made
      # "the library does not load" a green.
      #
      # The step asserts a non-zero @Test count FIRST, because a scan handed the
      # wrong paths examines nothing and exits 0. That is the shape of failure
      # this repository pays for most often.
      - name: Every test can fail, and every assertion is load-bearing
        run: |
          set -euo pipefail
          mapfile -t KTT < <(find android/app/src/androidTest -name '*.kt' 2>/dev/null | sort)
          echo "checking ${#KTT[@]} instrumented-test source(s)"
          test "${#KTT[@]}" -gt 0 || {
            echo "FAIL: found no androidTest sources; the find pattern is wrong and"
            echo "FAIL: this step would pass by checking nothing."
            exit 1
          }
          # `{ ... || true; }` so a file with no @Test cannot kill the step: this COUNTS
          # annotations to decide whether the lint below has anything to check, and a
          # count of zero is a legitimate answer, not a failure. Found by
          # check_set_e_grep_traps.py. Note this is the same shape as the bug that
          # stopped run-instrumented.sh's test-count gate from ever executing.
          NTESTS=$( { grep -h -o '@Test' "${KTT[@]}" || true; } | wc -l | tr -d ' ')
          echo "  $NTESTS @Test annotation(s) across ${#KTT[@]} file(s)"
          test "$NTESTS" -gt 0 || {
            echo "FAIL: no @Test found. Either the suite is empty or the extractor"
            echo "FAIL: stopped matching, and both must be a red run."
            exit 1
          }
          python3 .github/scripts/check_tests_can_fail.py "${KTT[@]}"

      # `check_home_type_parity.py` held twelve Home type roles to a contract, and
      # three source comments plus a paragraph in docs/DESIGN_SYSTEM.md said it
      # "fails CI". No workflow ran it, so it could not fail and the contract was
      # enforced by nothing. The first step below closes that class rather than the
      # instance: every `check_*`/`test_*` script must be invoked from a workflow run
      # block, and a mention in a YAML comment does not count.
      - name: Every gate script is actually invoked
        run: |
          set -euo pipefail
          python3 .github/scripts/check_gate_scripts_are_invoked.py --self-test
          python3 .github/scripts/check_gate_scripts_are_invoked.py
          python3 .github/scripts/check_home_type_parity.py

      - name: The two ABI lists agree
        run: |
          set -euo pipefail
          python3 .github/scripts/check_abi_lists_agree.py

      - name: Install the Android SDK
        run: |
          set -euo pipefail
          # The image ships ANDROID_HOME with no cmdline-tools, and sdkmanager is
          # therefore not on PATH. Every workflow that assumed otherwise failed
          # with "sdkmanager: command not found".
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools "$SDK/cmdline-tools/latest"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # compileSdk/targetSdk 35, minSdk 26. Installed explicitly rather than
          # letting the Gradle plugin pick a build-tools version, because an
          # unpinned one makes a failure unreproducible.
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "sdk: $(ls "$SDK/platforms")"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # ITS OWN CACHE, WITH ITS OWN KEY. Robolectric's ~130 MB android-all jar
      # lives in ~/.m2, not under ~/.gradle, so it has to be listed to be saved
      # at all — but listing it inside the Gradle cache above does not work
      # either: actions/cache commits one archive per key and never updates an
      # existing one, so the first run that saved under this key WITHOUT the m2
      # directory (any run that failed before the render step) poisoned it
      # forever, and every later run restored a jar-less archive and skipped
      # re-saving. Separate key, separate archive, and the jar can be cached by
      # a run whose Gradle cache was already warm.
      - name: Cache the Robolectric android-all jar
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Compile the Kotlin
        working-directory: android
        run: |
          set -euo pipefail
          # PIN THE GRADLE, DO NOT BORROW THE RUNNER'S. The runner image ships a
          # Gradle far newer than any AGP 8.x tolerates -- raw, run 37282692340:
          #     Plugin 'com.android.internal.application' relies on
          #     'org.gradle.api.problems.internal.InternalProblems', a Gradle
          #     internal API that was removed in Gradle 9.6.0.
          # ...with the runner on Gradle 9.8.0. The repo carries no
          # gradle-wrapper.jar BY DESIGN (no committed binaries), so the
          # wrapper is GENERATED here and every invocation goes through
          # ./gradlew, which downloads the distribution the properties file
          # pins (gradle-8.13-bin.zip). The generated jar lives only on the
          # runner; nothing binary lands in the repository.
          #
          # GENERATED IN AN EMPTY DIRECTORY, NOT IN THIS ONE. `gradle wrapper`
          # configures the build it runs in, which applies the AGP plugin --
          # and AGP on the runner's Gradle 9.8 dies during that configuration
          # (raw: run 37283167572, "could not generate the Gradle 8.13
          # wrapper" wrapping the same InternalProblems error). A directory
          # with no build files has no plugins to apply, so the wrapper task
          # cannot fail there.
          # An EMPTY settings.gradle: Gradle 9 refuses the wrapper task in a
          # directory with no build (raw: run 37284603107, "does not contain a
          # Gradle build"), and an empty one has no plugins to apply, so the
          # runner's Gradle 9.8 cannot trip over AGP here.
          mkdir -p /tmp/gs-wrapper-gen
          touch /tmp/gs-wrapper-gen/settings.gradle
          cd /tmp/gs-wrapper-gen
          gradle wrapper --gradle-version 8.13 --distribution-type bin --no-daemon \
            || { echo "::error::could not generate the Gradle 8.13 wrapper"; exit 1; }
          cd "$GITHUB_WORKSPACE/android"
          cp /tmp/gs-wrapper-gen/gradlew /tmp/gs-wrapper-gen/gradlew.bat .
          chmod +x gradlew
          # The jar is the only missing piece; the properties file is COMMITTED
          # and is the source of truth for the pinned version.
          cp /tmp/gs-wrapper-gen/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
          ./gradlew --version | sed -n '1,9p'
          ./gradlew --version 2>/dev/null | grep -q "Gradle 8.13" \
            || { echo "::error::the wrapper did not resolve Gradle 8.13"; exit 1; }
          # --no-daemon because a runner has one process and gradle's daemon
          # survives the step and eats the next one.
          # --info, because at the default level Gradle reports only
          #   Compilation error. See log for more details
          # and the actual `e: file://...` lines never reach the job log.
          # Raw, run 36383562738. That is the same defect as every other
          # swallowed diagnostic in this repo's history: a build that fails
          # without saying why, which costs a full re-run to diagnose.
          # --console=plain so the lines are not wrapped in ANSI box drawing.
          # BOTH source sets. Compiling only the main one let a completely
          # non-compiling androidTest file pass for as long as nobody ran the
          # emulator:
          #     .kt:10:12 Unresolved reference 'junit'.
          #     .kt:109:6  Unresolved reference 'Test'.
          # A source set that is never compiled is a source set nobody is
          # checking, and the instrumented tests are the whole point of the
          # device run.
          ./gradlew --no-daemon --console=plain --info --stacktrace \
            :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin 2>&1 | tee compile.log
          # Echo the diagnostics on their own, so a failure is legible without
          # scrolling a 4000-line --info log.
          echo "=== kotlin diagnostics ==="
          grep -E '^e: |^w: .*(GsNative|Model|Local|Device)' compile.log | sed -n '1,80p' || true
          echo "=== (end) ==="
          # Fail on gradle's status, not on grep's.
          test "${PIPESTATUS[0]}" -eq 0
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          # The Kotlin module references GsNative's JNI surface only through
          # `external fun` declarations, so the .so is not needed to compile.
          # Lint cannot see that, so the check is disabled for this job and
          # re-enabled by android-native.yml's own build.
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

      # ORDER MATTERS. A Gradle `Test` task cleans its own results directory
      # before executing, so whichever invocation runs LAST owns
      # app/build/test-results/testDebugUnitTest -- the directory `Report` below
      # counts. The filtered render pass used to sit AFTER the full suite, which
      # replaced the suite's XMLs with three screenshot XMLs and let `Report`
      # print "unit tests: 3 run" for a job that had executed hundreds. The
      # evidence step was destroying the evidence of the step it followed.
      # Renders first, full suite last: the suite is what Report sees.
      - name: Home renders (real Compose tree, JVM) + archive the PNGs
        working-directory: android
        run: |
          set -euo pipefail
          # HomeScreenshotTest is gated on the `gs.screenshots` SYSTEM PROPERTY,
          # and build.gradle.kts populates that property from the Gradle PROJECT
          # property `gsShots` (`-PgsShots=true`). Passing `-Dgs.screenshots=true`
          # on the CLI sets it on the Gradle client JVM, never on the forked test
          # JVM, so the test ASSUMES OUT and the job still goes green. The -P
          # form is the one that reaches the test; the PNG-existence check below
          # is what makes a silent skip impossible to miss.
          rm -rf app/build/screenshots
          ./gradlew --no-daemon --console=plain --stacktrace :app:testDebugUnitTest \
            --rerun --tests "com.grapsee.gsai.ui.home.HomeScreenshotTest" \
            --tests "com.grapsee.gsai.ui.navigation.DrawerScreenshotTest" \
            -PgsShots=true
          SHOTS=app/build/screenshots
          MISSING=0
          for w in 393x852 411x914 360x780; do
            if [ -s "$SHOTS/home-$w.png" ]; then
              echo "rendered home-$w.png ($(wc -c < "$SHOTS/home-$w.png") bytes)"
            else
              echo "::error::home-$w.png was not produced"; MISSING=1
            fi
          done
          # The drawer's own frames. A capture that silently skipped would make
          # every drawer gate below measure a file that is not there, so absence
          # is a failure here rather than an exit 2 three steps later.
          for n in drawer-393x852 drawer-393x852-dark drawer-360x780 drawer-500chats-393x852; do
            if [ -s "$SHOTS/$n.png" ]; then
              echo "rendered $n.png ($(wc -c < "$SHOTS/$n.png") bytes)"
            else
              echo "::error::$n.png was not produced"; MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1

      - name: Set up Python for the render probe
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render-probe dependencies
        run: |
          set -euo pipefail
          # Pinned — see the same note in ios.yml. These libraries produce the
          # numbers a blocking gate compares against.
          python3 -m pip install --quiet --disable-pip-version-check "numpy==2.1.3" "pillow==11.0.0"

      - name: Upload the Home renders
        uses: actions/upload-artifact@v4
        with:
          name: home-renders
          path: android/app/build/screenshots/*.png
          # Uploaded BEFORE the gate that judges them. `if-no-files-found: error`
          # still does real work: the render step above asserts each PNG exists,
          # so a missing file is already a red by the time this runs. What the
          # ordering buys is evidence — an upload ordered after a blocking gate is
          # skipped by exactly the failures that have to be read.
          if-no-files-found: error
          retention-days: 30

      # Placed after the upload for the same reason the pixel gate is: a failing
      # check must not cost the evidence that came before it. This one is cheap
      # (it reads PNG headers and greps sources), so it does not need to be early.
      - name: Artwork is accounted for on both platforms
        run: |
          set -euo pipefail
          # The backdrop and card art are what Home decodes, and the ground the
          # pixel gate divides its `lift` by. This asserts one authored source per
          # asset, one resolution, identical bytes on both platforms, a footprint
          # each target can actually cover, and a decoded budget per screen.
          python3 scripts/prepare_home_art.py --check

      - name: Nexly chat response renders (real Compose tree, JVM)
        if: always()
        working-directory: android
        run: |
          set -euo pipefail
          # Same Roborazzi harness as Home, pointed at the REAL model-response
          # composition: BlocksContent + Thinking card + Plan card + glass.
          ./gradlew --no-daemon --console=plain --stacktrace :app:testDebugUnitTest \
            --rerun --tests "com.grapsee.gsai.ui.chat.NexlyChatScreenshotTest" \
            -PgsShots=true
          SHOTS=app/build/screenshots
          for w in 393x852 411x914 360x780; do
            if [ -s "$SHOTS/nexly-chat-$w.png" ]; then
              echo "rendered nexly-chat-$w.png ($(wc -c < "$SHOTS/nexly-chat-$w.png") bytes)"
            else
              echo "::error::nexly-chat-$w.png was not produced"; exit 1
            fi
          done
          test -s "$SHOTS/nexly-chat-thinking-393x852.png" \
            || { echo "::error::the adaptive-thinking render was not produced"; exit 1; }
          echo "rendered nexly-chat-thinking-393x852.png"
          for w in 411x914 393x852; do
            test -s "$SHOTS/nexly-chat-full-$w.png" \
              || { echo "::error::nexly-chat-full-$w.png was not produced"; exit 1; }
            test -s "$SHOTS/nexly-chat-full-prose-$w.png" \
              || { echo "::error::nexly-chat-full-prose-$w.png was not produced"; exit 1; }
            echo "rendered nexly-chat-full-$w.png + prose"
          done

      - name: Nexly Explore AI renders (real Compose tree, JVM)
        if: always()
        working-directory: android
        run: |
          set -euo pipefail
          # Same Roborazzi harness, pointed at the REAL Explore page: hero,
          # chips, search, Featured Tools, Popular rows, Collections, Featured
          # journey, composer — over the pearl backdrop.
          ./gradlew --no-daemon --console=plain --stacktrace :app:testDebugUnitTest \
            --rerun --tests "com.grapsee.gsai.ui.explore.NexlyExploreScreenshotTest" \
            -PgsShots=true
          SHOTS=app/build/screenshots
          # The full-page capture keeps the -full- name (chat-harness
          # convention). Roborazzi flushes asynchronously, so wait for each
          # file to be non-empty instead of failing on a racing check.
          for name in nexly-explore-full-393x1400 nexly-explore-393x852 nexly-explore-411x914 nexly-explore-360x780 nexly-discover-full-393x1400 nexly-discover-393x852 nexly-explore-search-393x852 nexly-explore-search-empty-393x852; do
            for attempt in 1 2 3 4 5 6; do
              [ -s "$SHOTS/$name.png" ] && break
              sleep 5
            done
            test -s "$SHOTS/$name.png" \
              || { echo "::error::$name.png was not produced"; exit 1; }
          done
          echo "rendered all six Explore captures"

      - name: Nexly Settings renders (real Compose tree, JVM)
        if: always()
        working-directory: android
        run: |
          set -euo pipefail
          # The three settings screens from docs/reference/settings/: hub,
          # Profile & Preferences, Memory Management. One class = one Gradle
          # invocation; six captures (3 screens x 2 widths).
          ./gradlew --no-daemon --console=plain --stacktrace :app:testDebugUnitTest \
            --rerun --tests "com.grapsee.gsai.ui.settings.SettingsScreenshotTest" \
            -PgsShots=true
          SHOTS=app/build/screenshots
          for name in nexly-settings-393x852 nexly-settings-360x780 nexly-profile-393x852 nexly-profile-360x780 nexly-memory-393x852 nexly-memory-360x780; do
            for attempt in 1 2 3 4 5 6; do
              [ -s "$SHOTS/$name.png" ] && break
              sleep 5
            done
            test -s "$SHOTS/$name.png" \
              || { echo "::error::$name.png was not produced"; exit 1; }
          done
          echo "rendered all six Settings captures"

      - name: Upload the Nexly Settings renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexly-settings-render-android
          path: |
            android/app/build/screenshots/nexly-settings-*.png
            android/app/build/screenshots/nexly-profile-*.png
            android/app/build/screenshots/nexly-memory-*.png
          if-no-files-found: error
          retention-days: 30

      - name: Measure the Explore dock against its pixel contract
        if: always()
        run: |
          set -euo pipefail
          # The Explore renders were previously gated on EXISTENCE only (the
          # six-PNG >20 KB check above), which is why a screen could look done
          # while the dock never painted. This blocks on the capsule hairline
          # and the lit pill's saturation, measured off the CI render itself.
          # Runs from the repo root; the gradle render step set its own cwd.
          # This step is if: always(), so prove the artifact exists first: a
          # missing PNG is a clear named error, not the script's opaque exit 2
          # masquerading as a measurement.
          PNG=android/app/build/screenshots/nexly-explore-393x852.png
          test -s "$PNG" \
            || { echo "::error::$PNG was not produced — nothing to measure"; exit 1; }
          python3 scripts/check_explore_render.py \
            --render "$PNG" --platform android --label android-393
          # The gate's own non-vacuity: doctor the pill and the rim out, and
          # both probes must go red on the doctored copy.
          python3 scripts/check_explore_render.py \
            --render "$PNG" --self-test

      - name: Upload the Nexly Explore renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexly-explore-render-android
          path: |
            android/app/build/screenshots/nexly-explore-*.png
            android/app/build/screenshots/nexly-discover-*.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload the Nexly chat response renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexly-chat-render-android
          path: android/app/build/screenshots/nexly-chat-*.png
          if-no-files-found: error
          retention-days: 30

      - name: Unit tests
        id: unit
        working-directory: android
        run: |
          set -euo pipefail
          # THE WRAPPER, NOT THE RUNNER'S GRADLE. This step used to call bare
          # `gradle` (9.8.x on the image) and carried `continue-on-error: true`.
          # AGP 8.13 dies during configuration on Gradle 9.6+, so the step
          # failed in ~40s and the JOB STILL WENT GREEN: no unit test ever ran.
          # The compile step above generates the pinned 8.13 wrapper in this
          # same workspace, so use it and let a test failure fail the job.
          # --rerun: a Gradle cache hit on this task means "the same inputs
          # passed earlier", not "tests ran in THIS run". The evidence for this
          # commit is the result XML, so the task is forced to execute.
          # Runs last so its full-suite XML is what Report counts.
          ./gradlew --no-daemon --console=plain --stacktrace :app:testDebugUnitTest --rerun

      # The pixel gate runs AFTER the suite on purpose. It used to sit before it,
      # which meant a probe drift — a layout shift, a safe-area change, anything
      # that moves a rect without breaking a test — stopped the unit suite from
      # running at all, so the job reported one symptom and hid the other. The
      # render PASS still happens first (above), because a Gradle Test task wipes
      # its own results directory and the full suite must be the last writer;
      # only the measurement moved.
      - name: Measure the Android render against the reference
        run: |
          set -euo pipefail
          # Runs from the repository root: both paths below are repo-relative,
          # unlike the gradle steps which set working-directory: android.
          # The same instrument iOS is held to, so "it looks right on my
          # platform" cannot be the standard. Asserts the scale-invariant glass
          # relationships measured from the sheet, not absolute positions — the
          # mock is a non-rectified render and its pixels are not a spec.
          python3 scripts/check_home_render.py \
            --reference assets/reference/home-reference.png \
            --render android/app/build/screenshots/home-393x852.png \
            --probe-set android --label android-393

      # The gate's own non-vacuity, executed every run rather than argued once:
      # flat page, cards painted out, hairline erased, frame shifted, probes
      # slipped both ways, backdrop dimmed. Each must fail with the check that is
      # supposed to catch it, and the untouched frame must pass.
      # The drawer, scored against its own sheet. DR2 needs the Home capture of
      # the SAME run, which is why both files are named here: the dim is a ratio,
      # and a ratio against another run's page would move whenever the page did.
      - name: Measure the drawer against its reference sheet
        run: |
          set -euo pipefail
          python3 scripts/check_drawer_render.py \
            --render android/app/build/screenshots/drawer-393x852.png \
            --home android/app/build/screenshots/home-393x852.png \
            --same-frame android/app/build/screenshots/drawer-500chats-393x852.png \
            --probe-set android --label android-drawer

      # The drawer gate's own non-vacuity, executed every run: eight doctored
      # frames, each caught by the check that owns it, and the real frame passing.
      - name: The drawer gate can still fail
        run: |
          set -euo pipefail
          python3 scripts/test_drawer_render_gate.py \
            --render android/app/build/screenshots/drawer-393x852.png --home android/app/build/screenshots/home-393x852.png

      - name: The drawer's type and geometry agree across platforms
        run: |
          set -euo pipefail
          python3 .github/scripts/check_drawer_type_parity.py

      - name: The drawer's structure (lazy list, no per-frame sort, no shadow)
        run: |
          set -euo pipefail
          python3 scripts/check_drawer_structure.py --self-test

      - name: The icon catalogue (1,611 geometries, 5,466 names, both platforms)
        run: |
          set -euo pipefail
          python3 scripts/check_icon_catalogue.py --self-test

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: The headline's rules
        run: |
          set -euo pipefail
          # A first message that opens with a code fence or a URL used to name the
          # chat after the fence or the URL, and every cut was mid-word.
          bun scripts/test-conversation-title.ts

      - name: The drawer in dark mode
        run: |
          set -euo pipefail
          python3 scripts/check_drawer_dark.py \
            --render android/app/build/screenshots/drawer-393x852-dark.png \
            --home android/app/build/screenshots/home-393x852-dark.png \
            --label android-drawer-dark

      - name: The faces are upright and named for their weight
        run: |
          set -euo pipefail
          python3 scripts/check_font_faces.py

      # The dark page has no reference frame, so it is scored against what a dark
      # glass UI must satisfy rather than against a picture: a dark page, glass
      # that is present at all, copy that separates from it, no blown highlight.
      - name: The dark page holds up
        run: |
          set -euo pipefail
          python3 scripts/check_home_dark.py \
            --render android/app/build/screenshots/home-393x852-dark.png \
            --label android-dark

      - name: The pixel gate can still fail
        run: |
          set -euo pipefail
          python3 scripts/test_home_render_gate.py \
            --render android/app/build/screenshots/home-393x852.png \
            --probe-set android

      - name: Report
        if: always()
        run: |
          set -euo pipefail
          # THE APP MODULE IS android/app. This path used to be
          # `app/build/test-results/...` resolved from the REPOSITORY ROOT, so
          # it never existed and every green run printed "no result XML" --
          # a pass with no evidence behind it. The path is now the real one and
          # an empty/missing result is a FAILURE, not a shrug.
          RESULTS=android/app/build/test-results/testDebugUnitTest
          if [ ! -d "$RESULTS" ]; then
            # Only fatal when the suite actually ran. If a compile step above
            # already failed, the tests never executed and this step exiting 1
            # would add a second red for the same cause — the pattern this repo
            # keeps paying for. The job is already failed; say what is missing and
            # let the real failure be the one that is read.
            if [ "${{ steps.unit.outcome }}" = "success" ]; then
              echo "::error::the Unit tests step reported success but left no result XML at $RESULTS"
              exit 1
            fi
            echo "::warning::no test result XML at $RESULTS (the suite did not run: unit outcome '${{ steps.unit.outcome }}')"
            echo "unit tests: did not run" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          COUNT=$(python3 -c "import glob,xml.etree.ElementTree as E; rs=[E.parse(p).getroot() for p in glob.glob('$RESULTS/*.xml')]; t=sum(int(r.get('tests',0)) for r in rs); f=sum(int(r.get('failures',0))+int(r.get('errors',0)) for r in rs); print(f'{t} {f}')")
          TESTS=${COUNT%% *}
          FAILS=${COUNT##* }
          echo "unit tests: $TESTS run, $FAILS failed" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$TESTS" -eq 0 ]; then
            echo "::error::0 unit tests in $RESULTS -- an empty run is not a pass"
            exit 1
          fi
          # A TOTAL IS NOT EVIDENCE THAT A PARTICULAR SUITE RAN. These two classes
          # are the drawer's behavioural proof: the icon's decision and every
          # pressed control's route. If either stops being collected -- renamed,
          # moved out of the source set, filtered away -- the total still looks
          # healthy and the drawer's behaviour is untested again. Named, counted,
          # fatal.
          for spec in DrawerInteractionTest:6 DrawerIconTest:9; do
            cls=${spec%%:*}; want=${spec##*:}
            xml=$(ls "$RESULTS"/TEST-*"$cls".xml 2>/dev/null | head -1 || true)
            if [ -z "$xml" ]; then
              echo "::error::$cls has no result XML -- the drawer's behaviour is not being tested"
              exit 1
            fi
            got=$(python3 -c "import sys,xml.etree.ElementTree as E; r=E.parse(sys.argv[1]).getroot(); print(r.get('tests','0'))" "$xml")
            if [ "$got" -lt "$want" ]; then
              echo "::error::$cls ran $got case(s), expected at least $want"
              exit 1
            fi
            echo "$cls: $got case(s)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          {
            echo "### android-app"
            echo "compileDebugKotlin: see the step above"
            echo "wrapper: generated per run from the pinned properties"
            echo "      (8.13); no wrapper JAR is committed by design."
          } >> "$GITHUB_STEP_SUMMARY"




