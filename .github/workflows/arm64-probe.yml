name: arm64-runner-probe

# A PROBE, NOT A WORKFLOW. It exists to answer one question with a fact instead
# of an assumption: can this repository use an arm64 Linux runner, and does that
# runner have what the Android emulator needs?
#
# Why this is a question at all. The arm64 DEVICE run was attempted once
# (36676280935) and the emulator refused to start:
#
#     FATAL | Avd's CPU Architecture 'arm64' is not supported by the QEMU2
#            emulator on x86_64 host. System image must match the host architecture.
#
# /dev/kvm exists on the x86_64 runner and works, and that is the whole problem:
# KVM accelerates a guest of the HOST's architecture, it does not translate
# between them. arm64 on x86_64 needs full software emulation, which QEMU2 does
# not offer.
#
# So the fix is a different HOST, not a different flag. actions/runner-images
# lists ubuntu-24.04-arm and ubuntu-26.04-arm, and this repository is public
# ("GitHub Actions is free for public repositories"), so arm64 runners should be
# available on the free plan. "Should be" is exactly the kind of claim this
# repository has been bitten by, so this job prints the answer.
#
# DELETE THIS WORKFLOW once android-device runs on arm64 for real. It proves a
# runner exists; it is not evidence that the engine works.

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Which host to probe. ubuntu-24.04-arm has no /dev/kvm (run 36688288136); macos-15 is arm64 with hardware virtualization for an arm64 guest."
        required: false
        default: "macos-15"
        type: choice
        options:
          - macos-15
          - macos-latest
          # THE REAL LABEL IS ubuntu-24.04-arm64, and it was MISSING.
          #
          # Run 36688288136 probed "ubuntu-24.04-arm" and reported
          #
          #     uname -m = aarch64, arch = arm64
          #     ::error::/dev/kvm is absent on this arm64 runner
          #
          # which was read as "the arm64 Linux runner has no KVM, so item 2 is a
          # hardware wall". But actions/runner-images lists the arm64 labels as
          #
          #     [ubuntu-24.04-arm64]: images/ubuntu/Ubuntu2404-Arm64-Readme.md
          #     [ubuntu-26.04-arm64]: images/ubuntu/Ubuntu2604-Arm64-Readme.md
          #     [ubuntu-22.04-arm64]: images/ubuntu/Ubuntu2204-Arm64-Readme.md
          #
          # -- arm64, not -arm. So the earlier probe may have resolved a
          # DIFFERENT image, or a legacy one, and "no /dev/kvm" was measured on
          # something that is not the current public arm64 image.
          #
          # The old label stays in the list so that evidence stays reproducible;
          # if both report no /dev/kvm then the conclusion holds for both.
          - ubuntu-24.04-arm64
          - ubuntu-24.04-arm
          - ubuntu-latest
  # A push trigger on a path nothing touches, so the workflow is INDEXED by the
  # API. With workflow_dispatch alone it never appeared in
  #   GET /repos/.../actions/workflows
  # across four checks over several minutes, and workflow_dispatch returned 404
  # even though the file was committed and pushed (git ls-tree showed it). The
  # filter matches nothing in practice, so this costs no runner time; what it
  # buys is a workflow the API will let us dispatch.
  push:
    paths:
      - '.github/workflows/arm64-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    name: can ${{ inputs.host || 'macos-15' }} host an arm64 emulator?
    # ubuntu-24.04-arm IS a real arm64 runner -- run 36688288136 printed
    #   uname -m = aarch64, arch = arm64
    # -- and it has NO /dev/kvm, so it cannot accelerate an arm64 guest either.
    # Two attempts have now measured that rather than assumed it.
    runs-on: ${{ inputs.host || 'macos-15' }}
    timeout-minutes: 15
    steps:
      - name: The architecture, unedited
        run: |
          set -euo pipefail
          echo "uname -m = $(uname -m)"
          echo "uname -r = $(uname -r)"
          case "$(uname -m)" in
            aarch64|arm64) echo "ARCH: arm64" ;;
            *) echo "::error::this runner is $(uname -m), not arm64; the label resolved to something else."; exit 1 ;;
          esac

      - name: KVM is present and usable
        run: |
          set -euo pipefail
          # THE THING THAT DECIDES ITEM 2. On the x86_64 runner this existed and
          # was irrelevant; here it is the reason the attempt can work at all.
          # /dev/kvm IS THE LINUX ACCELERATOR. On macOS the equivalent is
          # Hypervisor.framework, and there is no /dev/kvm to look for -- so a
          # missing node here is a fact about the OS, not a failure, and the
          # probe continues to the thing that actually decides it.
          if [ "$(uname)" != Linux ]; then
            echo "not Linux: acceleration is Hypervisor.framework, not /dev/kvm."
            echo "continuing -- the emulator step below is what decides."
            exit 0
          fi
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is absent on this arm64 runner, so an arm64 guest cannot be accelerated."
            exit 1
          fi
          ls -l /dev/kvm
          echo "kvm group members: $(id -nG | tr ' ' '\n' | grep -c '^kvm$' || true)"

          # /dev/kvm existing is not the same as it working. Try to OPEN it.
          # A node that exists but cannot be opened produces an emulator that
          # refuses to start, which is the x86_64 failure all over again.
          if ! head -c 0 /dev/kvm 2>/dev/null; then
            echo "::error::/dev/kvm cannot be opened by this user; hardware acceleration is unusable."
            exit 1
          fi
          echo "VERIFIED: /dev/kvm exists and opened"

      # THE TEN MINUTES THAT WERE NOT ABOUT THE QUESTION.
      #
      # Run 36728988366 spent 14:25:20 -> 14:40:46 on this host and was cancelled
      # by the platform at 15m26s, of which roughly ten minutes was downloading
      # and unzipping the same 490 MB system image:
      #
      #     [=========  ] 100% Unzipping... arm64-v8a/data/system
      #
      # That is the same bytes on every run and has nothing to do with whether an
      # arm64 emulator boots. So they are cached, and the cache key includes the
      # runner's architecture: an arm64 image unpacked on an x86_64 host is a
      # different tree, and reusing one across architectures would be its own
      # false pass.
      # THE ONE NUMBER THE OPERATOR ASKED FOR, and the probe never measured it.
      #
      # Two macOS runs (36831549014, 36831680143, both on macos-15-arm64) reached
      # the emulator and printed
      #
      #     HVF error: HV_UNSUPPORTED
      #     qemu-system-aarch64-headless: failed to initialize HVF: Invalid argument
      #
      # which says the accelerator is unusable, and NOT WHY. On macOS the
      # accelerator is Hypervisor.framework, and `sysctl kern.hv_support` is the
      # single value that distinguishes "this VM has no nested virtualisation" from
      # "QEMU is misconfigured". 1 means HVF can work and any failure is ours;
      # 0 means the hypervisor is not exposed at all and no configuration will fix
      # it. Without it, "HV_UNSUPPORTED" is a symptom being read for a cause --
      # which is the mistake this repository has had to undo repeatedly.
      - name: On macOS, ask the hypervisor directly
        run: |
          set -euo pipefail
          if [ "$(uname -s)" != Darwin ]; then
            echo "not Darwin: Hypervisor.framework does not apply."
            echo "On Linux the equivalent is /dev/kvm, measured in the step above."
            exit 0
          fi
          echo "  uname -s = $(uname -s)"
          echo "  uname -m = $(uname -m)"
          HV=$(sysctl -n kern.hv_support 2>/dev/null || echo "unreadable")
          echo "  sysctl kern.hv_support = $HV"
          case "$HV" in
            1) echo "  VERDICT: Hypervisor.framework is AVAILABLE."
               echo "  So an arm64 guest could be accelerated, and an HVF error" 
               echo "  from QEMU is a configuration problem on this runner --" 
               echo "  which is ours to fix." ;;
            0) echo "  VERDICT: nested virtualisation is OFF in this VM."
               echo "  kern.hv_support = 0 is set by the HOST, not by QEMU, so no"
               echo "  flag, image or config on the runner can change it. This is"
               echo "  the hardware wall, measured rather than inferred."
               echo "  ::error::kern.hv_support = 0 -- HVF cannot work here." ;;
            *) echo "  VERDICT: could not read kern.hv_support, so the accelerator"
               echo "  state is UNKNOWN and must not be reported either way."
               echo "  ::error::sysctl kern.hv_support returned [$HV]." ;;
          esac

      - name: Cache the Android SDK, so the boot is not the download
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Android/sdk
            ~/.android
          key: arm64-probe-${{ runner.os }}-${{ runner.arch }}-sysimg-android-30-google_apis-arm64-v8a

      - name: Boot an arm64 emulator, or say why not
        run: |
          set -uo pipefail
          # THE ONLY QUESTION THAT MATTERS, ASKED DIRECTLY.
          #
          # Everything before this step was scaffolding: the architecture, the
          # accelerator, the SDK contents. None of those prove an arm64 emulator
          # can start. This creates an AVD, launches it, and waits for a real
          # boot, with a bound so it reports instead of hanging.
          #
          # The x86_64 runner failed exactly here, and the message names the
          # host/architecture mismatch:
          #
          #     FATAL | Avd's CPU Architecture 'arm64' is not supported by the
          #            QEMU2 emulator on x86_64 host.
          #
          # So success is the absence of that line PLUS a booted device. A probe
          # that only checked `uname -m` would have PASSED on the x86_64 runner
          # while the emulator could not start, which is the false pass this
          # repository keeps paying for.

          # A MISSING SDK IS NOT A PASS. The first version of this step did:
          #
          #     if ! command -v sdkmanager; then
          #       echo "::warning::no sdkmanager on PATH"
          #       exit 0            # <- GREEN, having tested NOTHING
          #
          # and the macOS probe run 36688948635 is exactly that: every step
          # green, "Boot an arm64 emulator" green, and the log says
          #
          #     ::warning::no sdkmanager on PATH; cannot test the emulator here.
          #
          # A green probe that booted no emulator is worse than a red one,
          # because it is the false pass this repository keeps paying for. So
          # the SDK is installed if absent, and if it still cannot be, the step
          # FAILS and says so.
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "no sdkmanager on PATH; installing the command-line tools"
            brew install --cask android-commandlinetools 2>&1 | tail -5 || true
            for CAND in "$ANDROID_HOME/cmdline-tools/latest/bin" \
                        "$ANDROID_HOME/cmdline-tools/bin"; do
              [ -x "$CAND/sdkmanager" ] && export PATH="$CAND:$PATH"
            done
            # The emulator and platform-tools are separate from the CLI tools.
            brew install --cask android-platform-tools 2>&1 | tail -3 || true
          fi
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error::could not obtain sdkmanager on this host; the emulator was NOT tested."
            echo "  ANDROID_HOME=$ANDROID_HOME"
            ls -1 "$ANDROID_HOME/cmdline-tools" 2>/dev/null | sed 's/^/    /' || echo "    (no cmdline-tools)"
            exit 1
          fi
          echo "sdkmanager: $(command -v sdkmanager)"
          echo "emulator  : $(command -v emulator || echo 'not on PATH')"

          IMG="system-images;android-30;google_apis;arm64-v8a"
          echo "installing $IMG"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          if ! sdkmanager --install "$IMG" "emulator" "platform-tools" 2>&1 | tail -20; then
            echo "::error::could not install $IMG on this host; the emulator was NOT tested."
            exit 1
          fi
          # ASK THE SDK. The previous line counted dirnames --
          #     "$(dirname "$(dirname "$(command -v sdkmanager)")")"/system-images/...
          # -- and sdkmanager sits at $ANDROID_HOME/cmdline-tools/latest/bin, so
          # two dirnames land on cmdline-tools/latest and the ls found nothing.
          # That is what printed:
          #     installed: ?
          # `?` here is a broken diagnostic, not a missing image: the AVD was
          # created from it moments later. `--list_installed` is the SDK's own
          # answer and cannot be wrong about its own layout.
          echo "sdkmanager --list_installed | grep 'system-images;android-30':"
          sdkmanager --list_installed 2>/dev/null | grep 'system-images;android-30' | sed 's/^/  /' || true
          if ! sdkmanager --list_installed 2>/dev/null | grep -q "$IMG"; then
            echo "::error::$IMG is not in --list_installed, so the AVD would be built on nothing."
            exit 1
          fi

          AVD_NAME=arm64probe
          echo no | avdmanager create avd --force -n "$AVD_NAME" \
            --package "$IMG" --device 'Nexus 6' || {
            echo "::error::avdmanager could not create the AVD on this host; the emulator was NOT tested."
            exit 1
          }
          avdmanager list avd | sed -n '1,20p' || true

          # WHICH EMULATOR, AND WHERE IT REALLY IS.
          #
          # Run 36733985703, the first run to fail for a readable reason rather
          # than being cancelled:
          #
          #   ERROR: qt_setup.cpp:28: Qt library not found at ../emulator/lib64/qt/lib
          #   Could not launch '/Users/runner/work/the-gs-ai-app/the-gs-ai-app/../emulator/qemu/darwin-x86_64/qemu-system-aarch64': No such file or directory
          #
          # The emulator locates its Qt libraries RELATIVE TO ITS OWN BINARY, and
          # the path it derived was
          #
          #   /Users/runner/work/the-gs-ai-app/the-gs-ai-app/../emulator/...
          #
          # which is outside the SDK, in the parent of the checkout. So the binary
          # that ran was not the SDK's own emulator. This step's own log named it:
          #
          #   emulator  : /Users/runner/Library/Android/sdk/tools/emulator
          #
          # `$ANDROID_HOME/tools/emulator` is the OBSOLETE Android SDK Tools
          # layout, removed in 2017; the current one is
          # `$ANDROID_HOME/emulator/emulator`. A bare `emulator` on PATH resolved
          # to that leftover and the emulator followed it out of the SDK, so the
          # Qt lookup failed before QEMU was ever involved and the architecture
          # was never actually tested.
          #
          # The inventory below is deliberate. The second line of that failure
          # mentioned `qemu/darwin-x86_64/qemu-system-aarch64` on an arm64 host,
          # which may be fine under Rosetta, may be the only QEMU the image ships,
          # or may be a wrapper failing to select an arm64 one. This run cannot
          # tell, because the Qt failure comes first. Rather than guess, the step
          # prints what is on disk, so the next iteration is decided by the disk.
          echo "=== emulator inventory ==="
          EMU=""
          for CAND in "$ANDROID_HOME/emulator/emulator" \
                      "$ANDROID_HOME/tools/emulator/emulator" \
                      "$(command -v emulator 2>/dev/null || true)"; do
            [ -n "$CAND" ] || continue
            if [ -f "$CAND" ]; then
              REAL=$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$CAND")
              echo "  candidate: $CAND"
              echo "     realpath: $REAL"
              echo "     executable: $([ -x "$CAND" ] && echo yes || echo no)"
              # WHERE THE Qt LIBRARIES MIGHT BE, CHECKED RATHER THAN GUESSED.
              #
              # 36733985703 printed one path:
              #
              #   Qt library not found at ../emulator/lib64/qt/lib
              #
              # and deriving the SDK root from that one line is guesswork -- the
              # message is relative and the run that produced it had the WRONG
              # root, which is the whole bug. So every layout the emulator has
              # plausibly used is checked and all of them are printed, and a
              # candidate is selected if ANY of them is present. If none is, the
              # inventory says so instead of the step dying inside QEMU.
              FOUND_QT=""
              for QT in "$(dirname "$REAL")/lib64/qt/lib" \
                        "$(dirname "$REAL")/../lib64/qt/lib" \
                        "$(dirname "$REAL")/../emulator/lib64/qt/lib" \
                        "$ANDROID_HOME/emulator/lib64/qt/lib"; do
                if [ -d "$QT" ]; then FOUND_QT="$QT"; fi
                echo "     qt? $QT -> $([ -d "$QT" ] && echo PRESENT || echo missing)"
              done
              if [ -z "$EMU" ] && [ -n "$FOUND_QT" ]; then
                EMU="$CAND"
                echo "     SELECTED (first candidate with its Qt libraries present)"
              fi
            else
              echo "  candidate: $CAND  (not a file)"
            fi
          done
          echo "=== qemu directories under the SDK ==="
          for D in "$ANDROID_HOME/emulator/qemu"/*/; do
            [ -d "$D" ] || continue
            echo "  $(basename "$D")  qemu-system-aarch64: $([ -x "$D/qemu-system-aarch64" ] && echo yes || echo no)"
          done
          echo "=== end inventory ==="
          if [ -z "$EMU" ]; then
            echo "::error::no emulator binary on this host has its Qt libraries beside it."
            echo "::error::The inventory above says which paths were tried and what each one lacks."
            exit 1
          fi

          # The emulator also looks for AVDs relative to its own location unless
          # told otherwise, and it is not run from the SDK's directory here.
          export ANDROID_EMULATOR_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"

          LOG=/tmp/emulator.log
          echo "launching $EMU ; log -> $LOG"
          # ABSOLUTE PATH, always. A bare name goes through PATH and the Qt
          # lookup follows whatever PATH pointed at, which is the entire bug.
          "$EMU" -avd "$AVD_NAME" -no-window -no-snapshot -noaudio \
            -no-boot-anim -gpu swiftshader_indirect -cores 4 -memory 2048 \
            > "$LOG" 2>&1 &
          PID=$!

          # BOUNDED, AND THE BOUND IS ONE THIS JOB CAN SURVIVE.
          #
          # 12 minutes, polling every 10s. The old bound was 20 minutes at 20s
          # intervals, and run 36728988366 was cancelled by the platform at
          # 15m26s wall clock -- so the loop that produces the verdict was never
          # able to finish. A bound longer than the job's life is not a bound,
          # it is a way of guaranteeing no answer.
          #
          # The number is not the interesting part. `sys.boot_completed = 1` is,
          # and the loop exits the instant it sees it, so a fast boot costs one
          # poll either way.
          #
          # EVERY POLL PRINTS. The old loop was silent for up to 20 minutes, so a
          # cancelled run and a hung run looked identical in the log. Now a job
          # that dies mid-loop still leaves behind how far the boot got, which is
          # the difference between "cancelled" and "known".
          BOOTED=no
          POLLS=72
          for i in $(seq 1 "$POLLS"); do
            ELAPSED=$((i * 10))
            # BOTH ASSIGNMENTS CARRY `|| true`, AND THAT IS THE WHOLE FIX.
            #
            # GitHub runs a `run:` block as `bash -e {0}`, so the `set -uo pipefail`
            # at the top of this step ADDS -u and pipefail to an -e that is already
            # switched on. The line reads like it is turning error handling on. It
            # is not.
            #
            # bash SUSPENDS set -e for a command in an `if` CONDITION, which is why
            # the old loop survived adb exiting non-zero:
            #
            #     if [ "$(adb shell getprop sys.boot_completed ...)" = "1" ]; then
            #
            # A bare ASSIGNMENT is not a condition, so -e applies to it and a
            # non-zero pipeline terminates the shell. Before the emulator registers,
            # `adb shell getprop` exits non-zero, so the first iteration killed the
            # step. Run 36731431711 died 69 seconds in with no poll line printed and
            # the emulator still running:
            #
            #     launching; log -> /tmp/emulator.log
            #     ##[error]Process completed with exit code 1.
            #     Terminate orphan process: pid (2005) (emulator)
            #
            # Reproduced with GitHub's own starting point:
            #
            #     OLD form (adb in an if condition):   survived
            #     NEW form (adb in an assignment):     script exit=1
            #
            # `|| true` and NOT `set +e` around the loop. The loop's job is to
            # survive a device that is not there yet; disabling error handling for
            # twelve minutes would hide every other failure inside it.
            PROP=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            DEVS=$(adb devices 2>/dev/null | grep -c 'device$' || true)
            printf '  t=%4ss  adb devices=%s  sys.boot_completed=%s\n' \
              "$ELAPSED" "$DEVS" "${PROP:-<empty>}"
            if [ "$PROP" = "1" ]; then
              BOOTED=yes
              echo "BOOTED after ${ELAPSED}s"
              break
            fi
            # The x86_64 failure is FATAL and immediate, so detect it rather than
            # waiting out the bound for a device that will never appear.
            if grep -q "is not supported by the QEMU2 emulator" "$LOG" 2>/dev/null; then
              echo "::error::the emulator refused this host, as it did on x86_64:"
              # `sed -n '1,3p'`, not `| head -3`, for the reason the ios-native
              # file explains: head closes the pipe and the producer takes
              # SIGPIPE, which under `set -euo pipefail` kills the step while it
              # is printing its own error message.
              grep -o "FATAL.*" "$LOG" | sed -n '1,3p' | sed 's/^/  /'
              break
            fi
            # A process that died leaves no device and no log growth. Say so now
            # rather than after 12 minutes of silence.
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::the emulator process exited before booting. Its whole log:"
              sed 's/^/  /' "$LOG" | tail -40
              break
            fi
            sleep 10
          done

          echo "=== emulator log (tail) ==="
          tail -25 "$LOG" | sed 's/^/  /'
          kill "$PID" 2>/dev/null || true

          if [ "$BOOTED" = yes ]; then
            echo "VERIFIED: an arm64-v8a emulator BOOTS on $(uname -m)"
            echo "  abi   : $(adb shell getprop ro.product.cpu.abi 2>/dev/null | tr -d '\r')"
            echo "  model : $(adb shell getprop ro.product.model 2>/dev/null | tr -d '\r')"
            exit 0
          fi
          echo "::error::no arm64 emulator boot on this host. See the log above for the reason."
          exit 1
