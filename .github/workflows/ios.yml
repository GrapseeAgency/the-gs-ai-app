name: iOS (macOS) — Xcode build & test

# REAL compilation verification on a GitHub-hosted macOS runner.
#
# This workflow is the iOS compile gate. The Python static gates
# (scripts/ios_static_gates.py, scripts/swift_structure_gate.py) are
# supplementary structural checks only — they are NOT a substitute for
# Xcode compilation and are run here merely as a cheap pre-flight.
#
# Code signing: intentionally disabled (project.yml sets
# CODE_SIGNING_ALLOWED=NO and the workflow passes it explicitly), so
# headless CI needs no certificates, provisioning profiles, or team ID.
# The artifacts produced are unsigned simulator builds/archives.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "scripts/ios_static_gates.py"
      - "scripts/swift_structure_gate.py"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build-test:
    name: Compile + test (macOS runner, real Xcode)
    runs-on: macos-15
    timeout-minutes: 60

    env:
      PROJECT_DIR: ios
      PROJECT_FILE: ios/GSApp.xcodeproj
      SCHEME: GSApp
      DERIVED_DATA: ios/build/DerivedData

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Host toolchain report (before selection)
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          swift --version || true

      - name: Select Xcode (latest stable available on the runner image)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain report (after selection — recorded for the report)
        run: |
          echo "xcodebuild: $(xcodebuild -version | tr '\n' ' ')"
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          swift --version
          # `sed -n '1p'`, not `| head -1`. head closes the pipe, xcodebuild
          # takes SIGPIPE, and the nested command substitution cannot fail the
          # enclosing echo -- so the visible symptom there is not a dead step but
          # an EMPTY XCODE_VERSION written to the environment. A gate that reads
          # it later then fails for a reason three steps away.
          echo "XCODE_VERSION=$(xcodebuild -version | sed -n '1s/.*Xcode \(.*\)/\1/p')" >> "$GITHUB_ENV"

      - name: Static validation (supplementary — NOT a substitute for compilation)
        run: |
          python3 scripts/ios_static_gates.py
          python3 scripts/swift_structure_gate.py

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          cd "$PROJECT_DIR"
          xcodegen generate
          test -d GSApp.xcodeproj || { echo "::error::GSApp.xcodeproj was not generated"; exit 1; }
          xcodebuild -list -project GSApp.xcodeproj

      - name: Fetch the GsFfi xcframework from the latest ios-native run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # THE APP TARGET HARD-LINKS Frameworks/GsFfi.xcframework (project.yml
          # dependencies), so a bare checkout cannot compile -- raw evidence,
          # every push since ~2026-10-04 failed at exactly that link, e.g. run
          # 37292984587:
          #     error: There is no XCFramework found at
          #     '.../ios/Frameworks/GsFfi.xcframework'. (in target 'App')
          # The framework is native toolchain OUTPUT, never a committed file
          # (no binaries in this repository). The producer is ios-native.yml,
          # which uploads it as the GsFfi.xcframework artifact; this pull gate
          # takes the latest successful one -- the same producer/consumer
          # pattern android-device.yml uses for libgs_ffi.so.
          RUN_ID=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ios-native.yml/runs?status=success&per_page=1" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); runs=d.get("workflow_runs",[]); print(runs[0]["id"] if runs else "")')
          if [ -z "$RUN_ID" ]; then
            echo "::error::no successful ios-native run to take GsFfi.xcframework from"
            exit 1
          fi
          echo "ios-native run: $RUN_ID"
          ART=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); arts=[a for a in d.get("artifacts",[]) if a["name"]=="GsFfi.xcframework"]; print(arts[0]["id"] if arts else "")')
          if [ -z "$ART" ]; then
            echo "::error::no GsFfi.xcframework artifact in ios-native run $RUN_ID"
            exit 1
          fi
          echo "artifact id: $ART"
          XF="$PROJECT_DIR/Frameworks/GsFfi.xcframework"
          rm -rf "$XF"
          mkdir -p "$XF"
          # The artifact zip's ROOT IS the xcframework's contents (Info.plist +
          # slice dirs) -- the same layout ios-native's own download step
          # extracts into this exact path.
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ART/zip" -o /tmp/xff.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/xff.zip').extractall('$XF')"
          test -f "$XF/Info.plist" || {
            echo "::error::the artifact zip did not yield GsFfi.xcframework/Info.plist. What came out:"
            find "$XF" -maxdepth 2 | sed -n '1,20p'
            exit 1
          }
          # BOTH SLICES, asserted the way ios-native asserts them: the plist's
          # LibraryIdentifier names are the truth, and a simulator-only or
          # device-only framework fails later with a dyld error that reads
          # like a broken build instead of a missing slice.
          PLIST="$XF/Info.plist"
          grep -q "ios-arm64-simulator" "$PLIST" || { echo "::error::no ios-arm64-simulator slice in the fetched framework"; exit 1; }
          grep -q '"ios-arm64"' "$PLIST" || { echo "::error::no ios-arm64 device slice in the fetched framework"; exit 1; }
          echo "staged: $(du -sh "$XF" | cut -f1)"

      - name: Resolve available iPhone simulator destination
        run: |
          xcrun simctl list devices available
          # simctl device lines end with a trailing space: "  iPhone 16 Pro (UUID) (Shutdown) "
          # — the regex must tolerate it (fixed after run #1 failed exactly here).
          # NO `head` IN A PIPELINE. The original ended in
          #
          #     | head -1 | xargs)
          #
          # and `head -1` exits on the first match, closing the pipe; `sed` takes
          # SIGPIPE and exits 141, and under `set -euo pipefail` the step dies
          # there with nothing on stdout. `read` cannot be signalled, so the first
          # match is taken with a loop and then the variable is trimmed in bash.
          NAME=""
          while IFS= read -r _CAND; do
            [ -n "$_CAND" ] || continue
            NAME="$(printf '%s' "$_CAND" | xargs)"
            break
          done < <(xcrun simctl list devices available 2>/dev/null \
                   | sed -n 's/^[[:space:]]*\(iPhone[^()]*\) ([^)]*) ([^)]*)[[:space:]]*$/\1/p')
          if [ -z "$NAME" ]; then
            echo "::error::No available iPhone simulator found on runner image"
            exit 1
          fi
          DEST="platform=iOS Simulator,name=${NAME},OS=latest"
          echo "IOS_DESTINATION=$DEST" >> "$GITHUB_ENV"
          echo "Using destination: $DEST"

      - name: Build (real Xcode compilation of the iOS target)
        run: |
          set -o pipefail
          mkdir -p ios/build
          xcodebuild build \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee ios/build/xcodebuild-build.log

      - name: Test (XCTest unit tests on iOS simulator)
        run: |
          set -o pipefail
          RESULT_BUNDLE="ios/build/GSApp-tests-$(date +%Y%m%dT%H%M%S).xcresult"
          rm -rf "$RESULT_BUNDLE"
          xcodebuild test \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ios/build/xcodebuild-test.log

      - name: Package — zip unsigned simulator .app
        run: |
          # XcodeGen's default PRODUCT_NAME = target name → the built bundle
          # is App.app (overriding PRODUCT_NAME desyncs the auto TEST_HOST).
          APP_PATH="ios/build/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH" || { echo "::error::Compiled App.app not found"; exit 1; }
          cd "$(dirname "$APP_PATH")"
          zip -qry "$GITHUB_WORKSPACE/ios/build/GSApp-simulator-debug.zip" App.app
          ls -l "$GITHUB_WORKSPACE/ios/build/GSApp-simulator-debug.zip"

      - name: Archive — unsigned Release xcarchive (packaging evidence)
        run: |
          set -o pipefail
          rm -rf ios/build/GSApp.xcarchive
          xcodebuild archive \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -archivePath ios/build/GSApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ios/build/xcodebuild-archive.log

      - name: Summarise results
        if: always()
        run: |
          APP_BUILT=$([ -d ios/build/DerivedData/Build/Products/Debug-iphonesimulator/App.app ] && echo "YES" || echo "NO")
          ARCHIVED=$([ -d ios/build/GSApp.xcarchive ] && echo "YES" || echo "NO")
          TESTS=$(grep -Eo "Test Suite 'All tests' (passed|failed)" ios/build/xcodebuild-test.log 2>/dev/null | sed -n '1p' || echo "n/a")
          {
            echo "## iOS CI summary"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Runner | \`${RUNNER_NAME}\` (${RUNNER_OS} ${ImageOS:-}) |"
            echo "| Xcode | \`${XCODE_VERSION:-unknown}\` |"
            echo "| App target compiled | ${APP_BUILT} |"
            echo "| XCTest result | ${TESTS} |"
            echo "| Unsigned xcarchive | ${ARCHIVED} |"
            echo "| Code signing | disabled by design (unsigned artifacts) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact (unsigned simulator app)
        uses: actions/upload-artifact@v4
        with:
          name: GSApp-simulator-debug-${{ github.sha }}
          path: ios/build/GSApp-simulator-debug.zip
          if-no-files-found: error

      - name: Upload unsigned Release xcarchive
        uses: actions/upload-artifact@v4
        with:
          name: GSApp-xcarchive-unsigned-${{ github.sha }}
          path: ios/build/GSApp.xcarchive
          if-no-files-found: error

      - name: Upload full xcodebuild logs (failure diagnostics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ github.run_id }}
          path: ios/build/*.log
          if-no-files-found: ignore
