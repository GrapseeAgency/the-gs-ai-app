name: ios-native

# Cross-compiles libgs_ffi.a for iOS device and simulator and assembles a real
# .xcframework containing both slices. Binaries are artifacts, never git.
#
# Like the Android build this is PORTABLE-ONLY: no ONNX Runtime, no llama.cpp, no
# Tesseract. None have drop-in arm64-ios prebuilts here, and the static library
# is meant to be small enough to ship inside an app.

on:
  workflow_dispatch:
  push:
    branches: [native-runtime]
    paths:
      - 'native/**'
      - '.github/workflows/ios-native.yml'
      - '.cargo/config.toml'

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GS_ALLOW_MISSING_ONNX: "1"

jobs:
  build:
    name: xcframework
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "=== available Xcodes ==="
          ls -1d /Applications/Xcode*.app 2>/dev/null || echo "(none listed)"
          SELECTED=""
          for V in 16.2 16.1 15.4; do
            if [ -d "/Applications/Xcode_${V}.app" ]; then
              # -p prints the path without changing global state, which is
              # enough for the SDK and lipo calls this job makes.
              SELECTED="/Applications/Xcode_${V}.app"
              break
            fi
          done
          if [ -n "$SELECTED" ]; then
            echo "pinned: $SELECTED"
            echo "DEVELOPER_DIR=$SELECTED" >> "$GITHUB_ENV"
          else
            echo "no pinned Xcode present; using the image default"
            echo "default: $(xcode-select -p)"
          fi
          # -p never fails on a missing argument, unlike -s.
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install Rust targets
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustc --version
          rustc --print target-list | grep -E '^aarch64-apple-ios' || true

      # ATTEMPT 7. The cross-compile itself works — lipo reports
      #   built: Non-fat file: target/aarch64-apple-ios/release/libgs_ffi.a
      #       is architecture: arm64
      # Every failure since attempt 3 has been in the verification I added, not
      # in the build:
      #   attempt 5  `file -b` on a .a says "current ar archive", never an arch
      #   attempt 6  `ar t | head -1` returns __.SYMDEF, and $SRC was relative
      #              while `ar x` ran in /tmp   -> ar: ... No such file or directory
      #   attempt 7  grep: stdout: Broken pipe
      # The last one is `set -euo pipefail` meeting `head`: head exits after one
      # line, its upstream grep dies on SIGPIPE, pipefail propagates the
      # non-zero status, and the step exits 2. Every pipeline below therefore
      # uses `sed -n 'Np'`, which consumes its whole input and cannot close a
      # pipe early. There is no `| head` left in this file.
      - name: Build and verify device slice (aarch64-apple-ios)
        working-directory: native
        run: |
          set -euo pipefail
          cargo build --release -p gs-ffi --lib --target aarch64-apple-ios
          SRC="target/aarch64-apple-ios/release/libgs_ffi.a"
          test -f "$SRC" || { echo "MISSING: $SRC"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/dist/ios/device"
          cp "$SRC" "$GITHUB_WORKSPACE/dist/ios/device/libgs_ffi.a"

          # lipo, not file: a .a is an ar archive, so `file -b` on it reports
          # only "current ar archive" and never an architecture.
          echo "built: $(lipo -info "$SRC")"
          lipo -info "$SRC" | grep -q 'arm64' || {
            echo "FAIL: device slice is not arm64"; exit 1; }
          bash "$GITHUB_WORKSPACE/.github/scripts/assert_arm64_member.sh" "$SRC" device

      - name: Build and verify simulator slice (aarch64-apple-ios-sim)
        working-directory: native
        run: |
          set -euo pipefail
          cargo build --release -p gs-ffi --lib --target aarch64-apple-ios-sim
          SRC="target/aarch64-apple-ios-sim/release/libgs_ffi.a"
          test -f "$SRC" || { echo "MISSING: $SRC"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/dist/ios/simulator"
          cp "$SRC" "$GITHUB_WORKSPACE/dist/ios/simulator/libgs_ffi.a"
          echo "built: $(lipo -info "$SRC")"
          lipo -info "$SRC" | grep -q 'arm64' || {
            echo "FAIL: simulator slice is not arm64"; exit 1; }
          bash "$GITHUB_WORKSPACE/.github/scripts/assert_arm64_member.sh" "$SRC" simulator

      - name: Assemble the xcframework
        run: |
          set -euo pipefail
          set -a; source "$GITHUB_ENV"; set +a
          rm -rf "$GITHUB_WORKSPACE/dist/ios/GsFfi.xcframework"
          mkdir -p "$GITHUB_WORKSPACE/dist/ios/GsFfi.xcframework/Headers"

          # Headers next to each slice: a consumer reads the module, not the
          # binary, and a missing header is the most common reason a generated
          # xcframework will not import.
          for f in \
            native/cpp/mobile/gs_mobile.h \
            native/cpp/include/gs_abi.h; do
            cp "$f" "$GITHUB_WORKSPACE/dist/ios/GsFfi.xcframework/Headers/"
          done

          # Headers must declare their own dependencies, and gs_mobile.h includes
          # gs_abi.h by plain name, so both land in the same directory.
          # A heredoc cannot be used here: its body would sit at column 1
          # inside this YAML literal block, which ends the block early and makes
          # "module GsFfi {" parse as a mapping key. printf has no such trap.
          MM="$GITHUB_WORKSPACE/dist/ios/GsFfi.xcframework/Headers/module.modulemap"
          printf '%s\n' \
            'module GsFfi {' \
            '    header "gs_abi.h"' \
            '    header "gs_mobile.h"' \
            '    export *' \
            '}' > "$MM"
          cat "$MM"

          xcodebuild -create-xcframework \
            -library  "$GITHUB_WORKSPACE/dist/ios/device/libgs_ffi.a" \
              -headers "$GITHUB_WORKSPACE/dist/ios/GsFfi.xcframework/Headers" \
            -library  "$GITHUB_WORKSPACE/dist/ios/simulator/libgs_ffi.a" \
              -headers "$GITHUB_WORKSPACE/dist/ios/GsFfi.xcframework/Headers" \
            -output   "$GITHUB_WORKSPACE/dist/ios/GsFfi.xcframework"

      - name: Verify slices, archs and exported ABI
        run: |
          set -euo pipefail
          XF="$GITHUB_WORKSPACE/dist/ios/GsFfi.xcframework"
          test -d "$XF" || { echo "MISSING xcframework"; exit 1; }

          echo "=== Info.plist ==="
          plutil -p "$XF/Info.plist" | sed -n '1,40p'

          echo "=== slices ==="
          ls -1 "$XF"

          for pair in "device:aarch64" "simulator:aarch64"; do
            LIB="${pair%%:*}"; ARCH="${pair##*:}"
            A="$GITHUB_WORKSPACE/dist/ios/$LIB/libgs_ffi.a"
            test -f "$A" || { echo "MISSING: $A"; exit 1; }
            echo "--- $LIB: $(file -b "$A")"
            # `ar t`, not a grep on `file`. Raw error, run 36376320644:
            #     FAIL: not an archive
            #     ##[error]Process completed with exit code 1.
            # `file -b` on a .a says "current ar archive" -- lowercase -- so
            # `grep -q "Archive"` never matches. That is the same tool mistake
            # twice: attempt 5 failed on `file` for the ARCHITECTURE and this
            # failed on `file` for the FILE TYPE. `ar t` succeeding is the
            # definitive test that the file is a real archive, and it is what
            # the member extraction uses anyway.
            MEMBERS=$(ar t "$A" | sed -n '1,200p')
            test -n "$MEMBERS" || { echo "FAIL: $LIB is not a readable ar archive"; exit 1; }
            echo "    members: $(printf '%s' "$MEMBERS" | wc -l | tr -d ' ')"
            # The Mach-O inside the archive must be the requested arch.
            INNER=$(ar t "$A" | grep -v '^__' | sed -n '1p')
            echo "    member: $INNER"
            lipo -info "$A" || { echo "FAIL: lipo could not read $A"; exit 1; }
            lipo -info "$A" | grep -q "$ARCH" || {
              echo "FAIL: $LIB is not $ARCH: $(lipo -info "$A")"; exit 1; }
            # Symbols: an archive that exists but exports nothing is the exact
            # failure that was fixed for the .so, and it must be caught here too.
            N=$(nm -gU "$A" 2>/dev/null | grep -c 'gs_ffi_mobile_' || true)
            echo "    gs_ffi_mobile_* exported: $N"
            [ "$N" -ge 8 ] || { echo "FAIL: expected >=8 exports, got $N"; exit 1; }
          done

          echo "=== exported mobile ABI (device) ==="
          nm -gU "$GITHUB_WORKSPACE/dist/ios/device/libgs_ffi.a" \
            | grep -oE 'gs_[a-z_0-9]+' | sort -u | sed -n '1,20p'

          echo "=== dSYM ==="
          # Rust ships a .a with debug info; a dSYM is produced when dSYM is
          # requested, and its absence is reported rather than glossed over.
          DSYM=$(find "$GITHUB_WORKSPACE/dist/ios" -name '*.dSYM' -type d | sed -n '1p')
          if [ -n "$DSYM" ]; then
            echo "dSYM: $DSYM"
            du -sh "$DSYM"
            dwarfdump --uuid "$DSYM" | sed -n '1,4p'
          else
            echo "dSYM: none produced (debug info is inside the .a; set"
            echo "      RUSTFLAGS=-C debuginfo=2 + dsymutil for a standalone dSYM)"
          fi

          echo "VERIFIED: xcframework with both slices and the mobile ABI"

      - name: Upload xcframework
        uses: actions/upload-artifact@v4
        with:
          name: GsFfi.xcframework
          path: dist/ios/GsFfi.xcframework
          if-no-files-found: error
          retention-days: 14

      - name: Upload raw static libraries
        uses: actions/upload-artifact@v4
        with:
          name: libgs_ffi-a
          path: |
            dist/ios/device/libgs_ffi.a
            dist/ios/simulator/libgs_ffi.a
            dist/ios/GsFfi.xcframework/Headers/*
          if-no-files-found: error
          retention-days: 14
