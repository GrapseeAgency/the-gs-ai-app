name: GenUI interaction contracts
on:
  pull_request:
    paths: ['shared-contracts/**', 'src/**', 'scripts/test-interaction-honesty.cjs', 'scripts/test-widget-compiler.ts', 'scripts/test-code-browser.cjs', 'scripts/test-react-preview-browser.cjs', 'scripts/build-react-runtime.cjs', 'scripts/react-runtime/**', 'scripts/browser-code-entry.tsx', 'package*.json', 'tsconfig*.json', '.github/workflows/genui-interactions.yml']
  push:
    branches: [main]
    paths: ['shared-contracts/**', 'src/**', 'scripts/test-interaction-honesty.cjs', 'scripts/test-widget-compiler.ts', 'scripts/test-code-browser.cjs', 'scripts/test-react-preview-browser.cjs', 'scripts/build-react-runtime.cjs', 'scripts/react-runtime/**', 'scripts/browser-code-entry.tsx', 'package*.json', 'tsconfig*.json', '.github/workflows/genui-interactions.yml']
permissions:
  contents: read
jobs:
  interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate the real Prisma client and typecheck the complete application
        env:
          DATABASE_URL: file:/tmp/gs-ai-typecheck.db
        run: |
          set -o pipefail
          npx prisma generate 2>&1 | tee /tmp/gs-prisma-generate.log
          npx tsc --noEmit --pretty false 2>&1 | tee /tmp/gs-typecheck.log
      - name: Compile and exercise actual interaction controls
        run: |
          set -o pipefail
          npm run test:interactions 2>&1 | tee /tmp/gs-interaction-runtime.log
      - name: Full-context fast-route and complex-task routing regressions
        run: npx --yes bun@1.3.14 test src/lib/attachments.test.ts src/lib/catalog-router.test.ts src/lib/reader-feedback.test.ts src/lib/model-capabilities.test.ts
      - name: Install pinned real-browser verification tools
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @sparticuz/chromium@143.0.4 puppeteer-core@24.37.5 esbuild@0.27.3
      - name: Real browser controls, clipboard, terminal files, worker timeout and causal CSP denial
        run: |
          set -o pipefail
          node scripts/test-code-browser.cjs 2>&1 | tee /tmp/gs-code-browser-runtime.log
          node scripts/test-react-preview-browser.cjs 2>&1 | tee /tmp/gs-react-preview-runtime.log
      - name: Publish browser failure diagnostics
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          for name in ['/tmp/gs-prisma-generate.log', '/tmp/gs-typecheck.log', '/tmp/gs-interaction-runtime.log', '/tmp/gs-code-browser-runtime.log', '/tmp/gs-react-preview-runtime.log']:
              p = Path(name)
              if p.exists():
                  text = p.read_text()[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + text)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-browser-code-runtime
          path: |
            /tmp/gs-prisma-generate.log
            /tmp/gs-typecheck.log
            /tmp/gs-interaction-runtime.log
            /tmp/gs-code-browser-runtime.log
            /tmp/gs-code-browser-runtime.png
            /tmp/gs-terminal-browser-runtime.png
            /tmp/gs-react-preview-runtime.log
            /tmp/gs-react-preview-browser.png
            /tmp/gs-ordinary-task-browser.png
          if-no-files-found: error
      - run: node dist/probe/scripts/test-widget-render.js
      - run: node dist/probe/scripts/test-widget-catalogue.js
      - run: node dist/probe/scripts/test-genui-pipeline.js
      - run: npm run test:widgets
