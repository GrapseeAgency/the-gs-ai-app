name: android-device

# Runs the instrumented tests on a real Android emulator.
#
# WHY THIS EXISTS
#
# Every bridge in this repo is compiled and symbol-verified, and none of it had
# ever been executed. That is not the same as working, and the gap is now closed
# by actually running it:
#
#   * a portable-only .so links cleanly, exports 10 symbols, and answers every
#     call with GS_ERR_UNAVAILABLE. Only a test that CALLS it can tell.
#   * the sampler-chain defect that made completions depend on request history
#     compiled perfectly for weeks.
#   * `GsNativeLoader` was written to survive UnsatisfiedLinkError, which means
#     it would also survive being wrong about everything else.
#
# The emulator is x86_64. That is not incidental: an x86_64 emulator cannot load
# an arm64 .so, so the instrumented tests only exercise the real generation path
# if llama.cpp is ALSO cross-compiled for x86_64-android. That is why the
# llamacpp job in android-deps.yml is a two-entry matrix.
#
# WHAT THIS JOB DOES NOT CLAIM
#
# An x86_64 emulator is not a phone. It is roughly 10-20x slower per core than
# the arm64 hardware these libraries target, so a timing measured here is a
# floor, not a figure. Nothing in the artifacts is a performance claim.
#
# A test that does not RUN is not a pass. The report step distinguishes a green
# test from a skipped one and from a device that never booted, and says so in
# the output rather than inferring success from a zero exit code.

on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: "android-native run to take libgs_ffi.so from (empty = latest success)"
        required: false
        default: ""
        type: string
      deps_run_id:
        description: "android-deps run id (blank = the latest successful one)"
        required: false
        default: ""
      abi:
        description: "Emulator ABI. x86_64 runs natively on a linux runner; arm64-v8a needs KVM for a foreign guest and may not boot."
        required: false
        default: "x86_64"
        type: choice
        options:
          - x86_64
          - arm64-v8a
  # Fires when android-deps FINISHES, not in parallel with it. The tests need the
  # llamacpp-x86_64 artifact to exist, and a path-filtered push trigger races it:
  # the device job starts while the cross-compile is still running, cannot find
  # the artifact, and either fails pointlessly or -- worse, given the graceful
  # fallback -- proceeds into a portable-only run whose tests "pass" by asserting
  # that generation does not work.
  workflow_run:
    workflows: ["android-deps"]
    types: [completed]
    branches: [native-runtime]

concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: true

env:
  GS_ALLOW_MISSING_ONNX: "1"

jobs:
  instrumented:
    # Not hardcoded, and that is the point. The ABI appears in five places
    # below -- the system image, the jniLibs directory, the artifact name, the
    # emulator arch and the job name -- and they used to be five copies of the
    # literal "x86_64". The same class of mistake that shipped x86-64 objects
    # labelled arm64-v8a in the deps job.
    #
    # Defaults to x86_64 because that is what a linux runner can actually
    # emulate. arm64-v8a is selectable and will be attempted once; whether it
    # boots is a property of the runner, not of this file.
    name: instrumented tests (emulator, ${{ inputs.abi || 'x86_64' }}, API 30)
    runs-on: ubuntu-latest
    # 60 MINUTES WAS EXACTLY THE BUDGET AND EXACTLY WHAT IT KILLED.
    #
    # Run 36958995854, head 96d3c29: cancelled at 04:10:48, started 03:10:37.
    # Sixty minutes and eleven seconds, with `timeout-minutes: 60` set on this
    # job. Nothing hung and nothing failed: the suite outgrew its own budget
    # because Item 1 added three lever sweeps to 23 existing tests, and lever 7
    # alone is five full model loads with multi-second generations each.
    #
    # The arithmetic for what this job now has to do, so the next increase is
    # not a guess:
    #
    #   existing suite, 23 tests, measured          ~40 min
    #   + lever 3   4 batch sizes x 6 generations   ~ 4 min
    #   + lever 5   2 settings x 4 generations      ~ 2 min
    #   + lever 7   5 thread counts x 6             ~ 6 min
    #   + lever 4   4 model loads + 20 generations ~ 6 min
    #   + sd0       one 882 MB load plus a CPU
    #               diffusion generation           ~ 8 min
    #   ------------------------------------------------------
    #   test time, roughly                            ~66 min
    #   + emulator boot, SDK, 2.6 GB of downloads,
    #     artifact upload                            ~15 min
    #   ------------------------------------------------------
    #   total, roughly                                ~81 min
    #
    # 150 leaves headroom for a slow runner without turning the timeout into a
    # no-op: a genuine hang still dies, and a 2.5x overrun means something is
    # wrong rather than merely slow.
    timeout-minutes: 150
    # ABI AT JOB LEVEL, NOT PER STEP.
    #
    # Each `run:` block is a fresh shell, so a variable set in one step does not
    # survive into the next. Three steps use $ABI and only the first declared it,
    # so those three would have expanded to an empty string and produced
    #     native/prebuilts/android-/
    #     android/app/src/main/jniLibs//libgs_ffi.so
    # -- paths that look plausible, are wrong, and fail much later as a missing
    # artifact rather than as a bad substitution.
    #
    # Declaring it once here means there is a single definition and a single
    # default, and every step inherits it. The per-step `ABI=` assignments that
    # already existed are left in place; they set the same value from the same
    # expression and cost nothing.
    env:
      ABI: ${{ inputs.abi || 'x86_64' }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          set -euo pipefail
          # Without KVM the emulator runs under full software emulation, which is
          # roughly 20x slower and pushes a 60-minute job past any useful
          # limit. The udev rules are the documented approach:
          #   https://github.com/reactivecircus/android-emulator-runner
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
          test -e /dev/kvm || { echo "FAIL: /dev/kvm is missing; the emulator cannot run"; exit 1; }

      - name: Enable the Android SDK and JDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q -o commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools "$SDK/cmdline-tools/latest"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # compileSdk 35 to build the app; the EMULATOR is API 30 because that is
          # the oldest image the runner's acceleration supports well, and the
          # app's minSdk is 26 so API 30 is in range.
          ABI="${{ inputs.abi || 'x86_64' }}"
          echo "emulator ABI: $ABI"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" "system-images;android-30;google_apis;$ABI" >/dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"
          echo "image: $(ls "$SDK/system-images/android-30/google_apis/")"

      - name: Fetch the cross-compiled llama.cpp for this ABI
        env:
          GH_TOKEN: ${{ github.token }}
          DEPS_RUN_ID: ${{ github.event.inputs.deps_run_id || github.event.workflow_run.id }}
        run: |
          echo "emulator ABI: $ABI"
          set -euo pipefail
          # Downloaded from THE SPECIFIC RUN that triggered this one, via the REST
          # API rather than `gh run download` (which only ever sees the latest run
          # of a workflow and would be a race against the next android-deps push).
          #
          # Without this the .so is PORTABLE-ONLY: it links, it exports all 10
          # mobile symbols, and every generation call answers GS_ERR_UNAVAILABLE.
          # The tests would then "pass" by asserting that nothing works, which is
          # the opposite of what they are for. So this fails the job.
          # On workflow_dispatch there is no triggering run, so fall back to the
          # most recent completed android-deps run. Without the fallback the job
          # is unreachable by hand, and "I can only run it the way CI runs it" is
          # not a usable property.
          if [ -z "$DEPS_RUN_ID" ] || [ "$DEPS_RUN_ID" = "0" ]; then
            DEPS_RUN_ID=$(
              curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/android-deps.yml/runs?per_page=1&status=success" \
              | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["workflow_runs"][0]["id"]))'
            )
            echo "dispatch: using the latest successful android-deps run"
          fi
          echo "deps run: $DEPS_RUN_ID"
          mkdir -p native/prebuilts/android-$ABI /tmp/artifact
          # A SCRIPT, NOT `python3 -c`.
          #
          # The inline version was single-quoted, so the shell never expanded
          # $ABI and python compared the artifact name against the literal
          # string "llamacpp-$ABI". The arm64 attempt then failed claiming an
          # artifact was missing that the SAME step printed as available:
          #
          #     FAIL: the llamacpp-arm64-v8a artifact is not in run 36662206872.
          #     Available:
          #       llamacpp-arm64-v8a 20634675 bytes
          #
          # And making that a multi-line single-quoted string inside
          # $( ... | ... ) broke the shell outright:
          #
          #     bash: line 46: syntax error near unexpected token `|'
          #     while looking for matching `)'
          #
          # No comment may sit INSIDE the $( ) here. A backslash continuation
          # runs into a `#` line and bash ends the command there, so the pipe
          # below becomes a separate command and the substitution captures
          # nothing -- which is exactly the error bash -n reported:
          #
          #     bash: line 40: syntax error near unexpected token `|'
          #     while looking for matching `)'
          #
          # sys.argv, not interpolation, so quoting cannot matter.
          ARTIFACT_ID=$(
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$DEPS_RUN_ID/artifacts" \
            | python3 "$GITHUB_WORKSPACE/.github/scripts/pick_artifact_id.py" llamacpp "$ABI"
          )
          if [ -z "$ARTIFACT_ID" ]; then
            # AN EMPTY LIST AND A FAILED LISTING LOOK IDENTICAL. Run 36866081875:
            #
            #   FAIL: the llamacpp-arm64-v8a artifact is not in run 36865379622.
            #   Available:
            #
            # and then nothing. The cause was that 36865379622 is an
            # android-APP run, which produces no artifacts at all -- so the
            # comprehension above ran correctly and printed nothing, and a message
            # with a bare "Available:" header is exactly what a BROKEN listing
            # would also print. I read that as the listing having a syntax error,
            # and nearly wrote that into a commit message; it does not.
            #
            # So the three causes are now distinguished, because they need three
            # different fixes and "the artifact is missing" distinguishes none:
            #
            #   zero artifacts       -> the wrong run id was passed
            #   artifacts, no $ABI   -> wrong ABI, or that job has not finished
            #   artifacts, expired   -> re-run android-deps (14-day retention)
            echo "FAIL: the llamacpp-$ABI artifact is not in run $DEPS_RUN_ID."
            ART_JSON=$(mktemp)
            if curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$DEPS_RUN_ID/artifacts" \
              -o "$ART_JSON"; then
              ART_COUNT=$(python3 -c "import json;print(len(json.load(open('$ART_JSON')).get('artifacts',[])))")
              if [ "$ART_COUNT" -eq 0 ]; then
                echo "      That run has NO artifacts at all."
                echo "      deps_run_id must be an android-deps run. An android-app or"
                echo "      android-native run has none, and produces this same message."
              else
                echo "      That run has $ART_COUNT artifact(s); none is named llamacpp-$ABI:"
                python3 -c "import json;[print('        ',a['name'],a['size_in_bytes'],'bytes') for a in json.load(open('$ART_JSON')).get('artifacts',[])]"
                echo "      Either the ABI is wrong, or android-deps has not finished"
                echo "      that job, or the artifact expired."
              fi
            else
              echo "      The artifacts API could not be read for that run at all."
            fi
            rm -f "$ART_JSON"
            echo "      Without it the app is portable-only and these tests cannot"
            echo "      test generation at all."
            exit 1
          fi
          echo "artifact id: $ARTIFACT_ID"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/artifact/llamacpp.zip
          ls -la /tmp/artifact/llamacpp.zip
          echo "=== what kind of file did the API hand back? ==="
          file /tmp/artifact/llamacpp.zip
          # GitHub's artifact API returns a ZIP. Raw, first device run:
          #     tar: This does not look like a tar archive
          #     tar: Exiting with failure status due to previous errors
          #     ##[error]Process completed with exit code 2.
          # It used to be a tarball wrapped in a zip. Uploaded a directory
          # instead, and this handles both shapes anyway because the cost of
          # guessing wrong is a 40-minute emulator run.
          if unzip -l /tmp/artifact/llamacpp.zip >/dev/null 2>&1; then
            echo "zip: unzipping"
            rm -rf /tmp/artifact/x && mkdir -p /tmp/artifact/x
            unzip -o -q /tmp/artifact/llamacpp.zip -d /tmp/artifact/x
            # A tarball inside the zip is still possible; unwrap it.
            T=$(find /tmp/artifact/x -name '*.tar.gz' | sed -n '1p')
            if [ -n "$T" ]; then
              echo "zip contained a tarball: $T"
              tar -xzf "$T" -C native/prebuilts/android-$ABI
            else
              cp -r /tmp/artifact/x/. native/prebuilts/android-$ABI/
            fi
          elif tar -tzf /tmp/artifact/llamacpp.zip >/dev/null 2>&1; then
            echo "gzip: untarring"
            tar -xzf /tmp/artifact/llamacpp.zip -C native/prebuilts/android-$ABI
          else
            echo "FAIL: the artifact is neither a zip nor a gzip tarball"
            file /tmp/artifact/llamacpp.zip
            head -c 200 /tmp/artifact/llamacpp.zip | cat -v | sed -n '1,5p'
            exit 1
          fi
          echo "=== prebuilt contents ==="
          find native/prebuilts/android-$ABI -type f | sort | sed -n '1,30p'
          test -f native/prebuilts/android-$ABI/include/llama.h || {
            echo "FAIL: no include/llama.h in the prebuilt package"; exit 1; }
          test -d native/prebuilts/android-$ABI/lib || {
            echo "FAIL: no lib/ in the prebuilt package"; exit 1; }
          echo "total: $(du -sh native/prebuilts/android-$ABI | cut -f1)"
          # The archives must be x86_64, not arm64. The emulator is x86_64 and an
          # arm64 .so is rejected by the linker, which turns every test into a
          # SKIP rather than a FAIL.
          for a in native/prebuilts/android-$ABI/lib/*.a; do
            echo "  $(basename "$a"): $(file -b "$a")"
          done

      - name: Fetch libgs_ffi.so for this ABI
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ github.event.inputs.native_run_id || '' }}
        run: |
          echo "emulator ABI: $ABI"
          # WITHOUT THIS THE APK SHIPS NO NATIVE LIBRARY AT ALL. Raw, run 36420986162,
          # which for the first time actually executed a test:
          #     java.lang.AssertionError: libgs_ffi.so did not load.
          #     isLibraryLoaded=false means the artifact is not in jniLibs, or
          #     its ABI does not match this device.
          #
          # android-native BUILDS and uploads libgs_ffi-<abi>. This job fetched only the
          # llama.cpp prebuilt from android-deps, so nothing ever placed a .so in
          # jniLibs and every native test was asserting against a library that was not
          # there. This is the VERIFY directive's assertion, and it is the assertion that
          # caught it.
          if [ -z "$NATIVE_RUN_ID" ] || [ "$NATIVE_RUN_ID" = "0" ]; then
            NATIVE_RUN_ID=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/android-native.yml/runs?per_page=1&status=success" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["workflow_runs"][0]["id"]))')
            echo "dispatch: using the latest successful android-native run"
          fi
          echo "native run: $NATIVE_RUN_ID"
          mkdir -p "android/app/src/main/jniLibs/$ABI" /tmp/so-artifact
          # Same fix as the llamacpp lookup above: $ABI as an argument, because
          # inside these single quotes the shell would not expand it and python
          # would have compared against the literal "libgs_ffi-$ABI". Found by
          # sweeping every single-quoted string in the file for a $ that belongs
          # in the middle of one.
          # Same reason as the llamacpp lookup above, and the same two traps
          # avoided: no comment inside the $( ), and no single-quoted python
          # that would stop the shell expanding $ABI. This inline version
          # compared the artifact name against the literal "libgs_ffi-$ABI".
          #
          # Found by sweeping every single-quoted string in this file for a $
          # that belongs in the middle of one. That sweep now reports zero.
          ARTIFACT_ID=$(
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN_ID/artifacts" \
            | python3 "$GITHUB_WORKSPACE/.github/scripts/pick_artifact_id.py" libgs_ffi "$ABI"
          )
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::no libgs_ffi-$ABI artifact in run $NATIVE_RUN_ID. An emulator of one ABI cannot load another ABI's .so, so this job cannot substitute. The build is wrong, not the run."
            exit 1
          fi
          echo "libgs_ffi-$ABI artifact id: $ARTIFACT_ID"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/so-artifact/a.zip
          python3 -c 'import zipfile; zipfile.ZipFile("/tmp/so-artifact/a.zip").extractall("/tmp/so-artifact/x")'
          SO=$(find /tmp/so-artifact/x -name 'libgs_ffi.so' -type f | head -1 || true)
          if [ -z "$SO" ]; then
            echo "::error::libgs_ffi.so not inside the artifact zip"
            find /tmp/so-artifact/x -type f | sed -n '1,20p'
            exit 1
          fi
          cp "$SO" android/app/src/main/jniLibs/$ABI/libgs_ffi.so

          # libgs_sd.so, AND THE GATE DECIDES WHETHER IT SHOULD BE HERE.
          #
          # This step found libgs_ffi.so with a `find -name` and copied that one file.
          # Option B put sd.cpp in a SECOND shared library that has to sit in the
          # SAME jniLibs/<abi>/ directory, and nothing here copied it, so it never
          # entered the APK. Everything upstream stayed green -- android-native
          # exported 5 of 5 entry points, the arch gate passed, 0 denied -- and the
          # only place it could show up was on the device:
          #
          #   sdBackendName is 'sd.cpp:unloadable'   (run 37135423868, sd0 FAILED)
          #
          # which is the failure this design has exactly one way to produce, and the
          # reason the wrapper tries the soname and then dladdr's its own path: a
          # library that is not a SIBLING cannot be found by either.
          #
          # Since ITEM 7 the gate inverts the rule: a build with
          # enable_sd_diffusion=false SHIPS NO libgs_sd.so on purpose, so absence
          # is now legal and the branch below decides between the two states.
          # What has NOT changed: when the library is shipped, it must be staged
          # here, or every diffusion number on the device is fabricated -- the
          # test fails closed on that, which is correct.
          SD_SO=$(find /tmp/so-artifact/x -name 'libgs_sd.so' -type f | head -1 || true)
          if [ -z "$SD_SO" ]; then
            # GATED OFF BY PRODUCT DECISION (ITEM 7 of the current brief).
            # android-native's enable_sd_diffusion input defaults to "false" and
            # a gated build ships NO libgs_sd.so at all: no 41.9 MB library, no
            # 882 MB checkpoint, GsNative.sdCreate fails closed. Absence is the
            # DESIGNED state of the artifact, not a broken upload.
            #
            # Raw evidence for why this cannot stay a hard failure: run
            # 37208912694 died here --
            #     ##[error]libgs_sd.so not inside the artifact zip.
            # -- before the emulator ever started, so 0 of 23 tests ran,
            # including the cancel test whose fix was waiting on a green suite.
            # The fetch step refused an artifact the producer was now SUPPOSED
            # to produce.
            #
            # sd0 detects the absence on the device (nativeLibraryDir probe)
            # and SKIPs loudly with the reason; the 882 MB checkpoint download
            # is skipped through GS_SD_LIB_ABSENT. Flip the gate in
            # android-native and both come back automatically.
            echo "::notice::libgs_sd.so is not in the artifact. Diffusion is"
            echo "::notice::gated off in android-native (enable_sd_diffusion=false"
            echo "::notice::is the shipping default). sd0 will SKIP on the device"
            echo "::notice::and the 882 MB checkpoint download is skipped."
            echo "GS_SD_LIB_ABSENT=true" >> "$GITHUB_ENV"
          else
            cp "$SD_SO" android/app/src/main/jniLibs/$ABI/libgs_sd.so
            echo "  libgs_sd.so staged: $(stat -c%s android/app/src/main/jniLibs/$ABI/libgs_sd.so) bytes"
            echo "GS_SD_LIB_ABSENT=false" >> "$GITHUB_ENV"
          fi
          # SAFETY NET, not the fix. android-native now links libc++ statically and
          # FAILS ITS OWN BUILD if a libc++_shared DT_NEEDED survives, so this
          # should find nothing. If it does, the companion is placed anyway so the
          # tests can run and the run reports a result instead of being unable to
          # start:
          #     java.lang.UnsatisfiedLinkError: dlopen failed: library
          #     "libc++_shared.so" not found
          COMPANION=$(find /tmp/so-artifact/x -name 'libc++_shared.so' -type f | head -1 || true)
          if [ -n "$COMPANION" ]; then
            echo "NOTE: placing companion $(basename "$COMPANION")"
            cp "$COMPANION" android/app/src/main/jniLibs/$ABI/libc++_shared.so
          else
            echo "companion: none needed"
          fi
          ls -l android/app/src/main/jniLibs/$ABI/
          # Prove the ELF machine is x86-64 BEFORE the APK is built. A wrong-ABI .so is
          # accepted by the build and rejected by the linker on device, where it looks
          # exactly like a missing file -- the ambiguity this step exists to remove.
          # A SCRIPT, NOT `python3 -c`. An inline body here puts `import struct`
          # at column 0, which ends the YAML block scalar and leaves the rest of
          # the file to parse as mapping keys:
          #     yaml.scanner.ScannerError: while scanning a simple key
          #       in ".github/workflows/android-device.yml", line 279, column 1
          #     could not find expected ':'
          # Third time in this repository. The script also carries the ABI table,
          # so the ABI->machine mapping exists in exactly one place.
          #
          # The comparison used to be against the literal "x86-64" whatever the
          # ABI was, which would have rejected a correct arm64 .so. And it is
          # spelled differently again from android-native.yml's table, which
          # compared "i386" against "i686" and so failed every correct x86 build.
          # Three spellings of the same idea; one now.
          MACHINE=$(python3 "$GITHUB_WORKSPACE/.github/scripts/elf_machine.py" \
            "android/app/src/main/jniLibs/$ABI/libgs_ffi.so")
          echo "ELF machine: $MACHINE  (ABI $ABI)"
          python3 "$GITHUB_WORKSPACE/.github/scripts/elf_machine.py" \
            "android/app/src/main/jniLibs/$ABI/libgs_ffi.so" "$ABI" \
            || { echo "::error::the linker would reject this .so on a $ABI emulator"; exit 1; }

          # BOTH, NOT ONE. An arm64 libgs_sd.so beside an x86_64 libgs_ffi.so is
          # accepted by the build, loads, and dies on the first call -- which from
          # the test's side is indistinguishable from "not packaged", because both
          # surface as the same gs_sd_backend_name. Checking only the first library
          # would have left that ambiguity in place for the second one, which is
          # precisely the failure mode Option B introduces that a single-library
          # design does not have.
          for SOFILE in libgs_ffi.so libgs_sd.so; do
            SMACH=$(python3 "$GITHUB_WORKSPACE/.github/scripts/elf_machine.py" \
              "android/app/src/main/jniLibs/$ABI/$SOFILE")
            echo "  $SOFILE: ELF machine $SMACH (ABI $ABI)"
            python3 "$GITHUB_WORKSPACE/.github/scripts/elf_machine.py" \
              "android/app/src/main/jniLibs/$ABI/$SOFILE" "$ABI" \
              || { echo "::error::$SOFILE is not $ABI. The linker would reject it on"
                   echo "::error::this emulator, and the failure surfaces as a missing"
                   echo "::error::library rather than as a wrong one."
                   exit 1; }
          done

          # THE KOTLIN CAN BE NEWER THAN THE LIBRARY, AND IT LOOKED LIKE SIXTEEN
          # BUGS.
          #
          # Run 36868936414 installed a .so from an android-native run whose commit
          # predated initTuned. The library loaded, the emulator booted, the 491 MB
          # model downloaded and checksum-verified, and then:
          #
          #   Tests 23/23 completed (16 failed)
          #   perf_...swept_in_one_run    FAILED  (all 12 configs rejected)
          #   a1 a1b a2 a3 a6 a7 b1 b2 b3 b4 c2 a0, GsNativeTest x2   FAILED
          #
          # Fifteen of those sixteen said exactly one thing:
          #
          #   GsNativeException: no native context; call init(modelPath) first
          #
          # which points at the MODEL. The one line that named the cause was in a
          # logcat artifact, after a 25-minute emulator run:
          #
          #   No implementation found for boolean
          #     com.grapsee.gsai.native.GsNative.initTuned(java.lang.String, int, int)
          #
          # So the two are compared BEFORE anything runs. Cheap, and it turns a
          # cascade into one named symbol.
          echo "=== does every Kotlin external fun exist in this .so? ==="
          bash "$GITHUB_WORKSPACE/.github/scripts/check_jni_matches_kt.sh" \
            "android/app/src/main/jniLibs/$ABI/libgs_ffi.so" \
            android/app/src/main/java

      - name: Fetch the 0.5B model and verify its checksum
        run: |
          set -euo pipefail
          # This is the model the instrumented tests load. Fetching it here also
          # VERIFIES the SHA-256 hardcoded in ModelCatalog.kt against the real
          # upstream file, which until now was a claim nothing had tested.
          #   expected: 74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db
          #   size   : 491,400,032 bytes
          URL="https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_0.gguf"
          EXPECT="7671c0c304e6ce5a7fc577bcb12aba01e2c155cc2efd29b2213c95b18edaf6ed"
          echo "fetching 429 MB from HuggingFace (the Q4_0 default)"
          curl -fL --retry 3 --retry-delay 5 -o model.gguf "$URL"
          SZ=$(stat -c%s model.gguf)
          echo "size: $SZ (expected 428730208)"
          [ "$SZ" = "428730208" ] || { echo "FAIL: size mismatch"; exit 1; }
          GOT=$(sha256sum model.gguf | cut -d' ' -f1)
          echo "sha256: $GOT"
          echo "expect: $EXPECT"
          if [ "$GOT" = "$EXPECT" ]; then
            echo "CHECKSUM MATCHES ModelCatalog.kt -- the hardcoded hash is correct"
            echo "GS_MODEL_VERIFIED=true" >> "$GITHUB_ENV"
          else
            # Not fatal to the device run: the model is still usable, and a
            # mismatch is a finding rather than a reason to skip the hardware.
            echo "CHECKSUM MISMATCH. ModelCatalog.kt needs updating. Continuing so"
            echo "the device results are not lost, and this is reported as a FAILURE."
            echo "GS_MODEL_VERIFIED=false" >> "$GITHUB_ENV"
          fi
          mkdir -p device-artifacts

      # =========================================================================
      # THE DIFFUSION CHECKPOINT. 882 MB, and every byte of that is checked
      # against the digest in DiffusionCatalog.kt before a test sees it -- the
      # same discipline the 0.5B model gets, and for a larger file.
      #
      # WHY NOT AN INSTRUMENTATION ARGUMENT AND A RUNTIME DOWNLOAD: the point of
      # this step is that the DIGEST IN THE CATALOGUE IS CORRECT. Fetching it here
      # and hashing it is what turns an assertion in a Kotlin file into a
      # measurement. A test that downloaded the weights itself would prove only
      # that a download works.
      #
      # NOT FATAL IF IT FAILS, and the reason is specific rather than diplomatic:
      # the LLM tests in the same run are still worth having, and losing 40
      # minutes of emulator time because a Hugging Face CDN had a bad minute
      # would be its own failure. It is reported as a FAILURE in the summary step
      # and the diffusion test SKIPS, loudly, rather than passing.
      # =========================================================================
      - name: Fetch the SDXS-512 checkpoint and verify its checksum
        run: |
          set -euo pipefail
          # THE LIBRARY GATE COMES FIRST. When the .so fetch found no
          # libgs_sd.so (diffusion gated off in android-native, ITEM 7), the
          # checkpoint has no consumer on the device and sd0 will SKIP. Pulling
          # 882 MB anyway would spend real runner minutes on a test that cannot
          # run -- the same waste the cache step below exists to avoid.
          if [ "${GS_SD_LIB_ABSENT:-false}" = "true" ]; then
            echo "::notice::no libgs_sd.so in this build (diffusion gated off)."
            echo "::notice::Skipping the 882 MB checkpoint download; sd0 SKIPs."
            echo "GS_SD_VERIFIED=false" >> "$GITHUB_ENV"
            echo "GS_SD_ABSENT=true" >> "$GITHUB_ENV"
            exit 0
          fi
          URL="https://huggingface.co/akleine/sdxs-512/resolve/main/sdxs.safetensors"
          EXPECT="6cca5bfd11b588cdfb4602018c7e623d24c95fdfdc5ab2d4b9e6978b3186980f"
          EXPECT_SZ="882587118"
          CHECKPOINT_NAME="sdxs-512-dreamshaper.safetensors"

          # BOTH ARE INITIALISED HERE, AND THAT IS THE WHOLE FIX.
          #
          # `set -euo pipefail` is on, and on the SUCCESS path neither variable
          # was ever assigned -- GS_SD_VERIFIED is set inside the `if`, and
          # GS_SD_ABSENT is only set in the two failure branches. So the closing
          #
          #     echo "GS_SD_ABSENT=$GS_SD_ABSENT" >> "$GITHUB_ENV"
          #
          # read an UNBOUND variable and the step exited 1 -- after the 882 MB had
          # been downloaded and its SHA-256 had been verified. Run 36971517977:
          #
          #     env:
          #       GS_MODEL_VERIFIED: true
          #       GS_SD_VERIFIED: true
          #                                    <- and no GS_SD_ABSENT line at all
          #     ##[error]Process completed with exit code 1.
          #
          # The job reported "Fetch the SDXS-512 checkpoint" as the failed step
          # and the log showed the checksum MATCHING, which is a contradiction
          # that points at the step rather than at the network or the file.
          #
          # The general form: a variable that is only assigned on some paths and
          # read on all of them is unset on the rest, and under `set -u` that is
          # a crash rather than an empty string. Defaults belong at the top.
          GS_SD_VERIFIED=false
          GS_SD_ABSENT=false

          echo "fetching 882 MB of diffusion weights from HuggingFace"
          if ! curl -fL --retry 3 --retry-delay 5 -o "$CHECKPOINT_NAME" "$URL"; then
            echo "::warning::could not fetch $URL; the diffusion test will SKIP"
            echo "GS_SD_VERIFIED=false" >> "$GITHUB_ENV"
            echo "GS_SD_ABSENT=true" >> "$GITHUB_ENV"
            exit 0
          fi

          SZ=$(stat -c%s "$CHECKPOINT_NAME")
          echo "size: $SZ (expected $EXPECT_SZ)"
          if [ "$SZ" != "$EXPECT_SZ" ]; then
            echo "::error::size mismatch: got $SZ, expected $EXPECT_SZ"
            echo "::error::DiffusionCatalog.kt's `bytes` is wrong. Aborting: an"
            echo "::error::unverified weight file must not reach a device test."
            exit 1
          fi

          GOT=$(sha256sum "$CHECKPOINT_NAME" | cut -d' ' -f1)
          echo "sha256: $GOT"
          echo "expect: $EXPECT"
          if [ "$GOT" = "$EXPECT" ]; then
            echo "CHECKSUM MATCHES DiffusionCatalog.kt -- the hardcoded hash is correct"
            GS_SD_VERIFIED=true
          else
            echo "::error::CHECKSUM MISMATCH. DiffusionCatalog.kt needs updating. The"
            echo "::error::file is left on disk and NOT pushed to the device, so a"
            echo "::error::test cannot act on a weight file nobody vouched for."
            rm -f "$CHECKPOINT_NAME"
            GS_SD_VERIFIED=false
            GS_SD_ABSENT=true
          fi
          echo "GS_SD_VERIFIED=$GS_SD_VERIFIED" >> "$GITHUB_ENV"
          echo "GS_SD_ABSENT=$GS_SD_ABSENT" >> "$GITHUB_ENV"
          ls -la "$CHECKPOINT_NAME" 2>/dev/null || echo "(removed: unverifiable)"

      # =========================================================================
      # ITEM 1, LEVER 4: THE OTHER THREE QUANTISATIONS.
      #
      # 2.12 GB of extra download in a job that already fetches 491 MB. That is
      # the cost of the measurement the brief asks for, and it is stated here
      # rather than discovered when a run times out.
      #
      # A LOOP, not three near-identical steps, because the three differ only in
      # url/size/digest and three copies of a verification block is three places
      # for a digest to be wrong in one of them. The pairs are read from a single
      # table below, so the values and the checks cannot drift apart.
      #
      # EACH IS VERIFIED OR DROPPED. A quantisation that fails its size or digest
      # is DELETED and reported, and the sweep then measures however many arrived
      # and names the ones that did not. Carrying an unverified weight file to a
      # device and measuring it would be worse than not measuring it: the number
      # would be real and wrong.
      # =========================================================================
      - name: Fetch the other three quantisations for the lever-4 sweep
        run: |
          set -euo pipefail
          BASE="https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main"
          # name                      url-path                          bytes         sha256
          # THREE names for THREE columns. It had FOUR:
          #
          #     while read -r NAME FILE BYTES SHA
          #
          # against rows of `filename  bytes  sha256`. Bash binds them in order and
          # does not complain about a leftover, so:
          #
          #     NAME  = qwen2.5-0.5b-instruct-q4_0.gguf
          #     FILE  = 428730208          <- THE BYTE COUNT
          #     BYTES = 7671c0c3...        <- THE DIGEST
          #     SHA   = (empty)
          #
          # and `curl -fL -o "$FILE" "$BASE/$FILE"` asked Hugging Face for a file
          # named `428730208`, which 404s. Three of four quantisations were never
          # downloaded, on two consecutive device runs, and the sweep reported one
          # row of four.
          #
          # The failure message is what gave it away, and it is worth keeping in
          # this form because a byte count where a filename belongs is not a
          # thing a reader can mistake for anything else:
          #
          #     ::warning::could not fetch 428730208; the sweep will run without it
          #
          # `$FILE` is also what the size and digest checks use, so a
          # mis-bound FILE would have made those checks meaningless too rather
          # than merely failing.
          while read -r FILE BYTES SHA; do
            [ -n "$FILE" ] || continue
            case "$FILE" in \#*) continue ;; esac
            # A row that is not three fields is not a row this loop understands,
            # and saying so is better than binding them one field along.
            if [ -z "$BYTES" ] || [ -z "$SHA" ]; then
              echo "::error::the quantisation table row '$FILE' has fewer than three"
              echo "::error::fields. Expected: filename  bytes  sha256."
              exit 1
            fi
            echo
            echo "=== $FILE: $BYTES bytes ==="
            # A MISSING QUANTISATION IS A FAILED RUN, NOT A SHORTER SWEEP.
            #
            # This was `::warning::` plus `continue`, and it is how the sweep
            # reported one row of four and stayed green on two consecutive device
            # runs: the download failed, the warning scrolled past, the test
            # printed "not on the device; skipping that row" for three rows and
            # PASSED. Nothing in the job was red. A measurement of one
            # configuration, presented as a measurement of four, is worse than no
            # measurement, because it gets quoted.
            #
            # It also failed open in the worst direction: if Hugging Face is
            # briefly unreachable, the run silently loses the row that would have
            # shown the shipped default is the slowest of the four.
            if ! curl -fL --retry 3 --retry-delay 5 -o "$FILE" "$BASE/$FILE"; then
              GS_QUANT_MISSING="${GS_QUANT_MISSING:-} $FILE"
              echo "::error::could not fetch $FILE from $BASE"
              echo "::error::The lever-4 sweep is defined over all four quantisations and"
              echo "::error::reports one row per file. Measuring three is not a result."
              echo "::error::Re-run; if it persists the upstream URL has moved and"
              echo "::error::ModelCatalog.kt and this TABLE both need the new one."
              exit 1
            fi
            SZ=$(stat -c%s "$FILE")
            if [ "$SZ" != "$BYTES" ]; then
              echo "::error::$FILE is $SZ bytes, expected $BYTES. ModelCatalog.kt is wrong"
              echo "::error::or upstream changed. Deleting rather than measuring it."
              rm -f "$FILE"
              GS_QUANT_MISSING="${GS_QUANT_MISSING:-} $FILE"
              exit 1
            fi
            GOT=$(sha256sum "$FILE" | cut -d' ' -f1)
            if [ "$GOT" != "$SHA" ]; then
              echo "::error::$FILE sha256 is $GOT, expected $SHA. Deleting rather than"
              echo "::error::measuring a weight file nothing has vouched for."
              rm -f "$FILE"
              GS_QUANT_MISSING="${GS_QUANT_MISSING:-} $FILE"
              exit 1
            fi
            echo "VERIFIED $FILE  $SZ bytes  $GOT"
          done <<'TABLE'
          qwen2.5-0.5b-instruct-q4_k_m.gguf 491400032  74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db
          qwen2.5-0.5b-instruct-q5_k_m.gguf 522186592  041474553fcabfc2a2d67903f9d2c2e50bd92528e670da4f33b5d0ce6e59fd55
          qwen2.5-0.5b-instruct-q8_0.gguf   675710816  ca59ca7f13d0e15a8cfa77bd17e65d24f6844b554a7b6c12e07a5f89ff76844e
          # q4_0 is NOT in this table: it is the control and is linked from the
          # already-verified model.gguf below. All four files still end up on the
          # device -- three downloaded here, one linked -- which is what the
          # four-row sweep needs.
          TABLE

          # Q4_0 is the CONTROL and is already in the workspace as model.gguf under
          # a different name. It is linked rather than downloaded a second time,
          # and the bytes are the bytes.
          #
          # The control FOLLOWED the default: it was Q4_K_M until android-device
          # 37118362666 measured Q4_0 as 4.9x-5.4x faster on TTFT and +0.06 (not
          # worse) on the 50-prompt rubric. A control that is not the shipped
          # default measures the wrong thing.
          #
          # Q4_K_M therefore moved INTO the fetch TABLE below. It used to be free
          # because the control supplied it; now it is downloaded and verified like
          # every other quantisation, which is what keeps the four-row sweep whole.
          if [ -f "$GITHUB_WORKSPACE/model.gguf" ]; then
            ln -f "$GITHUB_WORKSPACE/model.gguf" qwen2.5-0.5b-instruct-q4_0.gguf
            echo
            echo "q4_0 (CONTROL, and the shipped default) linked from the verified model.gguf"
            SZ=$(stat -c%s qwen2.5-0.5b-instruct-q4_0.gguf)
            echo "  $SZ bytes (expected 428730208)"
            [ "$SZ" = "428730208" ] || { echo "::error::the control is the wrong size"; exit 1; }
          else
            echo "::error::model.gguf is absent, so even the CONTROL is missing."
            echo "::error::The previous step verifies it and fails if it cannot; if this"
            echo "::error::fires, the sweep would have no baseline to compare against."
            exit 1
          fi

          echo "GS_QUANT_MISSING=${GS_QUANT_MISSING:-}" >> "$GITHUB_ENV"
          echo
          echo "=== quantisations present for the sweep ==="
          for F in qwen2.5-0.5b-instruct-q4_0.gguf \
                   qwen2.5-0.5b-instruct-q4_k_m.gguf \
                   qwen2.5-0.5b-instruct-q5_k_m.gguf \
                   qwen2.5-0.5b-instruct-q8_0.gguf; do
            if [ -f "$F" ]; then
              echo "  present  $F  $(stat -c%s "$F") bytes"
            else
              echo "  MISSING  $F"
            fi
          done
          echo "missing: ${GS_QUANT_MISSING:-none}"

      - name: Start the emulator and run the instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: ${{ inputs.abi || 'x86_64' }}
          profile: Nexus 6
          # A cold-boot profile. snapshot and headless are on by default.
          # -cores 4 -memory 3072: android-emulator-runner creates the AVD with
          # `hw.cpu.ncore=2`, and ModelCatalog.classify() needs 4 cores AND 2 GB for
          # anything above Tier.LOW:
          #     ram >= MODEL_0_5B.minRamBytes && cores >= 4 -> Tier.MID
          # At 2 cores the emulator classified LOW and every download call refused with
          # "this device does not run a local model", so the consent, resume and SHA-256
          # tests could never reach the code they exist to test. Raw, run 36420986162.
          #
          # classify() is production code and was NOT touched. A 2-core device really
          # cannot run these models and the refusal it got was correct; the emulator is
          # being configured to resemble the MID-tier phone that is under test.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -cores 4 -memory 3072
          disable-animations: true
          # `bash <script>`, NOT a bare path. The runner executes this through
          # /usr/bin/sh -c, which needs the exec bit, and the bit is lost on
          # checkout. Raw, run 36405645557 -- which BOOTED the emulator
          # successfully and then died here:
          #     [command]/usr/bin/sh -c .github/scripts/run-instrumented.sh
          #     /usr/bin/sh: 1: .github/scripts/run-instrumented.sh: Permission denied
          #     ##[error]The process '/usr/bin/sh' failed with exit code 126
          # This is the third time in this repo that a mode bit, not a program,
          # has been the failure. The fix is always the same: do not depend on it.
          script: bash .github/scripts/run-instrumented.sh

      - name: Report what actually ran
        if: always()
        run: |
          echo "emulator ABI: $ABI"
          set -euo pipefail
          echo "=== instrumented test summary ==="
          for f in android/app/build/reports/androidTests/connected/*/index.html; do
            [ -e "$f" ] || continue
            echo "report: $f"
          done
          for f in android/app/build/outputs/androidTest-results/connected/*.xml; do
            [ -e "$f" ] || continue
            echo "--- $(basename "$f") ---"
            grep -oE 'tests="[0-9]+" *[a-z]+="[0-9]+" *(failures|skipped)="[0-9]+"' "$f" || true
            grep -oE '<testsuite[^>]*name="[^"]*"' "$f" | sed 's/^/    /' | sed -n '1,40p' || true
          done
          {
            echo "### android-device"
            echo "emulator: API 30, google_apis, $ABI"
            echo "NOTE: an $ABI emulator is not a phone. Timings here are a floor."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logcat, test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-evidence
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
            device-artifacts/
            emulator-logcat.txt
          if-no-files-found: warn
          retention-days: 14
