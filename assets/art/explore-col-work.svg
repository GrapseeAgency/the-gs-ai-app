<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 215">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDEFE2"/>
      <stop offset="0.55" stop-color="#F8E3DA"/>
      <stop offset="1" stop-color="#F3D9D4"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9D4E8"/>
      <stop offset="1" stop-color="#CCC3DE"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8CFC0"/>
      <stop offset="1" stop-color="#DFC0B2"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBEFE7" stop-opacity="0"/>
      <stop offset="1" stop-color="#FBEFE7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="pagodaBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8B4D8"/>
      <stop offset="1" stop-color="#A99BC4"/>
    </linearGradient>
  </defs>

  <rect width="420" height="215" fill="url(#sky)"/>
  <!-- sun haze -->
  <circle cx="120" cy="70" r="52" fill="#FFF6E8" opacity="0.7"/>

  <!-- far mountains -->
  <path d="M -10 150 C 60 96, 130 92, 200 140 C 250 170, 320 168, 430 128 L 430 215 L -10 215 Z" fill="url(#hillFar)" opacity="0.85"/>
  <!-- the pagoda on the far ridge -->
  <g transform="translate(298,96)" fill="url(#pagodaBody)">
    <rect x="-3" y="-52" width="6" height="10"/>
    <path d="M 0 -58 L 5 -46 L -5 -46 Z"/>
    <path d="M -22 -34 C -10 -40, 10 -40, 22 -34 L 16 -28 L -16 -28 Z"/>
    <rect x="-11" y="-28" width="22" height="12"/>
    <path d="M -28 -16 C -14 -23, 14 -23, 28 -16 L 20 -9 L -20 -9 Z"/>
    <rect x="-14" y="-9" width="28" height="13"/>
    <path d="M -34 2 C -18 -6, 18 -6, 34 2 L 25 10 L -25 10 Z"/>
    <rect x="-17" y="10" width="34" height="16"/>
  </g>
  <!-- near hills -->
  <path d="M -10 176 C 80 132, 180 140, 260 172 C 320 194, 380 190, 430 172 L 430 215 L -10 215 Z" fill="url(#hillNear)"/>
  <!-- mist bands -->
  <rect x="0" y="150" width="420" height="65" fill="url(#mist)"/>
  <ellipse cx="140" cy="178" rx="120" ry="14" fill="#FBEFE7" opacity="0.7"/>
  <ellipse cx="330" cy="196" rx="130" ry="12" fill="#FBEFE7" opacity="0.6"/>
</svg>
