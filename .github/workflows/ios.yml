name: iOS (macOS) — Xcode build & test

# REAL compilation verification on a GitHub-hosted macOS runner.
#
# This workflow is the iOS compile gate. The Python static gates
# (scripts/ios_static_gates.py, scripts/swift_structure_gate.py) are
# supplementary structural checks only — they are NOT a substitute for
# Xcode compilation and are run here merely as a cheap pre-flight.
#
# Code signing: intentionally disabled (project.yml sets
# CODE_SIGNING_ALLOWED=NO and the workflow passes it explicitly), so
# headless CI needs no certificates, provisioning profiles, or team ID.
# The artifacts produced are unsigned simulator builds/archives.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "scripts/ios_static_gates.py"
      - "scripts/swift_structure_gate.py"
      # The pixel gate below runs this script and blocks on its verdict, so a
      # commit that changes the measurement has to run it. Without this line the
      # gate could be made stricter or looser in total silence — the same defect
      # `check_workflow_trigger_covers_scripts.py` exists for, one directory over.
      - "scripts/check_home_render.py"
      - "scripts/check_explore_render.py"
      # The Settings pixel gate below runs this script and enforces the numbers
      # in those mocks, so a commit to either has to run this job.
      - "scripts/check_settings_render.py"
      - "docs/reference/settings/**"
      - "shared-contracts/explore-geometry.json"
      # The adversarial suite below runs the pixel gate against doctored frames;
      # changing it, or the artwork manifest it feeds, has to run this job too.
      - "scripts/test_home_render_gate.py"
      - "scripts/prepare_home_art.py"
      - "scripts/check_home_dark.py"
      - "scripts/check_font_faces.py"
      - "scripts/check_drawer_render.py"
      - "scripts/check_drawer_dark.py"
      - "scripts/check_drawer_structure.py"
      - "scripts/check_icon_catalogue.py"
      - "ios/App/Sources/Components/Drawer/DrawerTopicIcons.swift"
      - "scripts/test_drawer_render_gate.py"
      - ".github/scripts/check_drawer_type_parity.py"
      - "assets/reference/drawer-reference.png"
      - "shared-contracts/drawer-geometry.json"
      # This one reads the Swift side of every Home type role; a change to either
      # the lint or the view has to run it here, because android-app's filter does
      # not see ios/**.
      - ".github/scripts/check_home_type_parity.py"
      - ".github/scripts/check_gate_scripts_are_invoked.py"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build-test:
    name: Compile + test (macOS runner, real Xcode)
    runs-on: macos-15
    timeout-minutes: 60

    env:
      PROJECT_DIR: ios
      PROJECT_FILE: ios/GSApp.xcodeproj
      SCHEME: GSApp
      DERIVED_DATA: ios/build/DerivedData

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Host toolchain report (before selection)
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          swift --version || true

      - name: Select Xcode (latest stable available on the runner image)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain report (after selection — recorded for the report)
        run: |
          echo "xcodebuild: $(xcodebuild -version | tr '\n' ' ')"
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          swift --version
          # `sed -n '1p'`, not `| head -1`. head closes the pipe, xcodebuild
          # takes SIGPIPE, and the nested command substitution cannot fail the
          # enclosing echo -- so the visible symptom there is not a dead step but
          # an EMPTY XCODE_VERSION written to the environment. A gate that reads
          # it later then fails for a reason three steps away.
          echo "XCODE_VERSION=$(xcodebuild -version | sed -n '1s/.*Xcode \(.*\)/\1/p')" >> "$GITHUB_ENV"

      - name: Static validation (supplementary — NOT a substitute for compilation)
        run: |
          python3 scripts/ios_static_gates.py
          python3 scripts/swift_structure_gate.py

      # The type contract is shared: it reads HomeDashboardView.swift and the Kotlin
      # view and fails if a role's size, weight, line height or tracking differs. It
      # was written before this job and invoked by nothing, so nothing held; the
      # meta-lint right after it keeps that from recurring for any script in the tree.
      - name: Home's type roles match across platforms, and every gate is invoked
        run: |
          set -euo pipefail
          python3 .github/scripts/check_home_type_parity.py
          python3 .github/scripts/check_gate_scripts_are_invoked.py --self-test
          python3 .github/scripts/check_gate_scripts_are_invoked.py

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          cd "$PROJECT_DIR"
          xcodegen generate
          test -d GSApp.xcodeproj || { echo "::error::GSApp.xcodeproj was not generated"; exit 1; }
          xcodebuild -list -project GSApp.xcodeproj

      - name: Fetch the GsFfi xcframework from the latest ios-native run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # THE APP TARGET HARD-LINKS Frameworks/GsFfi.xcframework (project.yml
          # dependencies), so a bare checkout cannot compile -- raw evidence,
          # every push since ~2026-10-04 failed at exactly that link, e.g. run
          # 37292984587:
          #     error: There is no XCFramework found at
          #     '.../ios/Frameworks/GsFfi.xcframework'. (in target 'App')
          # The framework is native toolchain OUTPUT, never a committed file
          # (no binaries in this repository). The producer is ios-native.yml,
          # which uploads it as the GsFfi.xcframework artifact; this pull gate
          # takes the latest successful one -- the same producer/consumer
          # pattern android-device.yml uses for libgs_ffi.so.
          RUN_ID=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ios-native.yml/runs?status=success&per_page=1" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); runs=d.get("workflow_runs",[]); print(runs[0]["id"] if runs else "")')
          if [ -z "$RUN_ID" ]; then
            echo "::error::no successful ios-native run to take GsFfi.xcframework from"
            exit 1
          fi
          echo "ios-native run: $RUN_ID"
          ART=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); arts=[a for a in d.get("artifacts",[]) if a["name"]=="GsFfi.xcframework"]; print(arts[0]["id"] if arts else "")')
          if [ -z "$ART" ]; then
            echo "::error::no GsFfi.xcframework artifact in ios-native run $RUN_ID"
            exit 1
          fi
          echo "artifact id: $ART"
          XF="$PROJECT_DIR/Frameworks/GsFfi.xcframework"
          rm -rf "$XF"
          mkdir -p "$XF"
          # The artifact zip's ROOT IS the xcframework's contents (Info.plist +
          # slice dirs) -- the same layout ios-native's own download step
          # extracts into this exact path.
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ART/zip" -o /tmp/xff.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/xff.zip').extractall('$XF')"
          test -f "$XF/Info.plist" || {
            echo "::error::the artifact zip did not yield GsFfi.xcframework/Info.plist. What came out:"
            find "$XF" -maxdepth 2 | sed -n '1,20p'
            exit 1
          }
          # BOTH SLICES, asserted the way ios-native asserts them: the plist's
          # LibraryIdentifier names are the truth, and a simulator-only or
          # device-only framework fails later with a dyld error that reads
          # like a broken build instead of a missing slice.
          # plutil -p, NOT raw grep: the Info.plist inside the artifact is a
          # BINARY plist, and grep over its bytes matched nothing (raw: run
          # 37308093580, "no ios-arm64-simulator slice" immediately after a
          # successful download and extract).
          plutil -p "$XF/Info.plist" > /tmp/xff-plist.txt || {
            echo "::error::could not read the fetched Info.plist"
            exit 1
          }
          cat /tmp/xff-plist.txt
          # THE SLICE NAMES INCLUDE EVERY ARCHITECTURE: the simulator slice is
          # a fat arm64+x86_64 build whose LibraryIdentifier is
          # "ios-arm64_x86_64-simulator" (raw: run 37308423838 -- the literal
          # "ios-arm64-simulator" matched nothing because of the _x86_64). So
          # match on what the identifiers are actually made of: a slice whose
          # name ends in -simulator, and the bare device identifier ios-arm64.
          grep -q -- '-simulator"' /tmp/xff-plist.txt || { echo "::error::no simulator slice in the fetched framework"; exit 1; }
          grep -q '"ios-arm64"' /tmp/xff-plist.txt || { echo "::error::no ios-arm64 device slice in the fetched framework"; exit 1; }
          echo "staged: $(du -sh "$XF" | cut -f1)"

      - name: Resolve available iPhone simulator destination
        run: |
          xcrun simctl list devices available
          # simctl device lines end with a trailing space: "  iPhone 16 Pro (UUID) (Shutdown) "
          # — the regex must tolerate it (fixed after run #1 failed exactly here).
          # NO `head` IN A PIPELINE. The original ended in
          #
          #     | head -1 | xargs)
          #
          # and `head -1` exits on the first match, closing the pipe; `sed` takes
          # SIGPIPE and exits 141, and under `set -euo pipefail` the step dies
          # there with nothing on stdout. `read` cannot be signalled, so the first
          # match is taken with a loop and then the variable is trimmed in bash.
          NAME=""
          while IFS= read -r _CAND; do
            [ -n "$_CAND" ] || continue
            NAME="$(printf '%s' "$_CAND" | xargs)"
            break
          done < <(xcrun simctl list devices available 2>/dev/null \
                   | sed -n 's/^[[:space:]]*\(iPhone[^()]*\) ([^)]*) ([^)]*)[[:space:]]*$/\1/p')
          if [ -z "$NAME" ]; then
            echo "::error::No available iPhone simulator found on runner image"
            exit 1
          fi
          DEST="platform=iOS Simulator,name=${NAME},OS=latest"
          echo "IOS_DESTINATION=$DEST" >> "$GITHUB_ENV"
          echo "Using destination: $DEST"

      - name: Build (real Xcode compilation of the iOS target)
        run: |
          set -o pipefail
          mkdir -p ios/build
          xcodebuild build \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee ios/build/xcodebuild-build.log

      - name: Test (XCTest unit tests on iOS simulator)
        run: |
          set -o pipefail
          # HomeRenderTests writes to /tmp/gs-home-renders because a step-level
          # env var never reaches the simulator-launched host. Clear it first:
          # otherwise a capture left behind by an earlier run would satisfy the
          # probe below even if this run's harness produced nothing at all.
          rm -rf /tmp/gs-home-renders
          # A FIXED path, because the menu-chrome step later exports this
          # bundle's attachments: a timestamped name would make each step guess
          # at the other's output.
          RESULT_BUNDLE="ios/build/GSApp-tests.xcresult"
          rm -rf "$RESULT_BUNDLE"
          xcodebuild test \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ios/build/xcodebuild-test.log

      - name: Set up Python for the render probe
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render-probe dependencies
        run: |
          set -euo pipefail
          # Pinned. This step feeds the numerics behind a blocking gate
          # (np.median over a probe window), so an unpinned numpy or Pillow
          # release could move a measured value and flip both platforms' verdict
          # with no change on our side.
          python3 -m pip install --quiet --disable-pip-version-check "numpy==2.1.3" "pillow==11.0.0"

      - name: Collect the iOS renders into the workspace
        run: |
          set -euo pipefail
          # iOS had no pixel evidence at all, which is why three of Wave 0's
          # four criticals — a card's copy rendered into the wrong corner, a
          # page that silently opted out of the app's font-scale contract, and a
          # resume card pinned to the oldest thread — shipped green. This is the
          # gate that would have caught them, and it is the same instrument
          # Android is held to, so the two platforms cannot drift apart quietly.
          #
          # HomeRenderTests writes to /tmp/gs-home-renders: an env var set on
          # this step never reaches the simulator-launched test host, so the
          # shared /tmp is the channel. Collect it into the workspace before
          # asserting, so a missing render is a build failure and not a shrug.
          SRC=/tmp/gs-home-renders
          DIR=ios/build/home-renders
          mkdir -p "$DIR"
          if [ -d "$SRC" ]; then cp "$SRC"/home-ios-*.png "$DIR/" 2>/dev/null || true; fi
          # The drawer writes its own directory, so Home's glob above can never
          # pick a drawer frame up and mis-register a Home probe on it.
          DSRC=/tmp/gs-drawer-renders
          if [ -d "$DSRC" ]; then cp "$DSRC"/drawer-ios-*.png "$DIR/" 2>/dev/null || true; fi
          for n in drawer-ios-393x852 drawer-ios-393x852-dark drawer-ios-360x780 \
                   drawer-ios-500chats-393x852; do
            test -s "$DIR/$n.png" \
              || { echo "::error::$n.png missing — the drawer harness did not produce it"; exit 1; }
          done
          for w in 393x852 411x914 360x780; do
            test -s "$DIR/home-ios-$w.png" \
              || { echo "::error::home-ios-$w.png missing — the render harness did not produce it"; exit 1; }
          done

      - name: Upload the iOS Home renders
        # BEFORE the measurement, for the same reason android-app.yml now does
        # it: the step that fails is the one whose pixels are needed, and an
        # upload ordered after a blocking gate is skipped by exactly the reds
        # that have to be read.
        uses: actions/upload-artifact@v4
        with:
          name: home-renders-ios
          path: ios/build/home-renders/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Collect the Nexly chat response render
        if: always()
        run: |
          set -euo pipefail
          # NexlyChatRenderTests uses the same simulator-visible /tmp channel as
          # HomeRenderTests. A missing PNG is a build failure, not a shrug.
          SRC=/tmp/gs-nexly-renders
          DIR=ios/build/nexly-renders
          mkdir -p "$DIR"
          if [ -d "$SRC" ]; then cp "$SRC"/nexly-chat-ios-*.png "$DIR/" 2>/dev/null || true; fi
          for w in 393x852 411x914 360x780; do
            test -s "$DIR/nexly-chat-ios-$w.png" \
              || { echo "::error::nexly-chat-ios-$w.png missing — the chat render harness did not produce it"; exit 1; }
          done
          test -s "$DIR/nexly-chat-ios-thinking-393x852.png" \
            || { echo "::error::the adaptive-thinking render was not produced"; exit 1; }
          for w in 411x914 393x852; do
            test -s "$DIR/nexly-chat-ios-full-$w.png" \
              || { echo "::error::nexly-chat-ios-full-$w.png missing — the full-chat render did not run"; exit 1; }
            test -s "$DIR/nexly-chat-ios-full-prose-$w.png" \
              || { echo "::error::nexly-chat-ios-full-prose-$w.png missing — the prose render did not run"; exit 1; }
          done

      - name: Collect the Explore AI render
        if: always()
        run: |
          set -euo pipefail
          # ExploreRenderTests shares the /tmp channel; a missing PNG is a
          # build failure, not a shrug. The 393x1400 capture is the
          # reference-height full page.
          SRC=/tmp/gs-nexly-renders
          DIR=ios/build/nexly-renders
          mkdir -p "$DIR"
          if [ -d "$SRC" ]; then cp "$SRC"/nexly-explore-ios-*.png "$DIR/" 2>/dev/null || true; fi
          if [ -d "$SRC" ]; then cp "$SRC"/nexly-discover-ios-*.png "$DIR/" 2>/dev/null || true; fi
          for w in 393x852 411x914 360x780 393x1400; do
            test -s "$DIR/nexly-explore-ios-$w.png" \
              || { echo "::error::nexly-explore-ios-$w.png missing — the Explore render harness did not produce it"; exit 1; }
          done
          for w in 393x852 393x1400; do
            test -s "$DIR/nexly-discover-ios-$w.png" \
              || { echo "::error::nexly-discover-ios-$w.png missing — the Discover render harness did not produce it"; exit 1; }
          done
          test -s "$DIR/nexly-explore-ios-search-393x852.png" \
            || { echo "::error::the Explore search-state render was not produced"; exit 1; }

      - name: Collect the Settings renders
        if: always()
        run: |
          set -euo pipefail
          # SettingsRenderTests shares the same /tmp channel: the three
          # settings screens from docs/reference/settings/, two widths each.
          SRC=/tmp/gs-nexly-renders
          DIR=ios/build/nexly-renders
          mkdir -p "$DIR"
          if [ -d "$SRC" ]; then cp "$SRC"/nexly-settings-ios-*.png "$DIR/" 2>/dev/null || true; fi
          if [ -d "$SRC" ]; then cp "$SRC"/nexly-profile-ios-*.png "$DIR/" 2>/dev/null || true; fi
          if [ -d "$SRC" ]; then cp "$SRC"/nexly-memory-ios-*.png "$DIR/" 2>/dev/null || true; fi
          for name in nexly-settings-ios nexly-profile-ios nexly-memory-ios; do
            for w in 393x852 360x780; do
              test -s "$DIR/$name-$w.png" \
                || { echo "::error::$name-$w.png missing — the Settings render harness did not produce it"; exit 1; }
            done
          done

      - name: Measure the Settings trio against its pixel contract
        if: always()
        run: |
          set -euo pipefail
          # The captures above were gated on EXISTENCE only, which is how a
          # settings card can go flat, a lit rim stop painting or the peach CTA
          # come back as glass while the job stays green. This blocks on the
          # mock's own numbers (docs/reference/settings/settings-geometry.json):
          # the card's composite against the ground actually under it — read out
          # of the shipped backdrop, identical bytes on both platforms — its lit
          # rim, and the CTA's saturation. Probes hang off the rim they FIND, so
          # iOS's safe-area difference cannot shift what is measured.
          # This step is if: always(), so prove the artifact exists first: a
          # missing PNG must be a named error, not the script's opaque exit 2.
          DIR=ios/build/nexly-renders
          for pair in hub:nexly-settings-ios profile:nexly-profile-ios memory:nexly-memory-ios; do
            screen=${pair%%:*}
            stem=${pair##*:}
            for w in 393x852 360x780; do
              PNG="$DIR/$stem-$w.png"
              test -s "$PNG" \
                || { echo "::error::$PNG was not produced — nothing to measure"; exit 1; }
              python3 scripts/check_settings_render.py \
                --render "$PNG" --screen "$screen" --label "ios-$screen-$w" \
                --platform ios \
                --backdrop "ios/App/Assets.xcassets/GSHomeBackdrop.imageset/gs-home-backdrop.png"
            done
          done
          # The gate's own non-vacuity: paint each card flat onto its ground,
          # bury its rim and desaturate the pill, and every gated probe must go
          # red on the doctored copy. A probe that cannot fail is not a gate.
          for pair in hub:nexly-settings-ios profile:nexly-profile-ios memory:nexly-memory-ios; do
            screen=${pair%%:*}
            stem=${pair##*:}
            python3 scripts/check_settings_render.py \
              --render "$DIR/$stem-393x852.png" --screen "$screen" --self-test \
              --platform ios \
              --backdrop "ios/App/Assets.xcassets/GSHomeBackdrop.imageset/gs-home-backdrop.png"
          done

      - name: Upload the Nexly chat response render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexly-chat-render-ios
          path: ios/build/nexly-renders/*.png
          if-no-files-found: error
          retention-days: 30

      - name: The menu harness ran, and left its captures
        if: always()
        run: |
          set -euo pipefail
          # The 29 menu rows were drawn by UIKit's menu chrome, which decides
          # whether a Label's icon is drawn at all — the one thing no static
          # check can see. MenuChromeTests opens every real menu and measures
          # the ink beside each title; this step proves the harness RAN (a
          # skipped or never-started test leaves no log line) and exports the
          # captures it left. Both halves are the gate: a capture with no test
          # is a screenshot of nothing, and a test with no capture cannot be
          # read by a human afterwards.
          LOG=ios/build/xcodebuild-test.log
          # EXPORT FIRST, assert after. A step that fails before exporting
          # throws away the very captures and numbers the failure has to be
          # read from (run 40130252859 produced none).
          DIR=ios/build/menu-chrome
          rm -rf "$DIR"; mkdir -p "$DIR"
          xcrun xcresulttool export attachments \
            --path ios/build/GSApp-tests.xcresult --output-path "$DIR/raw" \
            > "$DIR/export.log" 2>&1 || { echo "::error::xcresulttool could not export the attachments"; cat "$DIR/export.log"; }
          python3 - "$DIR" <<'PY'
          import glob, json, os, re, shutil, sys
          root = sys.argv[1]
          raw = os.path.join(root, "raw")
          path = os.path.join(raw, "manifest.json")
          if not os.path.exists(path):
              print("no manifest at", path)
              sys.exit(0)
          manifest = json.load(open(path))
          groups = manifest if isinstance(manifest, list) else [manifest]
          kept = []
          for group in groups:
              for a in group.get("attachments", []):
                  name = a.get("suggestedHumanReadableName") or ""
                  # Xcode appends `_<n>_<uuid>` and an extension to the name
                  # given to the attachment (run 40134206951 produced
                  # `menu-x_0_UUID.png.png`, run 40139415325 `report.json`),
                  # so the NAME is normalised first and matched after.
                  base = re.sub(r"(_\d+_[0-9A-Fa-f-]{36})?\.(png|jpe?g|json)$", "", name)
                  if base != "report" and not base.startswith("menu-"):
                      continue
                  if base == "report":
                      dst = os.path.join(root, "report.json")
                  else:
                      ext = os.path.splitext(a.get("exportedFileName", ""))[1] or ".png"
                      dst = os.path.join(root, base + ext)
                  shutil.copyfile(os.path.join(raw, a["exportedFileName"]), dst)
                  kept.append(os.path.basename(dst))
          print("exported:", ", ".join(sorted(kept)) or "nothing")
          PY
          if [ -s "$DIR/report.json" ]; then
            echo "=== the harness's own numbers ==="
            cat "$DIR/report.json"
          fi
          if ! grep -q "Test Case '-\[GsChatUITests.MenuChromeTests testEveryMenuPutsItsGlyphInTheLeadingSlot\]' passed" "$LOG"; then
            echo "::error::MenuChromeTests did not pass in this run — the menu gate is not live"
            grep -E "MenuChromeTests|MENU-|MEASURE |error: -\[" "$LOG" | head -60 || true
            exit 1
          fi
          for n in chats-row-context chats-row-swipe-leading chats-row-swipe-trailing \
                   user-bubble-context assistant-bubble-context drawer-recent-context; do
            ls "$DIR/menu-$n".* >/dev/null 2>&1 \
              || { echo "::error::menu-$n is missing — the menu harness opened no such menu"; exit 1; }
          done
          test -s "$DIR/report.json" || { echo "::error::report.json missing — no measurements were written"; exit 1; }
          # The only menus this build cannot open are the two header ones: their
          # contextMenus sit on buttons that consume the long press as their
          # action. Any OTHER menu that stops opening must fail this gate — a
          # skip list that can grow is how a gate turns itself off.
          python3 - "$DIR/report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          allowed = {"chat-header-sparkle", "chat-header-menu"}
          unreachable = set(report.get("unreachableMenus", []))
          print("unreachable (accepted):", sorted(unreachable) or "none")
          extra = sorted(unreachable - allowed)
          if extra:
              print(f"::error::menus that should have opened did not: {extra}")
              sys.exit(1)
          PY

      - name: Upload the menu-chrome captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-chrome-ios
          path: ios/build/menu-chrome/*
          if-no-files-found: warn
          retention-days: 30

      - name: Package — zip unsigned simulator .app
        run: |
          # XcodeGen's default PRODUCT_NAME = target name → the built bundle
          # is App.app (overriding PRODUCT_NAME desyncs the auto TEST_HOST).
          APP_PATH="ios/build/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH" || { echo "::error::Compiled App.app not found"; exit 1; }
          cd "$(dirname "$APP_PATH")"
          zip -qry "$GITHUB_WORKSPACE/ios/build/GSApp-simulator-debug.zip" App.app
          ls -l "$GITHUB_WORKSPACE/ios/build/GSApp-simulator-debug.zip"

      - name: Archive — unsigned Release xcarchive (packaging evidence)
        run: |
          set -o pipefail
          rm -rf ios/build/GSApp.xcarchive
          xcodebuild archive \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -archivePath ios/build/GSApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ios/build/xcodebuild-archive.log

      - name: Summarise results
        if: always()
        run: |
          APP_BUILT=$([ -d ios/build/DerivedData/Build/Products/Debug-iphonesimulator/App.app ] && echo "YES" || echo "NO")
          ARCHIVED=$([ -d ios/build/GSApp.xcarchive ] && echo "YES" || echo "NO")
          TESTS=$(grep -Eo "Test Suite 'All tests' (passed|failed)" ios/build/xcodebuild-test.log 2>/dev/null | sed -n '1p' || echo "n/a")
          # A GREEN SUITE LINE DOES NOT SAY WHICH SUITES RAN. The drawer's iOS
          # behaviour lives in DrawerLogicTests and its captures in
          # DrawerRenderTests; if either stops being collected the summary still
          # reads "passed" and the drawer is untested. Named here, for the same
          # reason android-app.yml names its two classes.
          for suite in DrawerLogicTests DrawerRenderTests; do
            if ! grep -q "Test Suite '$suite' passed" ios/build/xcodebuild-test.log; then
              echo "::error::$suite did not pass -- the drawer's iOS evidence is missing"
              exit 1
            fi
          done
          {
            echo "## iOS CI summary"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Runner | \`${RUNNER_NAME}\` (${RUNNER_OS} ${ImageOS:-}) |"
            echo "| Xcode | \`${XCODE_VERSION:-unknown}\` |"
            echo "| App target compiled | ${APP_BUILT} |"
            echo "| XCTest result | ${TESTS} |"
            echo "| Unsigned xcarchive | ${ARCHIVED} |"
            echo "| Code signing | disabled by design (unsigned artifacts) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact (unsigned simulator app)
        uses: actions/upload-artifact@v4
        with:
          name: GSApp-simulator-debug-${{ github.sha }}
          path: ios/build/GSApp-simulator-debug.zip
          if-no-files-found: error

      - name: Upload unsigned Release xcarchive
        uses: actions/upload-artifact@v4
        with:
          name: GSApp-xcarchive-unsigned-${{ github.sha }}
          path: ios/build/GSApp.xcarchive
          if-no-files-found: error

      # LAST, after every artifact is built and uploaded. The gate is blocking —
      # a red here fails the job — but it used to sit between Test and Package,
      # so a probe drift cost the .app and the .xcarchive too, and the run that
      # needed inspecting was the one with nothing to inspect. Judgment goes
      # after evidence, in this job as well as in android-app.yml.
      - name: Measure the iOS render against the reference
        run: |
          set -euo pipefail
          DIR=ios/build/home-renders
          python3 scripts/check_home_render.py \
            --reference assets/reference/home-reference.png \
            --render "$DIR/home-ios-393x852.png" --probe-set ios --label ios-393

      - name: Measure the Explore dock against its pixel contract
        run: |
          set -euo pipefail
          # The Explore renders were gated on existence only, which is why the
          # page could look done with the dock never painted. This blocks on
          # the capsule hairline and the lit pill's saturation, both measured
          # off the CI renders (shared-contracts/explore-geometry.json), and
          # re-runs the gate's non-vacuity doctoring on the same capture.
          python3 scripts/check_explore_render.py \
            --render ios/build/nexly-renders/nexly-explore-ios-393x852.png \
            --platform ios --label ios-393
          python3 scripts/check_explore_render.py \
            --render ios/build/nexly-renders/nexly-explore-ios-393x852.png \
            --self-test

      - name: Measure the drawer against its reference sheet
        run: |
          set -euo pipefail
          python3 scripts/check_drawer_render.py \
            --render ios/build/home-renders/drawer-ios-393x852.png \
            --home ios/build/home-renders/home-ios-393x852.png \
            --same-frame ios/build/home-renders/drawer-ios-500chats-393x852.png \
            --probe-set ios --label ios-drawer

      # The drawer gate's own non-vacuity, executed every run: eight doctored
      # frames, each caught by the check that owns it, and the real frame passing.
      - name: The drawer gate can still fail
        run: |
          set -euo pipefail
          python3 scripts/test_drawer_render_gate.py \
            --render ios/build/home-renders/drawer-ios-393x852.png --home ios/build/home-renders/home-ios-393x852.png

      - name: The drawer's type and geometry agree across platforms
        run: |
          set -euo pipefail
          python3 .github/scripts/check_drawer_type_parity.py

      - name: The drawer's structure (lazy list, no per-frame sort, no shadow)
        run: |
          set -euo pipefail
          python3 scripts/check_drawer_structure.py --self-test

      - name: The icon catalogue (1,611 geometries, 5,466 names, both platforms)
        run: |
          set -euo pipefail
          python3 scripts/check_icon_catalogue.py --self-test

      - name: The drawer in dark mode
        run: |
          set -euo pipefail
          python3 scripts/check_drawer_dark.py \
            --render ios/build/home-renders/drawer-ios-393x852-dark.png \
            --home ios/build/home-renders/home-ios-393x852-dark.png \
            --label ios-drawer-dark

      - name: The faces are upright and named for their weight
        run: |
          set -euo pipefail
          python3 scripts/check_font_faces.py

      - name: The dark page holds up
        run: |
          set -euo pipefail
          python3 scripts/check_home_dark.py \
            --render ios/build/home-renders/home-ios-393x852-dark.png \
            --label ios-dark

      # The gate's own non-vacuity, executed every run: flat page, cards painted
      # out, hairline erased, frame shifted, probes slipped, backdrop dimmed. A
      # green pixel gate that cannot fail has certified nothing, so the proof is a
      # step rather than a paragraph in a commit message.
      - name: The pixel gate can still fail
        run: |
          set -euo pipefail
          python3 scripts/test_home_render_gate.py \
            --render ios/build/home-renders/home-ios-393x852.png \
            --probe-set ios

      - name: Upload full xcodebuild logs (failure diagnostics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ github.run_id }}
          path: ios/build/*.log
          if-no-files-found: ignore
