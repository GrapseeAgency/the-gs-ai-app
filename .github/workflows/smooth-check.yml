name: smooth-check (emulator)

# Runs scripts/smooth-check.sh (48 interactions) against a KVM Android
# emulator on GitHub infra. The emulator's absolute numbers are garbage
# (software GPU); its ORDERING is the signal -- the slowest interactions
# here are the slowest on the operator's phone.
#
# Dispatch-only. Inputs:
#   update_baseline -- also write docs/perf/emulator-baseline.md (STEP 1 only)
#
# The APK is :app:assembleDebug with the committed BASE_URL pointing at the
# public preview gateway, so chat sends + streaming replies work on CI.

on:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'also refresh docs/perf/emulator-baseline.md'
        required: false
        default: 'false'
        type: string
      capture_profile:
        description: 'after the check: build RELEASE, exercise it, dump the ART profile, commit android/app/src/main/baseline-prof.txt'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write

concurrency:
  group: smooth-check-emulator
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build :app debug APK
        working-directory: android
        run: gradle --no-build-cache --max-workers=2 :app:assembleDebug

      - name: Enable KVM
        run: |
          echo '::group::kvm'
          ls -la /dev/kvm || true
          sudo chmod 666 /dev/kvm || true
          echo '::endgroup::'

      # Run 38769712321 died here with `adb: command not found` -- platform-tools
      # is installed by sdkmanager but is never on the runner PATH. Every step
      # below (and scripts/smooth-check.sh itself) shells out to `adb`.
      - name: Add adb to PATH
        run: echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install emulator + system image
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64"

      - name: Boot emulator
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        # Hardened after run 38771590818 hung in `adb wait-for-device` for 17+
        # minutes: the emulator process was either dead or stuck at boot with
        # nobody looking. Every wait is now bounded; a dead qemu dumps
        # /tmp/emulator.log and fails the step immediately. -feature -Vulkan
        # is the standard headless-CI fix for API-34 images stalling on a
        # missing Vulkan HAL under swiftshader_indirect.
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          # Run 38775646716: emulator 37.x said "Unknown AVD name [perf] ... no
          # file perf.ini in $HOME/.android/avd" 20s after avdmanager had just
          # created it. Cause: avdmanager (newer cmdline-tools) and the emulator
          # disagree on the AVD home directory when ANDROID_AVD_HOME is unset.
          # Pinning ANDROID_AVD_HOME for BOTH creator and consumer makes them
          # agree by construction.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n perf -k "system-images;android-34;google_apis;x86_64" -d pixel_6 --force
          ls -la "$ANDROID_AVD_HOME" || true
          nohup "$ANDROID_HOME/emulator/emulator" -avd perf \
            -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -accel on \
            -feature -Vulkan -no-metrics \
            -memory 4096 -cores 4 -no-snapshot \
            -camera-back none -camera-front none \
            > /tmp/emulator.log 2>&1 &
          sleep 20
          pgrep -f qemu >/dev/null || { echo "::error::emulator process died at launch"; tail -60 /tmp/emulator.log; exit 1; }
          timeout 240 adb wait-for-device || { echo "::error::adb never saw the device"; tail -60 /tmp/emulator.log; exit 1; }
          timeout 300 bash -c 'while [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" != "1" ]; do sleep 3; done' \
            || { echo "::error::boot_completed never reached 1"; tail -60 /tmp/emulator.log; exit 1; }
          adb shell input keyevent 82 || true
          sleep 8
          adb shell getprop sys.boot_completed
          adb devices

      - name: Install APK
        run: adb install -r android/app/build/outputs/apk/debug/app-debug.apk

      - name: Run smooth-check.sh
        run: |
          set +e
          bash scripts/smooth-check.sh 2>&1 | tee console.txt
          echo "${PIPESTATUS[0]}" > exit-code.txt
          echo "checker exit code: $(cat exit-code.txt)"
          set -e
          tail -8 console.txt

      - name: Capture crash evidence
        if: always()
        run: |
          RUN_DIR="$(ls -dt docs/perf/runs/*/ | head -1)"
          adb logcat -d -b crash > "$RUN_DIR/logcat-crash.txt" 2>/dev/null || true
          adb logcat -d 2>/dev/null | grep -E "FATAL EXCEPTION|AndroidRuntime|Process: com.grapsee.gsai|Force finishing activity" | tail -100 > "$RUN_DIR/logcat-fatal.txt" 2>/dev/null || true
          adb shell dumpsys dropbox --print 2>/dev/null | grep -A40 "com.grapsee.gsai" | tail -120 > "$RUN_DIR/dropbox.txt" 2>/dev/null || true
          adb shell "ps -A | grep grapsee" > "$RUN_DIR/process-state.txt" 2>/dev/null || true
          echo "--- fatal grep ---"; cat "$RUN_DIR/logcat-fatal.txt" || true
          echo "--- dropbox ---"; head -60 "$RUN_DIR/dropbox.txt" || true

      - name: Collect results
        run: |
          RUN_DIR="$(ls -dt docs/perf/runs/*/ | head -1)"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
          mkdir -p "docs/perf/emulator-runs/run-${{ github.run_number }}"
          for f in table.txt summary.md results.tsv device.txt checker.log commands.log logcat-fatal.txt logcat-crash.txt dropbox.txt process-state.txt; do
            [ -f "$RUN_DIR/$f" ] && cp "$RUN_DIR/$f" "docs/perf/emulator-runs/run-${{ github.run_number }}/" || true
          done
          cp console.txt exit-code.txt "docs/perf/emulator-runs/run-${{ github.run_number }}/" || true
          if [ "${{ inputs.update_baseline }}" = "true" ]; then
            {
              echo "# Emulator baseline -- smooth-check 48 interactions"
              echo
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo "Absolute numbers are emulator garbage; the ordering is the signal."
              echo
              echo '```'
              cat "$RUN_DIR/table.txt"
              echo '```'
              echo
              echo "$(cat console.txt | grep '^TOTAL:')"
            } > docs/perf/emulator-baseline.md
          fi
          cat "docs/perf/emulator-runs/run-${{ github.run_number }}/table.txt" || true

      # perf-smooth-4: the checker itself IS the profile generator. The release
      # APK (non-minified, liveUpdate-signed — same inputs as the release CI
      # build, so dex checksums match what ships) gets installed fresh, walked
      # through the real user paths, then its ART JIT profile is dumped with
      # profman and committed as android/app/src/main/baseline-prof.txt. AGP
      # compiles that file into every later release build, so a FRESH INSTALL
      # starts AOT-compiled instead of cold-JIT (the reinstall-laggy trap).
      - name: Capture baseline profile from release build
        if: inputs.capture_profile == 'true'
        run: |
          set -e
          cd android
          gradle --no-build-cache --max-workers=2 :app:assembleRelease
          cd ..
          adb install -r android/app/build/outputs/apk/release/app-release.apk
          adb shell pm clear com.grapsee.gsai || true
          # --- walk the real paths (taps are best-effort; missing UI = skip) ---
          adb shell am start -n com.grapsee.gsai/.MainActivity || true
          sleep 6
          W=$(adb shell wm size | tr -d '\r' | grep -o '[0-9]*' | tail -1)
          H=$(adb shell wm size | tr -d '\r' | grep -o '[0-9]*' | tail -1)
          [ "$W" -gt 0 ] || W=1080
          [ "$H" -gt 0 ] || H=2400
          CX=$((W/2))
          for i in 1 2 3 4; do adb shell input tap $CX $((H-150)); sleep 1.5; done
          adb shell input tap $CX $((H-170)); sleep 1.5
          adb shell input text smooth; sleep 1
          adb shell input keyevent 4; sleep 1
          adb shell input swipe $CX $((H/2)) $CX $((H/5)) 150; sleep 1
          adb shell input swipe $CX $((H/3)) $CX $((H-200)) 150; sleep 1
          adb shell input swipe 40 $((H/2)) $((W/2)) $((H/2)) 250; sleep 1.5
          adb shell input keyevent 4; sleep 1.5
          adb shell input tap $CX $((H-170)); sleep 1
          adb shell input keyevent 4; sleep 1
          # --- flush the JIT profile to disk ---
          adb shell am force-stop com.grapsee.gsai
          sleep 6
          adb root || true
          sleep 3
          APK=$(adb shell pm path com.grapsee.gsai | head -1 | tr -d '\r' | sed 's/package://')
          PROF=/data/misc/profiles/cur/0/com.grapsee.gsai/primary.prof
          adb shell "test -f $PROF && echo PROFILE_EXISTS || echo PROFILE_MISSING"
          adb shell "ls -la $PROF" || true
          adb shell "PROFMAN=/apex/com.android.art/bin/profman; $PROFMAN --dump-classes-and-methods --profile-file=$PROF --apk=$APK > /data/local/tmp/bp.txt 2>/data/local/tmp/bp.err; echo profman_exit=$?; head -c 300 /data/local/tmp/bp.err || true"
          adb shell "wc -l /data/local/tmp/bp.txt" || true
          adb pull /data/local/tmp/bp.txt /tmp/bp-dump.txt
          head -5 /tmp/bp-dump.txt
          # Merge: keep the hand-curated rules, add the machine dump, dedupe.
          mkdir -p android/app/src/main
          { cat /tmp/bp-dump.txt; cat android/app/src/main/baseline-prof.txt; } | awk '!seen[$0]++' > /tmp/bp-merged.txt
          mv /tmp/bp-merged.txt android/app/src/main/baseline-prof.txt
          echo "merged rules: $(wc -l < android/app/src/main/baseline-prof.txt)"
          echo "app rules: $(grep -c 'com/grapsee/gsai' android/app/src/main/baseline-prof.txt || true)"

      - name: Commit baseline profile
        if: inputs.capture_profile == 'true'
        run: |
          git config user.name "perf-bot"
          git config user.email "perf-bot@users.noreply.github.com"
          git add android/app/src/main/baseline-prof.txt
          if git diff --cached --quiet; then echo "no profile changes"; else
            git commit -m "perf: ART baseline profile captured from release build [skip ci]"
            git push origin main
          fi

      - name: Upload full raw run (incl. perfetto traces) as artifact
        uses: actions/upload-artifact@v4
        with:
          name: smooth-check-run-${{ github.run_number }}
          path: |
            docs/perf/runs/
            console.txt
            exit-code.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Commit results to repo
        run: |
          git config user.name "perf-bot"
          git config user.email "perf-bot@users.noreply.github.com"
          git add docs/perf/emulator-runs docs/perf/emulator-baseline.md 2>/dev/null || true
          git commit -m "perf: emulator smooth-check run ${{ github.run_number }} [skip ci]" || echo "nothing to commit"
          # run 38780804440 failed here: main moved while the 60-minute job ran
          # (attempts.md analysis pushed mid-run) and HEAD:main push was
          # rejected non-fast-forward. Rebase the results commit onto main.
          # run 38784673957: the rebase itself conflicted on
          # docs/perf/emulator-baseline.md (main also carried a baseline update).
          # During a rebase, --theirs is the commit being applied = THIS run's
          # fresh results; prefer it, then continue.
          git pull --rebase origin main || {
            git checkout --theirs docs/perf/emulator-baseline.md 2>/dev/null || true
            git add -A
            GIT_EDITOR=true git rebase --continue || true
          }
          git push origin HEAD:main
