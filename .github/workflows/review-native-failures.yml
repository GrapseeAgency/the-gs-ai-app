name: Review stored native failure evidence
on:
  pull_request:
    paths:
      - '.github/workflows/review-native-failures.yml'
      - 'scripts/publish_native_ui_pixels.py'
permissions:
  contents: read
  actions: read
jobs:
  review:
    name: Actual stored ${{ matrix.label }} from iOS 42504322347
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        label: [REACT, SHARE]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Recover existing genuine fixture evidence, not a new render and never
      # user data. Separate read-only Linux jobs avoid repeating a Mac suite
      # merely because dense pixels exceeded the earlier annotation budget.
      - uses: actions/download-artifact@v4
        with:
          name: ios-build-logs-42504322347
          run-id: 42504322347
          github-token: ${{ github.token }}
          path: stored-native-fixture
      - name: Locate actual stored XCTest output
        run: |
          python3 -m pip install --quiet --disable-pip-version-check 'pillow==11.0.0'
          python3 - <<'PY'
          import os
          from pathlib import Path
          logs = list(Path('stored-native-fixture').rglob('xcodebuild-genui-test.log'))
          if len(logs) != 1: raise SystemExit('Expected exactly one original XCTest fixture log')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('GS_STORED_FIXTURE_LOG=' + str(logs[0]) + '\n')
          PY
      - name: Publish original composited failure pixels
        run: python3 scripts/publish_native_ui_pixels.py "$GS_STORED_FIXTURE_LOG" '${{ matrix.label }}'
      - name: Publish actual relevant accessibility geometry
        env:
          GS_REVIEW_LABEL: ${{ matrix.label }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          chunks = {}
          for line in Path(os.environ['GS_STORED_FIXTURE_LOG']).read_text(errors='replace').splitlines():
              match = re.search(r'GS_PRESENTATION_' + os.environ['GS_REVIEW_LABEL'] + r'_(\d+): (.*)', line)
              if match: chunks[int(match.group(1))] = match.group(2)
          hierarchy = ''.join(chunks[index] for index in sorted(chunks))
          parts = [part for part in hierarchy.split(' | ') if any(term in part for term in [
              'Window,', 'WebView,', 'Keyboard,', 'TextField,', 'Button,',
              "label: 'Response tasks'", "label: 'React preview running'", "label: '0/0 complete'", "label: '0/1 complete'"])]
          actual = ' | '.join(parts)
          for start in range(0, min(len(actual), 28000), 3500):
              print('::notice::GS_STORED_' + os.environ['GS_REVIEW_LABEL'] + '_GEOMETRY: ' + actual[start:start+3500].replace('%', '%25').replace('\r', '%0D'))
          if not chunks: print('No original failure hierarchy exists for this label; no substitute is emitted')
          PY
