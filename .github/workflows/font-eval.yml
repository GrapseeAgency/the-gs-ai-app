name: Font evaluation

# Measures a candidate typeface against the numbers the reference actually has,
# before anyone edits a single line of app code.
#
# The two numbers that decide acceptance (see docs/TYPOGRAPHY.md):
#   * width of "Good morning," at matched cap height, relative to the shipped
#     Poppins SemiBold — the reference sits at 0.824;
#   * x-height / cap height — the reference sits at ~0.85.
#
# Both are scale-free ratios, so this needs no app build and no device: it
# downloads an OFL family, instantiates the four weights the UI uses, and prints
# the table. Nothing is written back to the repository — vendoring is a separate,
# reviewed commit.

on:
  workflow_dispatch:
    inputs:
      families:
        description: Space-separated Google Fonts family names
        default: "Manrope Outfit Figtree DM Sans Inter Tight"
        required: true

permissions:
  contents: read

jobs:
  measure:
    name: Measure candidate faces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tooling
        run: pip install --quiet --disable-pip-version-check fonttools pillow

      - name: Fetch, instantiate and measure
        env:
          FAMILIES: ${{ inputs.families }}
        run: |
          set -euo pipefail
          mkdir -p fonts
          # fonts.google.com/download answers with an HTML page, not the zip it used
          # to; the CSS API serves a real static instance per weight, and asking for
          # it with a legacy User-Agent makes Google hand back TTF instead of woff2.
          echo "$FAMILIES" | tr ' ' '\n' | while read -r FAM; do
            [ -n "$FAM" ] || continue
            SLUG=$(echo "$FAM" | tr ' ' '_')
            ENC=$(echo "$FAM" | sed 's/ /+/g')
            mkdir -p "fonts/$SLUG"
            echo "::group::$FAM"
            CSS=$(curl -fsSL --retry 3 -H "User-Agent: Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1)" \
                  "https://fonts.googleapis.com/css2?family=${ENC}:wght@600") || CSS=""
            URL=$(printf '%s' "$CSS" | grep -o 'https://[^)]*\.ttf' | head -1)
            if [ -z "$URL" ]; then
              echo "::warning::$FAM: no TTF served for weight 600"
              echo "::endgroup::"
              continue
            fi
            curl -fsSL --retry 3 "$URL" -o "fonts/$SLUG/SemiBold-600.ttf"
            echo "  $URL"
            echo "  bytes: $(wc -c < "fonts/$SLUG/SemiBold-600.ttf")"
            echo "::endgroup::"
          done

          python3 - <<'PY'
          import glob, os
          from PIL import Image, ImageDraw, ImageFont

          POPPINS = "android/app/src/main/res/font/poppins_semibold.ttf"

          def band(path, glyph, size=240):
              f = ImageFont.truetype(path, size)
              im = Image.new("L", (900, 600), 0)
              ImageDraw.Draw(im).text((40, 40), glyph, font=f, fill=255)
              bb = im.getbbox()
              return bb[3] - bb[1]

          base_f = ImageFont.truetype(POPPINS, 1000)
          base_cap = band(POPPINS, "H")
          base_wcap = base_f.getlength("Good morning,") / base_cap

          rows = [("Poppins SemiBold (shipped)", 1.0, band(POPPINS, "o") / base_cap, "baseline")]
          for fam in sorted(glob.glob("fonts/*/")):
              p = os.path.join(fam, "SemiBold-600.ttf")
              name = os.path.basename(fam.rstrip("/")).replace("_", " ")
              if not os.path.isfile(p):
                  rows.append((name, None, None, "not fetched"))
                  continue
              f = ImageFont.truetype(p, 1000)
              cap = band(p, "H")
              ratio = (f.getlength("Good morning,") / cap) / base_wcap
              xcap = band(p, "o") / cap
              ok_w = 0.80 <= ratio <= 0.85
              ok_x = xcap >= 0.82
              verdict = "PASS" if ok_w and ok_x else ("width" if not ok_w else "x-height")
              rows.append((name, ratio, xcap, verdict))

          print(f"{'face':28s} {'width/Poppins':>13s} {'x/cap':>7s}  verdict")
          print(f"{'-'*28} {'-'*13} {'-'*7}  {'-'*12}")
          for name, ratio, xcap, verdict in rows:
              r = f"{ratio:.3f}" if ratio is not None else "-"
              x = f"{xcap:.3f}" if xcap is not None else "-"
              print(f"{name[:28]:28s} {r:>13s} {x:>7s}  {verdict}")
              print(f"::notice::face={name} width_ratio={r} x_cap={x} verdict={verdict}")
          print()
          print("reference (measured from the sheet): width 0.824, x/cap 0.850")
          print("accept: width 0.80-0.85 AND x/cap >= 0.82")
          PY

      - name: Summary
        if: always()
        run: |
          {
            echo "### Font evaluation"
            echo ""
            echo "Acceptance (from \`docs/TYPOGRAPHY.md\`): width 0.80–0.85 of Poppins at matched cap height, x-height/cap ≥ 0.82."
            echo "The reference measures 0.824 and 0.850."
          } >> "$GITHUB_STEP_SUMMARY"
