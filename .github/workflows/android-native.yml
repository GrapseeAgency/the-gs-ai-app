name: android-native

# Cross-compiles libgs_ffi.so for the four Android ABIs and attaches one
# artifact per ABI. Binaries are artifacts, never git: the repo carries source
# only.
#
# The mobile build is PORTABLE-ONLY by design. ONNX Runtime, llama.cpp and
# Tesseract have no drop-in prebuilts for arm64 Android, and a 300 MB decode
# engine inside a phone binary is not the product. gs-ffi detects an Android
# target in build.rs and links only the portable C++ surface, whose
# backend-dependent entry points report GS_ERR_UNAVAILABLE with a reason.
# That is what the host app's local-first routing checks.

on:
  workflow_dispatch:
  push:
    branches: [native-runtime]
    paths:
      - 'native/**'
      - '.github/workflows/android-native.yml'
      - '.cargo/config.toml'

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMDLINE_VERSION: 11076708
  NDK_VERSION: 25.2.9519653
  # Consumed by gs-ffi/build.rs on the desktop only; the Android target path
  # ignores it and compiles portable-only.
  GS_ALLOW_MISSING_ONNX: "1"

jobs:
  build:
    name: ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            machine: AArch64
            target: aarch64-linux-android
          - abi: armeabi-v7a
            machine: ARM
            target: armv7-linux-androideabi
          - abi: x86_64
            machine: X86-64
            target: x86_64-linux-android
          - abi: x86
            machine: Intel 80386
            target: i686-linux-android

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The JNI bridge is `#[cfg(target_os = "android")]` by default, so a type
      # error in it is invisible to `cargo test` and to `cargo build` on a host.
      # That is not theoretical: nine E0308 errors sat in src/jni.rs until the
      # arm64 build ran (run 36374643605). This step is the fix for the blind
      # spot — a few seconds of host compilation, before the NDK is even
      # installed. It needs no ONNX and no llama.cpp, so it is the cheapest
      # possible place to catch the class of error that was invisible.
      - name: Type-check the JNI bridge on the host
        working-directory: native
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo check -p gs-ffi --features jni-typecheck

      - name: Install Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add ${{ matrix.target }}
          rustc --version

      # ATTEMPT 1 FAILED HERE. Raw error from run 36345064039, job arm64-v8a:
      #   /home/runner/work/_temp/f7d0910b-....sh: line 6: sdkmanager: command not found
      #   ##[error]Process completed with exit code 127.
      # The image ships an ANDROID_HOME with no command-line tools, so sdkmanager
      # is absent and every one of the four ABIs failed identically. Installed
      # from the Google zip rather than assuming the image provides it.
      - name: Install Android command-line tools and NDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd /tmp
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_VERSION}_latest.zip"
          unzip -q "commandlinetools-linux-${CMDLINE_VERSION}_latest.zip"
          # The zip unpacks cmdline-tools/, but the SDK requires the
          # *latest/* layout or every sdkmanager invocation fails.
          mv cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          echo "ANDROID_HOME=$SDK_ROOT"   >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          # Both names, same path. The image ships NDK 27.3.13750724 and
          # cargo-ndk 4 resolves the disagreement by preferring whichever
          # variable it sees, which silently built against an NDK this job did
          # not install:
          #   warning: Environment variable `ANDROID_NDK_HOME =
          #     "/home/runner/android-sdk/ndk/25.2.9519653"` doesn't match
          #     `ANDROID_NDK_ROOT = "/usr/local/lib/android/sdk/ndk/27.3.13750724"`
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          # Assert the tool exists BEFORE relying on it. The previous failure
          # was a missing binary discovered three steps later.
          command -v sdkmanager
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "ndk;$NDK_VERSION" "platform-tools" >/dev/null
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" >/dev/null

          test -d "$SDK_ROOT/ndk/$NDK_VERSION" || {
            echo "NDK $NDK_VERSION missing"; exit 1; }
          ls "$SDK_ROOT/ndk/$NDK_VERSION/toolchains/llvm/prebuilt"

      - name: Install cargo-ndk
        run: |
          set -euo pipefail
          cargo install cargo-ndk --locked
          cargo ndk --version

      - name: Fetch the cross-compiled llama.cpp for this ABI
        env:
          GH_TOKEN: ${{ github.token }}
          DEPS_RUN_ID: ${{ github.event.inputs.deps_run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # Downloaded from THE SPECIFIC RUN that triggered this one, via the REST
          # API rather than `gh run download` (which only ever sees the latest run
          # of a workflow and would be a race against the next android-deps push).
          #
          # Without this the .so is PORTABLE-ONLY: it links, it exports all 10
          # mobile symbols, and every generation call answers GS_ERR_UNAVAILABLE.
          # The tests would then "pass" by asserting that nothing works, which is
          # the opposite of what they are for. So this fails the job.
          # On workflow_dispatch there is no triggering run, so fall back to the
          # most recent completed android-deps run. Without the fallback the job
          # is unreachable by hand, and "I can only run it the way CI runs it" is
          # not a usable property.
          if [ -z "$DEPS_RUN_ID" ] || [ "$DEPS_RUN_ID" = "0" ]; then
            DEPS_RUN_ID=$(
              curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/android-deps.yml/runs?per_page=1&status=success" \
              | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["workflow_runs"][0]["id"]))'
            )
            echo "dispatch: using the latest successful android-deps run"
          fi
          echo "deps run: $DEPS_RUN_ID"
          mkdir -p native/prebuilts/android-${{ matrix.abi }} /tmp/artifact
          ARTIFACT_ID=$(
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$DEPS_RUN_ID/artifacts" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((str(a["id"]) for a in d.get("artifacts",[]) if a["name"]=="llamacpp-x86_64"), ""))'
          )
          if [ -z "$ARTIFACT_ID" ]; then
            echo "FAIL: the llamacpp-x86_64 artifact is not in run $DEPS_RUN_ID."
            echo "      Available:"
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$DEPS_RUN_ID/artifacts" \
              | python3 -c 'import json,sys; [print("       ",a["name"],a["size_in_bytes"],"bytes") for a in json.load(sys.stdin).get("artifacts",[])]' 
            echo "      Without it the app is portable-only and these tests cannot"
            echo "      test generation at all."
            exit 1
          fi
          echo "artifact id: $ARTIFACT_ID"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/artifact/llamacpp.zip
          ls -la /tmp/artifact/llamacpp.zip
          echo "=== what kind of file did the API hand back? ==="
          file /tmp/artifact/llamacpp.zip
          # GitHub's artifact API returns a ZIP. Raw, first device run:
          #     tar: This does not look like a tar archive
          #     tar: Exiting with failure status due to previous errors
          #     ##[error]Process completed with exit code 2.
          # It used to be a tarball wrapped in a zip. Uploaded a directory
          # instead, and this handles both shapes anyway because the cost of
          # guessing wrong is a 40-minute emulator run.
          if unzip -l /tmp/artifact/llamacpp.zip >/dev/null 2>&1; then
            echo "zip: unzipping"
            rm -rf /tmp/artifact/x && mkdir -p /tmp/artifact/x
            unzip -o -q /tmp/artifact/llamacpp.zip -d /tmp/artifact/x
            # A tarball inside the zip is still possible; unwrap it.
            T=$(find /tmp/artifact/x -name '*.tar.gz' | sed -n '1p')
            if [ -n "$T" ]; then
              echo "zip contained a tarball: $T"
              tar -xzf "$T" -C native/prebuilts/android-${{ matrix.abi }}
            else
              cp -r /tmp/artifact/x/. native/prebuilts/android-${{ matrix.abi }}/
            fi
          elif tar -tzf /tmp/artifact/llamacpp.zip >/dev/null 2>&1; then
            echo "gzip: untarring"
            tar -xzf /tmp/artifact/llamacpp.zip -C native/prebuilts/android-${{ matrix.abi }}
          else
            echo "FAIL: the artifact is neither a zip nor a gzip tarball"
            file /tmp/artifact/llamacpp.zip
            head -c 200 /tmp/artifact/llamacpp.zip | cat -v | sed -n '1,5p'
            exit 1
          fi
          echo "=== prebuilt contents ==="
          find native/prebuilts/android-${{ matrix.abi }} -type f | sort | sed -n '1,30p'
          test -f native/prebuilts/android-${{ matrix.abi }}/include/llama.h || {
            echo "FAIL: no include/llama.h in the prebuilt package"; exit 1; }
          test -d native/prebuilts/android-${{ matrix.abi }}/lib || {
            echo "FAIL: no lib/ in the prebuilt package"; exit 1; }
          echo "total: $(du -sh native/prebuilts/android-${{ matrix.abi }} | cut -f1)"
          # The archives must be x86_64, not arm64. The emulator is x86_64 and an
          # arm64 .so is rejected by the linker, which turns every test into a
          # SKIP rather than a FAIL.
          for a in native/prebuilts/android-${{ matrix.abi }}/lib/*.a; do
            echo "  $(basename "$a"): $(file -b "$a")"
          done

          # THE VARIABLE THAT WAS NEVER SET. build.rs reads GS_LLAMA_PREBUILT and
          # requires include/llama.h under it. Nothing in this workflow set it, so
          # llama_root was None and the job published a PORTABLE-ONLY library:
          #     warning: gs-ffi@0.1.0: portable mobile build: CLIP, OCR and
          #     llama.cpp are NOT compiled in
          # It exported all ten mobile symbols and passed every size and symbol
          # gate in the repo. Only a call on a device could tell.
          echo "GS_LLAMA_PREBUILT=$GITHUB_WORKSPACE/native/prebuilts/android-${{ matrix.abi }}" >> "$GITHUB_ENV"
          echo "GS_LLAMA_PREBUILT=$GITHUB_WORKSPACE/native/prebuilts/android-${{ matrix.abi }}"

      - name: Build libgs_ffi.so
        working-directory: native
        run: |
          set -euo pipefail
          # cargo-ndk sets CC_*_ANDROID_LINKER and friends for the targets it is
          # given. There is no `cargo ndk env` subcommand and no ndk-env file to
          # source: attempt 2 failed with
          #     error: no such command: `env`
          #     help: a command with a similar name exists: `new`
          cargo ndk \
            -t ${{ matrix.target }} \
            -o "$GITHUB_WORKSPACE/dist/android/${{ matrix.abi }}" \
            build --release -p gs-ffi --lib 2>&1 | tee "$GITHUB_WORKSPACE/build-${{ matrix.abi }}.log"

          # ATTEMPT 5. cargo-ndk printed
          #     Copying libraries to .../dist/android/arm64-v8a
          # and then copied NOTHING, so the verify step died on
          #     MISSING: .../dist/android/arm64-v8a/libgs_ffi.so
          # with no indication of where the library actually went. Rather than
          # trust the copy, find the artifact and place it explicitly -- and say
          # which path it came from, so the next failure is diagnosable from the
          # log instead of requiring a re-run.
          # SHIP THE COMPANION. Raw, run 36425439967, the first run to execute a
          # test with the library actually in the APK:
          #     java.lang.UnsatisfiedLinkError: dlopen failed: library
          #     "libc++_shared.so" not found: needed by
          #     .../base.apk!/lib/x86_64/libgs_ffi.so
          #
          # Attempt 1 was `-C link-arg=-static-libstdc++`, which does not even
          # parse here:
          #     error: unexpected argument '-C' found
          # cargo ndk has no `--` passthrough for rustc flags.
          #
          # Shipping it is the correct answer anyway, not a fallback: this app
          # links onnxruntime, Tesseract/Leptonica and stable-diffusion.cpp, all
          # of which are C++ and all of which will need libc++_shared.so. An APK
          # for this product carries it regardless of what gs-ffi does.
          DIST="$GITHUB_WORKSPACE/dist/android/${{ matrix.abi }}"
          # FOUND BY WHAT IT IS, NOT BY A DIRECTORY NAME. The obvious path
          #   sysroot/usr/lib/<triple>/libc++_shared.so
          # is right for three of the four ABIs and wrong for armeabi-v7a, which
          # NDK r25 does not ship where the triple suggests:
          #     ##[error]no libc++_shared.so at
          #     .../ndk/25.2.9519653/.../sysroot/usr/lib/armv7a-linux-androideabi/libc++_shared.so
          # A hardcoded directory is a guess about another toolchain's layout;
          # reading the ELF machine is a fact about the file. If no candidate
          # matches, the sysroot contents are printed so the next reader does not
          # have to go looking.
          CPP=""
          # NO -type f. The NDK ships libc++_shared.so as a SYMLINK, and -type f filters
          # symlinks out, so the candidate list came back empty and the step failed
          # with a message implying the file does not exist in the NDK at all.
          # Run 36443756041 printed zero candidate lines and then:
          #     ::error::no libc++_shared.so with Machine matching 'X86-64'
          # RESOLVE THE NDK, DO NOT ASSUME IT. This workflow already records the
          # disagreement (step 5 sets both, and they differ):
          #     ANDROID_NDK_HOME: /home/runner/android-sdk/ndk/25.2.9519653
          #     ANDROID_NDK_ROOT  -> ".../ndk/27.3.13750724"     (does not exist)
          # find on a nonexistent directory prints nothing and exits 0, so the
          # candidate loop below iterated ZERO times, CPP stayed empty, and the
          # step reported the file missing -- an accurate description of
          # $ANDROID_NDK_ROOT and a false one about the NDK. Two runs lost to it.
          NDK=""
          for CANDDIR in "${ANDROID_NDK_HOME:-}" "${ANDROID_NDK_ROOT:-}" "${ANDROID_SDK_ROOT:-}/ndk/${NDK_VERSION}" "${ANDROID_HOME:-}/ndk/${NDK_VERSION}"; do
            if [ -n "$CANDDIR" ] && [ -d "$CANDDIR/toolchains/llvm/prebuilt" ]; then
              NDK="$CANDDIR"
              echo "  NDK resolves to $NDK"
              break
            fi
          done
          if [ -z "$NDK" ]; then
            echo "::error::no NDK found among ANDROID_NDK_HOME, ANDROID_NDK_ROOT, ANDROID_SDK_ROOT/ndk/${NDK_VERSION}, ANDROID_HOME/ndk/${NDK_VERSION}"
            ls -d "${ANDROID_SDK_ROOT:-/nonexistent}"/ndk/* 2>&1 | sed -n '1,10p' || true
            exit 1
          fi
          for CAND in $(find "$NDK" -name 'libc++_shared.so' 2>/dev/null); do
            M=$(readelf -h "$CAND" 2>/dev/null | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')
            echo "  candidate $(basename "$(dirname "$CAND")") -> Machine: ${M:-unknown}"
            case "$M" in
              *${{ matrix.machine }}*) CPP="$CAND"; break ;;
            esac
          done
          if [ -z "$CPP" ]; then
            echo "::error::no libc++_shared.so with Machine matching '${{ matrix.machine }}' under $NDK"
            find "$NDK" -name 'libc++_shared.so' | sed -n '1,40p'
            exit 1
          fi
          echo "  using $CPP"
          cp "$CPP" "$DIST/libc++_shared.so"
          ls -l "$DIST/"

          # COMPLETENESS, NOT A GUESS. A JNI library that will not dlopen without
          # a second .so is not self-contained, and the missing companion is
          # invisible until System.loadLibrary on a device: the APK builds, the
          # install succeeds, the ELF machine is right, and only dlopen reveals
          # it. So read the DT_NEEDED of what was just built and require that
          # every non-system dependency is physically present beside it.
          #
          # This is deliberately not "is libc++_shared there" -- that was the
          # previous assertion and it would have passed a library missing some
          # other companion. Anything dlopen would need must be in this directory.
          echo "=== DT_NEEDED completeness check ==="
          MISSING=""
          for NEED in $(readelf -d "$DIST/libgs_ffi.so" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p'); do
            case "$NEED" in
              libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libz.so|libjnigraphics.so|libEGL.so|libGLESv2.so|libOpenSLES.so|libnativewindow.so)
                echo "  system  $NEED" ;;
              *)
                if [ -f "$DIST/$NEED" ]; then
                  echo "  present $NEED"
                else
                  echo "  MISSING $NEED"
                  MISSING="$MISSING $NEED"
                fi ;;
            esac
          done
          if [ -n "$MISSING" ]; then
            echo "::error::libgs_ffi.so needs$MISSING and none is in $DIST."
            echo "The APK would build, install, and then fail at System.loadLibrary."
            exit 1
          fi
          echo "  every dlopen dependency is accounted for"

          # REFUSE TO SHIP A PORTABLE LIBRARY. This is the check whose absence
          # let a portable-only .so reach a device, export ten symbols, and pass
          # every build-time gate in the repository. build.rs already announces
          # this condition; the workflow just never read the announcement.
          if grep -q 'portable mobile build' "$GITHUB_WORKSPACE/build-${{ matrix.abi }}.log"; then
            echo "::error::the build is PORTABLE-ONLY -- llama.cpp was not compiled in."
            echo "Every chat() on a phone would return GS_ERR_UNAVAILABLE."
            grep -n 'portable mobile build' "$GITHUB_WORKSPACE/build-${{ matrix.abi }}.log" || true
            exit 1
          fi
          if ! grep -q 'WITH a llama.cpp backend' "$GITHUB_WORKSPACE/build-${{ matrix.abi }}.log"; then
            echo "::error::the build log does not confirm a llama.cpp backend was linked."
            grep -iE 'llama|backend|prebuilt' "$GITHUB_WORKSPACE/build-${{ matrix.abi }}.log" | sed -n '1,20p' || true
            exit 1
          fi
          echo "  build log confirms a llama.cpp backend is compiled in"

          TRI="${{ matrix.target }}"
          DEST="$GITHUB_WORKSPACE/dist/android/${{ matrix.abi }}"
          mkdir -p "$DEST"
          FOUND=""
          for CANDIDATE in \
            "$DEST/libgs_ffi.so" \
            "target/$TRI/release/libgs_ffi.so" \
            "target/$TRI/release/deps/libgs_ffi.so"; do
            if [ -f "$CANDIDATE" ]; then FOUND="$CANDIDATE"; break; fi
          done
          if [ -z "$FOUND" ]; then
            echo "MISSING: libgs_ffi.so for $TRI. What is actually there:"
            find target -name 'libgs_ffi*' -o -name '*.so' | sed -n '1,40p' || true
            echo "--- and the crate types gs-ffi declares ---"
            sed -n '/^\[lib\]/,/^\[/p' crates/gs-ffi/Cargo.toml
            exit 1
          fi
          echo "found: $FOUND"
          if [ "$FOUND" != "$DEST/libgs_ffi.so" ]; then
            cp "$FOUND" "$DEST/libgs_ffi.so"
            echo "copied to $DEST/libgs_ffi.so"
          fi
          file "$DEST/libgs_ffi.so"
          # A cdylib that exists but exports nothing loads and fails at the
          # first call, so the ABI is asserted, not assumed.
          N=$(nm -D --defined-only "$DEST/libgs_ffi.so" | grep -c 'gs_ffi_mobile_' || true)
          echo "gs_ffi_mobile_* exported: $N"
          [ "$N" -ge 8 ] || {
            echo "FAIL: expected >=8 gs_ffi_mobile_* exports, got $N"; exit 1; }

      - name: Verify the artifact
        run: |
          set -euo pipefail
          SO="$GITHUB_WORKSPACE/dist/android/${{ matrix.abi }}/libgs_ffi.so"
          test -f "$SO" || { echo "MISSING: $SO"; exit 1; }
          echo "=== file ==="
          file "$SO"
          stat -c '%s bytes' "$SO"
          # A .so with no exported symbols loads and fails at the first call, so
          # the ABI is asserted, not assumed.
          echo "=== exported ABI ==="
          nm -D --defined-only "$SO" | grep -oE 'gs_[A-Za-z_0-9]+' | sort -u
          COUNT=$(nm -D --defined-only "$SO" | grep -c 'gs_ffi_mobile_' || true)
          echo "gs_ffi_mobile_* exported: $COUNT"
          [ "$COUNT" -ge 8 ] || {
            echo "FAIL: expected >=8 gs_ffi_mobile_* exports, found $COUNT"; exit 1; }
          # The JNI entry points must be present or the Kotlin bridge cannot
          # bind at all.
          JNI=$(nm -D --defined-only "$SO" | grep -c 'Java_com_grapsee_gsai_native_GsNative_' || true)
          echo "JNI entry points: $JNI"
          case "${{ matrix.abi }}" in
            arm64-v8a)   ARCH="aarch64" ;;
            armeabi-v7a) ARCH="ARM" ;;
            x86_64)      ARCH="x86-64" ;;
            x86)         ARCH="Intel 80386" ;;
          esac
          file "$SO" | grep -q "$ARCH" || {
            echo "FAIL: $ARCH not in: $(file "$SO")"; exit 1; }
          echo "VERIFIED: ${{ matrix.abi }} = $ARCH with the mobile ABI"

      - name: Upload libgs_ffi.so
        uses: actions/upload-artifact@v4
        with:
          name: libgs_ffi-${{ matrix.abi }}
          path: dist/android/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 14
