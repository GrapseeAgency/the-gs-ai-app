# Heap sized for the FULL, non-incremental compile the release does. The
# android-release job runs `gradle --no-build-cache :app:testDebugUnitTest
# :app:assembleRelease`, which recompiles every Kotlin source in one shot; at
# the old -Xmx1024m the Kotlin compiler daemon hit "java.lang.OutOfMemoryError:
# Java heap space" in :app:compileDebugKotlin (release run 39576059300). The
# incremental android-app path fit in 1 GB; the cold release path does not.
# ubuntu-latest is ~7 GB / 2 cores, and the release caps at --max-workers=2, so
# a 2 GB Gradle daemon + 3 GB Kotlin daemon leave headroom for the workers.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=35
