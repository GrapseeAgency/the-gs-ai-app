name: android-deps

# Cross-compiles the C/C++ dependencies for Android arm64-v8a.
#
# Four independent jobs, fail-fast disabled, so one dependency failing does not
# hide the other three. Each reports PASS or BLOCKED on its own, in its own log,
# with the raw compiler output preserved. The summary job at the end is the one
# place that says which of the four are usable, and it does not paper over a
# failure with a word like "expected".
#
# These are ARTIFACTS, never git. The repo carries source only; nothing here is
# committed, and .gitignore covers *.so, *.a, native/prebuilts/ and *.gguf.
#
# What each one is for, and the honest caveat:
#
#   tesseract + leptonica   the real deal. Small (~4 MB for arm64), pure C, and
#                           the only way OCR works on a phone with no Google
#                           Play Services: GrapheneOS, LineageOS without GMS,
#                           Huawei after 2019, some Chinese ROMs. ~1% of devices,
#                           which is exactly the set that has nothing else.
#   llama.cpp               a 300 MB decode engine in a phone binary is not the
#                           product. Built here so the option is measured rather
#                           than assumed, and so the size is a number.
#   onnxruntime             NOT a C library. The distribution is the Android AAR,
#                           and the arm64 .so inside it is a Java-loadable shared
#                           object. Extractable and linkable; see the job.
#   stable-diffusion.cpp    ~1 image per 5-10 min on phone CPU. Built with
#                           SD_VULKAN=OFF to get that number on the device rather
#                           than estimating it.
#
# Trigger: manual, or on a change to native/cpp or this file. Not on every
# native/** change, because these builds are long and the outputs are only
# consumed by a release build.

on:
  workflow_dispatch:
  push:
    branches: [native-runtime]
    paths:
      - 'native/cpp/**'
      - 'native/crates/gs-ffi/build.rs'
      - '.github/workflows/android-deps.yml'
      - '.github/scripts/**'

concurrency:
  group: android-deps-${{ github.ref }}
  cancel-in-progress: true

env:
  ABI: arm64-v8a
  TRIPLE: aarch64-linux-android
  NDK_VERSION: 25.2.9519653
  API: 24
  CARGO_TERM_COLOR: always
  # No ONNX on the runner: each dep job builds one C/C++ library and links it
  # with cmake or make directly. gs-ffi is not in this workflow.
  GS_ALLOW_MISSING_ONNX: "1"

jobs:
  tesseract:
    name: tesseract + leptonica (${{ matrix.source }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: upstream
            url: https://github.com/tesseract-ocr/tesseract.git
            ref: 5.3.4
            dir: tesseract
    steps:
      - uses: actions/checkout@v4
      - name: Install the NDK
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-ndk.sh"
        env:
          NDK_VERSION: ${{ env.NDK_VERSION }}
          CMDLINE_VERSION: 11076708

      - name: NDK toolchain file
        run: |
          set -euo pipefail
          NDK="$ANDROID_NDK_HOME"
          {
            echo "set(CMAKE_SYSTEM_NAME Android)"
            echo "set(CMAKE_SYSTEM_VERSION $API)"
            echo "set(CMAKE_ANDROID_ARCH_ABI $ABI)"
            echo "set(CMAKE_ANDROID_NDK $NDK)"
            echo "set(CMAKE_ANDROID_STL_TYPE c++_shared)"
            echo "set(CMAKE_FIND_ROOT_PATH $NDK)"
            echo "set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)"
            echo "set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY BOTH)"
            echo "set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE BOTH)"
          } > android.toolchain.cmake
          cat android.toolchain.cmake

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool pkg-config \
            libicu-dev libpango1.0-dev libcairo2-dev cmake ninja-build
          # libtiff is not optional for tesseract: without it the OCR models for
          # some scripts fail to load at runtime.
          echo "cmake: $(cmake --version | sed -n '1p')"

      - name: Fetch tesseract and leptonica
        run: |
          set -euo pipefail
          mkdir -p src && cd src
          git clone --depth 1 --branch "${{ matrix.ref }}" "${{ matrix.url }}" tesseract
          # Leptonica has no release tags; pin the commit rather than tracking
          # a moving branch, so a failure is reproducible.
          git clone --depth 1 https://github.com/DanBloomberg/leptonica.git leptonica
          cd leptonica && git log -1 --format='leptonica pinned at %H (%ad)' --date=short
          echo "tesseract: $(cd ../tesseract && git log -1 --format='%H (%ad)' --date=short)"

      - name: Build leptonica for arm64
        run: |
          set -euo pipefail
          cd src/leptonica
          # Leptonica has no cmake. Its autotools build honours CFLAGS/LDFLAGS,
          # which is the NDK toolchain, so that is the whole cross-compile.
          NDK="$ANDROID_NDK_HOME"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TOOLCHAIN/aarch64-linux-android$API-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android$API-clang++"
          export AR="$TOOLCHAIN/llvm-ar"
          export RANLIB="$TOOLCHAIN/llvm-ranlib"
          export STRIP="$TOOLCHAIN/llvm-strip"
          for T in CC CXX AR RANLIB STRIP; do
            test -x "${!T}" || { echo "MISSING TOOL: ${!T}=${!T}"; exit 1; }
          done
          echo "CC=$CC"
          ./autogen.sh
          # Every optional image library is disabled, and libpng is the reason
          # this step exists. Raw, run 36383749573:
          #     ld: error: unable to find library -lpng16
          #     make[2]: *** [Makefile:2961: convertfilestopdf] Error 1
          # leptonica's configure found the HOST's libpng through pkg-config and
          # enabled PNG support, then handed -lpng16 to the NDK linker, which
          # cannot see host libraries. Cross-compiling means the target's
          # libraries, and no target libpng exists in this build.
          #
          # None of these are needed for OCR: they are image-file conveniences,
          # and tesseract hands leptonica decoded pixel data. Disabling them is
          # how a leptonica cross-build is meant to be done.
          ./configure --host=aarch64-linux-android \
            --prefix="$PWD/../../out/prefix" \
            --disable-shared --enable-static \
            --without-gif --without-jpeg --without-libpng --without-libtiff \
            --without-libwebp --without-zlib
          echo "=== leptonica configure result ==="
          grep -iE 'png|jpeg|tiff|zlib|webp' config.log 2>/dev/null | tail -5 || true
          make -j"$(nproc)"
          make install
          echo "=== leptonica installed ==="
          find ../../out/prefix -name '*.a' -o -name '*.la' | sort | sed -n '1,20p'
          # The library is libleptonica.a, NOT liblept.a. Leptonica renamed it
          # and the old name is a configure-era alias that no longer appears in
          # $libdir. Raw, run 36384581930:
          #     ../../out/prefix/lib/libleptonica.a
          #     MISSING liblept.a
          #     ##[error]Process completed with exit code 1.
          # The build had SUCCEEDED; the assertion named a file that does not
          # exist in this version. Glob instead of hardcoding a name, and assert
          # that exactly one leptonica library came out.
          LEP=$(find ../../out/prefix/lib -name 'libleptonica.a' -o -name 'liblept.a' | sort | sed -n '1p')
          test -n "$LEP" || {
            echo "FAIL: no leptonica library under ../../out/prefix/lib; what is there:"
            ls -la ../../out/prefix/lib 2>/dev/null || echo "  (no lib directory)"
            exit 1
          }
          echo "leptonica library: $LEP ($(stat -c%s "$LEP") bytes)"

      - name: Build tesseract for arm64
        run: |
          set -euo pipefail
          cd src/tesseract
          NDK="$ANDROID_NDK_HOME"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TOOLCHAIN/aarch64-linux-android$API-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android$API-clang++"
          export AR="$TOOLCHAIN/llvm-ar"
          export RANLIB="$TOOLCHAIN/llvm-ranlib"
          export STRIP="$TOOLCHAIN/llvm-strip"
          export PKG_CONFIG_PATH="$PWD/../../out/prefix/lib/pkgconfig"
          export CPPFLAGS="-I$PWD/../../out/prefix/include"
          export LDFLAGS="-L$PWD/../../out/prefix/lib"
          ./autogen.sh
          # --without-graphics: the Android graphics backends are not wanted and
          # opencv is not in the NDK.
          ./configure --host=aarch64-linux-android \
            --build="$(gcc -dumpmachine)" \
            --prefix="$PWD/../../out/prefix" \
            --disable-shared --enable-static \
            --disable-openmp --without-graphics --without-openmp
          make -j"$(nproc)"
          make install
          echo "=== tesseract installed ==="
          ls -la ../../out/prefix/lib/libleptonica.a ../../out/prefix/lib/libtesseract.a
          du -sh ../../out/prefix/lib/libleptonica.a ../../out/prefix/lib/libtesseract.a

      - name: Verify the archives are arm64 and self-contained
        run: |
          set -euo pipefail
          OUT="$PWD/out/prefix/lib"
          TOTAL=0
          for A in libleptonica.a libtesseract.a; do
            test -f "$OUT/$A" || {
              echo "FAIL: $OUT/$A is missing. What IS there:"
              ls -la "$OUT" 2>/dev/null || echo "  (no directory)"
              exit 1
            }
            echo "=== $A ==="
            bash "$GITHUB_WORKSPACE/.github/scripts/assert_arch_member.sh" "$OUT/$A" "$A" arm64
            SZ=$(stat -c%s "$OUT/$A")
            TOTAL=$((TOTAL + SZ))
            echo "  size: $SZ bytes"
          done
          echo "TOTAL static size: $TOTAL bytes"
          echo "$TOTAL" > out/tesseract-total-bytes
          {
            echo "### tesseract: PASS"
            echo "libleptonica.a + libtesseract.a, both arm64, statically linked"
            echo "total: $TOTAL bytes"
          } >> "$GITHUB_STEP_SUMMARY"

          # The unstripped static size is not the number that decides whether this
          # ships. Measured on attempt 4:
          #     libleptonica.a    14,410,402 bytes
          #     libtesseract.a   71,842,076 bytes
          #     TOTAL            86,252,478 bytes
          # 86 MB, against a brief that expected ~4 MB. Debug symbols and DWARF are
          # most of that and none of it is loadable code, so the stripped figure is
          # reported alongside it rather than instead of it. Both numbers, because
          # "4 MB" and "86 MB" are both true of different things and only one of them
          # ends up in an APK.
      - name: Measure the stripped size
        run: |
          set -euo pipefail
          NDK="$ANDROID_NDK_HOME"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          test -x "$STRIP" || { echo "FAIL: no llvm-strip under $NDK"; exit 1; }
          mkdir -p stripped
          STRIPPED_TOTAL=0
          for A in libleptonica libtesseract; do
            cp "out/prefix/lib/$A.a" "stripped/$A.a"
            RAW=$(stat -c%s "stripped/$A.a")
          # -g removes debug info. The NDK's own strip is the right one for
          # objects its own clang produced.
            "$STRIP" --strip-debug "stripped/$A.a"
            S=$(stat -c%s "stripped/$A.a")
            STRIPPED_TOTAL=$((STRIPPED_TOTAL + S))
            printf '  %-18s raw %10d -> stripped %10d  (%.0f%% smaller)\n' \
              "$A.a" "$RAW" "$S" "$(awk "BEGIN{print 100-($S*100.0/$RAW)}")"
          done
          echo "STRIPPED TOTAL: $STRIPPED_TOTAL bytes"
          echo "$STRIPPED_TOTAL" > out/stripped-total-bytes
          {
            echo "### tesseract: stripped size"
            echo "raw      : 86,252,478 bytes (attempt 4 measurement)"
            echo "stripped : $STRIPPED_TOTAL bytes"
            echo "brief expected ~4 MB; the honest figure is above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          # The STRIPPED libraries ship. Shipping the unstripped ones would put
          # 86 MB into an APK for code that is 12 MB.
          cp stripped/libleptonica.a stripped/libtesseract.a dist/
          # tessdata is a runtime asset, not a library. 3.5 MB of traineddata
          # (eng + osd) and it is what makes OCR work at all. It ships as an
          # asset, never in git.
          mkdir -p dist/tessdata
          cp src/tesseract/tessdata/eng.traineddata dist/tessdata/ 2>/dev/null || true
          cp src/tesseract/tessdata/osd.traineddata dist/tessdata/ 2>/dev/null || true
          du -sh dist/tessdata 2>/dev/null || echo "tessdata: not found in the source tree"
          tar -czf tesseract-arm64.tar.gz -C dist .
          ls -la tesseract-arm64.tar.gz

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-arm64
          path: tesseract-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14

  onnxruntime:
    name: onnxruntime (AAR extraction)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the Android AAR and extract the arm64 .so
        run: |
          set -euo pipefail
          # ONNX Runtime ships Android support ONLY as an AAR, a Java artifact.
          # There is no arm64 C distribution. The .so inside the AAR is a real
          # ELF shared object and is linkable from NDK builds; it is loaded at
          # runtime by the Java loader, which is why an app can use it without
          # ONNX Runtime knowing about C at all.
          #
          # Version pinned deliberately: an unpinned "latest" makes a failure
          # unreproducible, and the ABI of the .so is not guaranteed across
          # majors.
          VER="1.20.0"
          URL="https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/$VER/onnxruntime-android-$VER.aar"
          echo "fetching $URL"
          curl -fsSL -o ort.aar "$URL"
          ls -la ort.aar
          mkdir -p aar && cd aar && unzip -q ../ort.aar
          echo "=== AAR contents ==="
          find . -name '*.so' | sort
          mkdir -p dist
          SRC="jni/$ABI/libonnxruntime.so"
          test -f "$SRC" || { echo "MISSING: $SRC"; find . -name '*.so'; exit 1; }
          cp "$SRC" dist/libonnxruntime.so
          cp "$SRC" "dist/libonnxruntime-$ABI.so"
          # Verification, same as everywhere else: an ELF that exists but is the
          # wrong architecture, or exports nothing, is worse than no artifact.
          echo "=== verify ==="
          file dist/libonnxruntime.so
          file dist/libonnxruntime.so | grep -q 'aarch64' || {
            echo "FAIL: not aarch64"; exit 1; }
          N=$(nm -D --defined-only dist/libonnxruntime.so | grep -c 'OrtGetApiBase' || true)
          echo "OrtGetApiBase exported: $N"
          [ "$N" -ge 1 ] || { echo "FAIL: OrtGetApiBase not exported"; exit 1; }
          echo "=== ONNX Runtime does NOT define a C++ API symbol check here ==="
          # gs-ffi's clip_bridge uses OrtGetApiBase via the C API only, so that
          # is the contract. Asserted rather than assumed.
          ls -la dist/libonnxruntime.so
          {
            echo "### onnxruntime: PASS"
            echo "onnxruntime-android $VER, $ABI, $(stat -c%s dist/libonnxruntime.so) bytes"
            echo "OrtGetApiBase present"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package and upload
        run: |
          set -euo pipefail
          tar -czf onnxruntime-arm64.tar.gz -C aar/dist .
          ls -la onnxruntime-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-arm64
          path: onnxruntime-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14

  llamacpp:
    name: llama.cpp (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            expect: arm64
          # x86_64 is not optional. The instrumented tests run on an x86_64
          # emulator, and an x86_64 emulator CANNOT load an arm64 .so. Without
          # this slice the device tests could only ever exercise the paths that
          # report UNAVAILABLE, which is the opposite of what they are for.
          - abi: x86_64
            target: x86_64-linux-android
            expect: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install the NDK
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-ndk.sh"
        env:
          NDK_VERSION: ${{ env.NDK_VERSION }}
          CMDLINE_VERSION: 11076708

      - name: NDK toolchain file
        run: |
          set -euo pipefail
          NDK="$ANDROID_NDK_HOME"
          {
            echo "set(CMAKE_SYSTEM_NAME Android)"
            echo "set(CMAKE_SYSTEM_VERSION $API)"
            echo "set(CMAKE_ANDROID_ARCH_ABI ${{ matrix.abi }})"
            echo "set(CMAKE_ANDROID_NDK $NDK)"
            echo "set(CMAKE_ANDROID_STL_TYPE c++_shared)"
            echo "set(CMAKE_FIND_ROOT_PATH $NDK)"
          } > android.toolchain.cmake
          cat android.toolchain.cmake

      - name: Fetch llama.cpp
        run: |
          set -euo pipefail
          # NOT "src": the repository root already contains one, and
          #   fatal: destination path 'src' already exists and is not an empty
          #   directory.
          # is what that produced (run 36383123086).
          # PINNED TO THE DESKTOP COMMIT, NOT A MOVING BRANCH.
          #
          # This used to be `--branch b4581`, which is b636228c0ad0db95bf73008094c6145a05615cf6.
          # The desktop build uses GS_LLAMA_ROOT, and .cargo/config.toml:37 points it at
          #     /mnt/new_volume/llm-workspace/llama.cpp
          # whose HEAD is the commit below. The wrapper at
          # native/cpp/llama_wrapper/llama_wrapper.cpp is written against THAT version,
          # and the two disagree about the API. Raw, run 36460210545, the first time
          # the wrapper was ever compiled for Android:
          #
          #   error: use of undeclared identifier 'llama_get_memory'
          #          did you mean 'llama_get_model'?
          #   error: use of undeclared identifier 'llama_memory_clear'
          #   error: use of undeclared identifier 'llama_memory_seq_pos_max'
          #          did you mean 'llama_kv_cache_seq_pos_max'?
          #   error: use of undeclared identifier 'GGML_BACKEND_DEVICE_TYPE_IGPU'
          #   error: cannot initialize a parameter of type 'struct llama_context *'
          #          with an rvalue of type 'const struct llama_model *'
          #   11 errors generated.
          #
          # Confirmed at the HEADER level, not inferred from the errors. Counting the
          # symbols the wrapper needs in each tree's include/llama.h:
          #
          #   3018a11e79e489b657dbb77c95694889ccff92df  ->  4 matches
          #   b636228c0ad0db95bf73008094c6145a05615cf6  ->  0 matches
          #
          # A shallow clone CANNOT take `--branch <sha>`, so this fetches the commit
          # directly and detaches onto it.
          LLAMA_SHA=3018a11e79e489b657dbb77c95694889ccff92df
          git init -q src-llama
          cd src-llama
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch -q --depth 1 origin "$LLAMA_SHA"
          git checkout -q --detach FETCH_HEAD
          # --recurse-submodules is a NO-OP at this commit: there is no .gitmodules,
          # ggml is an in-tree directory (git ls-tree shows it as a tree, not a
          # 160000 gitlink). Kept because it costs nothing and because ggml WAS a
          # submodule historically -- if that ever changes back, this step would
          # otherwise build against an empty directory and fail obscurely.
          git submodule update --init --recursive || true
          cd - >/dev/null
          GOT=$(cd src-llama && git rev-parse HEAD)
          echo "llama.cpp pinned: $GOT"
          echo "llama.cpp: $(cd src-llama && git log -1 --format='%H (%ad)' --date=short)"
          # ASSERT THE PIN TOOK. A wrong checkout here compiles the WRONG API and
          # produces exactly the 11 errors above, twenty minutes later, in a
          # different job. One line here names it immediately.
          if [ "$GOT" != "$LLAMA_SHA" ]; then
            echo "::error::llama.cpp is at $GOT, not $LLAMA_SHA. The wrapper and the headers will disagree."
            exit 1
          fi
          # And assert the header actually carries the API, so a same-shaped but
          # wrong-version tree cannot pass either.
          for SYM in llama_get_memory llama_memory_clear llama_memory_seq_pos_max; do
            if ! grep -q "$SYM" src-llama/include/llama.h; then
              echo "::error::$SYM is absent from src-llama/include/llama.h at $GOT."
              echo "The wrapper will not compile against this tree."
              exit 1
            fi
            echo "  header has $SYM"
          done
          # ggml-backend.h carries the fourth symbol the wrapper needs. It lives in
          # the ggml tree, not include/, so it is checked separately -- and its
          # presence at 3018a11e7 is what makes GGML_BACKEND_DEVICE_TYPE_IGPU resolve.
          if ! grep -q GGML_BACKEND_DEVICE_TYPE_IGPU src-llama/ggml/include/ggml-backend.h; then
            echo "::error::GGML_BACKEND_DEVICE_TYPE_IGPU absent from src-llama/ggml/include/ggml-backend.h at $GOT"
            exit 1
          fi
          echo "  header has GGML_BACKEND_DEVICE_TYPE_IGPU"

      - name: Build
        run: |
          set -euo pipefail
          # LLAMA_BUILD_APP IS THE ONE THAT WAS MISSING, and it is ON BY DEFAULT.
          # At 3018a11e7 the top-level CMakeLists declares:
          #   option(LLAMA_BUILD_APP "llama: build the unified binary" ${LLAMA_STANDALONE})
          # so pinning the desktop commit turned on a target that the previous
          # pinned branch did not have, and the very first build at the new pin
          # died with:
          #   FAILED: [code=1] bin/llama
          #   ld: error: unable to find library -lllama-server-impl
          #   ld: error: unable to find library -lllama-cli-impl
          # The CLI links those impl libraries, and LLAMA_BUILD_SERVER/EXAMPLES
          # being OFF is what removed them -- so the unified binary was being
          # built with its own dependencies switched out from under it.
          #
          # NOTHING here needs a CLI, a server, or the common utils. build.rs
          # links every .a this package ships (native/crates/gs-ffi/build.rs:200),
          # so a stray bin/llama would not just cost disk, it would be handed to
          # rustc as a link input. Hence COMMON and UI off as well -- both are
          # ON by default at this commit too.
          # THE NDK'S OWN TOOLCHAIN FILE, NOT A HAND-WRITTEN ONE.
          #
          # The hand-written file set CMAKE_SYSTEM_NAME and CMAKE_ANDROID_ARCH_ABI
          # and CMake accepted all of it -- then selected the bare driver:
          #     -- The C compiler identification is Clang 14.0.7
          #     -- Check for working C compiler:
          #        .../ndk/25.2.9519653/.../bin/clang - skipped
          # The NDK's bare `clang` is a HOST driver. It takes its target from
          # --target, and with none it builds for the build machine. So arm64-v8a
          # produced x86_64 objects, every job went green, and the only place it
          # surfaced was a cross-link from rustc twenty minutes later:
          #     ld: error: .../android-arm64-v8a/lib/libllama.a(llama.cpp.o)
          #     is incompatible with aarch64linux
          #
          # Setting an ABI variable in a hand-rolled file is not the same thing
          # as using the NDK's file, which emits --target= and picks
          # aarch64-linux-android24-clang.
          cmake -S src-llama -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${{ env.API }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_CURL=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_COMMON=OFF -DLLAMA_BUILD_UI=OFF \
            -G Ninja 2>&1 | tee configure.log
          # The build log is kept: on failure it is the raw evidence required
          # before anything is called BLOCKED.
          cmake --build build -j"$(nproc)" 2>&1 | tee build.log

      # Raw, run 36385099961: the build SUCCEEDED, all 49 targets linked
      #   [41/49] Linking CXX static library src/libllama.a
      # and then verification failed with "no llama.cpp archives produced"
      # because it looked in build/bin/. A cmake build writes archives next to
      # their sources, so find them anywhere and print every .a when there is
      # none. A verify step that asserts a hardcoded path is a guess.
      - name: Package with headers
        run: |
          set -euo pipefail
          mkdir -p dist/lib dist/include dist/ggml-include
          FOUND=0
          for S in $(find build -name '*.a' | sort); do
            B="dist/lib/$(basename "$S")"
            cp "$S" "$B"
            bash "$GITHUB_WORKSPACE/.github/scripts/assert_arch_member.sh" "$B" "$(basename "$S")" "${{ matrix.expect }}"
            echo "  $S -> $B ($(stat -c%s "$S") bytes)"
            FOUND=$((FOUND+1))
          done
          # THE ARCHITECTURE IS ASSERTED WHERE IT WENT WRONG.
          #
          # assert_arch_member.sh inspects the archives and PASSED on archives
          # built for the wrong CPU, so whatever it checked was not sufficient.
          # CMake naming the wrong compiler is upstream of the archives and is the
          # cheapest thing to catch: one line of output, before an hour of compiling.
          # READ THE ARCHITECTURE OUT OF THE ARCHIVES.
          #
          # The CMake-reported value is NOT evidence. CMAKE_SYSTEM_PROCESSOR is
          # derived from -DANDROID_ABI, the variable this workflow just passed, so
          # it reports whatever was asked for and confirms nothing about the bytes:
          #
          #   -- CMAKE_SYSTEM_PROCESSOR: aarch64      <- because we passed arm64-v8a
          #   -- GGML_SYSTEM_ARCH:      ARM
          #
          # That check was circular and I shipped it. This one parses each archive
          # member's ELF header and requires the machine to match the ABI, so it can
          # only pass if the objects really were built for the target.
          #
          # It is also the check that was already here and is sound --
          # assert_arch_member.sh passed on these archives because they ARE aarch64:
          #   libllama.a members=169  {'AArch64': 169}
          # So the archives are correct and the remaining "is incompatible with
          # aarch64linux" comes from the LINK side, not the archive side. This gate
          # is kept because it is the one that would catch a genuinely wrong build.
          python3 -c '
          import struct, sys, collections
          MACH = {0x03:"i386", 0x3e:"x86-64", 0x28:"ARM", 0xb7:"AArch64"}
          WANT = {"arm64-v8a":"AArch64","armeabi-v7a":"ARM","x86_64":"x86-64","x86":"i386"}["${{ matrix.abi }}"]
          bad = 0
          for lib in ("libllama.a","libggml.a","libggml-cpu.a","libggml-base.a"):
          p = "dist/lib/" + lib
          d = open(p,"rb").read()
          if d[:8] != b"!<arch>\n":
          print("  %-16s NOT AN AR ARCHIVE" % lib); bad += 1; continue
          off, seen = 8, collections.Counter()
          while off + 60 <= len(d):
          h = d[off:off+60]
          if h[58:60] != b"\x60\n": break
          nm = h[0:16].decode("ascii","replace").strip().rstrip("/")
          try: sz = int(h[48:58].decode().strip())
          except ValueError: break
          b = d[off+60:off+60+sz]
          if b[:4] == b"\x7fELF" and struct.unpack_from("<H", b, 18)[0] in MACH:
          seen[MACH[struct.unpack_from("<H", b, 18)[0]]] += 1
          off += 60 + sz + (sz % 2)
          n = sum(seen.values())
          print("  %-16s objects=%-5d %s" % (lib, n, dict(seen)))
          if n == 0 or list(seen) != [WANT]:
          print("  %s: expected only %s objects, found %s" % (lib, WANT, dict(seen))); bad += 1
          sys.exit(1 if bad else 0)
          '
          echo "  every archive member is ${{ matrix.abi }} ELF"
          if [ "$FOUND" -eq 0 ]; then
            echo "no llama.cpp archives anywhere under build/; every .a that exists:"
            find build -name '*.a' | sort
            tail -30 build.log || true
            exit 1
          fi
          # HEADERS. gs-ffi's wrapper #includes <llama.h> and <ggml.h>, so the
          # archives alone cannot be linked -- the build fails on a missing
          # header, not on a missing library, which is a confusing way to learn
          # that only the .a files were shipped.
          cp -r src-llama/include/. dist/include/
          # PUT THE ggml HEADERS IN include/ TOO, next to llama.h.
          #
          # llama.h:4 does `#include "ggml.h"` -- QUOTED. A quoted include always
          # searches the directory of the file doing the including FIRST, before
          # any -I path. So copying ggml.h beside llama.h makes the include resolve
          # with no -I flag involved at all.
          #
          # Relying on -I instead is what just failed. build.rs does add
          # ggml-include/ when it exists, and it does exist:
          #     native/prebuilts/android-x86_64/ggml-include/ggml.h
          # yet the compile still produced
          #     include/llama.h:4:10: fatal error: 'ggml.h' file not found
          # cc-rs does not echo its command line unless CC_ENABLE_DEBUG_OUTPUT is
          # set, so the flags could not be confirmed from the log either. Rather
          # than keep guessing at include-path plumbing, remove the dependency on
          # it: the headers go where a quoted include looks first.
          cp -r src-llama/ggml/include/. dist/include/
          # dist/ggml-include/ is kept as well, so anything using <ggml.h> still
          # resolves and the package keeps documenting where these came from.
          if [ ! -f dist/include/ggml.h ]; then
            echo "FAIL: dist/include/ggml.h missing after copying ggml headers"
            ls -1 dist/include/ | sed -n '1,20p'
            exit 1
          fi
          echo "dist/include/llama.h and dist/include/ggml.h are both present"
          mkdir -p dist/ggml-include
          cp -r src-llama/ggml/include/. dist/ggml-include/ 2>/dev/null || true
          test -f dist/include/llama.h || { echo "FAIL: dist/include/llama.h missing"; exit 1; }
          echo "=== package contents ==="
          find dist -type f | sort | sed -n '1,40p'
          echo "total: $(du -sh dist | cut -f1)"

      # The DIRECTORY, not a tarball. GitHub's artifact API always returns a zip
      # wrapper, so uploading a .tar.gz produces a zip containing a tarball, and
      # a consumer that runs `tar -xzf` on it gets:
      #     tar: This does not look like a tar archive
      # which is what the first device run did. One layer, not two.
      - uses: actions/upload-artifact@v4
        with:
          name: llamacpp-${{ matrix.abi }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  stablediffusion:
    name: stable-diffusion.cpp
    # No continue-on-error any more: the operator diagnosed the cause (the
    # vendored libwebp points at ${ANDROID_NDK}/sources/android/cpufeatures/,
    # a path Google removed from the NDK years ago) and specified the flags
    # that skip it. If these fail the job goes red, which is the correct
    # outcome.
    # BLOCKED after five attempts, with raw logs. The cause is an upstream
    # out-of-tree configure defect in the vendored libwebp, not a missing SDK,
    # not a missing toolchain, and not an environment limitation:
    #
    #   1. run 36383123086  `src` collided with the repository's own src/
    #                      fatal: destination path 'src' already exists
    #   2. run 36383749573  ggml is a git SUBMODULE; --depth 1 left it empty
    #                        CMake Error at cmake/ggml.cmake:5 (add_subdirectory)
    #                          The source directory .../src-sd/ggml
    #                          does not contain a CMakeLists.txt file.
    #   3. run 36384581930  libwebp's cpufeatures target resolves a nonsense path
    #                        CMake Error at thirdparty/libwebp/CMakeLists.txt:204
    #                          Cannot find source file:
    #                            /sources/android/cpufeatures/cpu-features.c
    #   4. run 36385099961  -DSD_ENABLE_WEBP=OFF -DGGML_WEBP=OFF -DWEBP=OFF did
    #                        nothing, because libwebp is added unconditionally
    #   5. run 36385724635  removing the vendored dir and commenting the reference
    #                        broke the top-level CMakeLists instead
    #                        CMake Error at CMakeLists.txt:60 (endif)
    #
    # The one untried idea: patch thirdparty/libwebp/CMakeLists.txt so the
    # cpufeatures-webp target points at a real source, rather than deleting the
    # reference. Recorded so a sixth attempt starts there instead of repeating
    # these five.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the NDK
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-ndk.sh"
        env:
          NDK_VERSION: ${{ env.NDK_VERSION }}
          CMDLINE_VERSION: 11076708

      - name: NDK toolchain file
        run: |
          set -euo pipefail
          NDK="$ANDROID_NDK_HOME"
          {
            echo "set(CMAKE_SYSTEM_NAME Android)"
            echo "set(CMAKE_SYSTEM_VERSION $API)"
            echo "set(CMAKE_ANDROID_ARCH_ABI $ABI)"
            echo "set(CMAKE_ANDROID_NDK $NDK)"
            echo "set(CMAKE_ANDROID_STL_TYPE c++_shared)"
            echo "set(CMAKE_FIND_ROOT_PATH $NDK)"
          } > android.toolchain.cmake

      - name: Fetch stable-diffusion.cpp
        run: |
          set -euo pipefail
          # --recurse-submodules is REQUIRED, not optional. Raw, run 36383749573:
          #     CMake Error at cmake/ggml.cmake:5 (add_subdirectory):
          #       The source directory
          #         /home/runner/.../src-sd/ggml
          #       does not contain a CMakeLists.txt file.
          # ggml is a git SUBMODULE. `git clone --depth 1` leaves it as an empty
          # directory, so the whole project fails to configure -- and the error
          # names a missing CMakeLists rather than an unfetched submodule, which
          # is a genuinely misleading message.
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/leejet/stable-diffusion.cpp.git src-sd
          test -f src-sd/ggml/CMakeLists.txt || {
            echo "FAIL: src-sd/ggml/CMakeLists.txt is missing; the submodule is not fetched"
            ls -la src-sd/ggml | sed -n '1,10p'
            exit 1
          }
      - name: Build for arm64, CPU only
        run: |
          set -euo pipefail
          # SD_VULKAN=OFF on the first build by design: the brief asks for the
          # CPU-only number to be measured, and Vulkan on Android needs
          # libvulkan + a loader that is not in the NDK sysroot. Enabling it
          # without measuring would be the other kind of guess.
          # Webp is off, and the reason is a real upstream defect rather than a
          # preference. Raw, run 36384581930:
          #     CMake Error at thirdparty/libwebp/CMakeLists.txt:204 (add_library):
          #       Cannot find source file:
          #         /sources/android/cpufeatures/cpu-features.c
          #     CMake Error at thirdparty/libwebp/CMakeLists.txt:204 (add_library):
          #       No SOURCES given to target: cpufeatures-webp
          #     CMake Generate step failed.
          # The path is nonsense -- an absolute /sources/android/... built from a
          # relative path -- so libwebp's cpufeatures target does not resolve
          # out of tree. Webp is an image INPUT format for this project and is
          # not needed to measure CPU decode, which is the number the brief asks
          # for. Unknown -D names are a cmake warning, not an error, so all
          # three spellings are passed and the one that bites is the one used.
          cmake -S src-sd -B build \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSD_VULKAN=OFF -DSD_METAL=OFF -DSD_CUDA=OFF \
            -DGGML_OPENMP=OFF \
            -DSD_BUILD_SHARED_LIBS=OFF \
            -DSD_WEBP=OFF -DSD_WEBM=OFF \
            -G Ninja
          cmake --build build -j"$(nproc)" 2>&1 | tee build.log
          ls -la build/bin/*.a 2>/dev/null || true

      - name: Verify and package
        run: |
          set -euo pipefail
          mkdir -p dist
          FOUND=0
          # find, not a hardcoded build/bin path. Same defect as llama.cpp in the
          # same run: a cmake build writes archives next to their sources.
          for S in $(find build -name '*.a' | sort); do
            B="dist/$(basename "$S")"
            cp "$S" "$B"
            bash "$GITHUB_WORKSPACE/.github/scripts/assert_arch_member.sh" "$B" "$(basename "$S")" arm64 || true
            echo "  $S -> $B ($(stat -c%s "$S") bytes)"
            FOUND=$((FOUND+1))
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "no stable-diffusion archives anywhere under build/"
            tail -30 build.log || true
            exit 1
          fi
          echo "archives found: $FOUND"
          du -sh dist
          tar -czf stablediffusion-arm64.tar.gz -C dist .
          ls -la stablediffusion-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: stablediffusion-arm64
          path: stablediffusion-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
