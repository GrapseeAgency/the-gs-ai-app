name: android-screens

# Design-pass evidence: builds the app, boots the emulator, drives the eight
# design-pass screens with UiAutomator, and captures one PNG per screen.
#
# Dispatch-only by design: a screenshot run is a product decision, not an
# automatic gate. Run it against a revision to get the "before", change the
# UI, run it again for the "after".
#
# The emulator reaches the same public origin the shipped APK uses (BASE_URL
# is the preview-gateway origin for every build type), so the streaming and
# rich-reply shots are real turns served by the real backend.

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Shot label baked into the artifact name (before / after / ...)"
        required: false
        default: "run"
        type: string

permissions:
  contents: read

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm || { echo "FAIL: /dev/kvm is missing"; exit 1; }

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install the Android SDK and the emulator image
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q -o commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools "$SDK/cmdline-tools/latest"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" "system-images;android-30;google_apis;x86_64" >/dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"

      - name: Build the app and the test APK
        run: |
          cd android
          gradle -v
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Start the emulator and capture the screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -cores 4 -memory 3072
          disable-animations: true
          # `bash <script>`, NOT an inline script: the runner executes the
          # script field through /usr/bin/sh (dash), which rejects
          # `set -o pipefail`. Same mode-bit-class workaround that
          # android-device's run-instrumented.sh documents.
          script: bash .github/scripts/run-screens.sh

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screens-${{ inputs.label || 'run' }}
          path: |
            device-artifacts/
            instrumentation-out.txt
          if-no-files-found: warn
          retention-days: 30
