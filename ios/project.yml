name: GSApp
options:
  bundleIdPrefix: com.grapsee
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    # SWIFT_VERSION is the LANGUAGE MODE, not the toolchain version — valid
    # values are 4.0 / 4.2 / 5.0 / 6.0. The previous "5.9" (a toolchain-era
    # marker, never compiler-validated) hard-errors on every xcodebuild:
    # "SWIFT_VERSION '5.9' is unsupported". Swift-5 mode is the intended mode.
    SWIFT_VERSION: "5.0"
    # THE APP'S FLOOR: 16.0, AND IT IS NOT THE LIBRARY'S NUMBER.
    #
    # This line said "15.0" until run 36751766601, which was the first run to get
    # as far as building the app:
    #
    #   AttachmentSheetView.swift:34:38: error:
    #     'PhotosPickerItem' is only available in iOS 16.0 or newer
    #   AttachmentSheetView.swift:276:45: error:
    #     'PhotosPickerItem' is only available in iOS 16.0 or newer
    #   ** BUILD FAILED **
    #
    # A regression I introduced. 2ccb3a7 set this to 15.0 to fix an undefined
    # __chkstk_darwin in the CARGO link, and because the line had not existed
    # before, xcodebuild's own default -- 16.0 or higher -- was silently replaced
    # by 15.0. So a change aimed at the native library lowered the APP by a whole
    # version and broke the app's own Swift.
    #
    # The two numbers are for two different things and conflating them is the bug:
    #
    #   THE LIBRARY  needs >= 12, because __chkstk_darwin is only exported from
    #                libSystem from iOS 12.0 onward, and 15.0 because that is what
    #                the prebuilt archives are configured with. That is the
    #                job-level IPHONEOS_DEPLOYMENT_TARGET in ios-native.yml, and it
    #                stays 15.0.
    #   THE APP       needs >= 16, because PhotosPickerItem is PhotosUI, iOS 16.0.
    #                That is this line.
    #
    # A library built for 15.0 links perfectly well into an app whose floor is 16,
    # so the floors are independent and the app's is the higher of the two. 16.0
    # is chosen as the minimum the source actually requires rather than the
    # highest version available, because a floor nobody needs is a floor that
    # needlessly excludes devices.
    #
    # Asserted, not just documented:
    #   .github/scripts/check_ios_deployment_target.py
    # reads the floors the Swift source actually uses and fails if this value is
    # below the highest of them. A comment could not have stopped this -- a number
    # cannot be wrong about itself, only a comparison can.
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: "NO"
targets:
  App:
    type: application
    platform: iOS
    # THE XcFRAMEWORK. Until this line existed, `canImport(GsFfi)` was false in
    # every build, so the whole native bridge compiled to its #else branch:
    #
    #     return .failed(.libraryMissing("GsFfi not linked into this target"))
    #
    # and the seven XCTests in App/Tests/GsNativeTests.swift had never been run
    # by anything, because no CI job built the app at all. ios-native builds a
    # green GsFfi.xcframework and stops there.
    #
    # A static library, so `embed` must stay off: a framework marked for
    # embedding is copied into the bundle at runtime, and a STATIC library has
    # nothing to copy. Xcode's "Do Not Embed" is the correct setting here, and
    # getting it wrong fails at the copy step with a framework-type error that
    # names neither cause.
    #
    # XcodeGen emits a project even when this path is absent (the file is only
    # resolved at build time), so a clean checkout still generates. The CI job
    # that builds the app places the xcframework here first and asserts it
    # exists; the app without it builds exactly as it did before -- portable,
    # and reporting `libraryMissing` with a reason.
    dependencies:
      - framework: Frameworks/GsFfi.xcframework
        embed: false
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grapsee.gsai
        # LIBC++. libgs_ffi.a is C++, and a static library does not carry its
        # own runtime. Without this the app target links and every C++ symbol
        # libgs_ffi.a references is undefined (run 36663379374, the first
        # successful compile of this app and therefore the first link):
        #
        #   Undefined symbols for architecture arm64:
        #     "std::length_error::~length_error()"
        #     "std::logic_error::logic_error(char const*)"
        #     "std::__1::thread::hardware_concurrency()"
        #     "vtable for std::length_error"
        #     "typeinfo for std::exception"
        #     "operator delete(void*)"
        #
        # The same class of fault as the Android job's missing
        # libc++_shared.so, which cost that platform a run too: a C++ engine
        # shipped into a target that does not link the C++ runtime.
        #
        # `-lc++` AND `-ObjC++`: the first pulls in libc++, and the second
        # compiles the target's own .mm/.cpp and is what makes the linker
        # accept C++ static initialisers. Setting only CLANG_CXX_LANGUAGE_STANDARD
        # chooses a dialect and links nothing.
        # -lc++ -ObjC++ -framework Metal -framework Foundation
        #
        # The first two were there because libgs_ffi.a is C++ (run 36663379374,
        # 21 undefined libc++ symbols). Metal and Foundation are there because
        # GGML_METAL is ON by default on Apple silicon, so llama.cpp builds
        # libggml-metal.a, and every symbol IT references is a system framework
        # symbol. Run 36689648561:
        #
        #   Undefined symbols for architecture arm64:
        #     "_MTLCreateSystemDefaultDevice", referenced from
        #        _ggml_metal_device_init in libggml-metal.a[3](ggml-metal-device.m.o)
        #     "_OBJC_CLASS_$_MTLCompileOptions", ...
        #     "_OBJC_CLASS_$_NSLock", ...
        #     "_OBJC_CLASS_$_MTLCaptureManager", ...
        #     "___CFConstantStringClassReference", ...
        #     "___chkstk_darwin", ...
        #
        # 11 ObjC/Metal references plus CoreFoundation and one stack-check
        # helper, and NOT ONE llama_ or ggml_ symbol -- so llama.cpp itself
        # linked correctly and only the system frameworks are missing.
        #
        # -ObjC++ is what makes the linker accept those at all: it links the
        # Objective-C runtime and the framework search.
        #
        # Foundation is explicit rather than implied because __CFConstantString-
        # ClassReference comes from CoreFoundation, which Foundation re-exports.
        OTHER_LDFLAGS: "$(inherited) -lc++ -ObjC++ -framework Metal -framework Foundation -framework Accelerate"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        # The app target's module name must be GSApp: AppTests does
        # `@testable import GSApp` (default module name would be "App" and
        # the test target would fail to build with "no such module 'GSApp'").
        PRODUCT_MODULE_NAME: GSApp
        # NOTE: PRODUCT_NAME deliberately left at the XcodeGen default
        # ($(TARGET_NAME) = "App") — overriding it desynchronises the
        # auto-generated TEST_HOST for AppTests ("Could not find test host").
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: GS AI
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSSpeechRecognitionUsageDescription: GS turns your voice into text for your prompts when you use voice mode.
        NSMicrophoneUsageDescription: GS uses the microphone when you talk in voice mode.
        # PHASE 5 (attachments): camera capture handoff for in-the-moment photo
        # attachments. PhotosPicker and fileImporter need NO permission keys —
        # do not add others.
        NSCameraUsageDescription: GS uses the camera when you attach a photo you take in the moment.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.grapsee.gsai.quick.newChat
            UIApplicationShortcutItemTitle: New chat
            UIApplicationShortcutItemSubtitle: Start a new chat
            UIApplicationShortcutItemIconSymbolName: bubble.left
          - UIApplicationShortcutItemType: com.grapsee.gsai.quick.newImage
            UIApplicationShortcutItemTitle: New image
            UIApplicationShortcutItemSubtitle: Open Image Studio
            UIApplicationShortcutItemIconSymbolName: photo
          - UIApplicationShortcutItemType: com.grapsee.gsai.quick.ask
            UIApplicationShortcutItemTitle: Ask GS
            UIApplicationShortcutItemSubtitle: Ask with your voice
            UIApplicationShortcutItemIconSymbolName: mic
  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
        # The UI test belongs to the GsChatUITests bundle ONLY (see below).
        # Without this exclude the file compiles into BOTH bundles, and the
        # unit bundle's copy runs inside the app host where XCUIApplication()
        # has no runner -- it could only ever SKIP, which is the state the
        # file sat in before ITEM 5 wired the real target.
        excludes:
          - "UITests/**"
    settings:
      base:
        # The test bundle links libgs_ffi.a itself, so it needs libc++ for the
        # same reason the app does. A unit-test bundle gets no transitive link
        # flags from its host, so this is not inherited from the App target.
        # -lc++ -ObjC++ -framework Metal -framework Foundation
        #
        # The first two were there because libgs_ffi.a is C++ (run 36663379374,
        # 21 undefined libc++ symbols). Metal and Foundation are there because
        # GGML_METAL is ON by default on Apple silicon, so llama.cpp builds
        # libggml-metal.a, and every symbol IT references is a system framework
        # symbol. Run 36689648561:
        #
        #   Undefined symbols for architecture arm64:
        #     "_MTLCreateSystemDefaultDevice", referenced from
        #        _ggml_metal_device_init in libggml-metal.a[3](ggml-metal-device.m.o)
        #     "_OBJC_CLASS_$_MTLCompileOptions", ...
        #     "_OBJC_CLASS_$_NSLock", ...
        #     "_OBJC_CLASS_$_MTLCaptureManager", ...
        #     "___CFConstantStringClassReference", ...
        #     "___chkstk_darwin", ...
        #
        # 11 ObjC/Metal references plus CoreFoundation and one stack-check
        # helper, and NOT ONE llama_ or ggml_ symbol -- so llama.cpp itself
        # linked correctly and only the system frameworks are missing.
        #
        # -ObjC++ is what makes the linker accept those at all: it links the
        # Objective-C runtime and the framework search.
        #
        # Foundation is explicit rather than implied because __CFConstantString-
        # ClassReference comes from CoreFoundation, which Foundation re-exports.
        OTHER_LDFLAGS: "$(inherited) -lc++ -ObjC++ -framework Metal -framework Foundation -framework Accelerate"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    dependencies:
      - target: App
      # @testable import GSApp re-exports the app module, but the framework has
      # to be linkable by the TEST bundle too: GsNativeTests calls
      # GsNative.backendAvailable and GsNative.chat directly, and a symbol that
      # resolves only in the host app fails the link with
      #   undefined symbol: _gs_ffi_mobile_chat
      - framework: Frameworks/GsFfi.xcframework
        embed: false
  GsChatUITests:
    # ITEM 5 of the current brief -- the ui-testing bundle GsChatUiTests.swift
    # has been waiting for. It was in the unit bundle, where XCUIApplication()
    # cannot launch anything, so the test's only possible outcome was a SKIP.
    # A bundle.ui-testing target gets its own runner app: xcodebuild installs
    # the runner, the runner spawns the app under test (GSApp), and the test
    # drives the real UI from outside the app's process.
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/Tests/UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.grapsee.gsai.uiTests
    dependencies:
      # The app under test. XcodeGen turns this into TEST_TARGET_NAME for the
      # runner, which is how xcodebuild knows what XCUIApplication() launches.
      - target: App
      # A ui-testing bundle links NO app module and NO GsFfi: it must not
      # import GSApp (the file's @testable import was removed for exactly that
      # reason), so no framework dependency is declared here on purpose.
schemes:
  GSApp:
    build:
      targets:
        App: all
    test:
      targets:
        - AppTests
        - GsChatUITests
      # Read by the TEST RUNNER process (the xctest runner, not the app).
      # GsChatUiTests.deviceModel() checks GS_UI_TEST_MODE as its honest-mode
      # guard and GS_TEST_MODEL as the model path. /tmp on the runner host is
      # visible inside the simulator; ios-native.yml stages the VERIFIED 0.5B
      # download at that exact path before running the tests.
      environmentVariables:
        - variable: GS_UI_TEST_MODE
          value: "1"
          isEnabled: true
        - variable: GS_TEST_MODEL
          value: /tmp/gs-ui-model.gguf
          isEnabled: true
