name: Benchmark

# Phase 6 — GS BENCH CI: build the bench image, run the eval matrix against
# the Phase 1 shim, aggregate into a scorecard, and verify container escape
# resistance (Phase 10) BEFORE any agentic task runs model-generated code.
#
# Hard rules encoded here:
#   - eval jobs time out per benchmark; a killed job writes BLOCKED results
#     (the CLI records the raw error), it never reports a partial score.
#   - every artifact uploaded contains raw logs + result JSONs.
#   - secrets flow only to the eval step, never into the image.

on:
  workflow_dispatch:
    inputs:
      model: { description: 'single model override (optional)', required: false, default: '' }
      suite: { description: 'suite to run', required: false, default: 'knowledge' }
      scaffold:
        description: 'scaffold lever under test (one lever per dispatch — rule 1)'
        required: false
        default: 'baseline'
        type: choice
        options: [baseline, aci, verification, context, router]
      benchmarks:
        description: 'optional comma list to run a subset (default: full knowledge suite)'
        required: false
        default: ''

# push/tag triggers REMOVED (raw evidence: runs 36081243077, 36082501113,
# 36105391647, 36105420784, 36153729479 — every push to main since a5c6c71
# fired a 0-job startup-failure run despite `push: tags: ['v*']`; the eval
# job-level `if:` from a5c6c71 has never executed in a dispatch run, so it
# was the unproven construct). This workflow is dispatch-only by design:
# the sandbox writes code and dispatches, GitHub Actions executes.

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: grapseeagency/gs-bench

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v5
        with:
          file: Dockerfile.bench
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Phase 10 — sandbox escape verification. Fail-closed: if the environment
  # cannot MEASURE the escape rate (no nested VM sandbox on hosted runners),
  # the verdict is BLOCKED and every code-executing agentic benchmark stays
  # blocked (SWE-bench class — already BLOCKED for disk). tau2 emits tool
  # calls into a simulated domain and executes no model-generated code, so
  # it is out of the Phase 10 gate scope (reasoning recorded in
  # runners/sandbox_escape.py).
  sandbox-escape-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Phase 10 escape verification (fail-closed)
        run: |
          pip install "git+https://github.com/icml-2026-34047/SANDBOXESCAPEBENCH" 2>&1 | tee escape-install.log || true
          python runners/sandbox_escape.py --scenarios-dir scenarios --output escape-verdict.json 2>&1 | tee escape-run.log
          STATUS=$(python -c "import json;print(json.load(open('escape-verdict.json'))['status'])")
          echo "Phase 10 verdict: $STATUS"
          if [ "$STATUS" = "MEASURED" ]; then
            RATE=$(python -c "import json;print(json.load(open('escape-verdict.json'))['escape_rate'])")
            if [ "$RATE" != "0" ] && [ "$RATE" != "0.0" ]; then
              echo "::error::Escape rate > 0 on levels 1-2 — fix container config before agentic runs"
              exit 4
            fi
          else
            echo "::warning::Phase 10 NOT MEASURED on this runner — escape verdict recorded as BLOCKED; code-executing agentic benchmarks remain blocked"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-escape-verification
          path: |
            escape-install.log
            escape-run.log
            escape-verdict.json

  eval:
    needs: [build, sandbox-escape-verification]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Subset filtering lives in STEP-level conditions below: the `matrix`
    # context is NOT recognized in jobs.<job_id>.if (raw evidence: dispatch
    # API 422 on 4ab6e53 — "Unrecognized named-value: 'matrix'" — same
    # construct shipped in a5c6c71 startup-failed every push since).
    # Step-level `if` is documented to support matrix. Empty `benchmarks`
    # input = full matrix; a non-matching leg writes an honest
    # SKIPPED_BY_SUBSET marker, never a silent omission.
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        # Competitor columns DROPPED (task decision): free-tier OpenRouter keys
        # return 402 for gpt-5.5/opus-4.8 — an unfunded key is not a result.
        # The experiment is now SAME model, DIFFERENT scaffold: the lever is
        # selected by the `scaffold` dispatch input, never by the matrix.
        benchmark: [gpqa_diamond, aime, ifbench, tau2_telecom]
        model: [gs-ai]
    steps:
      - uses: actions/checkout@v4
      - name: Subset filter — decide honestly whether this leg runs
        id: subset
        run: |
          WANT=$(echo "${{ inputs.benchmarks }}" | tr -d ' ')
          LEG="${{ matrix.benchmark }}"
          if [ -z "$WANT" ] || echo ",$WANT," | grep -q ",$LEG,"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "subset decision: RUN $LEG (benchmarks input: '$WANT')"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::leg $LEG skipped — not in dispatch subset '$WANT'"
          fi
      - uses: actions/setup-python@v5
        if: steps.subset.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-bench.txt'
      - name: Install harness deps (image deps, mirrored locally for the CLI)
        if: steps.subset.outputs.run == 'true'
        run: pip install -r requirements-bench.txt
      - name: Run benchmark
        if: steps.subset.outputs.run == 'true'
        env:
          GS_ENDPOINT: ${{ secrets.GS_ENDPOINT }}
          GS_API_KEY: ${{ secrets.GS_API_KEY }}
          GS_BENCH_API_KEY: ${{ secrets.GS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GS_BENCH_IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -n "${{ github.event.inputs.model }}" ]; then
            MODEL="${{ github.event.inputs.model }}"
          else
            MODEL="${{ matrix.model }}"
          fi
          SCAFFOLD="${{ github.event.inputs.scaffold || 'baseline' }}"
          echo "scaffold lever under test: $SCAFFOLD (model $MODEL — rule 2: fixed)"
          python -m cli.main run \
            --model "$MODEL" \
            --scaffold "$SCAFFOLD" \
            --benchmark ${{ matrix.benchmark }} \
            --output ./results/
      - name: Record honest skip for legs outside the dispatch subset
        if: steps.subset.outputs.run != 'true'
        run: |
          mkdir -p ./results
          printf '{"benchmark":"%s","model":"%s","scaffold":"%s","status":"SKIPPED_BY_SUBSET","reason":"dispatch benchmarks input did not include this leg","input":"%s","timestamp_utc":"%s"}\n' \
            "${{ matrix.benchmark }}" "${{ matrix.model }}" "${{ inputs.scaffold || 'baseline' }}" "${{ inputs.benchmarks }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "./results/skipped-${{ matrix.benchmark }}-${{ matrix.model }}.json"
          cat "./results/skipped-${{ matrix.benchmark }}-${{ matrix.model }}.json"
      - uses: actions/upload-artifact@v4
        if: always()   # BLOCKED result files + raw logs must survive a failing step (rule 5)
        with:
          name: results-${{ matrix.benchmark }}-${{ matrix.model }}-${{ github.event.inputs.scaffold || 'baseline' }}
          path: ./results/

  aggregate:
    needs: eval
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ./all-results
      - name: Aggregate scorecard
        run: |
          python -m cli.main aggregate --input ./all-results --output ./scorecard.json || true
          ls -la ./all-results
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: ./scorecard.json
      - name: Commit scorecard to bench-scores branch (avoids main collisions)
        run: |
          if [ -f ./scorecard.json ]; then
            git config user.name "gs-bench-bot"
            git config user.email "bot@grapsee.dev"
            git fetch origin bench-scores || true
            git checkout -B bench-scores origin/bench-scores 2>/dev/null || git checkout -B bench-scores
            mkdir -p results
            cp ./scorecard.json ./results/latest.json
            git add ./results/latest.json
            git commit -m "benchmark: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
            git push origin bench-scores
          else
            echo "::warning::no scorecard produced — all eval jobs failed or wrote BLOCKED only"
          fi
