      - name: Review full-scroll 01-dashboard viewport 5
        run: python3 scripts/publish_response_section_frames.py "$GS_NATIVE_FRAME_DIR" '${{ inputs.platform }}' 01-dashboard 5
      - name: Review full-scroll 02-structured-launch viewport 0
        run: python3 scripts/publish_response_section_frames.py "$GS_NATIVE_FRAME_DIR" '${{ inputs.platform }}' 02-structured-launch 0
      - name: Review full-scroll 02-structured-launch viewport 1
