openapi: 3.1.0
info:
  title: GS AI Platform API
  version: 0.2.0
  description: >
    Contract-first API for the GS AI platform. Native clients (Kotlin/Compose,
    Swift/SwiftUI) consume this contract via Ktor. Streaming uses SSE; WebSocket
    upgrade is planned for interruptible/voice sessions.
servers:
  - url: /api
    description: Relative to deployment origin
tags:
  - name: system
  - name: models
  - name: conversations
  - name: assistants
paths:
  /health:
    get:
      tags: [system]
      summary: Liveness probe
      operationId: getHealth
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/models:
    get:
      tags: [models]
      summary: List available models and capabilities
      operationId: listModels
      responses:
        '200':
          description: Model catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
  /v1/conversations:
    get:
      tags: [conversations]
      summary: List conversations (newest first)
      operationId: listConversations
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Conversation page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'
    post:
      tags: [conversations]
      summary: Create a conversation
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationInput'
      responses:
        '201':
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
  /v1/conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [conversations]
      summary: Fetch one conversation
      operationId: getConversation
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [conversations]
      summary: Delete a conversation
      operationId: deleteConversation
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [conversations]
      summary: Update pin/archive/title/model
      operationId: updateConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationInput'
      responses:
        '200':
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [conversations]
      summary: Message history for a conversation
      operationId: listMessages
      responses:
        '200':
          description: Messages (oldest first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
    post:
      tags: [conversations]
      summary: Send a user message and run the assistant
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageInput'
      responses:
        '200':
          description: >
            Assistant reply. Non-streaming JSON by default; when
            sendMessageInput.stream is true the response is text/event-stream
            with `delta` events and a final `done` event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
            text/event-stream:
              schema:
                type: object
                properties:
                  event: { type: string, enum: [delta, done, error] }
                  data: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/assistants:
    get:
      tags: [assistants]
      summary: List assistant catalogue (favourites first)
      operationId: listAssistants
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: favourite
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Assistant catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantList'
    post:
      tags: [assistants]
      summary: Create an assistant
      operationId: createAssistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssistantInput'
      responses:
        '201':
          description: Created assistant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assistant'
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/assistants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [assistants]
      summary: Fetch one assistant (with conversation count)
      operationId: getAssistant
      responses:
        '200':
          description: Assistant detail
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/Assistant'
                  - type: object
                    properties:
                      conversationCount: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [assistants]
      summary: Update assistant (favourite, publish, edits)
      operationId: updateAssistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssistantInput'
      responses:
        '200':
          description: Updated assistant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assistant'
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [assistants]
      summary: Delete an assistant (linked conversations are unlinked)
      operationId: deleteAssistant
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  id: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Client exceeded a rate limit
      headers:
        Retry-After:
          schema: { type: string }
          description: Seconds until the client may retry
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }
    Model:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string }
        displayName: { type: string }
        capabilities:
          type: array
          items:
            type: string
            enum: [text, vision, tools, reasoning, voice]
        contextWindow: { type: integer }
        speedTier:
          type: string
          enum: [fast, balanced, deep]
    ModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { $ref: '#/components/schemas/Model' }
    Conversation:
      type: object
      required: [id, title, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        modelId: { type: string }
        assistantId: { type: string }
        pinned: { type: boolean, default: false }
        archived: { type: boolean, default: false }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConversationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Conversation' }
        nextCursor: { type: string, nullable: true }
    CreateConversationInput:
      type: object
      properties:
        title: { type: string }
        modelId: { type: string }
        assistantId: { type: string }
    UpdateConversationInput:
      type: object
      properties:
        title: { type: string, maxLength: 120 }
        pinned: { type: boolean }
        archived: { type: boolean }
        modelId: { type: string }
    Message:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        role:
          type: string
          enum: [user, assistant, system, tool]
        content: { type: string }
        createdAt: { type: string, format: date-time }
    MessageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Message' }
    SendMessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 32000 }
        stream: { type: boolean, default: false }
        modelId: { type: string }
    Assistant:
      type: object
      required: [id, slug, name, starters]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        instructions: { type: string }
        category:
          type: string
          enum: [general, research, writing, coding, productivity, learning]
        starters:
          type: array
          items: { type: string }
        published: { type: boolean, default: false }
        favourite: { type: boolean, default: false }
        uses: { type: integer, default: 0 }
        rating: { type: number, default: 0 }
        createdAt: { type: string, format: date-time }
    AssistantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Assistant' }
    CreateAssistantInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string }
        instructions: { type: string }
        category: { type: string }
        starters:
          type: array
          maxItems: 6
          items: { type: string }
        published: { type: boolean }
    UpdateAssistantInput:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string }
        instructions: { type: string }
        category: { type: string }
        starters:
          type: array
          maxItems: 6
          items: { type: string }
        favourite: { type: boolean }
        published: { type: boolean }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
