name: iOS (macOS) — Xcode build & test

# REAL compilation verification on a GitHub-hosted macOS runner.
#
# This workflow is the iOS compile gate. The Python static gates
# (scripts/ios_static_gates.py, scripts/swift_structure_gate.py) are
# supplementary structural checks only — they are NOT a substitute for
# Xcode compilation and are run here merely as a cheap pre-flight.
#
# Code signing: intentionally disabled (project.yml sets
# CODE_SIGNING_ALLOWED=NO and the workflow passes it explicitly), so
# headless CI needs no certificates, provisioning profiles, or team ID.
# The artifacts produced are unsigned simulator builds/archives.

on:
  pull_request:
    paths:
      - "ios/**"
      - "shared-contracts/**"
      - ".github/workflows/ios.yml"
      - "scripts/check_response_archive.py"
      - "scripts/publish_response_section_frames.py"
      - ".github/workflows/review-native-response-sections.yml"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "shared-contracts/**"
      - ".github/workflows/ios.yml"
      - "scripts/check_response_archive.py"
      - "scripts/publish_response_section_frames.py"
      - ".github/workflows/review-native-response-sections.yml"
      - "scripts/ios_static_gates.py"
      - "scripts/swift_structure_gate.py"
      # The pixel gate below runs this script and blocks on its verdict, so a
      # commit that changes the measurement has to run it. Without this line the
      # gate could be made stricter or looser in total silence — the same defect
      # `check_workflow_trigger_covers_scripts.py` exists for, one directory over.
      - "scripts/check_home_render.py"
      - "scripts/check_explore_render.py"
      # The Settings pixel gate below runs this script and enforces the numbers
      # in those mocks, so a commit to either has to run this job.
      - "scripts/check_settings_render.py"
      - "docs/reference/settings/**"
      # The reference pages are rendered and gated here; a change to the card
      # law, the inventory or the mocks has to run this job.
      - "scripts/check_sheets_render.py"
      - "scripts/check_sheets_copy_parity.py"
      - "docs/reference/pending/**"
      - "shared-contracts/explore-geometry.json"
      # The adversarial suite below runs the pixel gate against doctored frames;
      # changing it, or the artwork manifest it feeds, has to run this job too.
      - "scripts/test_home_render_gate.py"
      - "scripts/prepare_home_art.py"
      - "scripts/check_home_dark.py"
      - "scripts/check_font_faces.py"
      - "scripts/check_drawer_render.py"
      - "scripts/check_drawer_dark.py"
      - "scripts/check_drawer_structure.py"
      - "scripts/check_icon_catalogue.py"
      - "ios/App/Sources/Components/Drawer/DrawerTopicIcons.swift"
      - "scripts/test_drawer_render_gate.py"
      - ".github/scripts/check_drawer_type_parity.py"
      - "assets/reference/drawer-reference.png"
      - "shared-contracts/drawer-geometry.json"
      # This one reads the Swift side of every Home type role; a change to either
      # the lint or the view has to run it here, because android-app's filter does
      # not see ios/**.
      - ".github/scripts/check_home_type_parity.py"
      - ".github/scripts/check_gate_scripts_are_invoked.py"

permissions:
  actions: read
  contents: read

concurrency:
  # Preserve executed evidence, but do not let an obsolete revision stranded
  # before runner allocation pin every newer fix behind it. Match the Android
  # runtime gate's revision-isolated scheduling; all acceptance gates remain.
  group: ios-response-runtime-v9-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ios-build-test:
    name: Compile + test (macOS runner, real Xcode)
    runs-on: macos-15
    timeout-minutes: 120

    env:
      PROJECT_DIR: ios
      PROJECT_FILE: ios/GSApp.xcodeproj
      SCHEME: GSApp
      DERIVED_DATA: ios/build/DerivedData

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # BEFORE the build, not after it. The sheet and Settings pixel gates are
      # `if: always()` so their verdict still lands when the suite is red — and
      # run 41014412869 proved why the install cannot sit later: Test failed
      # first, the install step was skipped, and both gates died on
      # `ModuleNotFoundError: numpy` instead of measuring anything. A gate that
      # only works when nothing has failed yet is not always-on.
      - name: Set up Python for the render probe
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render-probe dependencies
        run: |
          set -euo pipefail
          # Pinned. This step feeds the numerics behind a blocking gate
          # (np.median over a probe window), so an unpinned numpy or Pillow
          # release could move a measured value and flip both platforms' verdict
          # with no change on our side.
          python3 -m pip install --quiet --disable-pip-version-check "numpy==2.1.3" "pillow==11.0.0"

      - name: Host toolchain report (before selection)
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          swift --version || true

      - name: Select Xcode (latest stable available on the runner image)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain report (after selection — recorded for the report)
        run: |
          echo "xcodebuild: $(xcodebuild -version | tr '\n' ' ')"
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          swift --version
          # `sed -n '1p'`, not `| head -1`. head closes the pipe, xcodebuild
          # takes SIGPIPE, and the nested command substitution cannot fail the
          # enclosing echo -- so the visible symptom there is not a dead step but
          # an EMPTY XCODE_VERSION written to the environment. A gate that reads
          # it later then fails for a reason three steps away.
          echo "XCODE_VERSION=$(xcodebuild -version | sed -n '1s/.*Xcode \(.*\)/\1/p')" >> "$GITHUB_ENV"

      - name: Static validation (supplementary — NOT a substitute for compilation)
        run: |
          python3 scripts/ios_static_gates.py
          python3 scripts/swift_structure_gate.py

      # The type contract is shared: it reads HomeDashboardView.swift and the Kotlin
      # view and fails if a role's size, weight, line height or tracking differs. It
      # was written before this job and invoked by nothing, so nothing held; the
      # meta-lint right after it keeps that from recurring for any script in the tree.
      - name: Home's type roles match across platforms, and every gate is invoked
        run: |
          set -euo pipefail
          python3 .github/scripts/check_home_type_parity.py
          python3 .github/scripts/check_gate_scripts_are_invoked.py --self-test
          python3 .github/scripts/check_gate_scripts_are_invoked.py

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          cd "$PROJECT_DIR"
          xcodegen generate
          test -d GSApp.xcodeproj || { echo "::error::GSApp.xcodeproj was not generated"; exit 1; }
          xcodebuild -list -project GSApp.xcodeproj

      - name: Fetch the GsFfi xcframework built for this source revision
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NATIVE_SOURCE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          NATIVE_WORKFLOW_SHA: ${{ github.sha }}
          SOURCE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # GsFfi is a native build artifact, never committed. Do not silently
          # take an arbitrary recent archive: its public C headers are compiled
          # into Swift, and an older archive can omit a symbol used by THIS
          # revision (the previous failure was gs_mobile_chat_stream).
          SELECTION_FILE="$RUNNER_TEMP/gs-ffi-xcframework.selection"
          rm -f "$SELECTION_FILE"
          python3 - <<'PYFRAMEWORK'
          import json
          import os
          import subprocess
          import sys
          import time

          def fail(message):
              safe = str(message).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Native framework selection failed::{safe}', file=sys.stdout)
              raise SystemExit(1)

          required = ('GITHUB_REPOSITORY', 'NATIVE_SOURCE_BRANCH', 'NATIVE_SOURCE_SHA',
                      'NATIVE_WORKFLOW_SHA', 'SOURCE_EVENT', 'RUNNER_TEMP')
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              fail('missing required environment values: ' + ', '.join(missing))

          repo = os.environ['GITHUB_REPOSITORY']
          target_branch = os.environ['NATIVE_SOURCE_BRANCH']
          target_shas = {os.environ['NATIVE_SOURCE_SHA'], os.environ['NATIVE_WORKFLOW_SHA']}
          event = os.environ['SOURCE_EVENT']
          bridge_path = os.path.join(os.environ.get('GITHUB_WORKSPACE', '.'),
                                     'ios/App/Sources/Native/GsNative.swift')
          try:
              requires_stream_api = 'gs_mobile_chat_stream' in open(bridge_path, encoding='utf-8').read()
          except OSError:
              requires_stream_api = False

          started = time.monotonic()
          deadline = started + 50 * 60
          fallback_after = 180
          announced_wait = False

          def api(path):
              last_error = None
              for attempt in range(3):
                  try:
                      result = subprocess.run(
                          ['gh', 'api', f'repos/{repo}/{path}'],
                          check=False, capture_output=True, text=True, timeout=60)
                      if result.returncode != 0:
                          detail = (result.stderr or result.stdout).strip()
                          raise RuntimeError(f'gh api exited {result.returncode}: {detail}')
                      return json.loads(result.stdout)
                  except Exception as exc:
                      last_error = f'{type(exc).__name__}: {exc}'
                      if attempt < 2:
                          time.sleep(2)
              fail(f'{path}: {last_error}')

          def artifact_from(run):
              if run.get('status') in ('queued', 'pending'):
                  return None, 'pending'
              jobs = api(f"actions/runs/{run['id']}/jobs?per_page=100").get('jobs', [])
              producer = next((j for j in jobs if j.get('name') == 'xcframework'), None)
              if producer is None or producer.get('status') != 'completed':
                  return None, 'pending' if run.get('status') != 'completed' else 'failed'
              if producer.get('conclusion') != 'success':
                  return None, 'failed'
              artifacts = api(f"actions/runs/{run['id']}/artifacts?per_page=100").get('artifacts', [])
              artifact = next((a for a in artifacts
                               if a.get('name') == 'GsFfi.xcframework' and not a.get('expired')), None)
              if artifact:
                  return artifact, 'success'
              return None, 'pending' if run.get('status') != 'completed' else 'failed'

          def native_sources_unchanged(run):
              source_sha = run.get('head_sha')
              target_sha = os.environ['NATIVE_SOURCE_SHA']
              if not source_sha or not target_sha:
                  return False
              if source_sha == target_sha:
                  return True
              comparison = api(f'compare/{source_sha}...{target_sha}')
              if comparison.get('status') not in ('ahead', 'identical'):
                  return False
              files = comparison.get('files', [])
              # The compare API truncates very large file lists. Never call a
              # truncated diff "compatible" by accident.
              if len(files) >= 300:
                  return False
              for changed in files:
                  path = changed.get('filename', '')
                  if (path.startswith(('native/', '.cargo/', '.github/scripts/'))
                          or path == '.github/workflows/ios-native.yml'):
                      return False
              return True

          def emit(run, artifact):
              selection_path = os.path.join(os.environ['RUNNER_TEMP'], 'gs-ffi-xcframework.selection')
              with open(selection_path, 'w', encoding='ascii') as selected:
                  selected.write(f"{run['id']} {artifact['id']}\n")
              print(f"Selected GsFfi artifact {artifact['id']} from ios-native run {run['id']}",
                    file=sys.stderr)
              raise SystemExit(0)

          while True:
              runs = api('actions/workflows/ios-native.yml/runs?per_page=100').get('workflow_runs', [])
              same_repo = [r for r in runs
                           if (r.get('head_repository') or {}).get('full_name') == repo]
              exact = [r for r in same_repo if r.get('head_sha') in target_shas]
              pending = False

              if exact:
                  failures = []
                  for run in sorted(exact, key=lambda r: r.get('created_at', ''), reverse=True):
                      artifact, state = artifact_from(run)
                      if state == 'success':
                          emit(run, artifact)
                      if state == 'pending':
                          pending = True
                      else:
                          failures.append(run)
                  if pending:
                      # A prior PR artifact is safe to reuse only when every
                      # native build input is byte-for-byte unchanged since its
                      # source commit. This avoids rebuilding the XCFramework
                      # for an iOS-workflow-only follow-up while never masking a
                      # changed C/Rust ABI or implementation.
                      prior = sorted(
                          (r for r in same_repo if r.get('head_branch') == target_branch
                           and r.get('head_sha') not in target_shas
                           and r.get('status') in ('in_progress', 'completed')),
                          key=lambda r: r.get('created_at', ''), reverse=True)
                      for run in prior:
                          artifact, state = artifact_from(run)
                          if state == 'success' and native_sources_unchanged(run):
                              emit(run, artifact)
                  if not pending:
                      details = ', '.join(f"run {r['id']}: {r.get('conclusion') or 'no producer artifact'}"
                                          for r in failures)
                      fail(f'ios-native xcframework producer for {target_branch}@{os.environ["NATIVE_SOURCE_SHA"]} '
                           f'did not succeed ({details})')
              else:
                  elapsed = time.monotonic() - started
                  branch_runs = sorted(
                      (r for r in same_repo if r.get('head_branch') == target_branch
                       and r.get('status') in ('in_progress', 'completed')),
                      key=lambda r: r.get('created_at', ''), reverse=True)

                  # Pull requests changing iOS/native sources start an exact-SHA
                  # producer. Give its run time to appear before considering a
                  # compatible prior artifact. When the Swift bridge needs the
                  # new stream API, never fall back to another branch's binary.
                  if event in ('pull_request', 'push') and elapsed < fallback_after:
                      pending = True
                  else:
                      candidates = list(branch_runs)
                      if not requires_stream_api or event == 'workflow_dispatch':
                          candidates += [r for r in sorted(
                              (r for r in same_repo if r not in branch_runs
                               and r.get('status') in ('in_progress', 'completed')),
                              key=lambda r: r.get('created_at', ''), reverse=True)]
                      for run in candidates:
                          artifact, state = artifact_from(run)
                          if state == 'success':
                              if requires_stream_api and not native_sources_unchanged(run):
                                  continue
                              emit(run, artifact)

                      if requires_stream_api and event in ('pull_request', 'push'):
                          # A source-compatible artifact may be produced by an
                          # older commit on this same branch. If none exists,
                          # keep waiting for the exact producer instead of
                          # accepting a stale main/native-runtime archive.
                          pending = True
                      elif elapsed < fallback_after:
                          pending = True
                      else:
                          fail('No unexpired GsFfi.xcframework from a successful ios-native producer job')

              if time.monotonic() >= deadline:
                  fail(f'Timed out waiting for a source-compatible ios-native xcframework for '
                       f'{target_branch}@{os.environ["NATIVE_SOURCE_SHA"]}')
              if not announced_wait:
                  print(f'Waiting for ios-native xcframework for {target_branch}@{os.environ["NATIVE_SOURCE_SHA"]}',
                        file=sys.stderr)
                  announced_wait = True
              time.sleep(30)
          PYFRAMEWORK
          read -r RUN_ID ART < "$SELECTION_FILE"
          test -n "$RUN_ID" && test -n "$ART"
          echo "Verified native producer run: $RUN_ID"
          echo "artifact id: $ART"
          XF="$PROJECT_DIR/Frameworks/GsFfi.xcframework"
          rm -rf "$XF"
          mkdir -p "$XF"
          # The artifact zip's ROOT IS the xcframework's contents (Info.plist +
          # slice dirs) -- the same layout ios-native's own download step
          # extracts into this exact path.
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ART/zip" -o /tmp/xff.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/xff.zip').extractall('$XF')"
          test -f "$XF/Info.plist" || {
            echo "::error::the artifact zip did not yield GsFfi.xcframework/Info.plist. What came out:"
            find "$XF" -maxdepth 2 | sed -n '1,20p'
            exit 1
          }
          # Swift imports the C module from each XCFramework slice. Assert that
          # the staged artifact declares every symbol this source bridge calls;
          # otherwise Xcode reports a misleading "cannot find ... in scope".
          if grep -q 'gs_mobile_chat_stream' "$PROJECT_DIR/App/Sources/Native/GsNative.swift"; then
            HEADER_COUNT=0
            while IFS= read -r MOBILE_HEADER; do
              HEADER_COUNT=$((HEADER_COUNT + 1))
              if ! grep -Eq 'gs_mobile_chat_stream[[:space:]]*\(' "$MOBILE_HEADER"; then
                echo "::error::stale GsFfi header omits gs_mobile_chat_stream: $MOBILE_HEADER"
                exit 1
              fi
            done < <(find "$XF" -type f -name gs_mobile.h -print)
            if [ "$HEADER_COUNT" -lt 2 ]; then
              echo "::error::expected gs_mobile.h in both XCFramework slices; found $HEADER_COUNT"
              exit 1
            fi
            echo "Verified gs_mobile_chat_stream in $HEADER_COUNT XCFramework slice headers"
          fi
          # BOTH SLICES, asserted the way ios-native asserts them: the plist's
          # LibraryIdentifier names are the truth, and a simulator-only or
          # device-only framework fails later with a dyld error that reads
          # like a broken build instead of a missing slice.
          # plutil -p, NOT raw grep: the Info.plist inside the artifact is a
          # BINARY plist, and grep over its bytes matched nothing (raw: run
          # 37308093580, "no ios-arm64-simulator slice" immediately after a
          # successful download and extract).
          plutil -p "$XF/Info.plist" > /tmp/xff-plist.txt || {
            echo "::error::could not read the fetched Info.plist"
            exit 1
          }
          cat /tmp/xff-plist.txt
          # THE SLICE NAMES INCLUDE EVERY ARCHITECTURE: the simulator slice is
          # a fat arm64+x86_64 build whose LibraryIdentifier is
          # "ios-arm64_x86_64-simulator" (raw: run 37308423838 -- the literal
          # "ios-arm64-simulator" matched nothing because of the _x86_64). So
          # match on what the identifiers are actually made of: a slice whose
          # name ends in -simulator, and the bare device identifier ios-arm64.
          grep -q -- '-simulator"' /tmp/xff-plist.txt || { echo "::error::no simulator slice in the fetched framework"; exit 1; }
          grep -q '"ios-arm64"' /tmp/xff-plist.txt || { echo "::error::no ios-arm64 device slice in the fetched framework"; exit 1; }
          echo "staged: $(du -sh "$XF" | cut -f1)"

      - name: Resolve available iPhone simulator destination
        run: |
          xcrun simctl list devices available
          # simctl device lines end with a trailing space: "  iPhone 16 Pro (UUID) (Shutdown) "
          # — the regex must tolerate it (fixed after run #1 failed exactly here).
          # NO `head` IN A PIPELINE. The original ended in
          #
          #     | head -1 | xargs)
          #
          # and `head -1` exits on the first match, closing the pipe; `sed` takes
          # SIGPIPE and exits 141, and under `set -euo pipefail` the step dies
          # there with nothing on stdout. `read` cannot be signalled, so the first
          # match is taken with a loop and then the variable is trimmed in bash.
          NAME=""
          while IFS= read -r _CAND; do
            [ -n "$_CAND" ] || continue
            NAME="$(printf '%s' "$_CAND" | xargs)"
            break
          done < <(xcrun simctl list devices available 2>/dev/null \
                   | sed -n 's/^[[:space:]]*\(iPhone[^()]*\) ([^)]*) ([^)]*)[[:space:]]*$/\1/p')
          if [ -z "$NAME" ]; then
            echo "::error::No available iPhone simulator found on runner image"
            exit 1
          fi
          DEST="platform=iOS Simulator,name=${NAME},OS=latest"
          echo "IOS_DESTINATION=$DEST" >> "$GITHUB_ENV"
          echo "Using destination: $DEST"

      - name: Build (real Xcode compilation of the iOS target)
        run: |
          set -o pipefail
          mkdir -p ios/build
          if ! xcodebuild build \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee ios/build/xcodebuild-build.log; then
            { grep -E 'error:' ios/build/xcodebuild-build.log || true; } | sed -n '1,35p' | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 65
          fi

      - name: Early transport, calculator and inline React keyboard acceptance
        run: |
          set -o pipefail
          xcodebuild test \
            -parallel-testing-enabled NO \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -only-testing:AppTests/CalcHonestyTests/testNativeJSONDelimiterRecoveryPreservesActualSourceBytesAndQuotedPunctuation \
            -only-testing:AppTests/ChatResponseHonestyTests \
            -only-testing:AppTests/AttachmentLogicTests \
            -only-testing:AppTests/AttachmentPreviewTests \
            -only-testing:AppTests/CalculatorSourceHonestyTests \
            -only-testing:GsChatUITests/PlatformRuntimeUITests/testGeneratedReactCodeRunsActualTaskControlsAndPersistsAcrossRelaunch \
            -resultBundlePath ios/build/GSApp-react-keyboard.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ios/build/xcodebuild-genui-test.log
          cp ios/build/xcodebuild-genui-test.log ios/build/xcodebuild-react-keyboard-test.log
          python3 - <<'PY'
          from pathlib import Path
          log = Path('ios/build/xcodebuild-react-keyboard-test.log').read_text(errors='replace')
          receipt = [line for line in log.splitlines() if 'Test Case' in line
                     and 'PlatformRuntimeUITests testGeneratedReactCodeRunsActualTaskControlsAndPersistsAcrossRelaunch]' in line
                     and 'passed (' in line]
          if len(receipt) != 1:
              raise SystemExit('Actual inline React test must execute and pass exactly once; zero/skipped tests do not count')
          print('::notice::Actual inline React keyboard/CRUD/storage receipt: ' + receipt[0].replace('%', '%25'))
          source_receipt = [line for line in log.splitlines() if 'Test Case' in line
                            and 'CalcHonestyTests testNativeJSONDelimiterRecoveryPreservesActualSourceBytesAndQuotedPunctuation]' in line
                            and 'passed (' in line]
          if len(source_receipt) != 1:
              raise SystemExit('The actual native JSON source-byte test must execute and pass exactly once')
          print('::notice::Actual native JSON source-byte receipt: ' + source_receipt[0].replace('%', '%25'))
          PY

      # The complete suite below includes every CalcHonesty, six-section
      # render and PlatformRuntime test. Do not run the same seeded UI suite
      # first: its persisted chats invalidate clean-install Home/history and
      # displace menu recents. The early real React test still independently
      # requires actual relaunch persistence, and all named full-suite gates
      # remain mandatory. No booted-simulator-name assumption or test skips.
      - name: Test (XCTest unit tests on iOS simulator)
        run: |
          set -o pipefail
          # HomeRenderTests writes to /tmp/gs-home-renders because a step-level
          # env var never reaches the simulator-launched host. Clear it first:
          # otherwise a capture left behind by an earlier run would satisfy the
          # probe below even if this run's harness produced nothing at all.
          rm -rf /tmp/gs-home-renders
          # A FIXED path, because the menu-chrome step later exports this
          # bundle's attachments: a timestamped name would make each step guess
          # at the other's output.
          RESULT_BUNDLE="ios/build/GSApp-tests.xcresult"
          rm -rf "$RESULT_BUNDLE"
          xcodebuild test \
            -parallel-testing-enabled NO \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ios/build/xcodebuild-test.log

      - name: Independently verify actual XCTest source archive bytes
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/check_response_archive.py --self-test
          DIR=ios/build/source-archive
          mkdir -p "$DIR"
          if ! xcrun xcresulttool export attachments \
            --path ios/build/GSApp-tests.xcresult --output-path "$DIR/raw" > "$DIR/export.log" 2>&1; then
            python3 -c 'from pathlib import Path; print("::error::Native source attachment export failed: " + Path("ios/build/source-archive/export.log").read_text().replace("%", "%25").replace("\n", "%0A"))'
            exit 1
          fi
          python3 -u scripts/check_response_archive.py "$DIR/raw" 2>&1 | tee "$DIR/verification.log"

      - name: Preserve native source archive byte evidence
        if: always()
        id: source-archive-upload-primary
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-source-archive-${{ github.run_id }}
          path: ios/build/source-archive
          if-no-files-found: error

      - name: Retry native source archive evidence upload after transient failure
        if: always() && steps.source-archive-upload-primary.outcome == 'failure'
        id: source-archive-upload-retry
        uses: actions/upload-artifact@v4
        with:
          name: ios-source-archive-${{ github.run_id }}
          path: ios/build/source-archive
          if-no-files-found: error
          overwrite: true

      - name: Require native source archive byte evidence to persist
        if: always()
        env:
          PRIMARY_OUTCOME: ${{ steps.source-archive-upload-primary.outcome }}
          RETRY_OUTCOME: ${{ steps.source-archive-upload-retry.outcome }}
        run: |
          if [[ "$PRIMARY_OUTCOME" != "success" && "$RETRY_OUTCOME" != "success" ]]; then
            echo "::error::Native source archive evidence upload failed on both attempts (primary=$PRIMARY_OUTCOME, retry=$RETRY_OUTCOME)"
            exit 1
          fi

      - name: Select actual complete-suite diagnostics, not stale early output
        if: always()
        run: |
          if [ -s ios/build/xcodebuild-test.log ]; then
            cp ios/build/xcodebuild-test.log ios/build/xcodebuild-genui-test.log
          else
            echo "No complete-suite log exists; preserve the original early-test evidence, not an inferred full-suite result."
          fi

      - name: Require platform runtime tests to actually pass
        run: |
          python3 - <<'PYRUNTIME'
          from pathlib import Path
          import re
          log = Path('ios/build/xcodebuild-test.log').read_text(errors='replace')
          required = [
              ('CalculatorSourceHonestyTests', 'testActualFencedCalculatorAcceptsSourceAliasesAndScientificInitialValuesWithoutInventedDefaults'),
              ('CalculatorSourceHonestyTests', 'testActualCalculatorFormatterDoesNotInventDollarsAndKeepsExplicitSourceUnits'),
              ('CalculatorSourceHonestyTests', 'testProductionCalculatorExpressionsSupportScientificNumbersAndRejectInvalidArityOrRecursiveSource'),
              ('PlatformRuntimeUITests', 'testGeneratedCalculatorKeepsNinthTenthInputsSixthChoiceAndSeventhOutputUsable'),
              ('ChatResponseHonestyTests', 'testUnusualPromptFailureNeverBecomesKeywordSelectedCannedAnswer'),
              ('ChatResponseHonestyTests', 'testCanonicalDoneReplacesDraftAndKeepsRealServerIdentityBeforeFinalization'),
              ('ChatResponseHonestyTests', 'testInterruptedReplyPreservesOnlyActualTextAndDoesNotPromiseAutomaticContinuation'),
              ('ChatResponseHonestyTests', 'testEmptyCompletionIsAnErrorNotASuccessfulBlankAnswer'),
              ('ChatResponseHonestyTests', 'testFailedFirstCreationRetriesCreationAndPersistsOriginalUserOnceWithoutFakeIDs'),
              ('ChatResponseHonestyTests', 'testBatchedAnswerRevealsProgressivelyAndModeReachesTheActualViewModel'),
              ('ChatResponseHonestyTests', 'testStopDuringBurstRevealPreservesEveryReceivedCharacter'),
              ('ChatResponseHonestyTests', 'testStoppedRevealCannotFinalizeTheImmediatelyFollowingTurn'),
              ('AttachmentLogicTests', 'testAllowlistMatchesBackend'),
              ('AttachmentLogicTests', 'testKindForMime'),
              ('AttachmentPreviewTests', 'testPhotoPDFAndTextProduceBoundedPreviewsFromActualBytes'),
              ('AttachmentPreviewTests', 'testUnreadableFileCannotBecomeInventedImagePreview'),
              ('PlatformRuntimeUITests', 'testConversationActionsTapOpensRealOptionsWithoutLeavingChat'),
              ('CalcHonestyTests', 'testActualMessagePreviewIdentitySurvivesRehydrationWithoutInventingServerIDs'),
              ('CalcHonestyTests', 'testActualSQLiteHistoryAndOlderPagesKeepDurablePreviewIdentity'),
              ('CalcHonestyTests', 'testActualSQLiteLegacyImportKeepsActualRowsAndCannotReviveClearedHistoryOnReopen'),
              ('CalcHonestyTests', 'testNativeJSONDelimiterRecoveryPreservesActualSourceBytesAndQuotedPunctuation'),
              ('CalcHonestyTests', 'testActualSQLiteDelayedBootstrapKeepsNewerRenamePinArchiveAndSourceBytes'),
              ('CalcHonestyTests', 'testActualSQLiteDelayedBootstrapCannotResurrectDeletedConversationOrMessages'),
              ('CalcHonestyTests', 'testActualSQLiteDelayedBootstrapCannotUndoClearHistoryOrDropPostClearAnswer'),
              ('CalcHonestyTests', 'testActualSQLiteDelayedBootstrapCannotRestoreEditedAwayMessageTail'),
              ('CalcHonestyTests', 'testActualSQLiteDelayedBootstrapCannotRestoreRetentionPurgedHistory'),
              ('PlatformRuntimeUITests', 'testOrdinaryMarkdownTaskControlsPreserveRealDetailsAndCompletion'),
              ('PlatformRuntimeUITests', 'testGeneratedReactCodeRunsActualTaskControlsAndPersistsAcrossRelaunch'),
              ('CalcHonestyTests', 'testGeneratedReactTsxUsesActualWebKitTasksPersistenceAndResponseIsolation'),
              ('PlatformRuntimeUITests', 'testGeneratedChecklistEditsDeletesAddsAndKeepsActualTaskCompletion'),
              ('NexlyChatRenderTests', 'testSixSuppliedResponseSectionReferencesRenderThroughActualChat'),
              ('PlatformRuntimeUITests', 'testGeneratedTimerUsesActualSecondsPausesResetsAndNeverUsesPrices'),
              ('PlatformRuntimeUITests', 'testGeneratedBookingSavesOnlyActualLocalSelectionWithoutReservation'),
              ('CalcHonestyTests', 'testWholeJSONPreservesMachineStringsBeforeMarkdownAndStreaming'),
              ('CalcHonestyTests', 'testChecklistRefusesMalformedAndOversizedSourceWithoutKindHealing'),
              ('CalcHonestyTests', 'testInvalidWizardCannotBypassIOSWidgetValidation'),
              ('PlatformRuntimeUITests', 'testContextualEditOpensActualCodeAndExportOpensSystemDocumentPicker'),
              ('PlatformRuntimeUITests', 'testContextualReportShowsActualDataAndSharePresentsSystemActivitySheet'),
              ('CalcHonestyTests', 'testContextualCodeActionsRetainActualDraftsAndStayResponseScoped'),
              ('CalcHonestyTests', 'testSourceArchivePreservesRealBytesAndKnownCRCWithoutInventingAProject'),
              ('CalcHonestyTests', 'testSharedResponseReportIncludesActualTableAndWidgetData'),
              ('PlatformRuntimeUITests', 'testGeneratedCodeCopyEditRunAndInvalidDraftReset'),
              ('PlatformRuntimeUITests', 'testGeneratedTerminalUsesRealFilesWorkerAndUnsupportedRefusal'),
              ('CalcHonestyTests', 'testCodeDisplayAndEditorPreserveActualSource'),
              ('CalcHonestyTests', 'testGeneratedJavaScriptWorkerPreservesUnicodeStopsLoopsAndRejectsNetwork'),
              ('CalcHonestyTests', 'testWorkerCSPPreventsActualHTTPAndPolicyOnlyCounterfactualCanFetch'),
              ('CalcHonestyTests', 'testNativeFencesPreserveEverySourceSeparatorAndBlankLine'),
              ('CalcHonestyTests', 'testNativeStreamingMatchesFullParseAtEveryFencePrefix'),
              ('PlatformRuntimeUITests', 'testGeneratedChartRetainsAllPointsSelectsSeriesAndRejectsSignedPie'),
              ('PlatformRuntimeUITests', 'testGeneratedScatterUsesActualPairedAxesAndNativeObservationInspection'),
              ('CalcHonestyTests', 'testNativeChartSelectionFollowsActualCoordinatesAndPreservesSpecializedSemantics'),
              ('CalcHonestyTests', 'testGeneratedHtmlExecutesAndCleansDynamicEmojiInProductionWebView'),
              ('CalcHonestyTests', 'testSignedChartDomainPreservesZeroNegativeAndAllObservations'),
              ('PlatformRuntimeUITests', 'testBackgroundNoticeIsDeliveredAndDisabledKindsAreNot'),
              ('PlatformRuntimeUITests', 'testGeneratedCalculatorUsesActualTypedNumbersAndNoEmoji'),
              ('PlatformRuntimeUITests', 'testGeneratedTableAllDisplaysEveryActualRow'),
              ('PlatformRuntimeUITests', 'testLongPressPinSurvivesBackgroundAndRelaunch'),
              ('PlatformHapticRuntimeTests', 'testUIKitDispatchAndDisabledGate'),
          ]
          missing = []
          for suite, test in required:
              lines = [line for line in log.splitlines() if suite in line and test in line]
              if not any(re.search(r"\bpassed\b", line) for line in lines):
                  missing.append(f'{suite}.{test}')
          if missing:
              raise SystemExit('Missing runtime passes (skips do not count): ' + ', '.join(missing))
          print('All required iOS platform runtime tests executed and passed')
          PYRUNTIME

      - name: Review actual Files before the real Cancel touch
        if: failure()
        run: python3 scripts/publish_native_ui_pixels.py ios/build/xcodebuild-genui-test.log FILES

      - name: Review actual Files after an unacknowledged Cancel touch
        if: failure()
        run: python3 scripts/publish_native_ui_pixels.py ios/build/xcodebuild-genui-test.log EXPORT

      - name: Review actual React native UI failure pixels
        if: failure()
        run: python3 scripts/publish_native_ui_pixels.py ios/build/xcodebuild-genui-test.log REACT

      - name: Publish actual React keyboard layout measurements
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ios/build/xcodebuild-genui-test.log')
          if path.exists():
              actual = [line for line in path.read_text(errors='replace').splitlines()
                        if 'GS_REACT_KEYBOARD_LAYOUT:' in line or 'GS_REACT_FOCUS_CHECK:' in line]
              for line in actual[-8:]:
                  print('::notice::' + line[:3500].replace('%', '%25').replace('\r', '%0D'))
          PY

      - name: Review actual system Share failure pixels
        if: failure()
        run: python3 scripts/publish_native_ui_pixels.py ios/build/xcodebuild-genui-test.log SHARE

      - name: Publish actual Files presentation and cancellation diagnostics
        if: failure()
        run: |
          python3 - <<'PYFILES'
          import re
          from pathlib import Path
          path = Path('ios/build/xcodebuild-genui-test.log')
          if not path.exists(): raise SystemExit(0)
          lines = path.read_text(errors='replace').splitlines()
          chunks = {}
          for line in lines:
              match = re.search(r'GS_PRESENTATION_EXPORT_(\d+): (.*)', line)
              if match: chunks[int(match.group(1))] = match.group(2)
              if 'GS_FILES_CANCEL_FRAME:' in line:
                  print('::notice::' + line[-3000:].replace('%', '%25'))
          hierarchy = ''.join(chunks[key] for key in sorted(chunks))
          # This dedicated step owns its annotation budget. Unit-pass notices
          # in a different step must never hide the actual system UI evidence.
          if len(hierarchy) > 28000:
              hierarchy = ' | '.join(part for part in hierarchy.split(' | ') if any(word in part for word in ['Window,', 'NavigationBar,', 'Button,', "label: 'Cancel'", "label: 'Save'", "label: 'Browse'", 'DocumentPicker', 'frame:']))
          for start in range(0, min(len(hierarchy), 28000), 3500):
              print('::notice::GS_FILES_HIERARCHY_' + str(start) + ': ' + hierarchy[start:start+3500].replace('%', '%25'))
          PYFILES

      - name: Publish XCTest failure diagnostics as annotations
        if: failure()
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          for log in sorted(Path('ios/build').glob('xcodebuild*test.log')):
              lines = log.read_text(errors='replace').splitlines()
              failures = [line for line in lines if 'Ignoring failure to get hierarchy' not in line and any(word in line.lower() for word in ['error:', 'testing failed:', '** test failed **', 'timed out', 'could not'])]
              failures += [line for line in lines if 'Test Case' in line and 'failed' in line]
              for line in failures[-8:]:
                  print('::error::' + line[:1800].replace('%', '%25').replace('\r', '%0D'))
              passes = [line for line in lines if 'Test Case' in line and 'passed' in line and ('PlatformRuntimeUITests' in line or 'CalcHonestyTests' in line)]
              for start in range(0, len(passes), 4):
                  print('::notice::Actual executed native passes: ' + ' | '.join(passes[start:start + 4]).replace('%', '%25'))
              import re
              for label in ['EXPORT', 'SHARE']:
                  chunks = {}
                  for line in lines:
                      match = re.search(r'GS_PRESENTATION_' + label + r'_(\d+): (.*)', line)
                      if match: chunks[int(match.group(1))] = match.group(2)
                  hierarchy = ''.join(chunks[key] for key in sorted(chunks))
                  native = [part.strip() for part in hierarchy.split(' | ') if any(word in part for word in ["Button,", "NavigationBar,", "label: 'Cancel'", "label: 'Copy'", "label: 'Save'", "label: 'On My iPhone", "label: 'Browse'"])]
                  if native: print('::notice::Actual native ' + label + ' controls: ' + ' | '.join(native)[-3200:].replace('%', '%25'))
              for line in lines:
                  if any(name in line for name in ['testWorkerCSPPreventsActualHTTPAndPolicyOnlyCounterfactualCanFetch', 'testSourceArchivePreservesRealBytesAndKnownCRCWithoutInventingAProject']) and 'passed' in line:
                      print('::notice::Actual native unit proof: ' + line.replace('%', '%25'))
              for archive_log in [Path('ios/build/source-archive/export.log'), Path('ios/build/source-archive/verification.log')]:
                  if archive_log.exists():
                      print('::notice::Native archive diagnostic: ' + archive_log.read_text(errors='replace')[-8000:].replace('%', '%25').replace('\n', '%0A'))
          PYTEST
          for RESULT in ios/build/GSApp-react-keyboard.xcresult ios/build/GSApp-genui.xcresult ios/build/GSApp-tests.xcresult; do
            [ -d "$RESULT" ] || continue
            # test-results summary emits JSON by default on current Xcode.
            xcrun xcresulttool get test-results summary --path "$RESULT" > "$RESULT-summary.json" || true
          done
          python3 - <<'PYRESULT'
          import json
          from pathlib import Path
          for p in Path('ios/build').glob('*.xcresult-summary.json'):
              try:
                  obj = json.loads(p.read_text())
                  for item in obj.get('testFailures', [])[:25]:
                      print('::error::' + json.dumps(item)[:3000].replace('%', '%25'))
              except (ValueError, OSError) as error:
                  print('::warning::Could not read XCTest summary: ' + str(error))
          PYRESULT

      - name: Collect the iOS renders into the workspace
        run: |
          set -euo pipefail
          # iOS had no pixel evidence at all, which is why three of Wave 0's
          # four criticals — a card's copy rendered into the wrong corner, a
          # page that silently opted out of the app's font-scale contract, and a
          # resume card pinned to the oldest thread — shipped green. This is the
          # gate that would have caught them, and it is the same instrument
          # Android is held to, so the two platforms cannot drift apart quietly.
          #
          # HomeRenderTests writes to /tmp/gs-home-renders: an env var set on
          # this step never reaches the simulator-launched test host, so the
          # shared /tmp is the channel. Collect it into the workspace before
          # asserting, so a missing render is a build failure and not a shrug.
          SRC=/tmp/gs-home-renders
          DIR=ios/build/home-renders
          mkdir -p "$DIR"
          if [ -d "$SRC" ]; then cp "$SRC"/home-ios-*.png "$DIR/" 2>/dev/null || true; fi
          # The drawer writes its own directory, so Home's glob above can never
          # pick a drawer frame up and mis-register a Home probe on it.
          DSRC=/tmp/gs-drawer-renders
          if [ -d "$DSRC" ]; then cp "$DSRC"/drawer-ios-*.png "$DIR/" 2>/dev/null || true; fi
          for n in drawer-ios-393x852 drawer-ios-393x852-dark drawer-ios-360x780 \
                   drawer-ios-500chats-393x852; do
            test -s "$DIR/$n.png" \
              || { echo "::error::$n.png missing — the drawer harness did not produce it"; exit 1; }
          done
          for w in 393x852 411x914 360x780; do
            test -s "$DIR/home-ios-$w.png" \
              || { echo "::error::home-ios-$w.png missing — the render harness did not produce it"; exit 1; }
          done

      - name: Upload the iOS Home renders
        # BEFORE the measurement, for the same reason android-app.yml now does
        # it: the step that fails is the one whose pixels are needed, and an
        # upload ordered after a blocking gate is skipped by exactly the reds
        # that have to be read.
        uses: actions/upload-artifact@v4
        with:
          name: home-renders-ios
          path: ios/build/home-renders/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Collect the Nexly chat response render
        if: always()
        run: |
          set -euo pipefail
          # NexlyChatRenderTests uses the same simulator-visible /tmp channel as
          # HomeRenderTests. A missing PNG is a build failure, not a shrug.
          SRC=/tmp/gs-nexly-renders
          DIR=ios/build/nexly-renders
          mkdir -p "$DIR"
          if [ -d "$SRC" ]; then cp "$SRC"/nexly-chat-ios-*.png "$DIR/" 2>/dev/null || true; fi
          if [ -d "$SRC" ]; then cp "$SRC"/genui-reference-ios-*.png "$DIR/" 2>/dev/null || true; fi
          if [ -d "$SRC" ]; then cp "$SRC"/genui-reference-ios-*-scroll.json "$DIR/" 2>/dev/null || true; fi
          for section in 01-dashboard 02-structured-launch 03-react-code 04-citations 05-data-grid 06-interactive-charts; do
            test -s "$DIR/genui-reference-ios-$section-393x852.png" \
              || { echo "::error::Missing actual iOS reference frame: $section"; exit 1; }
          done
          for w in 393x852 411x914 360x780; do
            test -s "$DIR/nexly-chat-ios-$w.png" \
              || { echo "::error::nexly-chat-ios-$w.png missing — the chat render harness did not produce it"; exit 1; }
          done
          test -s "$DIR/nexly-chat-ios-thinking-393x852.png" \
            || { echo "::error::the adaptive-thinking render was not produced"; exit 1; }
          for w in 411x914 393x852; do
            test -s "$DIR/nexly-chat-ios-full-$w.png" \
              || { echo "::error::nexly-chat-ios-full-$w.png missing — the full-chat render did not run"; exit 1; }
            test -s "$DIR/nexly-chat-ios-full-prose-$w.png" \
              || { echo "::error::nexly-chat-ios-full-prose-$w.png missing — the prose render did not run"; exit 1; }
          done

      - name: Collect the Explore AI render
        if: always()
        run: |
          set -euo pipefail
          # ExploreRenderTests shares the /tmp channel; a missing PNG is a
          # build failure, not a shrug. The 393x1400 capture is the
