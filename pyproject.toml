[project]
name = "gs-bench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "inspect-ai",
  "datasets",
  "statsmodels",
  "scipy",
  "numpy",
  "evalci",
  "python-dotenv",
  "httpx",
]

[project.scripts]
gs-bench = "cli.main:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cli", "stats", "runners", "benchmarks"]
