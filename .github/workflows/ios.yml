      - name: Collect the reference-page renders
        if: always()
        run: |
          set -euo pipefail
          # ReferenceSheetsRenderTests shares the same /tmp channel. These are
          # the ten pages under docs/reference/pending; the inbox is seeded
          # test-only, exactly as Android's fixture seeds it, and cleared by the
