name: Android release build

# Builds the phone APK on GitHub's infra — the sandbox keeps losing its
# toolchain and fights OOM on every release. The committed gs-live.keystore
# gives CI builds the SAME signing cert as sandbox builds (over-install safe),
# and the BASE_URL gate below proves the APK carries the real public origin
# (the 10.0.2.2 emulator-loopback regression is exactly what this guards).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests + assemble
        working-directory: android
        run: gradle --no-build-cache --max-workers=2 testDebugUnitTest assembleDebug

      - name: Gates (badging, cert, BASE_URL)
        working-directory: android
        run: |
          SDK_BUILDTOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APK=app/build/outputs/apk/debug/app-debug.apk
          # `grep -q` IN A PIPELINE, IN A `|| exit 1` GATE, IS A LANDMINE.
          #
          # The originals were:
          #
          #     aapt2 dump badging "$APK" | grep -q "package: name='com.grapsee.gsai'" || exit 1
          #     apksigner verify --print-certs "$APK" | grep -qi "<sha256>" || exit 1
          #
          # `grep -q` exits on the FIRST match, which closes the pipe. `aapt2` and
          # `apksigner` are still writing, take SIGPIPE, and exit 141 -- and
          # `pipefail` makes the PIPELINE's status the last non-zero one, so it is
          # 141 rather than grep's 0. `|| exit 1` THEREFORE FIRES ON A
          # SUCCESSFUL MATCH.
          #
          # So these gates reject a good APK, and only when the match happens early
          # enough to win the race against the producer. Intermittent, and
          # indistinguishable from a real signing failure. Found by
          # .github/scripts/check_pipefail_traps.py, which this session had never
          # run against this workflow.
          #
          # Both tools' full output is captured first, so there is no live process
          # for grep to signal -- and the captures are printed, so a failure says
          # WHAT the APK actually was rather than only that a gate tripped.
          BADGING=$("$SDK_BUILDTOOLS/aapt2" dump badging "$APK" 2>&1 || true)
          printf '%s\n' "$BADGING" | sed -n '1,6p' | sed 's/^/  badging: /'
          if ! printf '%s\n' "$BADGING" | grep -q "package: name='com.grapsee.gsai'"; then
            echo "::error::APK does not declare com.grapsee.gsai. aapt2 said:"
            printf '%s\n' "$BADGING" | sed -n '1,20p' | sed 's/^/  /'
            exit 1
          fi
          CERTS=$("$SDK_BUILTOOLS/apksigner" verify --print-certs "$APK" 2>&1 || true)
          printf '%s\n' "$CERTS" | sed -n '1,6p' | sed 's/^/  certs: /'
          if ! printf '%s\n' "$CERTS" | grep -qi "b1ffd75dd410c84bd9467e418c419cd377d57569ae7ac5e26b778e6418b1a483"; then
            echo "::error::signing certificate is not b1ffd75dd410c84bd9467e418c419cd377d57569ae7ac5e26b778e6418b1a483. apksigner said:"
            printf '%s\n' "$CERTS" | sed -n '1,20p' | sed 's/^/  /'
            exit 1
          fi
          unzip -p "$APK" 'classes*.dex' | grep -q "https://preview-chat-c945696f-6447-4dfa-b510-971d8b9eb5bf.space-z.ai" || { echo "FATAL: public origin missing from dex"; exit 1; }
          if unzip -p "$APK" 'classes*.dex' | grep -q "http://10.0.2.2:3000"; then echo "FATAL: emulator loopback leaked into build"; exit 1; fi
          echo "gates ok"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GS-AI-App.apk
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "CI build" 2>/dev/null || true
          gh release upload "$TAG" GS-AI-App.apk --clobber
          echo "uploaded GS-AI-App.apk for $TAG"
