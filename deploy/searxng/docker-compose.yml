# Self-hosted SearXNG — the free, no-API-key search backend.
#
#   cd deploy/searxng && docker compose up -d
#   # then, in the app's environment:
#   SEARXNG_URL=http://127.0.0.1:8888
#
# Bound to 127.0.0.1 on purpose: this is an internal dependency of the app, not
# a public search engine. Publishing it to 0.0.0.0 turns the box into an open
# proxy and gets the IP banned by the upstream engines within hours.
services:
  searxng:
    image: searxng/searxng:latest
    container_name: gsai-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
    # SearXNG drops privileges itself; keep the rest of the caps off.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
