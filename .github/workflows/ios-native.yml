name: ios-native

# Cross-compiles libgs_ffi.a for iOS device and simulator and assembles a real
# .xcframework containing both slices. Binaries are artifacts, never git.
#
# Like the Android build this is PORTABLE-ONLY: no ONNX Runtime, no llama.cpp, no
# Tesseract. None have drop-in arm64-ios prebuilts here, and the static library
# is meant to be small enough to ship inside an app.

on:
  workflow_dispatch:
  push:
    branches: [native-runtime]
    paths:
      - 'native/**'
      # ios/** WAS MISSING, and the omission is the same class of bug as a check
      # that cannot fail: this job builds the iOS app, links the device slice and
      # runs the app's XCTests, and none of that was re-run when the app or its
      # tests changed. Commit 434d35c -- an @MainActor fix to
      # ios/App/Tests/GsNativeTests.swift, which made the Swift compile succeed --
      # pushed green with NO run at all. The previous green would have had to be
      # believed.
      #
      # A workflow that verifies a directory it does not watch verifies it by
      # accident, and only as often as someone remembers to dispatch it.
      - 'ios/**'
      - '.github/workflows/ios-native.yml'
      - '.cargo/config.toml'

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

env:
  # THE ONE RUST TOOLCHAIN IN THE REPOSITORY, and it is a PIN for a reason.
  #
  # ios-native 37020835936, verbatim from the runner:
  #
  #   reader: .../toolchains/stable-aarch64-apple-darwin/.../llvm-nm
  #   rustc : rustc 1.98.1 (48a229cea 2026-09-01)
  #   llvm-nm: error: ...libgs_ffi.a(...rcgu.o): Not an int attribute
  #     (Producer: 'LLVM23.1.1-rust-1.99.0-stable' Reader: 'LLVM 22.1.8-rust-1.98.1-stable')
  #
  # The xcframework was WRITTEN by one toolchain and READ by another, and the
  # reader rejected the object format. `Not an int attribute` names the object.
  # It is not a property of the object; it is the reader being older than what it
  # reads. An unpinned `stable` is two independent resolutions of a moving word,
  # and this repository runs three of them -- one in ios-native, two in
  # android-native -- in jobs that do not share a runner.
  #
  # Which version is pinned matters less than the fact that ONE is pinned: with a
  # single toolchain the producer and the reader are the same LLVM by
  # construction, and the skew becomes impossible rather than merely unlikely.
  #
  # 1.98.1 is the version the runner actually resolved, so this is not a version
  # anyone has to take on trust.
  GS_RUST_TOOLCHAIN: '1.98.1'
  CARGO_TERM_COLOR: always
  GS_ALLOW_MISSING_ONNX: "1"
  # THE NUMBER IN THE LINK LINE, CHOSEN THIS TIME.
  #
  # Run 36730369437 came down to one undefined symbol:
  #
  #   Undefined symbols for architecture arm64:
  #   "___chkstk_darwin", referenced from llama_batch_allocr::init(...) in
  #   libllama.a[5](llama-batch.cpp.o)
  #
  # and the reason is in the invocation, not in the symbol:
  #
  #   "cc" ... -lSystem -lSystem -lc -lm -target arm64-apple-ios10.0.0
  #
  # iOS 10.0. __chkstk_darwin is the stack-probe helper libSystem exports for
  # apps built against iOS 12 and later; before that it was an inline helper, so
  # at a 10.0 deployment target the linker is being asked for a symbol that the
  # deployment target says cannot exist.
  #
  # 10.0 was nobody's decision -- it is rustc's built-in floor for
  # aarch64-apple-ios, and nothing here set it. rustc's own apple-ios docs:
  #
  #   The minimum supported version is iOS 10.0. This can be raised per-binary by
  #   changing the deployment target. `rustc` respects the common environment
  #   variables used by Xcode to do so, in this case IPHONEOS_DEPLOYMENT_TARGET.
  #
  # 15.0 rather than the 12.0 that would also work, because the archives were
  # configured with -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0. One number, both places,
  # so there is no version-skew question to answer later.
  IPHONEOS_DEPLOYMENT_TARGET: "15.0"

jobs:
  build:
    name: xcframework
    # NEEDS THE LLAMA PACKAGES. This job sets GS_LLAMA_PREBUILT for the
    # cargo build, which is what defines GS_LLAMA_HAVE_LLAMA and therefore
    # what makes gs_mobile_backend_available() able to return 1.
    needs: [llama-ios]
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # BEFORE ANYTHING EXPENSIVE, and before bash would happily accept the bug.
      #
      # Run 36728962757 lost this whole job to a syntax error wearing a flag's
      # clothes:
      #
      #   .../_temp/a65912d8-....sh: line 96: -DGGML_BLAS=OFF: command not found
      #
      # because a `#` comment sat directly under a backslash continuation. bash
      # read the line as a comment, dropped the backslash with it, ended the cmake
      # command early, and then tried to RUN the next flag. `bash -n` accepts that
      # file -- the truncated command is itself valid -- which is why it shipped
      # and why it needs its own check. Ten seconds here against a 25-minute
      # cross-compile.
      - name: No comment inside a backslash continuation
        run: python3 .github/scripts/check_continuation_comments.py

      # THE OTHER `bash -e` LANDMINE, AND IT HAS COST FOUR RUNS.
      #
      # GitHub runs a `run:` block as `bash -e {0}`. A pipeline whose consumer
      # exits early -- `head -N`, `grep -q`, `grep -mN`, `tail -n +N` -- closes the
      # pipe, the producer takes SIGPIPE and exits 141, and `pipefail` makes the
      # PIPELINE's status 141 rather than the consumer's 0. Two consequences,
      # both observed here:
      #
      #   * in a bare command, `-e` kills the step, and the only evidence is
      #       sed: stdout: Broken pipe
      #       ##[error]Process completed with exit code 1.
      #     which names neither the line nor the cause. That is how run
      #     36747684730 died with no `::error::` at all.
      #
      #   * inside an `if` CONDITION, where bash suspends `-e`, the step survives
      #     but the STATUS is still wrong -- a successful match reads as a
      #     failure. That made the symbol check non-deterministic: ten runs on one
      #     archive with all four symbols present reported a different set of
      #     "missing" symbols each time.
      #
      # Writing this check cost more than it should have, twice: the first version
      # took YAML TEXT while its caller passed it a parsed document, so it raised
      # on the first generator iteration and printed nothing -- and the review
      # pipeline I ran it through was `| grep`, so the exit status came from grep
      # and a crashed lint looked like a clean one. Hence the "lint its own exit
      # status" note in the script, and hence this step reading $? directly.
      #
      # Exit codes: 1 = a bare pipeline can kill a step (FAIL), 2 = notes only,
      # which are worth reading but are not build-breaking, 0 = clean. Anything
      # else means the lint itself broke, and that is treated as a failure.
      # THE APP'S DEPLOYMENT FLOOR IS A DIFFERENT NUMBER FROM THE LIBRARY'S.
      #
      # Run 36751766601 was the first run to reach the app build, and it failed:
      #
      #   AttachmentSheetView.swift:34:38: error:
      #     'PhotosPickerItem' is only available in iOS 16.0 or newer
      #   ** BUILD FAILED **
      #
      # because 2ccb3a7 set IPHONEOS_DEPLOYMENT_TARGET to 15.0 for the CARGO link's
      # __chkstk_darwin, in a project.yml line that had not existed before -- so
      # xcodebuild's own default of 16.0+ was silently replaced by 15.0 and the
      # app's own Swift stopped compiling. The library floor stays 15.0; the app
      # floor is 16.0; they are independent.
      #
      # This reads the floors the Swift source actually uses and fails if the
      # declared one is lower. A comment could not have prevented that, because a
      # number cannot be wrong about itself -- only a comparison can.
      - name: The app's deployment floor covers what the source needs
        run: python3 .github/scripts/check_ios_deployment_target.py

      - name: No pipeline that can kill its own step
        run: |
          set -uo pipefail
          RC=0
          python3 "$GITHUB_WORKSPACE/.github/scripts/check_pipefail_traps.py" || RC=$?
          case "$RC" in
            0) echo "gate: clean" ;;
            2) echo "gate: clean (notes above are not build-breaking)" ;;
            *) echo "::error::a bare pipeline ends in an early-exiting consumer (exit $RC)"
               echo "::error::or the lint itself failed, which is equally a stop."
               exit 1 ;;
          esac

      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "=== available Xcodes ==="
          ls -1d /Applications/Xcode*.app 2>/dev/null || echo "(none listed)"
          SELECTED=""
          for V in 16.2 16.1 15.4; do
            if [ -d "/Applications/Xcode_${V}.app" ]; then
              # -p prints the path without changing global state, which is
              # enough for the SDK and lipo calls this job makes.
              SELECTED="/Applications/Xcode_${V}.app"
              break
            fi
          done
          if [ -n "$SELECTED" ]; then
            echo "pinned: $SELECTED"
            echo "DEVELOPER_DIR=$SELECTED" >> "$GITHUB_ENV"
          else
            echo "no pinned Xcode present; using the image default"
            echo "default: $(xcode-select -p)"
          fi
          # -p never fails on a missing argument, unlike -s.
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Fetch the llama.cpp packages for this target
        uses: actions/download-artifact@v4
        with:
          name: llamacpp-ios
          path: native/prebuilts

      - name: Install Rust targets
        run: |
          set -euo pipefail
          # An empty $GS_RUST_TOOLCHAIN would be `--default-toolchain ""`, and
          # rustup reads that as "no preference" and installs its own default --
          # the unpinned resolution this pin exists to remove, restored silently
          # and with a green step. So the value is checked before the install.
          [ -n "${GS_RUST_TOOLCHAIN:-}" ] || {
            echo "::error::GS_RUST_TOOLCHAIN is empty or unset. Refusing to install an"
            echo "::error::unpinned toolchain, because that is the exact condition that"
            echo "::error::produced 'Not an int attribute' on ios-native 37020835936."
            exit 1
          }
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$GS_RUST_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # x86_64-apple-ios, NOT x86_64-apple-ios-sim. There is no "-sim"
          # variant of that triple: an Intel iOS simulator is x86_64 running iOS,
          # which is the same target as the device triple with a different
          # platform at link time. Run 36665244922:
          #     error: toolchain 'stable-aarch64-apple-darwin' does not support
          #       target 'x86_64-apple-ios-sim'
          # Confirmed against a real toolchain, not assumed:
          #     rustc --print target-list | grep apple-ios
          #       aarch64-apple-ios        aarch64-apple-ios-macabi
          #       aarch64-apple-ios-sim    arm64e-apple-ios
          #       armv7s-apple-ios         i386-apple-ios
          #       x86_64-apple-ios         x86_64-apple-ios-macabi
          # Only aarch64 has a separate -sim triple, because Apple Silicon
          # simulators share the device's arm64 code with only the platform
          # differing.
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          rustc --version
          rustc --print target-list | grep -E '^(aarch64|x86_64)-apple-ios' || true

      # ATTEMPT 7. The cross-compile itself works — lipo reports
      #   built: Non-fat file: target/aarch64-apple-ios/release/libgs_ffi.a
      #       is architecture: arm64
      # Every failure since attempt 3 has been in the verification I added, not
      # in the build:
      #   attempt 5  `file -b` on a .a says "current ar archive", never an arch
      #   attempt 6  `ar t | head -1` returns __.SYMDEF, and $SRC was relative
      #              while `ar x` ran in /tmp   -> ar: ... No such file or directory
      #   attempt 7  grep: stdout: Broken pipe
      # The last one is `set -euo pipefail` meeting `head`: head exits after one
      # line, its upstream grep dies on SIGPIPE, pipefail propagates the
      # non-zero status, and the step exits 2. Every pipeline below therefore
      # uses `sed -n 'Np'`, which consumes its whole input and cannot close a
      # pipe early. There is no `| head` left in this file.
      - name: Build and verify device slice (aarch64-apple-ios)
        working-directory: native
        run: |
          set -euo pipefail
          # THE VARIABLE THAT MAKES THE ENGINE EXIST ON iOS.
          #
          # gs-ffi/build.rs defines GS_LLAMA_HAVE_LLAMA -- the macro
          # gs_mobile_backend_available() keys off -- only when
          # GS_LLAMA_PREBUILT points at a directory containing include/llama.h.
          # Android sets it (android-native.yml:295). iOS never did, so:
          #
          #     GsNativeLoader: native engine unavailable: this build has no
          #                     generation backend
          #
          # which is true, and the five engine-backed XCTests skip on it while
          # the job stays green.
          #
          # Asserted here rather than trusted: a missing or mis-shaped package
          # produces a build that links and then reports no backend, which is
          # the worst combination -- it looks installed and does nothing.
          GS_LLAMA_PREBUILT="$GITHUB_WORKSPACE/native/prebuilts/ios-arm64"
          test -f "$GS_LLAMA_PREBUILT/include/llama.h" || {
            echo "FAIL: no include/llama.h under $GS_LLAMA_PREBUILT"
            echo "package contents:"; ls -A "$GS_LLAMA_PREBUILT" 2>/dev/null | sed -n '1,8p'
            exit 1
          }
          echo "GS_LLAMA_PREBUILT=$GS_LLAMA_PREBUILT"
          ls -1 "$GS_LLAMA_PREBUILT/lib" || true
          export GS_LLAMA_PREBUILT

          # ASSERT THE DEPLOYMENT TARGET RATHER THAN TRUSTING THE ENV VAR.
          #
          # An exported variable is a claim. `rustc --print deployment-target` is
          # what the compiler actually selected, and this is the difference
          # between "we set 15.0" and "the link line says 15.0". Run 36730369437
          # is the case where the two disagreed: nothing set the variable, the
          # link line quietly said 10.0, and the only symptom was one undefined
          # symbol whose name says nothing about deployment targets.
          # NOTE THE PREFIX. rustc does not print a bare "15.0". Measured on this
          # host, with the variable unset:
          #
          #     $ rustc --print deployment-target --target aarch64-apple-ios
          #     IPHONEOS_DEPLOYMENT_TARGET=10.0
          #
          # which is also the exact number that appeared in run 36730369437's
          # link line, so the floor is confirmed rather than assumed.
          GOT_DEPLOY=$(rustc --print deployment-target --target aarch64-apple-ios 2>/dev/null || echo '<unknown>')
          echo "rustc --print deployment-target = $GOT_DEPLOY"
          echo "IPHONEOS_DEPLOYMENT_TARGET      = ${IPHONEOS_DEPLOYMENT_TARGET:-<unset>}"
          # The pattern is QUOTED, and that is not cosmetic. An unquoted
          # `<unknown>` in a `case` arm is a SYNTAX error in bash -- the `<` is
          # parsed as a redirection operator even in pattern position:
          #
          #   $ bash -n t.sh
          #   t.sh: line 3: syntax error near unexpected token `<'
          #   t.sh: line 3: `  <unknown>)'
          #   exit=2
          #
          # Quoted, the same file is exit=0. Found by `bash -n` over the run
          # blocks, which is the check that earns its keep here.
          case "$GOT_DEPLOY" in
            "<unknown>")
              echo "::error::rustc would not report a deployment target for aarch64-apple-ios."
              exit 1
              ;;
          esac
          # __chkstk_darwin is exported from iOS 12.0 onward, so 12 is the floor
          # that matters, not the 15 we prefer.
          #
          # TWO PARSES WERE WRONG BEFORE THIS ONE, and the first is the dangerous
          # kind. Stripping only `iOS ` off the front gives
          # "IPHONEOS_DEPLOYMENT_TARGET=10", and then
          #
          #     [ "IPHONEOS_DEPLOYMENT_TARGET=10" -lt 12 ] 2>/dev/null
          #
          # makes bash print "integer expression expected" to stderr and exit
          # non-zero -- so the `if` is FALSE and the check ACCEPTS. A 10.0 build
          # passes. Measured, both parses, on real rustc output:
          #
          #     raw rustc output: [IPHONEOS_DEPLOYMENT_TARGET=10.0]
          #     the WRONG parse:   extracted [IPHONEOS_DEPLOYMENT_TARGET=10]
          #                        -> ACCEPT  <-- FALSE PASS on a 10.0 build
          #     the CORRECT parse: extracted [10]   -> REJECT (below 12)
          #
          # So the prefix is stripped explicitly, the result must be a bare
          # integer, and the numeric test is NOT allowed to fail open.
          DEPLOY_MAJOR=$(echo "$GOT_DEPLOY" | sed 's/^[A-Z_]*=//; s/^iOS *//; s/\..*//')
          if ! printf '%s' "$DEPLOY_MAJOR" | grep -qE '^[0-9]+$'; then
            echo "::error::could not read a version out of '$GOT_DEPLOY' (parsed '$DEPLOY_MAJOR')."
            echo "::error::Refusing to pass a check whose input I could not parse."
            exit 1
          fi
          if [ "$DEPLOY_MAJOR" -lt 12 ]; then
            echo "::error::deployment target is $GOT_DEPLOY, and __chkstk_darwin is"
            echo "::error::exported from iOS 12.0 onward. The link will fail with:"
            echo "::error::  ___chkstk_darwin, referenced from libllama.a"
            echo "::error::Set IPHONEOS_DEPLOYMENT_TARGET at the job level."
            exit 1
          fi
          echo "VERIFIED: deployment target $GOT_DEPLOY, which is >= the iOS 12 floor for __chkstk_darwin"

          cargo build --release -p gs-ffi --lib --target aarch64-apple-ios
          SRC="target/aarch64-apple-ios/release/libgs_ffi.a"
          test -f "$SRC" || { echo "MISSING: $SRC"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/dist/ios/device"
          cp "$SRC" "$GITHUB_WORKSPACE/dist/ios/device/libgs_ffi.a"

          # lipo, not file: a .a is an ar archive, so `file -b` on it reports
          # only "current ar archive" and never an architecture.
          echo "built: $(lipo -info "$SRC")"
          lipo -info "$SRC" | grep -q 'arm64' || {
            echo "FAIL: device slice is not arm64"; exit 1; }
          bash "$GITHUB_WORKSPACE/.github/scripts/assert_arch_member.sh" "$SRC" device arm64

      - name: Build and verify simulator slice (aarch64-apple-ios-sim)
        working-directory: native
        run: |
          set -euo pipefail
          # THE VARIABLE THAT MAKES THE ENGINE EXIST ON iOS.
          #
          # gs-ffi/build.rs defines GS_LLAMA_HAVE_LLAMA -- the macro
          # gs_mobile_backend_available() keys off -- only when
          # GS_LLAMA_PREBUILT points at a directory containing include/llama.h.
          # Android sets it (android-native.yml:295). iOS never did, so:
          #
          #     GsNativeLoader: native engine unavailable: this build has no
          #                     generation backend
          #
          # which is true, and the five engine-backed XCTests skip on it while
          # the job stays green.
          #
          # Asserted here rather than trusted: a missing or mis-shaped package
          # produces a build that links and then reports no backend, which is
          # the worst combination -- it looks installed and does nothing.
          GS_LLAMA_PREBUILT="$GITHUB_WORKSPACE/native/prebuilts/ios-arm64-sim"
          test -f "$GS_LLAMA_PREBUILT/include/llama.h" || {
            echo "FAIL: no include/llama.h under $GS_LLAMA_PREBUILT"
            echo "package contents:"; ls -A "$GS_LLAMA_PREBUILT" 2>/dev/null | sed -n '1,8p'
            exit 1
          }
          echo "GS_LLAMA_PREBUILT=$GS_LLAMA_PREBUILT"
          ls -1 "$GS_LLAMA_PREBUILT/lib" || true
          export GS_LLAMA_PREBUILT

          # ASSERT THE DEPLOYMENT TARGET RATHER THAN TRUSTING THE ENV VAR.
          #
          # An exported variable is a claim. `rustc --print deployment-target` is
          # what the compiler actually selected, and this is the difference
          # between "we set 15.0" and "the link line says 15.0". Run 36730369437
          # is the case where the two disagreed: nothing set the variable, the
          # link line quietly said 10.0, and the only symptom was one undefined
          # symbol whose name says nothing about deployment targets.
          # NOTE THE PREFIX. rustc does not print a bare "15.0". Measured on this
          # host, with the variable unset:
          #
          #     $ rustc --print deployment-target --target aarch64-apple-ios
          #     IPHONEOS_DEPLOYMENT_TARGET=10.0
          #
          # which is also the exact number that appeared in run 36730369437's
          # link line, so the floor is confirmed rather than assumed.
          GOT_DEPLOY=$(rustc --print deployment-target --target aarch64-apple-ios 2>/dev/null || echo '<unknown>')
          echo "rustc --print deployment-target = $GOT_DEPLOY"
          echo "IPHONEOS_DEPLOYMENT_TARGET      = ${IPHONEOS_DEPLOYMENT_TARGET:-<unset>}"
          # The pattern is QUOTED, and that is not cosmetic. An unquoted
          # `<unknown>` in a `case` arm is a SYNTAX error in bash -- the `<` is
          # parsed as a redirection operator even in pattern position:
          #
          #   $ bash -n t.sh
          #   t.sh: line 3: syntax error near unexpected token `<'
          #   t.sh: line 3: `  <unknown>)'
          #   exit=2
          #
          # Quoted, the same file is exit=0. Found by `bash -n` over the run
          # blocks, which is the check that earns its keep here.
          case "$GOT_DEPLOY" in
            "<unknown>")
              echo "::error::rustc would not report a deployment target for aarch64-apple-ios."
              exit 1
              ;;
          esac
          # __chkstk_darwin is exported from iOS 12.0 onward, so 12 is the floor
          # that matters, not the 15 we prefer.
          #
          # TWO PARSES WERE WRONG BEFORE THIS ONE, and the first is the dangerous
          # kind. Stripping only `iOS ` off the front gives
          # "IPHONEOS_DEPLOYMENT_TARGET=10", and then
          #
          #     [ "IPHONEOS_DEPLOYMENT_TARGET=10" -lt 12 ] 2>/dev/null
          #
          # makes bash print "integer expression expected" to stderr and exit
          # non-zero -- so the `if` is FALSE and the check ACCEPTS. A 10.0 build
          # passes. Measured, both parses, on real rustc output:
          #
          #     raw rustc output: [IPHONEOS_DEPLOYMENT_TARGET=10.0]
          #     the WRONG parse:   extracted [IPHONEOS_DEPLOYMENT_TARGET=10]
          #                        -> ACCEPT  <-- FALSE PASS on a 10.0 build
          #     the CORRECT parse: extracted [10]   -> REJECT (below 12)
          #
          # So the prefix is stripped explicitly, the result must be a bare
          # integer, and the numeric test is NOT allowed to fail open.
          DEPLOY_MAJOR=$(echo "$GOT_DEPLOY" | sed 's/^[A-Z_]*=//; s/^iOS *//; s/\..*//')
          if ! printf '%s' "$DEPLOY_MAJOR" | grep -qE '^[0-9]+$'; then
            echo "::error::could not read a version out of '$GOT_DEPLOY' (parsed '$DEPLOY_MAJOR')."
            echo "::error::Refusing to pass a check whose input I could not parse."
            exit 1
          fi
          if [ "$DEPLOY_MAJOR" -lt 12 ]; then
            echo "::error::deployment target is $GOT_DEPLOY, and __chkstk_darwin is"
            echo "::error::exported from iOS 12.0 onward. The link will fail with:"
            echo "::error::  ___chkstk_darwin, referenced from libllama.a"
            echo "::error::Set IPHONEOS_DEPLOYMENT_TARGET at the job level."
            exit 1
          fi
          echo "VERIFIED: deployment target $GOT_DEPLOY, which is >= the iOS 12 floor for __chkstk_darwin"

          cargo build --release -p gs-ffi --lib --target aarch64-apple-ios-sim
          SRC="target/aarch64-apple-ios-sim/release/libgs_ffi.a"
          test -f "$SRC" || { echo "MISSING: $SRC"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/dist/ios/simulator"
          cp "$SRC" "$GITHUB_WORKSPACE/dist/ios/simulator/libgs_ffi.a"
          echo "built: $(lipo -info "$SRC")"
          lipo -info "$SRC" | grep -q 'arm64' || {
            echo "FAIL: simulator slice is not arm64"; exit 1; }
          bash "$GITHUB_WORKSPACE/.github/scripts/assert_arch_member.sh" "$SRC" simulator arm64

      # THE SIMULATOR IS NOT ALWAYS ARM64.
      #
      # Run 36664200219 linked the app for
      #     -target x86_64-apple-ios16.0-simulator
      # on an Intel macos-latest runner, against an arm64-only xcframework:
      #
      #     ld: warning: ignoring file '.../libgs_ffi.a(...atomic_thread_fence.o)':
      #       found architecture 'arm64', required architecture 'x86_64'
      #     Undefined symbols for architecture x86_64:
      #       "_gs_mobile_create"  "_gs_mobile_chat"  "_gs_free_string"  ...
      #
      # The whole .a is skipped, so every gs_* the bridge calls is undefined. It
      # reads like a broken library; it is an arm64 library being offered to an
      # x86_64 link.
      #
      # Two ways out: pin the runner to arm64, or build the slice. Pinning is a
      # claim about macos-latest that has already been wrong once in this
      # repository, so this builds BOTH simulator architectures and lipos them
      # into the single library the xcframework advertises. That way the
      # framework is correct on an Intel runner AND an Apple Silicon one, and
      # neither choice has to be guessed.
      #
      # -target aarch64-apple-ios (the DEVICE slice) is left arm64-only: an iOS
      # device is arm64 and has been since iPhone 5s.
      - name: Build and verify simulator slice (x86_64-apple-ios)
        working-directory: native
        run: |
          set -euo pipefail
          # THE VARIABLE THAT MAKES THE ENGINE EXIST ON iOS.
          #
          # gs-ffi/build.rs defines GS_LLAMA_HAVE_LLAMA -- the macro
          # gs_mobile_backend_available() keys off -- only when
          # GS_LLAMA_PREBUILT points at a directory containing include/llama.h.
          # Android sets it (android-native.yml:295). iOS never did, so:
          #
          #     GsNativeLoader: native engine unavailable: this build has no
          #                     generation backend
          #
          # which is true, and the five engine-backed XCTests skip on it while
          # the job stays green.
          #
          # Asserted here rather than trusted: a missing or mis-shaped package
          # produces a build that links and then reports no backend, which is
          # the worst combination -- it looks installed and does nothing.
          GS_LLAMA_PREBUILT="$GITHUB_WORKSPACE/native/prebuilts/ios-x86_64-sim"
          test -f "$GS_LLAMA_PREBUILT/include/llama.h" || {
            echo "FAIL: no include/llama.h under $GS_LLAMA_PREBUILT"
            echo "package contents:"; ls -A "$GS_LLAMA_PREBUILT" 2>/dev/null | sed -n '1,8p'
            exit 1
          }
          echo "GS_LLAMA_PREBUILT=$GS_LLAMA_PREBUILT"
          ls -1 "$GS_LLAMA_PREBUILT/lib" || true
          export GS_LLAMA_PREBUILT
          cargo build --release -p gs-ffi --lib --target x86_64-apple-ios
          SRC="target/x86_64-apple-ios/release/libgs_ffi.a"
          test -f "$SRC" || { echo "MISSING: $SRC"; exit 1; }
          echo "built: $(lipo -info "$SRC")"
          lipo -info "$SRC" | grep -q 'x86_64' || {
            echo "FAIL: x86_64 simulator slice reports the wrong architecture"; exit 1; }
          bash "$GITHUB_WORKSPACE/.github/scripts/assert_arch_member.sh" "$SRC" simulator-intel x86_64

      # ONE library for both simulator architectures. lipo joins the objects;
      # xcodebuild -create-xcframework then records SupportedArchitectures as
      # [arm64, x86_64] for a single ios-arm64-simulator/ios-x86_64-simulator
      # slice, which is exactly what a fat static library is for.
      - name: Combine the simulator slices
        run: |
          set -euo pipefail
          ARM="$GITHUB_WORKSPACE/native/target/aarch64-apple-ios-sim/release/libgs_ffi.a"
          X86="$GITHUB_WORKSPACE/native/target/x86_64-apple-ios/release/libgs_ffi.a"
          test -f "$ARM" || { echo "MISSING: $ARM"; exit 1; }
          test -f "$X86" || { echo "MISSING: $X86"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/dist/ios/simulator"
          lipo -create "$ARM" "$X86" -output "$GITHUB_WORKSPACE/dist/ios/simulator/libgs_ffi.a"
          echo "simulator lib is now: $(lipo -info "$GITHUB_WORKSPACE/dist/ios/simulator/libgs_ffi.a")"
          # Assert BOTH architectures are really inside it. lipo -info prints
          # what it read, and a library missing an architecture still links on
          # the runner it was built for, which is how this went unnoticed.
          lipo -info "$GITHUB_WORKSPACE/dist/ios/simulator/libgs_ffi.a" | grep -q 'arm64' \
            || { echo "FAIL: combined simulator lib has no arm64"; exit 1; }
          lipo -info "$GITHUB_WORKSPACE/dist/ios/simulator/libgs_ffi.a" | grep -q 'x86_64' \
            || { echo "FAIL: combined simulator lib has no x86_64"; exit 1; }

      - name: Assemble the xcframework
        run: |
          set -euo pipefail
          set -a; source "$GITHUB_ENV"; set +a
          rm -rf "$GITHUB_WORKSPACE/dist/ios/GsFfi.xcframework"
          mkdir -p "$GITHUB_WORKSPACE/dist/ios/GsFfi.xcframework/Headers"

          # Headers next to each slice: a consumer reads the module, not the
          # binary, and a missing header is the most common reason a generated
          # xcframework will not import.
          for f in \
            native/cpp/mobile/gs_mobile.h \
            native/cpp/include/gs_abi.h; do
            cp "$f" "$GITHUB_WORKSPACE/dist/ios/GsFfi.xcframework/Headers/"
          done

          # Headers must declare their own dependencies, and gs_mobile.h includes
          # gs_abi.h by plain name, so both land in the same directory.
          # A heredoc cannot be used here: its body would sit at column 1
          # inside this YAML literal block, which ends the block early and makes
          # "module GsFfi {" parse as a mapping key. printf has no such trap.
          MM="$GITHUB_WORKSPACE/dist/ios/GsFfi.xcframework/Headers/module.modulemap"
          printf '%s\n' \
            'module GsFfi {' \
            '    header "gs_abi.h"' \
            '    header "gs_mobile.h"' \
            '    export *' \
            '}' > "$MM"
          cat "$MM"

          # FATTEN EACH SLICE WITH LLAMA.CPP FIRST. A static archive does not
          # carry its dependencies with it, and libgs_ffi.a now references
          # llama_*, ggml_* and ggml_* symbols. Shipping it alone produces an app
          # that builds and then cannot generate -- "it looks installed and does
          # nothing", which is the exact failure GS_LLAMA_HAVE_LLAMA exists to
          # prevent.
          #
          # ORDER: llama needs ggml, ggml needs ggml-cpu and ggml-base. Alphabetical
          # is the reverse (build.rs says so, having been bitten).
          fatten () {
            SLICE="$1"; PKG="$2"; OUT="$3"
            echo "=== $SLICE + $PKG -> $OUT ==="

            # THE TOOLS, RESOLVED FIRST because the guard below needs lipo and
            # this function runs under `set -u`, so an unset $LIPO_BIN would
            # abort the step rather than the guard failing informatively. Both
            # are resolved with `xcrun --find` rather than by bare name: a bare
            # name depends on what the runner's PATH holds, and a silently
            # different lipo is a different program with the same name.
            LIBTOOL_BIN="$(xcrun --find libtool 2>/dev/null || command -v libtool || true)"
            LIPO_BIN="$(xcrun --find lipo 2>/dev/null || command -v lipo || true)"
            [ -n "$LIBTOOL_BIN" ] || { echo "::error::no libtool on this runner"; exit 1; }
            [ -n "$LIPO_BIN" ] || { echo "::error::no lipo on this runner"; exit 1; }

            # THE INPUT MUST BE EXACTLY ONE ARCHITECTURE, AND THE RIGHT ONE.
            #
            # Run 36745378533 merged a FAT library -- the file a previous step had
            # already lipos'd -- and produced a fat output while every check on
            # that output passed:
            #
            #   members: Architectures in the fat file:
            #            .../libgs_ffi-sim-arm64.a are: x86_64 arm64
            #   archive members        : 0
            #
            # 62 MB, the right symbol count, the right four contract symbols, and
            # a filename that lies. Every check here was about the OUTPUT. So the
            # input is checked now, and it is checked two ways: exactly one
            # architecture, and that architecture is the one this prebuilt package
            # was compiled for.
            set +o pipefail
            # SPACES ARE PRESERVED, and that is load-bearing.
            #
            # `lipo -info` prints two shapes:
            #
            #     Non-fat file: /x/libgs_ffi.a is architecture: arm64
            #     Architectures in the fat file: /x/a.a are: x86_64 arm64
            #
            # and the second has to come out as TWO whitespace-separated words,
            # because `wc -w` is what counts the architectures. My first attempt
            # ended the pipeline with `tr -d ' '`, which squeezed the pair into
            # `x86_64arm64` -- one word, so `wc -w` reported 1 and the COUNT check
            # did not fire. The fat input was still rejected, but by the string
            # comparison failing to match `arm64`, which is luck rather than
            # logic. Verified both ways:
            #
            #     with tr -d ' '   archs='x86_64arm64' count=1  -> count check misses it
            #     with trimming    archs='x86_64 arm64'  count=2  -> count check catches it
            #
            # So: squeeze runs of spaces, then trim the ends, and never delete
            # them. `wc -w` does not care about surrounding whitespace.
            IN_ARCHS=$("$LIPO_BIN" -info "$SLICE" 2>/dev/null \
                       | sed -e 's/.*are: //' -e 's/.*is architecture: //' -e 's/,//g' \
                       | tr -s ' ' | sed -e 's/^ *//' -e 's/ *$//' || true)
            set -o pipefail
            IN_COUNT=$(printf '%s' "$IN_ARCHS" | wc -w | tr -d ' ')
            # The package directory is named ios-<arch>[-sim]; take the arch out
            # of it so the check needs no duplicated table that can drift.
            PKG_ARCH=$(basename "$PKG" | sed 's/^ios-//; s/-sim$//')
            echo "  input archs : ${IN_ARCHS:-<none>}   package expects: $PKG_ARCH"
            if [ "${IN_COUNT:-0}" -ne 1 ]; then
              echo "::error::$SLICE has ${IN_COUNT:-0} architectures (${IN_ARCHS:-none})."
              echo "::error::A merge combines ONE architecture's archives. Merging a"
              echo "::error::library that is already fat is what produced"
              echo "::error::  'libgs_ffi-sim-arm64.a are: x86_64 arm64'"
              echo "::error::in run 36745378533. Use the per-architecture cargo output:"
              echo "::error::  native/target/<triple>/release/libgs_ffi.a"
              exit 1
            fi
            if [ "$IN_ARCHS" != "$PKG_ARCH" ]; then
              echo "::error::$SLICE is $IN_ARCHS but $PKG holds $PKG_ARCH objects."
              echo "::error::Merging them yields a slice that is neither."
              exit 1
            fi
            ORDER=""
            # ggml-blas is deliberately absent: it is built with GGML_BLAS=OFF.
            # Merging an archive that needs an external BLAS adds a second full
            # backend to the binary for no benefit, and its cblas_* symbols are
            # unresolved (run 36725021214).
            for NAME in llama ggml ggml-cpu ggml-base ggml-metal; do
              [ -f "$PKG/lib/lib$NAME.a" ] && ORDER="$ORDER $PKG/lib/lib$NAME.a"
            done
            if [ -z "$ORDER" ]; then
              echo "::error::no llama.cpp archives under $PKG/lib -- the engine would link without a backend."
              ls -1 "$PKG/lib" 2>/dev/null || true
              exit 1
            fi
            echo "  merging:$ORDER"
            # Refuse to read and write the same file. lipo opens the output for
            # writing before it has read the inputs, so this truncates the
            # archive being copied and reports success.
            [ "$SLICE" != "$OUT" ] || {
              echo "::error::fatten would read and write the same file: $SLICE"
              exit 1
            }
            # libtool -static, NOT lipo -create. See the long note below; the
            # short version is that lipo builds a UNIVERSAL file from slices of
            # DIFFERENT architectures and refuses same-architecture inputs:
            #
            #   fatal error: lipo: .../libgs_ffi.a and .../libllama.a have the
            #   same architectures (arm64) and can't be in the same fat output
            #   file                                          (run 36735809161)
            #
            # Folding several single-architecture static archives into one is an
            # ARCHIVE MERGE, which is libtool's job on Apple platforms. lipo is
            # still used one step later, to combine the two simulator libraries
            # -- and that use is correct, because aarch64-apple-ios-sim and
            # x86_64-apple-ios really are different architectures.
            #
            # libtool and lipo are resolved with `xcrun --find` at the TOP of this
            # function, where the single-architecture guard can use lipo too.

            rm -f "$OUT"
            "$LIBTOOL_BIN" -static -o "$OUT" "$SLICE" $ORDER
            [ -f "$OUT" ] || { echo "::error::libtool produced no $OUT"; exit 1; }
            # The merge is asserted FROM THE RESULT, not assumed: an output that
            # silently contained only its first input would look like success
            # until something failed to link much later.
            echo "  members: $("$LIPO_BIN" -info "$OUT" 2>/dev/null | tr '\n' ' ')"
            echo "  bytes  : $(stat -f%z "$OUT" 2>/dev/null || stat -c%s "$OUT" 2>/dev/null)"
            if ! "$LIPO_BIN" -info "$OUT" >/dev/null 2>&1; then
              echo "::error::$OUT is not a readable archive after the merge."
              exit 1
            fi
            echo "  $(lipo -info "$OUT")"
            # And assert the merged archive really is bigger than the input,
            # which catches an empty or truncated merge that lipo reports as
            # success.
            IN=$(stat -f%z "$SLICE")
            MERGED=$(stat -f%z "$OUT")
            echo "  $IN bytes -> $MERGED bytes"
            if [ "$MERGED" -le "$IN" ]; then
              echo "::error::$OUT is not larger than $SLICE ($MERGED <= $IN); the merge did nothing."
              exit 1
            fi
            # THE SYMBOLS THE WHOLE CHANGE EXISTS FOR. Asserted on the merged
            # archive, because a build that links without a backend reports
            # "no generation backend" at run time and never at link time.
            #
            # BOTH UNDERSCORE SPELLINGS, MATCHED BY REGEX. The first version
            # grepped for ' T _llama_model_load' -- the Mach-O spelling -- and
            # checked against a locally built ELF archive, where nm prints
            # "T llama_model_load" with no underscore:
            #
            #     $ nm -gU m.a | grep -c ' T _llama_model_load'
            #     0
            #
            # so the check would have FAILED a perfectly good merge on any
            # runner whose nm did not add the underscore. Matched on the symbol
            # name with the underscore optional, which covers Mach-O and ELF.
            #
            # Four symbols, not one: llama_model_load initialises the backend,
            # llama_backend_init sets up the backend registry, ggml_init is what
            # the ggml side needs, and llama_free releases it. Any one missing
            # means the engine cannot run, and the message names which.
            # SYMBOLS, COUNTED, ON EVERY RUN.
            #
            # These print whether or not the required symbols are found, so a
            # merge that quietly stopped including llama.cpp shows up as a
            # FALLING NUMBER rather than as a link error much later. Run
            # 36737879525 merged to 35,291,352 bytes with libggml-cpu's own
            # objects inside it, and then reported the three llama entry points
            # missing -- and the only evidence offered was five lines of Rust
            # allocator internals, which says the archive is not empty and
            # nothing whatsoever about llama.
            #
            # A check that stops a build must hand the reader something to act
            # on, so the counts are printed on the failure path too.
            # NONE OF THESE MAY END THE STEP, AND NONE MAY DISCARD STDERR.
            #
            # This step opens with `set -euo pipefail`, and GitHub runs `run:`
            # blocks as `bash -e {0}` anyway, so `-e` is on. `nm` on a 35 MB
            # Mach-O static archive returns NON-ZERO when it cannot fully parse a
            # member -- it still prints everything it did parse, but the status
            # is 1 -- and a non-zero pipeline inside a bare ASSIGNMENT terminates
            # the shell. With `2>/dev/null` on top, the reason is discarded in the
            # same breath. Run 36740298082 is exactly that: the counters below were
            # the first thing after the merge-size check, none of them printed, and
            # the step ended with no `::error::` line at all --
            #
            #     26733808 bytes -> 35291352 bytes
            #     Post job cleanup
            #     ##[error]Process completed with exit code 1
            #
            # which is the signature of a command that failed without saying so.
            # This is the same trap the arm64 probe hit, and the same trap the
            # deployment-target parse nearly hit:
            #
            #     OLD form (in an `if` condition, where -e is suspended): survived
            #     NEW form (in a bare assignment):                           exit 1
            #
            # `|| true` stops the step ending. Capturing nm's STDERR is the part
            # that matters: nm's complaint about the member it could not parse IS
            # the answer, and `2>/dev/null` was sending it to /dev/null one line
            # before the shell exited. A check that throws away the evidence when
            # it fails is not a check.
            NMERR=$(mktemp)
            set +o pipefail
            NSYM=$(nm -gU "$OUT" 2>"$NMERR" | wc -l | tr -d ' ' || true)
            echo "  global defined symbols : ${NSYM:-0}"
            echo "  names containing llama : $(nm "$OUT" 2>>"$NMERR" | grep -ci llama || true)"
            echo "  global T _llama*       : $(nm -gU "$OUT" 2>>"$NMERR" | grep -cE ' T _?llama' || true)"
            echo "  archive members        : $(ar -t "$OUT" 2>>"$NMERR" | wc -l | tr -d ' ' || true)"
            set -o pipefail
            if [ -s "$NMERR" ]; then
              echo "  nm/ar said (kept, not discarded):"
              # `sed -n '1,12p'`, NOT `| head -12`.
              #
              # This line is why run 36747684730 ended with
              #
              #     sed: stdout: Broken pipe
              #     ##[error]Process completed with exit code 1.
              #
              # and no `::error::` line naming anything. `head -12` exits after
              # twelve lines and closes the pipe, so `sed` takes SIGPIPE and
              # exits 141, and the step runs under `set -euo pipefail` with -e
              # already on from `bash -e {0}`.
              #
              # `head -N` and `sed -n '1,Np'` look interchangeable and are not:
              # `head` STOPS READING, `sed -n '1,Np'` reads to the end and merely
              # prints less. Under pipefail only the first can fail the pipeline.
              sed -n '1,12p' "$NMERR" | sed 's/^/    /'
            else
              echo "  nm/ar said: nothing"
            fi
            rm -f "$NMERR"

            # THE LINK CONTRACT, NOT LLAMA.CPP'S OWN API.
            #
            # This loop used to ask for llama_backend_init, llama_model_load and
            # llama_free, and it could never have passed. Those are llama.cpp's
            # own API, and at the pinned commit
            # 3018a11e79e489b657dbb77c95694889ccff92df they are C++, so they are
            # MANGLED in the archive:
            #
            #     _ZN6llama11model_loadE...      not      T _llama_model_load
            #
            # Only the subset llama.h exposes inside `extern "C"` has an
            # unmangled name. So the check named three symbols outside that
            # subset, and would have failed on every runner at every llama
            # version where those three are C++.
            #
            # What the build actually promises is the extern "C" block the Rust
            # side compiles against, native/crates/gs-ffi/src/mobile.rs:
            #
            #     fn gs_llama_available    fn gs_llama_create
            #     fn gs_llama_backend_name fn gs_llama_generate
            #     fn gs_mobile_backend_available  ...
            #
            # and run 36742545988 shows the first two in the merged archive as
            #
            #     0000000000002214 T _gs_llama_available
            #     0000000000002220 T _gs_llama_backend_name
            #
            # so the symbols the build needs were exported all along. Asserting
            # them is a STRONGER test than asserting llama.cpp internals, which
            # nothing in this repository calls -- and gs_mobile_backend_available
            # is the one function whose value decides "this build has a
            # generation backend", which is the whole claim of the iOS work.
            # NO PIPE, ON PURPOSE. This used to be
            #
            #     nm -gU "$OUT" 2>/dev/null | grep -qE " T _?${SYM}\$"
            #
            # in a step that opens with `set -euo pipefail`, and it was
            # NON-DETERMINISTIC -- ten runs on the same archive, four symbols all
            # present:
            #
            #     run  1: MISSING=' gs_llama_backend_name gs_llama_create'
            #     run  2: MISSING=' gs_llama_create'
            #     run  3: MISSING=' gs_llama_available'
            #     run  5: MISSING=' gs_llama_backend_name gs_mobile_backend_available'
            #     run  6: MISSING=''
            #     run 10: MISSING=''
            #
            # `grep -q` exits on the first match, which closes the pipe; `nm` is
            # still writing and takes SIGPIPE, exiting 141; `pipefail` makes the
            # PIPELINE's status the last non-zero one, so a SUCCESSFUL match is
            # reported as a MISS. Whether nm has filled the pipe buffer before
            # grep leaves is a race, which is why the set of "missing" symbols
            # changed every run -- always in the direction of present -> absent.
            #
            # So: nm runs ONCE, its output is captured, and each symbol is
            # compared with bash pattern matching. No pipe, no SIGPIPE, nothing
            # for pipefail to misreport, and the archive is read once instead of
            # five times.
            #
            # FIELD-EXACT, not a substring, so `gs_llama_create` cannot be
            # satisfied by `gs_llama_create_result`. A check that accepts a
            # longer name will one day pass on the wrong symbol.
            ALLSYM=$(nm -gU "$OUT" 2>>"$NMERR" || true)
            MISSING=""
            for SYM in gs_llama_available gs_llama_backend_name gs_llama_create \
                      gs_mobile_backend_available; do
              FOUND=no
              while read -r _ADDR _TYPE NAME; do
                case "$NAME" in
                  "$SYM"|_"$SYM") FOUND=yes; break ;;
                esac
              done <<< "$ALLSYM"
              [ "$FOUND" = yes ] || MISSING="$MISSING $SYM"
            done
            # A FLOOR ON THE LLAMA SYMBOL COUNT, so "the wrapper is there but
            # llama.cpp was never merged" cannot pass. Every named symbol above
            # lives in libgs_llama.a, which is small; a wrapper-only archive would
            # satisfy all four and then fail to link much later with an
            # undefined llama.cpp symbol.
            #
            # 476 unmangled llama symbols is what a real merge produced
            # (run 36742545988). The floor is 100 -- 21% of that -- and is
            # deliberately loose: its job is to catch "llama.cpp is absent
            # entirely", not to track a number that moves between llama releases.
            # The count prints on every run, so a drift toward the floor is
            # visible before it becomes a failure.
            LLAMA_COUNT=$(printf '%s\n' "$ALLSYM" | grep -cE ' T _?llama' || true)
            if [ "${LLAMA_COUNT:-0}" -lt 100 ]; then
              MISSING="$MISSING (only ${LLAMA_COUNT:-0} llama symbols, floor is 100;"
              MISSING="$MISSING a wrapper-only archive cannot pass this)"
            fi
            if [ -n "$MISSING" ]; then
              echo "::error::$OUT is missing:$MISSING. The engine cannot initialise."
              # WHICH of the four possible causes this is, from the counts above.
              #
              #   llama named but not as ` T `   -> nm type letter, check is wrong
              #   llama named, 0 members         -> libtool dropped the input
              #   0 anywhere                     -> not in the archives at all
              #
              # None of these is guessed at; the numbers decide.
              echo "  --- why, and the evidence ---"
              echo "  any llama symbol, any type, first few:"
              printf '%s\n' "$ALLSYM" | grep -i llama | sed -n '1,5p' | sed 's/^/    /'
              echo "  members whose name mentions llama:"
              ar -t "$OUT" 2>/dev/null | grep -i llama | sed -n '1,5p' | sed 's/^/    /' || echo "    (none)"
              echo "  sizes of what went in, and what came out:"
              for F in "$SLICE" $ORDER "$OUT"; do
                echo "    $(stat -f%z "$F" 2>/dev/null || stat -c%s "$F" 2>/dev/null)  $F"
              done
              echo "  first symbols present:"
              nm -gU "$OUT" 2>/dev/null | grep -E ' T ' | sed -n '1,5p' | sed 's/^/    /'
              exit 1
            fi
            echo "  symbols present: llama_backend_init, llama_model_load, llama_free"
          }

          # A DIFFERENT OUTPUT PATH. The first version of this was
          #     fatten .../device/libgs_ffi.a  ...  .../device/libgs_ffi.a
          # -- reading and writing the same file. The merge tool opens the output
          # for writing before it finishes reading the inputs, so this truncates
          # the archive it is copying. The result is a "successful" merge and an
          # empty or half-written library, which fails later as undefined symbols
          # and names nothing.
          #
          # (It was `lipo -create` when this was written. It is `libtool -static`
          # now, for the same reason the merge needs one at all -- see the note
          # about lipo above -- and the hazard is identical, so the guard stays.)
          fatten "$GITHUB_WORKSPACE/dist/ios/device/libgs_ffi.a" \
                 "$GITHUB_WORKSPACE/native/prebuilts/ios-arm64" \
                 "$GITHUB_WORKSPACE/dist/ios/device/libgs_ffi-merged.a"
          mv "$GITHUB_WORKSPACE/dist/ios/device/libgs_ffi-merged.a" \
             "$GITHUB_WORKSPACE/dist/ios/device/libgs_ffi.a"
          # The simulator slice is ALREADY fat across arm64 and x86_64, so the
          # llama archives must be too, and both simulators need their own.
          # THE PER-ARCHITECTURE CARGO OUTPUTS, NOT THE COMBINED LIBRARY.
          #
          # These two calls used to read `dist/ios/simulator/libgs_ffi.a`, which
          # the previous step has ALREADY lipos into a single arm64+x86_64 fat
          # file. So each merge took a fat input and produced a fat output, and
          # the run named the evidence:
          #
          #   members: Architectures in the fat file:
          #            .../libgs_ffi-sim-arm64.a are: x86_64 arm64
          #   archive members        : 0
          #
          # `archive members: 0` is the tell -- `ar -t` lists nothing for a fat
          # file. A file called `-sim-arm64.a` carrying x86_64 is a file whose
          # name lies about its contents, and every check on it passed.
          #
          # The single-architecture cargo outputs are still on disk and are the
          # real inputs. Merge the prebuilts into each of those, and join the two
          # results ONCE at the end -- which is the only configuration lipo is
          # for, and the only one the step below it can consume.
          #
          # The device slice never had this problem: it has no combine step, so
          # its input is the cargo output directly. That is why the device
          # passed its symbol check on this run and the simulator did not.
          fatten "$GITHUB_WORKSPACE/native/target/aarch64-apple-ios-sim/release/libgs_ffi.a" \
                 "$GITHUB_WORKSPACE/native/prebuilts/ios-arm64-sim" \
                 "$GITHUB_WORKSPACE/dist/ios/simulator/libgs_ffi-sim-arm64.a"
          fatten "$GITHUB_WORKSPACE/native/target/x86_64-apple-ios/release/libgs_ffi.a" \
                 "$GITHUB_WORKSPACE/native/prebuilts/ios-x86_64-sim" \
                 "$GITHUB_WORKSPACE/dist/ios/simulator/libgs_ffi-sim-x86_64.a"
          lipo -create \
            "$GITHUB_WORKSPACE/dist/ios/simulator/libgs_ffi-sim-arm64.a" \
            "$GITHUB_WORKSPACE/dist/ios/simulator/libgs_ffi-sim-x86_64.a" \
            -output "$GITHUB_WORKSPACE/dist/ios/simulator/libgs_ffi.a"

          xcodebuild -create-xcframework \
            -library  "$GITHUB_WORKSPACE/dist/ios/device/libgs_ffi.a" \
              -headers "$GITHUB_WORKSPACE/dist/ios/GsFfi.xcframework/Headers" \
            -library  "$GITHUB_WORKSPACE/dist/ios/simulator/libgs_ffi.a" \
              -headers "$GITHUB_WORKSPACE/dist/ios/GsFfi.xcframework/Headers" \
            -output   "$GITHUB_WORKSPACE/dist/ios/GsFfi.xcframework"

      - name: Verify slices, archs and exported ABI
        run: |
          set -euo pipefail
          XF="$GITHUB_WORKSPACE/dist/ios/GsFfi.xcframework"
          test -d "$XF" || { echo "MISSING xcframework"; exit 1; }

          echo "=== Info.plist ==="
          plutil -p "$XF/Info.plist" | sed -n '1,40p'

          echo "=== slices ==="
          ls -1 "$XF"

          # arm64, not aarch64. aarch64 is the RUST TRIPLE
          # (aarch64-apple-ios); the ARCHITECTURE that lipo reports is arm64.
          # Raw error, run 36376588212:
          #     FAIL: device is not aarch64: Non-fat file: .../libgs_ffi.a
          #         is architecture: arm64
          #     ##[error]Process completed with exit code 1.
          # A comma-separated LIST of architectures per library, because the
          # simulator one is now FAT. It was "simulator:arm64" until run
          # 36664200219, which linked the app for x86_64-apple-ios-simulator on
          # an Intel runner and got, for every gs_* the bridge calls:
          #     ld: warning: ignoring file '.../libgs_ffi.a(...o)':
          #       found architecture 'arm64', required architecture 'x86_64'
          # A single-arch check would have kept passing that broken framework.
          for pair in "device:arm64" "simulator:arm64,x86_64"; do
            LIB="${pair%%:*}"; ARCHS="${pair##*:}"
            A="$GITHUB_WORKSPACE/dist/ios/$LIB/libgs_ffi.a"
            test -f "$A" || { echo "MISSING: $A"; exit 1; }
            echo "--- $LIB: $(file -b "$A")"
            # `ar t`, not a grep on `file`. Raw error, run 36376320644:
            #     FAIL: not an archive
            #     ##[error]Process completed with exit code 1.
            # `file -b` on a .a says "current ar archive" -- lowercase -- so
            # `grep -q "Archive"` never matches. That is the same tool mistake
            # twice: attempt 5 failed on `file` for the ARCHITECTURE and this
            # failed on `file` for the FILE TYPE. `ar t` succeeding is the
            # definitive test that the file is a real archive, and it is what
            # the member extraction uses anyway.
            # ar CANNOT READ A FAT ARCHIVE. Raw, run 36667019000:
            #     ar: .../dist/ios/simulator/libgs_ffi.a is a fat file
            #       (use libtool(1) or lipo(1) and ar(1) on it)
            #     ar: ...libgs_ffi.a: Inappropriate file type or format
            #
            # The simulator library is a lipo of arm64 + x86_64 since the Intel
            # slice was added, so `ar t` on the whole file fails. Per-ARCHIVE,
            # not per-FILE: lipo -thin extracts one slice to a temporary .a and
            # ar can read that. The arm64 slice is used for the member checks
            # because it is the one every iOS target can use.
            # ONLY IF IT IS FAT. `lipo -thin` on a thin library is itself an
            # error (run 36667890600):
            #     fatal error: lipo: input file (.../device/libgs_ffi.a) must be
            #       a fat file when the -thin option is specified
            # The device slice has been arm64-only all along, so it is thin. The
            # simulator one is fat since the Intel slice was added. So ask lipo
            # what it has and only thin a fat file.
            THIN="$A"
            # Match "Architectures in the FAT FILE:", NOT the bare substring
            # "fat file" -- lipo prints "Non-fat file: ... is architecture: arm64"
            # for a thin library, which CONTAINS "fat file" and would send a
            # thin file down the -thin path that just failed on the device
            # slice. Caught by running the pattern against lipo's own output
            # before dispatching.
            case "$(lipo -info "$A" 2>/dev/null || true)" in
              *"Architectures in the fat file"*)
                THIN="$RUNNER_TEMP/thin-$LIB.a"
                lipo "$A" -thin arm64 -output "$THIN"
                echo "    fat; extracted arm64 to $THIN"
                ;;
              *)
                echo "    thin; reading it directly"
                ;;
            esac
            MEMBERS=$(ar t "$THIN" | sed -n '1,200p')
            test -n "$MEMBERS" || { echo "FAIL: $LIB is not a readable ar archive"; exit 1; }
            echo "    members: $(printf '%s' "$MEMBERS" | wc -l | tr -d ' ')"
            # The Mach-O inside the archive must be the requested arch.
            INNER=$(ar t "$THIN" | grep -v '^__' | sed -n '1p')
            echo "    member: $INNER"
            lipo -info "$A" || { echo "FAIL: lipo could not read $A"; exit 1; }
            # The thin slice has to be a real, readable archive, or every `ar`
            # below fails on a file that was never created.
            test -s "$THIN" || { echo "FAIL: lipo -thin produced no $THIN"; exit 1; }
            ar t "$THIN" >/dev/null 2>&1 \
              || { echo "FAIL: the thin slice is not a readable ar archive"; exit 1; }
            # EVERY requested architecture must be present, not one of them.
            # `grep -q arm64` alone is satisfied by a library that has arm64 and
            # nothing else, which is the framework that failed to link.
            for ARCH in ${ARCHS//,/ }; do
              lipo -info "$A" | grep -q "$ARCH" || {
                echo "FAIL: $LIB is missing $ARCH: $(lipo -info "$A")"; exit 1; }
              echo "    has $ARCH"
            done
            # Symbols: an archive that exists but exports nothing is the exact
            # failure that was fixed for the .so, and it must be caught here too.
            #
            # Counted by .github/scripts/count_exported_symbols.sh rather than by
            # inline `nm`, because Xcode's nm cannot read the objects Rust
            # produces. Raw error, run 36377091198:
            #     nm: error: .../libgs_ffi.a(gs_ffi.gs_ffi....rcgu.o):
            #       Unknown attribute kind (105)
            #       (Producer: 'LLVM22.1.8-rust-1.98.1-stable'
            #        Reader: 'LLVM APPLE_1_2100.1.1.101_0')
            #     FAIL: expected >=8 exports, got 0
            # The gs_ffi member is one of the rejected ones, so "0 exports" was
            # the reader's version skew wearing the costume of a real result.
            # The script uses llvm-nm from the Rust toolchain -- the LLVM that
            # emitted the objects -- and reports a reader failure as a failure
            # rather than as a count of zero.
            N="$(bash "$GITHUB_WORKSPACE/.github/scripts/count_exported_symbols.sh" "$A" gs_ffi_mobile_)"
            echo "    gs_ffi_mobile_* exported: $N"
            if [ "$N" -lt 8 ]; then
              echo "FAIL: expected >=8 exports, got $N"
              # Print what the reader DID find, so a genuinely empty export table
              # is distinguishable from a reader problem.
              bash "$GITHUB_WORKSPACE/.github/scripts/count_exported_symbols.sh" \
                "$A" 'gs_' 2>/dev/null | sed -n '1,20p' || true
              exit 1
            fi
          done

          echo "=== exported mobile ABI (device) ==="
          # llvm-nm for the same reason as the count above.
          SYSROOT="$(rustc --print sysroot)"
          LLVM_NM="$(find "$SYSROOT" -name 'llvm-nm' -type f | sed -n '1p')"
          test -n "$LLVM_NM" || { echo "FAIL: llvm-nm not found"; exit 1; }
          "$LLVM_NM" --defined-only --extern-only \
            "$GITHUB_WORKSPACE/dist/ios/device/libgs_ffi.a" \
            | grep -oE 'gs_[a-z_0-9]+' | sort -u | sed -n '1,20p'

          echo "=== dSYM ==="
          # Rust ships a .a with debug info; a dSYM is produced when dSYM is
          # requested, and its absence is reported rather than glossed over.
          DSYM=$(find "$GITHUB_WORKSPACE/dist/ios" -name '*.dSYM' -type d | sed -n '1p')
          if [ -n "$DSYM" ]; then
            echo "dSYM: $DSYM"
            du -sh "$DSYM"
            dwarfdump --uuid "$DSYM" | sed -n '1,4p'
          else
            echo "dSYM: none produced (debug info is inside the .a; set"
            echo "      RUSTFLAGS=-C debuginfo=2 + dsymutil for a standalone dSYM)"
          fi

          echo "VERIFIED: xcframework with both slices and the mobile ABI"

      - name: Upload xcframework
        uses: actions/upload-artifact@v4
        with:
          name: GsFfi.xcframework
          path: dist/ios/GsFfi.xcframework
          if-no-files-found: error
          retention-days: 14

      - name: Upload raw static libraries
        uses: actions/upload-artifact@v4
        with:
          name: libgs_ffi-a
          path: |
            dist/ios/device/libgs_ffi.a
            dist/ios/simulator/libgs_ffi.a
            dist/ios/GsFfi.xcframework/Headers/*
          if-no-files-found: error
          retention-days: 14

  # THE APP HAS NEVER BEEN BUILT. Until this job, ios-native ended at
  # "Upload xcframework": nothing downloaded it, ios/project.yml did not
  # reference it, so `canImport(GsFfi)` was false in every build and
  #
  #     GsNativeLoader.probe() -> .failed(.libraryMissing("GsFfi not linked
  #                                                        into this target"))
  #
  # which is a supported configuration and a green result. A green job that
  # proves the library exists is not a job that proves the app uses it.
  #
  # `needs: build` is the whole point: it consumes that artifact the same way a
  # developer would after `ios-native` publishes one. The job id is `build`; the
  # STEP inside it is called "xcframework", and confusing the two is how a
  # `needs:` silently names a job that does not exist:
  #     Invalid job, xcframework is not a valid job name
  simulator-tests:
    name: app + XCTests (iOS simulator)
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          # DISCOVER, DO NOT PIN. The first version of this step was
          #     sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          # and the image does not have it (run 36659050115):
          #     xcode-select: error: invalid developer directory
          #       '/Applications/Xcode_16.2.app/Contents/Developer'
          #
          # A hardcoded Xcode path is a claim about the runner image that
          # nothing checks, and the runner image changes. The `build` job above
          # already solves this by listing /Applications and falling back to the
          # image default, so this does the same thing rather than inventing a
          # second convention.
          echo "=== available Xcodes ==="
          ls -1d /Applications/Xcode*.app 2>/dev/null || echo "(none listed)"
          SELECTED=""
          for V in 16.2 16.1 15.4; do
            if [ -d "/Applications/Xcode_${V}.app" ]; then
              SELECTED="/Applications/Xcode_${V}.app"
              break
            fi
          done
          if [ -n "$SELECTED" ]; then
            echo "pinned: $SELECTED"
            echo "DEVELOPER_DIR=$SELECTED" >> "$GITHUB_ENV"
          else
            echo "no pinned Xcode present; using the image default"
            echo "default: $(xcode-select -p)"
          fi
          # And assert it works, because `xcodebuild -version` failing three
          # steps later would be reported as a test failure.
          xcodebuild -version
          swift --version
          # The simulator run needs these to exist. A destination that is not
          # installed fails as "Unable to find a destination", which does not
          # say that a whole runtime is missing.
          echo "=== simulator runtimes ==="
          xcrun simctl list runtimes available || true
          xcrun simctl list devicetypes | grep -i 'iPhone 16' || \
            echo "NOTE: no iPhone 16 device type; the destination will need adjusting"

      - name: Install xcodegen
        run: |
          set -euo pipefail
          # The .xcodeproj is generated and never committed (ios/.gitignore), so
          # the generator is not optional.
          brew install xcodegen
          xcodegen --version

      - name: Download the xcframework from this run
        uses: actions/download-artifact@v4
        with:
          name: GsFfi.xcframework
          path: ios/Frameworks/GsFfi.xcframework

      - name: The framework landed, and it has both slices
        run: |
          set -euo pipefail
          # Assert the download rather than trusting the step. A download that
          # yields an empty directory fails later as
          # "framework not found GsFfi", which names neither upload nor extract.
          XF=ios/Frameworks/GsFfi.xcframework
          test -d "$XF" || { echo "FAIL: $XF was not downloaded"; exit 1; }
          find "$XF" -type f | sort
          echo "=== Info.plist says which slices exist ==="
          plutil -p "$XF/Info.plist"
          # One slice for the device, one for the simulator. A single-slice
          # framework builds for the simulator and then fails at runtime with a
          # dyld error about a missing architecture, which reads like a broken
          # build rather than a missing slice.
          # A single-slice framework BUILDS for the simulator and then fails at
          # runtime with a dyld error about a missing architecture, which reads
          # like a broken build rather than a missing slice. So assert here.
          #
          # ON THE NAMES. This loop used to look for
          #     ios-arm64   ios-simulator
          # and the runner's own plist says (run 36660102564, job 109713131562):
          #     "LibraryIdentifier"        => "ios-arm64-simulator"
          #     "SupportedPlatform"        => "ios"
          #     "SupportedPlatformVariant" => "simulator"
          #
          # "ios-simulator" appears NOWHERE in it. A simulator slice is named
          # after its ARCHITECTURE: a 32-bit one is `ios-armv7-simulator`, an
          # Intel-simulator build `ios-x86_64-simulator`. So grepping a fixed
          # substring is correct for exactly the one ABI that happens to have
          # been built, and wrong for every other -- a check that passes for the
          # wrong reason, which is worse than one that fails.
          #
          # Read the PLIST, and read the field that means it:
          # SupportedPlatformVariant is present for a simulator slice and absent
          # for a device slice, on every ABI, with nothing to guess.
          #
          # A SCRIPT, not `python3 -c`. An inline python body inside a YAML
          # `run: |` block puts `import json, sys` and `print(...)` at column 0,
          # which ENDS the block scalar and leaves the rest of the file to parse
          # as YAML mapping keys:
          #     yaml.scanner.ScannerError: while scanning a simple key
          #       in ".github/workflows/ios-native.yml", line 378, column 1
          #     could not find expected ':'
          # That happened here twice before this script existed.
          plutil -extract AvailableLibraries json -o - "$XF/Info.plist" \
            | python3 "$GITHUB_WORKSPACE/.github/scripts/xcframework_variants.py"
          echo "  slice present: device and simulator"

          # And the binaries, because a plist can describe slices that are not
          # there -- the plist is not the last word.
          # DERIVE THE SLICE NAME, DO NOT SPELL IT. This loop used to be
          #     for SLICE in ios-arm64 ios-arm64-simulator
          # and run 36668750491 failed on it, correctly:
          #     ::error::.../GsFfi.xcframework/ios-arm64-simulator/libgs_ffi.a
          #       is missing
          #
          # -create-xcframework names a multi-architecture slice after ALL of
          # its architectures joined by underscores:
          #     ios-arm64_x86_64-simulator    arm64 + x86_64 simulator
          #     ios-arm64-simulator           arm64 simulator only
          #     ios-arm64                     device
          # so the name changes whenever the architecture set does -- exactly
          # when a hardcoded name stops being true. There is no spelling that is
          # right in advance, and the identifier is in the plist, so read it.
          for VARIANT in device simulator; do
            # `|| exit 1` IS LOAD-BEARING. Without it a script failure inside
            # $( ) leaves $SLICE empty, the loop carries on with BIN=/libgs_ffi.a
            # and the only symptom is a `stat: cannot statx` four lines later --
            # which names neither the plist nor the script. Verified by removing
            # a slice directory and watching exactly that happen.
            SLICE=$(python3 \
              "$GITHUB_WORKSPACE/.github/scripts/xcframework_slice_path.py" \
              "$XF" "$VARIANT") || exit 1
            BIN="$XF/$SLICE/libgs_ffi.a"
            test -f "$BIN" || { echo "::error::$BIN is missing"; exit 1; }
            echo "  $VARIANT -> $SLICE/libgs_ffi.a  $(stat -c%s "$BIN") bytes"
          done
          test -f "$XF/Headers/module.modulemap" \
            || { echo "FAIL: no module.modulemap"; exit 1; }
          cat "$XF/Headers/module.modulemap"

      # A NOTE, NOT A GATE, and the reason is recorded here rather than left to
      # be discovered.
      #
      # This lint exists because of a bug no other check in this repository can
      # see. Run 36822191969 of the `app + XCTests` job reported "the reader
      # returned nothing" while the repository's own symbol counter -- same reader,
      # same flags -- printed 10. The cause was a line assigning `NAMES` that had
      # been deleted by an earlier edit, so every count downstream was counting an
      # empty string. `bash -n` cannot see a deleted assignment: the block still
      # parsed, still passed both other lints, and still read correctly.
      #
      # Verified against the real shape before shipping, and it works. Given a block
      # whose assignment is gone it reports every read of the missing name and names
      # the line. Given a block that assigns it, plus `for V in`, plus
      # `while read -r V`, plus a step-level `env:` key, plus `${MAYBE_UNSET-}`, it
      # reports none of those.
      #
      # WHY IT IS NOT A GATE: it has a demonstrable false positive in this tree. It
      # reports `$SDK_BUILDTOOLS` in android-release.yml's "Gates" step, and that
      # step's own first line is
      #
      #     SDK_BUILDTOOLS="$ANDROID_HOME/build-tools/35.0.0"
      #
      # with the read twenty-odd lines later in the SAME block. So it is wrong
      # there, for a reason I did not finish finding. A gate that fails on
      # verified-correct code is the false-failure machine this repository has spent
      # a session undoing, so it reports and does not block -- exactly as
      # check_pipefail_traps.py does with its notes.
      #
      # A finding from it is a CANDIDATE, not a conclusion. Each one has to be read
      # in its own step before it is acted on.
      - name: Variables read but never assigned (NOTE, read every finding)
        run: |
          set -uo pipefail
          RC=0
          python3 "$GITHUB_WORKSPACE/.github/scripts/check_unassigned_reads.py" || RC=$?
          case "$RC" in
            0) echo "gate: clean" ;;
            1) echo "NOTE: candidates above. NOT build-breaking, because this lint"
               echo "NOTE: has a known false positive in this tree -- see the"
               echo "NOTE: comment on this step. Read each finding in its own step."
               ;;
            *) echo "::error::the lint itself failed (exit $RC), which is a stop."
               exit 1 ;;
          esac

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          cd ios
          xcodegen generate
          test -d GSApp.xcodeproj || { echo "FAIL: xcodegen produced no project"; exit 1; }
          echo "targets:"
          xcodebuild -list -project GSApp.xcodeproj

      # ==================================================================
      # THE DEVICE BUILD, which did not exist and which a comment claimed
      # could not.
      # ==================================================================
      #
      # The simulator step above says, in a comment, that "the device slice
      # needs a signing identity and a physical device". The first half of that
      # is wrong in a way that cost a whole item of the plan, so it is worth
      # being precise: a SIGNED app needs an identity, and an INSTALLED app
      # needs a device. An UNSIGNED .app for `iphoneos` builds and links with
      # CODE_SIGNING_ALLOWED=NO, exactly as the simulator build already does.
      #
      # So the device slice was never un-buildable here. What was missing was the
      # build, and with it the only check that would catch a device-only link
      # failure -- a simulator build cannot: the device and simulator slices have
      # the same architecture (arm64) but DIFFERENT platforms, so a symbol
      # resolved for iphonesimulator and not for iphoneos is invisible until a
      # device build runs.
      #
      # What this asserts, from the built bytes:
      #   1. the product exists and is under Debug-iphoneos, not -iphonesimulator
      #   2. the executable is Mach-O arm64
      #   3. GsNative.swift's UNGUARDED call compiled in, which it must, because
      #      it is not inside any #if -- so the link is what proves GsFfi linked
      #   4. the app actually contains the GsFfi framework
      #   5. that framework's binary exports the gs_ffi symbols
      #
      # What it does NOT claim: a signed, installable .ipa. That needs a signing
      # identity and a provisioning profile, and this repository has neither. The
      # gap between "links for the device" and "installs on a device" is signing,
      # and it is stated rather than papered over.
      - name: Build the app for the DEVICE (aarch64-apple-ios, unsigned)
        run: |
          set -euo pipefail
          cd ios
          # `generic/platform=iOS` is the DEVICE platform; `generic/platform=iOS
          # Simulator` is the other one, and mixing them up produces a green
          # build of the wrong thing -- which is what this step exists to avoid.
          xcodebuild build -project GSApp.xcodeproj -scheme GSApp \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            2>&1 | tee build-device.log

          echo "=== the device product ==="
          # `sed -n '1,3p'`, never `head`: see the note in the simulator step
          # about SIGPIPE under `set -euo pipefail`. Found by
          # .github/scripts/check_pipefail_traps.py.
          find ~/Library/Developer/Xcode/DerivedData -name '*.app' \
            -path '*iphoneos*' -maxdepth 6 2>/dev/null | sed -n '1,4p'

      - name: Assert the device app is aarch64 and links the engine
        run: |
          set -euo pipefail

          # Resolve the product path from Xcode itself rather than guessing a
          # depth. Run 36757667662 failed with "no GSApp.app in DerivedData"
          # while the product was three levels deeper than the old `find`, and a
          # guessed depth costs a 25-minute run every time it is wrong.
          SETTINGS=$(xcodebuild -showBuildSettings \
            -project ios/GSApp.xcodeproj -scheme GSApp \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            2>/dev/null)
          HOW="xcodebuild -showBuildSettings"
          # NO `exit` IN THE awk, and that is the whole point of the `seen` flag.
          #
          # The pattern copied from the simulator step is
          #
          #     awk -F' = ' '/ TARGET_BUILD_DIR /{print $2; exit}'
          #
          # whose `exit` closes the pipe, so `printf` can take SIGPIPE and exit
          # 141; under pipefail that is the substitution's status, and
          # BUILD_DIR=$(...) is an ASSIGNMENT, so `set -e` kills the step. It
          # survives on the existing step only because that particular output
          # happens to fit the 64K pipe buffer -- which is a property of the
          # input, not a property of the code.
          #
          # Reading the whole input and printing the first match cannot SIGPIPE
          # anything, and gives the same answer.
          # THE PRODUCT IS App.app, NOT GSApp.app, AND THAT IS NOT AN OVERSIGHT.
          #
          # Run 36782878437 built the device slice SUCCESSFULLY and then failed my
          # own assertion:
          #
          #     ** BUILD SUCCEEDED **
          #     TARGET_BUILD_DIR = .../Build/Products/Debug-iphoneos
          #     (resolved by find instead: )
          #     ::error::GSApp.app is not a Debug-iphoneos/Release-iphoneos product
          #
          # with the real product in the same log, four hundred lines earlier:
          #
          #     Ld    .../Debug-iphoneos/App.app/App normal (in target 'App')
          #     Touch .../Debug-iphoneos/App.app      (in target 'App')
          #
          # `GSApp` is the SCHEME and the MODULE name. The PRODUCT is `App`, and
          # ios/project.yml says why, at the line that otherwise reads as an
          # oversight:
          #
          #     # NOTE: PRODUCT_NAME deliberately left at the XcodeGen default
          #     # ($(TARGET_NAME) = "App") -- overriding it desynchronises the
          #     # auto-generated TEST_HOST for AppTests ("Could not find test host").
          #
          # So the name is ASKED FOR rather than assumed: BUILT_PRODUCTS_DIR plus
          # FULL_PRODUCT_NAME, which is what the existing step uses for the same
          # reason, and FULL_EXECUTABLE_NAME for the executable. A hardcoded .app
          # name in an assertion about a build is a second thing that can be
          # wrong, and this one was.
          #
          # No `exit` in the awk, so it reads the whole input and cannot SIGPIPE
          # printf under pipefail -- which for APP=$(...) would kill the step.
          # THE PRODUCT IS FOUND IN THE BUILD DIRECTORY, NOT ASKED FOR BY NAME.
          #
          # Run 36784337230 printed this and failed:
          #
          #     ::error::xcodebuild -showBuildSettings did not resolve a product
          #     ::error::and an executable name.
          #     ::error::first 25 lines of its output:
          #     Command line invocation:
          #     /Applications/Xcode_26.6.app/.../xcodebuild -showBuildSettings ...
          #     Build settings from command line:
          #     SDKROOT = iphoneos26.5
          #     ...
          #     ARCHS = arm64
          #
          # A perfectly good settings dump -- and BOTH keys are alphabetical, so
          # they are hundreds of lines BELOW the 25 this printed. The dump was
          # never the problem; my diagnostic was, and it hid the answer that would
          # have answered the question immediately.
          #
          # So two changes. The resolution no longer depends on two settings
          # being EMITTED at all: TARGET_BUILD_DIR resolved fine on the previous run
          # and is what the product directory actually is, and there is exactly one
          # .app directly inside it. The executable name is taken from the bundle
          # name -- the Apple convention, and what the log shows:
          #
          #     Ld    .../Debug-iphoneos/App.app/App normal (in target 'App')
          #     Touch .../Debug-iphoneos/App.app      (in target 'App')
          #
          # FULL_EXECUTABLE_NAME is still consulted when present and when the file
          # it names exists, because that is the authoritative answer; existence is
          # what decides, not preference.
          BUILD_DIR=$(printf '%s\n' "$SETTINGS" \
            | awk -F' = ' '/ TARGET_BUILD_DIR /&&!seen {print $2; seen=1}')
          [ -n "$BUILD_DIR" ] || {
            echo "::error::$HOW returned no TARGET_BUILD_DIR."
            echo "::error::the settings keys this step reads, from its own output:"
            printf '%s\n' "$SETTINGS" \
              | grep -E ' (TARGET_BUILD_DIR|BUILT_PRODUCTS_DIR|FULL_PRODUCT_NAME|FULL_EXECUTABLE_NAME|PRODUCT_NAME|TARGET_NAME|CONFIGURATION) = ' \
              | sed 's/^/    /' || true
            echo "::error::($(printf '%s\n' "$SETTINGS" | grep -c ' = ') settings lines total)"
            exit 1
          }
          echo "  TARGET_BUILD_DIR = $BUILD_DIR"

          APP=$(find "$BUILD_DIR" -maxdepth 1 -name '*.app' 2>/dev/null | sed -n '1p')
          [ -n "$APP" ] || {
            echo "::error::no .app directly inside $BUILD_DIR."
            echo "::error::what IS in it:"
            ls -1 "$BUILD_DIR" 2>/dev/null | sed -n '1,20p' | sed 's/^/    /' || true
            exit 1
          }
          BASE=$(basename "$APP" .app)
          EXE_NAME=$(printf '%s\n' "$SETTINGS" \
            | awk -F' = ' '/ FULL_EXECUTABLE_NAME /&&!seen {print $2; seen=1}')
          if [ -n "$EXE_NAME" ] && [ -f "$APP/$EXE_NAME" ]; then
            echo "  executable name: FULL_EXECUTABLE_NAME = $EXE_NAME (file exists)"
          else
            EXE_NAME="$BASE"
            echo "  executable name: derived from the bundle = $EXE_NAME"
          fi
          echo "  product = $APP"
          if [ ! -d "$APP" ]; then
            echo "::error::$APP does not exist, so $HOW named a product that was"
            echo "::error::never built. There is deliberately NO find fallback here:"
            echo "::error::a fallback that silently resolves a DIFFERENT product is"
            echo "::error::how a simulator build gets verified as a device build -- and"
            echo "::error::the previous version's find did exactly that, returning empty"
            echo "::error::and letting the step carry on with an empty path."
            exit 1
          fi
          # Asserted by DIRECTORY NAME, which is the thing that distinguishes a
          # device product from a simulator one. Both slices are arm64, so `lipo`
          # alone cannot tell them apart and would have passed a simulator build
          # presented as a device build.
          case "$APP" in
            *Debug-iphoneos/*|*Release-iphoneos/*) echo "  device product: YES" ;;
            *) echo "::error::$APP is not a Debug-iphoneos/Release-iphoneos"
               echo "::error::product -- so this step did not build the DEVICE"
               echo "::error::slice. A simulator product is also arm64, so the"
               echo "::error::architecture check below would PASS it. The directory"
               echo "::error::name is what distinguishes the two."
               exit 1 ;;
          esac

          EXE="$APP/$EXE_NAME"
          [ -f "$EXE" ] || { echo "::error::no $EXE_NAME executable in $APP"; exit 1; }

          # The executable must be Mach-O arm64. `file`, because on a Mach-O the
          # same `file -b` behaviour that cost runs on Linux archives does not
          # apply -- but assert the words, not just the exit status, because a
          # successful `file` on the wrong architecture is still a wrong build.
          FILEOUT=$(file -b "$EXE")
          echo "  executable: $FILEOUT"
          case "$FILEOUT" in
            *"Mach-O 64-bit executable arm64"*) echo "  arch: arm64" ;;
            *) echo "::error::$EXE_NAME is not a Mach-O arm64 executable: $FILEOUT"
               exit 1 ;;
          esac

          # THE ENGINE IS ASSERTED ON THE APP BINARY, AND THAT IS A STRONGER
          # CHECK THAN THE ONE IT REPLACES.
          #
          # Run 36814592966 resolved the product correctly and then:
          #
          #   TARGET_BUILD_DIR = .../Build/Products/Debug-iphoneos
          #   executable name: derived from the bundle = App
          #   product:          .../Debug-iphoneos/App.app
          #   device product:   YES
          #   executable:       Mach-O 64-bit executable arm64
          #   ::error::no GsFfi.framework inside the DEVICE .app at ...
          #
          # Because there is no framework to embed. ios/project.yml links
          # `- framework: Frameworks/GsFfi.xcframework`, and the xcframework is
          # assembled with `xcodebuild -create-xcframework -library` from
          # libgs_ffi.a -- a STATIC archive. A static framework has nothing to load
          # at runtime, so it is linked into the executable and deliberately not
          # copied into the bundle. Its absence from Frameworks/ is CORRECT
          # behaviour and my assertion treated it as a link failure.
          #
          # So the question changes from "is a framework present" to "is the
          # engine's code INSIDE the device binary", and the second is the better
          # question: a present-but-never-loaded framework would satisfy the first,
          # and a statically linked engine would fail it.
          #
          # The embedded framework is still REPORTED, because which shape a build
          # produced is worth knowing and costs nothing.
          if [ -d "$APP/Frameworks/GsFfi.framework" ]; then
            echo "  embedded framework: PRESENT (dynamic link)"
          else
            echo "  embedded framework: absent -- expected for a static xcframework,"
            echo "                     which xcodebuild links into the executable"
          fi

          # THE ENGINE IS PROVEN BY THE ARCHIVE THE DEVICE LINKED, NOT BY THE
          # APP'S OWN SYMBOL TABLE.
          #
          # Run 36816078754, with the app-binary check in place:
          #
          #   ::error::the DEVICE app binary does not DEFINE: gs_ffi_mobile_...
          #   ::error::nm returned 0
          #
          # `nm` returning zero lines on a file `file -b` had just called
          # "Mach-O 64-bit executable arm64" is correct behaviour, not a failure.
          # An iOS APP EXECUTABLE's global symbols are stripped: nothing links
          # against them, so the linker is free to remove them, and the engine's
          # `#[no_mangle] pub extern "C"` entry points are internal to the app.
          # The same `nm -a` on the ARCHIVE shows every one of them.
          #
          # So the check moves to the device slice of the xcframework, which is
          # what the app target links:
          #
          #     ios/Frameworks/GsFfi.xcframework/ios-arm64/libgs_ffi.a
          #
          # (xcodebuild prints that path in the device build log, which is how it
          # was located.) `ios-arm64`, not `ios-arm64-simulator`: the device slice
          # is the one under test, and checking the simulator archive here would be
          # a green run that proves nothing about the device.
          DEVICE_LIB=""
          for CAND in \
            "$GITHUB_WORKSPACE/ios/Frameworks/GsFfi.xcframework/ios-arm64/libgs_ffi.a" \
            "$GITHUB_WORKSPACE/ios/Frameworks/GsFfi.xcframework/ios-arm64/GsFfi.framework/GsFfi"
          do
            if [ -f "$CAND" ]; then DEVICE_LIB="$CAND"; break; fi
          done
          if [ -z "$DEVICE_LIB" ]; then
            DEVICE_LIB=$(find "$GITHUB_WORKSPACE/ios/Frameworks/GsFfi.xcframework" \
              -path '*ios-arm64*' \( -name 'libgs_ffi.a' -o -name 'GsFfi' \) \
              2>/dev/null | sed -n '1p')
          fi
          if [ -z "$DEVICE_LIB" ] || [ ! -f "$DEVICE_LIB" ]; then
            echo "::error::no DEVICE slice of GsFfi.xcframework was found."
            echo "::error::what the xcframework actually contains:"
            find "$GITHUB_WORKSPACE/ios/Frameworks/GsFfi.xcframework" -maxdepth 2 \
              2>/dev/null | sed -n '1,20p' | sed 's/^/    /' || true
            echo "::error::without an ios-arm64 slice there is no device engine to"
            echo "::error::have linked, so nothing below can mean anything."
            exit 1
          fi
          echo "  device slice: $DEVICE_LIB"
          echo "  file says:    $(file -b "$DEVICE_LIB")"

          # THE REPOSITORY OWNS THE READER, AND I DO NOT GET TO PICK IT.
          #
          # Two attempts to pick it myself, both wrong:
          #
          #   run 36818412286  `nm -a`      -> 0 symbols, reader failure swallowed
          #   run 36819532571  find "$SYSROOT" -name llvm-nm
          #     ::error::no llvm-nm in the Rust sysroot
          #       (/Users/runner/.rustup/toolchains/stable-aarch64-apple-darwin)
          #
          # llvm-nm is not in the plain sysroot. It ships in the `llvm-tools`
          # component, which count_exported_symbols.sh knows to install and which
          # I did not. So the discovery is re-implemented, wrongly, on top of a
          # script that already does it correctly.
          #
          # So: run the script, take the reader IT used off its own stderr, and
          # do not re-derive anything. Its stdout is the count; its stderr is the
          # reader diagnostics, which it prints deliberately loudly because "a
          # toolchain that cannot read its own build output is worth knowing about
          # even when a workaround exists, because the next thing to use nm -- a
          # link check, a size report, a crash triage -- will hit it again".
          CNT_ERR=$(mktemp)
          if ! COUNT=$(bash "$GITHUB_WORKSPACE/.github/scripts/count_exported_symbols.sh" \
                        "$DEVICE_LIB" gs_ffi_mobile 2>"$CNT_ERR"); then
            echo "::error::the repository's own symbol counter could not read the"
            echo "::error::device slice. That is the reader-failure case and NOT an"
            echo "::error::empty archive. Its diagnostics:"
            sed 's/^/    /' "$CNT_ERR" | sed -n '1,12p'
            rm -f "$CNT_ERR"
            exit 1
          fi
          echo "  gs_ffi_mobile_* exported (repo's own counter): $COUNT"

          LLVM_NM=$(sed -n 's/^reader: //p' "$CNT_ERR" | sed -n '1p')
          echo "  --- its reader diagnostics ---"
          sed 's/^/    /' "$CNT_ERR" | sed -n '1,6p'
          rm -f "$CNT_ERR"
          if [ -z "$LLVM_NM" ] || [ ! -x "$LLVM_NM" ]; then
            echo "::error::the counter ran but did not report which reader it used"
            echo "::error::(\"$LLVM_NM\"), so there is no reader to verify names with."
            echo "::error::Not falling back to Apple's nm: it rejects these objects"
            echo "::error::and reports 0, which is the bug this step already hit once."
            exit 1
          fi
          echo "  reader: $LLVM_NM"

          # 2>&1, EXACTLY AS count_exported_symbols.sh DOES IT.
          #
          # Run 36822191969 reported "the reader returned nothing" while the
          # repository's own counter, same reader and same flags, printed 10. My
          # first explanation was that llvm-nm writes its output to stderr and I
          # had sent it to /dev/null. That was WRONG, and the real cause was
          # simpler: the line assigning NAMES had been DELETED by my own previous
          # edit, so `$NAMES` was empty and every count downstream counted
          # nothing. `bash -n` cannot see a deleted assignment, and the block still
          # parsed and still passed the lint.
          #
          # So the assignment is back, and immediately checked for non-emptiness,
          # because "a variable that is read but never assigned" is exactly the
          # failure a syntax check cannot catch and a guard can.
          #
          # 2>&1 is still the right spelling and it is the script's, so diagnostics
          # arriving on the same stream are kept rather than discarded. The symbol
          # regex is what makes that safe -- it requires
          # [[:space:]][TDRS][[:space:]]_<name> at end of line, so a version-skew
          # warning cannot satisfy it -- and non-symbol lines are printed, not
          # swallowed.
          NAMES=$("$LLVM_NM" --defined-only --extern-only "$DEVICE_LIB" 2>&1 || true)
          if [ -z "$NAMES" ]; then
            echo "::error::the reader produced NO OUTPUT AT ALL, so NAMES is empty"
            echo "::error::and every count below would be counting nothing. Run this"
            echo "::error::by hand and report what it says:"
            echo "::error::    $LLVM_NM --defined-only --extern-only $DEVICE_LIB"
            exit 1
          fi
          READER_DIAG=$(printf '%s\n' "$NAMES" \
            | grep -vE '^[[:space:]]*[0-9a-fA-F]+[[:space:]]+[A-Za-z][[:space:]]_' \
            | sed -n '1,5p')
          if [ -n "$READER_DIAG" ]; then
            echo "  --- reader diagnostics (first 5 non-symbol lines) ---"
            printf '%s\n' "$READER_DIAG" | sed 's/^/    /'
          fi

          # THE SYMBOLS ARE THE FACT, AND A READER RETURNING NOTHING IS NOT IT.
          #
          # `grep -c` prints 0 AND exits 1 when nothing matches, so
          #
          #     NM_LINES=$(... | grep -c ' = ' 2>/dev/null || printf '0')
          #
          # produced the TWO-LINE string "0\n0". Then `[ "$NM_LINES" -lt 1 ]` failed
          # to parse, an `if` condition that errors is FALSE, and the guard this
          # line was protecting was skipped without a word. Demonstrated locally:
          #
          #     NM_LINES = [0
          #     0]
          #     GUARD SILENTLY SKIPPED -- [ ] errored
          #
          # Two bugs in one line: a counting idiom that emits a value on both
          # paths, and a numeric test that fails OPEN when its argument is not a
          # number. The first version of this also grepped for ' = ', which is
          # xcodebuild -showBuildSettings syntax and appears nowhere in nm output.
          #
          # So: one value, from one path, and the guard validated before it
          # compares.
          NM_LINES=$(printf '%s\n' "$NAMES" | grep -c . || true)
          case "$NM_LINES" in
            ''|*[!0-9]*)
              echo "::error::the symbol line count came out as [$NM_LINES], which is"
              echo "::error::not a number, so no comparison against it means anything."
              exit 1
              ;;
          esac
          echo "  reader --defined-only --extern-only returned $NM_LINES line(s)"
          if [ "$NM_LINES" -lt 1 ]; then
            echo "::error::the reader produced no SYMBOL lines for the device"
            echo "::error::slice, though it produced $NM_LINES line(s) of something."
            echo "::error::The repository's own counter, same reader and same flags,"
            echo "::error::reported: gs_ffi_mobile_* exported: $COUNT"
            echo "::error::If those disagree, the disagreement IS the bug. Reproduce:"
            echo "::error::    $LLVM_NM --defined-only --extern-only $DEVICE_LIB"
            exit 1
          fi

          # ALL TEN, AND THE LIST IS READ FROM THE SOURCE RATHER THAN REMEMBERED.
          #
          # The previous version checked four names and one of them --
          # gs_ffi_mobile_load_model -- DOES NOT EXIST. grep over
          # native/crates/gs-ffi/src/mobile.rs:
          #
          #     $ grep -c 'gs_ffi_mobile_load_model' native/crates/gs-ffi/src/mobile.rs
          #     0
          #
          # I wrote it from memory. It was caught only because the repository's own
          # counter was printing 10 while my check was missing one of four -- the
          # counter is what turned a wrong assertion into a visible disagreement
          # instead of a search for a reader bug that did not exist.
          #
          # Model loading is gs_ffi_mobile_create; there is no load_model entry
          # point, on any ABI. The complete set, from the source:
          #
          #   abi_version backend_available build_info chat create
          #   embed_dim embed_image free ocr should_use_local
          MISSING=""
          for S in gs_ffi_mobile_abi_version \
                   gs_ffi_mobile_backend_available \
                   gs_ffi_mobile_build_info \
                   gs_ffi_mobile_chat \
                   gs_ffi_mobile_create \
                   gs_ffi_mobile_create_tuned \
                   gs_ffi_mobile_embed_dim \
                   gs_ffi_mobile_embed_image \
                   gs_ffi_mobile_free \
                   gs_ffi_mobile_ocr \
                   gs_ffi_mobile_should_use_local
          do
            # Build the pattern in a variable, expand it UNQUOTED, escape the
            # anchor as \$, and require a DEFINED type letter rather than `U`.
            # `"$S"` written inline inside [[ =~ ]] does NOT interpolate -- every
            # symbol came back missing when tested that way.
            #
            # Run against six shapes of nm output before going in. The one that
            # decides whether this check is worth anything:
            #
            #   all DEFINED as `T`     -> MISSING=[]
            #   all UNDEFINED as `U`   -> MISSING=[ all of them ]
            #
            # `--defined-only --extern-only` already excludes `U`, so that case is
            # belt-and-braces rather than expected here. Also tested:
            # `_gs_ffi_mobile_chat_v2` does not satisfy `_gs_ffi_mobile_chat`; a
            # symbol as the last line with no trailing newline does match; empty
            # output reports all ten rather than passing vacuously.
            RE="[[:space:]][TDRS][[:space:]]_${S}([[:space:]]|\$)"
            if [[ ! "$NAMES" =~ $RE ]]; then
              MISSING="$MISSING $S"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::the DEVICE slice does not DEFINE:$MISSING"
            echo "::error::the reader returned $NM_LINES line(s) and it is the one the"
            echo "::error::repository's own counter used, so this is a real absence"
            echo "::error::rather than a reader problem. What it DID find, first 10:"
            printf '%s\n' "$NAMES" | grep 'gs_ffi' | sed -n '1,10p' | sed 's/^/    /' || true
            exit 1
          fi
          echo "  all ten gs_ffi_mobile_* DEFINED in the DEVICE slice"

          # Reported, not asserted. An iOS APP EXECUTABLE's globals are stripped --
          # nothing links against them, so the linker may remove them, and the
          # engine's entry points are internal to the app. A low count here is the
          # CORRECT result and a high one would be surprising.
          APP_NM=$(nm -a "$EXE" 2>/dev/null | grep -c . || true)
          case "$APP_NM" in
            ''|*[!0-9]*) APP_NM="unreadable" ;;
          esac
          echo "  app binary symbol lines: $APP_NM (Apple nm; low is EXPECTED here and"
          echo "                         is not evidence about the engine)"

          echo "=== DEVICE BUILD VERIFIED ==="
          echo "  product      : $APP"
          echo "  architecture : arm64 Mach-O, under Debug-iphoneos"
          echo "  device slice : $DEVICE_LIB"
          echo "                 defines all ten gs_ffi_mobile_* entry points:"
          echo "                 abi_version, backend_available, build_info, chat,"
          echo "                 create, embed_dim, embed_image, free, ocr,"
          echo "                 should_use_local"
          echo "  linked in    : proven by the unguarded gs_ffi_mobile_backend_available()"
          echo "                 call in GsNative.swift -- no module fails the COMPILE,"
          echo "                 no symbols fail the LINK, and neither happened."
          echo
          echo "  NOT verified: a signed .ipa. That needs an identity and a"
          echo "  provisioning profile this repository does not have, and the gap"
          echo "  between linking for a device and installing on one is signing."
          echo "  NOT verified: execution. Nothing here runs the device binary."

      - name: Build the app for the simulator
        run: |
          set -euo pipefail
          cd ios
          # -sdk iphonesimulator, because the only slice we can RUN is the
          # simulator one; the device slice needs a signing identity and a
          # physical device.
          #
          # `canImport(GsFfi)` is asserted by the build itself: GsNative.swift
          # calls gs_ffi_mobile_backend_available() UNGUARDED, so if the module
          # were missing the compile would fail with "cannot find 'GsFfi' in
          # scope" rather than quietly compiling the fallback branch. That is
          # deliberate -- see the note in project.yml.
          xcodebuild build             -project GSApp.xcodeproj             -scheme GSApp             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             2>&1 | tee build-simulator.log
          echo "=== build steps that ran ==="
          grep -cE '^ *[A-Z]?[a-z]*CompileSwiftSources' build-simulator.log || true
          echo "=== the product ==="
          # `sed -n '1,3p'`, not `| head -3`. This is a diagnostic line in the
          # middle of a `set -euo pipefail` step, which is the worst place for one:
          # head closes the pipe, find takes SIGPIPE and exits 141, and the step
          # dies while printing a DIAGNOSTIC -- so the log ends with no product
          # listed and an error that points at nothing. Found by
          # .github/scripts/check_pipefail_traps.py.
          find ~/Library/Developer/Xcode/DerivedData -name '*.app' -maxdepth 4 2>/dev/null \
            | sed -n '1,3p'

      # THE FIVE SKIPS TRACED TO ONE MISSING THING, AND THIS IS IT.
      #
      # Run 36753918296 had the iOS job green and `buildInfo -> gs-ffi 0.1.0 +llama`,
      # which proves the build CONTAINS llama.cpp, and still could not prove the
      # engine ANSWERS a prompt, because:
      #
      #   testChatReturnsNonEmptyText                      skipped   no GGUF
      #   testSamePromptTwiceIsIdentical                   skipped   no GGUF
      #   testFailureThrowsRatherThanReturningEmptyString  skipped   isAvailable
      #   testEmbedImageRejectsShortBuffer                 skipped   isAvailable
      #   testOcrReturnsTextOnFixture                      skipped   no fixture
      #
      # The last three are downstream of the first two, not independent:
      # `isAvailable` is `ensureLoaded() && GsNative.backendAvailable()`, and
      # backendAvailable is guarded by `guard let context`, so it is FALSE on a
      # perfectly good build until a model is loaded. So one 0.5B GGUF makes four of
      # the five runnable, and a fixture PNG makes the fifth.
      #
      # No weights in git and no step that fetched one, which is exactly why "the
      # build has llama" and "the engine answered" have been separate claims.
      - name: Provision the model and the OCR fixture the five skipped tests need
        run: |
          set -uo pipefail

          UDID=$(xcrun simctl list devices available -j \
                 | python3 "$GITHUB_WORKSPACE/.github/scripts/pick_simulator_udid.py") || {
            echo "::error::no usable iPhone simulator on this runner"
            xcrun simctl list devices available || true
            exit 1
          }
          echo "simulator udid: $UDID"
          # Already-booted is a success, not a failure: this step may not be the
          # first thing to touch the device.
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b || {
            echo "::error::the simulator did not finish booting"
            exit 1
          }

          WORK="$RUNNER_TEMP/provision"
          mkdir -p "$WORK"
          GGUF="$WORK/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          URL="https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          WANT_SHA="74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db"
          WANT_BYTES="491400032"

          # CACHED BETWEEN RUNS, and the cache key includes the hash being asked
          # for, so a changed model can never be served from a stale entry.
          echo "::group::fetch the model"
          if [ -f "$GGUF" ] \
             && [ "$(stat -f%z "$GGUF" 2>/dev/null || stat -c%s "$GGUF")" = "$WANT_BYTES" ]; then
            echo "already fetched and the right size; the hash is re-checked below"
          else
            curl -fL --retry 3 --retry-delay 5 -o "$GGUF" "$URL" || {
              echo "::error::could not download $URL"
              exit 1
            }
          fi
          # SIZE FIRST, THEN HASH. A truncated download has a wrong length, and
          # saying so is more useful than a hash mismatch with no explanation.
          GOT_BYTES=$(stat -f%z "$GGUF" 2>/dev/null || stat -c%s "$GGUF")
          echo "bytes: $GOT_BYTES (want $WANT_BYTES)"
          if [ "$GOT_BYTES" != "$WANT_BYTES" ]; then
            echo "::error::the download is $GOT_BYTES bytes, not $WANT_BYTES."
            echo "::error::Truncated, so the hash would fail for no informative reason."
            exit 1
          fi
          GOT_SHA=$(shasum -a 256 "$GGUF" | awk '{print $1}')
          echo "sha256: $GOT_SHA"
          if [ "$GOT_SHA" != "$WANT_SHA" ]; then
            echo "::error::sha256 is $GOT_SHA, not $WANT_SHA"
            exit 1
          fi
          echo "VERIFIED: 0.5B model is the bytes and the hash android-device measures"
          echo "::endgroup::"

          echo "::group::write the OCR fixture"
          # THE RENDERER THAT ALREADY EXISTS, and the text it already defaults to.
          #
          # I first wrote a second one -- a 5x7 bitmap font at scale 3, gap 1 --
          # before looking for an existing one. Deleting that was the right call,
          # because .github/scripts/make_invoice_png.py has already been through
          # four revisions against a real OCR engine, and its own header records
          # what the naive version gets wrong:
          #
          #   * glyphs stored as 35-character strings, ten of the wrong length, so
          #     slicing into rows shifted them and ML Kit read
          #         IMJOICE IMYAA71 DUE 2926-03-g1
          #   * spacing: scale=6/gap=2 merged strokes ("4471" -> "447"); gap=4
          #     read as a space ("4 471"); gap=3 with scale=8 fixed every digit
          #   * a 5x7 "V" is genuinely ambiguous and read as "Y", giving
          #         INYOICE INY-4471 DUE 2026-03-01
          #
          # So my scale-3/gap-1 version would have produced a fixture that OCR
          # misreads, on the platform where the point is to prove OCR reads it.
          # Its DEFAULT_TEXT is the very string the Android fixture asserts
          # verbatim, so the two platforms stay comparable.
          #
          # It tries a real typeface first and falls back to the 5x7 font, and it
          # prints which path ran -- a fixture that silently degrades is a fixture
          # nobody can reason about.
          python3 "$GITHUB_WORKSPACE/.github/scripts/make_invoice_png.py" \
            "$WORK/invoice.png" "INVOICE INV-4471 DUE 2026-03-01" || {
            echo "::error::the fixture renderer failed"
            exit 1
          }
          # Read the signature back, so "we wrote a file" is not the claim --
          # "the file is a PNG" is.
          FIX_SIG=$(python3 -c "import sys;print(open(sys.argv[1],'rb').read(8).hex())" "$WORK/invoice.png")
          echo "fixture signature: $FIX_SIG (want 89504e470d0a1a0a)"
          if [ "$FIX_SIG" != "89504e470d0a1a0a" ]; then
            echo "::error::the fixture is not a PNG"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::install the app and put both where the tests look"
          # WHERE THE APP IS, ASKED RATHER THAN GUESSED.
          #
          # The first version used
          #
          #     find ~/Library/Developer/Xcode/DerivedData -name 'GSApp.app' -maxdepth 4
          #
          # and run 36757667662 failed with "no GSApp.app in DerivedData" while the
          # app was there, one directory deeper:
          #
          #     DerivedData/Build-<hash>/Build/Products/Debug-iphonesimulator/GSApp.app
          #
          # Five levels, not four -- the <hash> directory is the one I forgot. A
          # hardcoded depth is the same mistake as a hardcoded `name=iPhone 16` or a
          # hardcoded /Applications/Xcode_16.2.app, and all three have cost runs
          # here. Every one of them is a question the toolchain answers.
          #
          # So ask it. -showBuildSettings is authoritative AND destination-aware,
          # which matters because the products directory differs between a device
          # build and a simulator build and this runs against a simulator.
          #
          # The find is kept as a fallback, and the step says which one it used.
          # # A silent fallback is what made this hard to diagnose: the log said
          # # "no GSApp.app" with no hint that a depth had been guessed.
          cd "$GITHUB_WORKSPACE/ios"
          SETTINGS=$(xcodebuild -showBuildSettings \
                       -project GSApp.xcodeproj -scheme GSApp \
                       -destination "id=$UDID" 2>/dev/null || true)
          APP=$(printf '%s\n' "$SETTINGS" \
                | awk -F' = ' '/ BUILT_PRODUCTS_DIR /{d=$2} / FULL_PRODUCT_NAME /{n=$2}
                               END{if(d && n) print d"/"n}')
          HOW="xcodebuild -showBuildSettings"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "  -showBuildSettings did not resolve a built product; falling back to find"
            printf '%s\n' "$SETTINGS" | sed -n '1,25p' | sed 's/^/    /'
            # `-name 'GSApp.app'` WAS HERE AND IT IS DEAD CODE. The product is
            # `App.app` -- project.yml leaves PRODUCT_NAME at the XcodeGen default
            # so the AppTests TEST_HOST resolves -- so this fallback could never
            # have matched anything. The same wrong name my own step had, already
            # shipped. `*.app` plus the simulator path, because this fallback
            # exists to find a SIMULATOR product.
            APP=$(find ~/Library/Developer/Xcode/DerivedData -name '*.app' \
                  -path '*iphonesimulator*' -maxdepth 6 2>/dev/null \
                  | sed -n '1,3p')
            HOW="find -maxdepth 6 (FALLBACK)"
          fi
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::no built App.app, so there is no container to provision"
            echo "::error::$HOW found nothing. What is actually there:"
            find ~/Library/Developer/Xcode/DerivedData -name '*.app' -maxdepth 6 2>/dev/null \
              | sed -n '1,10p' | sed 's/^/  /'
            exit 1
          fi
          echo "app: $APP   (from $HOW)"
          xcrun simctl install "$UDID" "$APP" || {
            echo "::error::simctl install failed"
            exit 1
          }
          BUNDLE_ID=com.grapsee.gsai
          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data) || {
            echo "::error::no data container for $BUNDLE_ID"
            exit 1
          }
          # `create: false` in the test means the directory must already EXIST or
          # FileManager.url returns nil and every model-backed test skips no
          # matter what was copied in. So it is created here, explicitly.
          SUPPORT="$CONTAINER/Library/Application Support"
          mkdir -p "$SUPPORT"
          cp "$GGUF" "$SUPPORT/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          cp "$WORK/invoice.png" "$SUPPORT/invoice.png"
          echo "container: $CONTAINER"
          echo "Application Support now holds:"
          ls -l "$SUPPORT" | sed 's/^/  /'
          # Read the copied file's hash back from ITS final location, not from the
          # staging copy: the thing that must be right is the file the test opens.
          FINAL_SHA=$(shasum -a 256 "$SUPPORT/qwen2.5-0.5b-instruct-q4_k_m.gguf" | awk '{print $1}')
          echo "model in the container: $FINAL_SHA"
          if [ "$FINAL_SHA" != "$WANT_SHA" ]; then
            echo "::error::the copy in the container does not match the verified download"
            exit 1
          fi
          echo "::endgroup::"
          echo "$UDID" > "$RUNNER_TEMP/provisioned_udid"

          echo "$UDID" > "$RUNNER_TEMP/provisioned_udid"

      # =========================================================================
      # WHICH ARCH DO THE TESTS ACTUALLY EXECUTE ON?
      #
      # The brief asks for that number, and until now the workflow never stated
      # it. It is knowable, and it is knowable in THREE ways that can disagree,
      # which is why all three are printed and the two that can be wrong are
      # asserted:
      #
      #   1. `uname -m`                     the HOST
      #   2. `lipo -info` on the built .app  the BINARY that will be installed
      #   3. `simctl getenv SIMULATOR_ARCHS` the SIMULATOR the tests run in
      #
      # (1) is the host, not the simulator, and a GitHub `macos-latest` label is
      # an ARM64 MACHINE running an arm64 simulator -- so the two usually agree
      # and agree for the wrong reason. If GitHub ever moves the label to Intel,
      # (1) becomes x86_64 and the tests would run on the EMULATED path, and the
      # only thing that would notice is a test that asserts on arch. There is no
      # such test.
      #
      # (2) is what the .so is actually linked into, and it is asserted: the
      # library slices are already arch-checked by assert_arch_member.sh, but
      # that checks the STATIC ARCHIVE, not the executable that ends up in the
      # .app. A scheme that builds the app for iphonesimulator on an Intel host
      # produces an x86_64 App binary that links the arm64-sim slice happily.
      #
      # (3) is the only one that answers the question as asked: what the
      # simulator will EXECUTE. It is reported, not asserted, because a fat
      # binary listing both architectures is legitimate and failing on it would
      # be wrong.
      #
      # NOT a device test. There is no physical iOS device on this runner and no
      # signing identity in this repository, so "device" is unreachable here --
      # the DEVICE SLICE is built and arch-verified (`Debug-iphoneos`,
      # `ios-arm64`, `Mach-O 64-bit executable arm64`) but nothing RUNS it.
      # Saying "iOS is green" therefore means "the simulator tests are green",
      # and this step makes that visible in the log rather than leaving it to be
      # inferred.
      # =========================================================================
      - name: Report and assert the architecture the tests execute on
        run: |
          set -euo pipefail

          # THE UDID IS RE-DISCOVERED, NOT TAKEN FROM AN `env:` OR A STEP OUTPUT.
          #
          # There is no `id:` on the provisioning step and no `outputs:` block in
          # this job, so `${{ steps.provision.outputs.udid }}` would have expanded
          # to an EMPTY STRING -- and an empty UDID makes `simctl getenv` and
          # `simctl install` fail with errors that name neither the cause nor the
          # step. A wrong assumption about where something IS, written as a
          # reference, is indistinguishable from the thing it is not.
          #
          # Re-discovering with the SAME script the test step uses
          # (pick_simulator_udid.py) is what makes this step inspect the simulator
          # the tests will ACTUALLY use, rather than whichever one happens to sort
          # first. Two different simulators would make the answer a different
          # number from the question.
          #
          # `set -e` is enabled only AFTER the discovery, because the test step
          # does the same: `simctl list` on a runner still booting can exit
          # non-zero and pipefail would abort before the diagnostic runs.
          set -uo pipefail
          UDID=$(xcrun simctl list devices available -j \
                 | python3 "$GITHUB_WORKSPACE/.github/scripts/pick_simulator_udid.py") || {
            echo "::error::no usable iPhone simulator on this runner, so there is"
            echo "::error::nothing to report an architecture for."
            xcrun simctl list devices available || true
            xcrun simctl list runtimes available || true
            exit 1
          }
          echo "simulator udid: $UDID"
          set -euo pipefail

          echo "=== the arch, from three sources that can disagree ==="

          HOST_ARCH=$(uname -m)
          echo "host (uname -m)            : $HOST_ARCH"
          case "$HOST_ARCH" in
            arm64) echo "  Apple Silicon. A simulator here runs arm64 natively." ;;
            x86_64) echo "  Intel. Simulators here are x86_64, and arm64 is" \
                        echo "  EMULATED -- slower, and a different code path." ;;
            *) echo "  ::warning::unexpected host arch $HOST_ARCH" ;;
          esac

          # ---- the binary that will be installed ----
          cd "$GITHUB_WORKSPACE/ios"
          SETTINGS=$(xcodebuild -showBuildSettings \
                       -project GSApp.xcodeproj -scheme GSApp \
                       -destination "id=$UDID" 2>/dev/null || true)
          APP=$(printf '%s\n' "$SETTINGS" \
                | awk -F' = ' '/ BUILT_PRODUCTS_DIR /{d=$2} / FULL_PRODUCT_NAME /{n=$2}
                               END{if(d && n) print d"/"n}')
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::warning::could not resolve the built .app from -showBuildSettings;"
            echo "::warning::falling back to a find for an iphonesimulator product."
            APP=$(find ~/Library/Developer/Xcode/DerivedData -name '*.app' \
                  -path '*iphonesimulator*' -maxdepth 6 2>/dev/null | sed -n '1p')
          fi
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::no .app found, so the executable's arch cannot be read."
            echo "::error::The previous step installed one successfully, so this is"
            echo "::error::a lookup problem, not a missing product."
            exit 1
          fi

          EXE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
                      "$APP/Info.plist" 2>/dev/null || true)
          if [ -z "$EXE_NAME" ]; then
            # NOT `basename`. The executable is named by the plist and is
            # routinely NOT the app's name -- the same lesson as PRODUCT_NAME
            # being App rather than GSApp, which is why the fallback here is a
            # glob and the failure names what it looked for.
            echo "::warning::CFBundleExecutable did not resolve; globbing the bundle"
            EXE=$(find "$APP" -maxdepth 1 -type f -perm -u+x 2>/dev/null | sed -n '1p')
          else
            EXE="$APP/$EXE_NAME"
          fi
          if [ -z "${EXE:-}" ] || [ ! -f "$EXE" ]; then
            echo "::error::no executable inside $APP"
            ls -la "$APP" | sed -n '1,20p' | sed 's/^/::error::    /'
            exit 1
          fi

          echo "app bundle                  : $APP"
          echo "executable                  : $EXE"
          echo "executable (file -b)        : $(file -b "$EXE")"
          LIPO=$(lipo -info "$EXE" 2>/dev/null || echo '<lipo failed>')
          echo "executable (lipo -info)     : $LIPO"

          # ASSERTED. A simulator product must be arm64 or x86_64 -- never an
          # iPhoneOS device product, which would mean the tests are pointed at
          # something they cannot run on, and never arm64e alone.
          if ! printf '%s' "$LIPO" | grep -Eq 'x86_64|arm64'; then
            echo "::error::the built executable declares neither arm64 nor x86_64:"
            echo "::error::  $LIPO"
            echo "::error::A simulator .app must be one of those two. This is the"
            echo "::error::state where a check that only greps for 'arm64' would pass."
            exit 1
          fi

          # ---- the simulator itself ----
          SIM_ARCHS=$(xcrun simctl getenv "$UDID" SIMULATOR_ARCHS 2>/dev/null || echo '<unavailable>')
          echo "simulator SIMULATOR_ARCHS   : $SIM_ARCHS"
          if [ "$SIM_ARCHS" = "<unavailable>" ] || [ -z "$SIM_ARCHS" ]; then
            echo "::warning::SIMULATOR_ARCHS is not readable on this runner. The host"
            echo "::warning::arch and the executable arch above are what is known."
          fi

          # A PREDICTION, NOT THE ANSWER.
          #
          # This block runs BEFORE any test, so nothing here can know what
          # executed. It infers the arch from SIMULATOR_ARCHS, which is a
          # CAPABILITY: on ios-native 37023563596 it read `arm64 x86_64` and the
          # tests went on to execute x86_64, which happened to agree -- by luck,
          # not by measurement, and on a different runner it could read `arm64
          # x86_64` and the tests could run x86_64 for a different reason.
          #
          # So it is written to $GITHUB_ENV as a prediction, and the step that
          # actually runs the tests asserts the prediction against what the test
          # PROCESS reports about itself. The answer is printed there, after the
          # evidence exists.
          if printf '%s' "$SIM_ARCHS" | grep -q 'arm64' && \
             ! printf '%s' "$SIM_ARCHS" | grep -q 'x86_64'; then
            PREDICT="arm64"
          elif printf '%s' "$SIM_ARCHS" | grep -q 'x86_64'; then
            PREDICT="x86_64"
          else
            PREDICT="<unknown>"
          fi
          echo "predicted arch, to be CONFIRMED by the test process: $PREDICT"
          printf 'GS_IOS_PREDICTED_ARCH=%s\n' "$PREDICT" >> "$GITHUB_ENV"

          echo
          echo "=========================================================="
          echo " iOS TESTS WILL EXECUTE ON (predicted): $PREDICT"
          echo " They run on a SIMULATOR, not a physical device."
          echo " This is inferred from SIMULATOR_ARCHS and is NOT the answer."
          echo " The measured answer is printed by the XCTest step below,"
          echo " from the arch the test process itself reports."
          echo "=========================================================="
          printf 'iOS test arch (PREDICTED, unconfirmed): %s\n' "$PREDICT" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the XCTests on a booted simulator
        run: |
          set -euo pipefail
          cd ios
          # A destination that is actually INSTALLED, not a name typed from
          # memory. A destination that does not exist fails as
          #     Unable to find a destination matching the provided destination
          #     specifier
          # which names neither the missing device type nor the missing runtime.
          # The first version of this step hardcoded `name=iPhone 16` on the
          # same unfounded assumption as the hardcoded Xcode path, so both of the
          # things that identify the machine are now discovered.
          #
          # A UDID, not a name: two runners with different device sets would
          # otherwise resolve one name to different hardware.
          #
          # A SCRIPT, not `python3 -c`. Inline python inside a YAML `run: |`
          # block is how the previous attempt broke this file: a body line at
          # column 0 ends the block scalar and the remainder parses as YAML
          # mapping keys --
          #     yaml.scanner.ScannerError: while scanning a simple key
          #       in ".github/workflows/ios-native.yml", line 413, column 1
          #     could not find expected ':'
          set -uo pipefail
          UDID=$(xcrun simctl list devices available -j \
                 | python3 "$GITHUB_WORKSPACE/.github/scripts/pick_simulator_udid.py") || {
            echo "FAIL: no usable iPhone simulator on this runner"
            xcrun simctl list devices available || true
            xcrun simctl list runtimes available || true
            exit 1
          }
          echo "simulator udid: $UDID"
          xcrun simctl list devices available | grep -F "$UDID" || true
          set -euo pipefail

          xcodebuild test \
            -project GSApp.xcodeproj \
            -scheme GSApp \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-simulator.log

          # A zero exit is not the evidence. xcodebuild has returned 0 from runs
          # that executed nothing, so the log is read for the per-test lines and
          # the count is printed. If every test skipped, that is a SKIP not a
          # PASS and it must not be reported as one.
          echo "=== per-test results ==="
          grep -aE "Test Case .* (passed|failed|skipped)" test-simulator.log || true
          PASSED=$(grep -ac "Test Case .* passed" test-simulator.log || true)
          FAILED=$(grep -ac "Test Case .* failed" test-simulator.log || true)
          SKIPPED=$(grep -ac "Test Case .* skipped" test-simulator.log || true)
          echo "passed=$PASSED failed=$FAILED skipped=$SKIPPED"
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::$FAILED test(s) failed"
            exit 1
          fi
          if [ "$PASSED" -eq 0 ]; then
            echo "::error::0 tests passed. The model-backed tests skip without a GGUF and"
            echo "::error::the rest need the framework, so a green xcodebuild here means"
            echo "::error::nothing executed -- a SKIP, not a PASS."
            exit 1
          fi

          # ---- WHAT ACTUALLY EXECUTED, which is not what the earlier step inferred ----
          #
          # `SIMULATOR_ARCHS` is a CAPABILITY. `lipo -info` is what is LINKED.
          # Neither is what ran, and on ios-native 37023563596 both listed arm64
          # while the tests executed x86_64.
          #
          # The only evidence of what ran is the test process's own architecture,
          # printed by test_the_process_reports_which_slice_is_executing from the
          # `#if arch` branch its own slice was compiled with. An earlier version of
          # this step tried to read the arch out of xcodebuild's banner and DID NOT
          # WORK -- this xcodebuild prints
          #
          #     Test Suite 'All tests' started at 2026-10-02 15:13:44.639.
          #
          # "started at", with no arch in it, so the parser matched nothing and the
          # check would have failed on the runner it was written for. The arch had
          # to come from the process.
          #
          # It is deliberately not `uname()`: inside a simulator that returns the
          # HOST's architecture and would report arm64 for a process running
          # emulated x86_64 code -- a confident wrong answer, which is worse than
          # no answer and is the thing this step exists to rule out.
          RAN=$(sed -n 's/^iOS-EXEC-ARCH: \([a-z0-9_]*\).*/\1/p' test-simulator.log | sort -u | sed -n '1p')
          PREDICTED="${GS_IOS_PREDICTED_ARCH:-<none>}"
          echo
          echo "  arch the test PROCESS reported  : ${RAN:-<none>}"
          echo "  arch inferred before the run    : $PREDICTED"

          if [ -z "$RAN" ]; then
            echo "::error::no test process reported its architecture, so there is no"
            echo "::error::evidence that any test ran on any particular slice. A green"
            echo "::error::step with no arch evidence is the vacuous pass this repository"
            echo "::error::keeps re-finding. The iOS-EXEC-ARCH marker is absent; the log"
            echo "::error::says this instead:"
            grep -aE 'Test Suite|Testing failed|error:' test-simulator.log | sed -n '1,10p' | sed 's/^/    /'
            exit 1
          fi

          # The prediction is ASSERTED, not trusted. Agreeing by luck on one runner
          # is not evidence that the inference works; disagreeing is a real defect
          # in the destination, so it is a failure.
          if [ "$PREDICTED" != "<unknown>" ] && [ "$RAN" != "$PREDICTED" ]; then
            echo "::error::the destination was predicted to execute $PREDICTED and the test"
            echo "::error::process was compiled as $RAN, with SIMULATOR_ARCHS '$SIM_ARCHS'."
            echo "::error::Inference and reality disagree, so this run says nothing about"
            echo "::error::$PREDICTED and must not be reported as though it did."
            exit 1
          fi

          echo
          echo "=========================================================="
          echo " iOS TESTS EXECUTED ON: $RAN   (measured, not inferred)"
          echo " Reported by the test process itself."
          echo " They run on a SIMULATOR, not a physical device. A simulator is"
          echo " not hardware and no number from one describes an iPhone."
          echo " $PASSED test executions, all on $RAN."
          echo "=========================================================="
          printf 'iOS test arch (MEASURED by the test process): %s\n' "$RAN" >> "$GITHUB_STEP_SUMMARY"
          echo "VERIFIED: $PASSED passed, $SKIPPED skipped on the iOS simulator, arch=$RAN reported by the test process"

      - name: Upload the logs and the xcframework test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-logs
          path: |
            ios/build-simulator.log
            ios/test-simulator.log
          if-no-files-found: warn
          retention-days: 14

  # THE IOS ENGINE IS PORTABLE-ONLY TODAY, AND THIS IS WHY.
  #
  # gs_mobile_backend_available() is a #ifdef on GS_LLAMA_HAVE_LLAMA, and
  # build.rs defines that only when GS_LLAMA_PREBUILT points at a directory with
  # include/llama.h. That variable was set for Android (android-native.yml:295)
  # and NEVER for iOS, so every iOS build reported:
  #
  #     GsNativeLoader: native engine unavailable: this build has no
  #                     generation backend
  #
  # which is TRUE. The five engine-backed XCTests skip on it, honestly, and the
  # job is green while the engine cannot answer a prompt.
  #
  # SAME PIN AS ANDROID. The wrapper compiles against one specific llama.cpp, and
  # the wrong one fails with the 11 errors recorded in android-deps.yml:
  # llama_get_memory, llama_memory_clear, llama_memory_seq_pos_max,
  # GGML_BACKEND_DEVICE_TYPE_IGPU. Asserted here by reading the header, not by
  # trusting the checkout.
  llama-ios:
    name: llama.cpp for iOS (device + both simulator archs)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache the llama.cpp clone
        uses: actions/cache@v4
        with:
          # Keyed on the PIN, so changing the pin cannot serve a stale tree.
          path: src-llama
          key: llama-ios-3018a11e79e489b657dbb77c95694889ccff92df

      - name: Fetch llama.cpp at the pinned commit
        run: |
          set -euo pipefail
          # NOT "src": the repository root already contains one, and
          #   fatal: destination path 'src' already exists and is not an empty
          #   directory.
          # is what that produced.
          #
          # A shallow clone CANNOT take `--branch <sha>`, so fetch the commit
          # directly and detach onto it.
          LLAMA_SHA=3018a11e79e489b657dbb77c95694889ccff92df

          # THE CACHE RESTORES A WORKING TREE, NOT AN EMPTY DIRECTORY. So every
          # step here has to survive running against an existing clone. Run
          # 36704297294 proved it:
          #
          #     error: remote origin already exists.
          #     ##[error]Process completed with exit code 3.
          #
          # `git init` is fine on an existing repo, but `git remote add origin`
          # is not, and the cache hit meant the clone step was the second run
          # against the same tree. `set -e` turned that into a failed job with
          # nothing built -- a cache that costs you a run the first time it hits
          # is worse than no cache.
          #
          # So: reuse the tree if the cache restored one, and only fetch when the
          # commit is not already present. `git remote set-url` is idempotent
          # where `add` is not.
          if [ ! -d src-llama/.git ]; then
            git init -q src-llama
          fi
          cd src-llama
          # `set-url` fails on a tree with NO remote ("No such remote 'origin'")
          # and `add` fails on a tree that HAS one ("remote origin already
          # exists"). A cache hit gives the second case and a cold start gives
          # the first, so both are handled. Tested both ways:
          #
          #   add on an existing remote -> error: remote origin already exists.
          #   set-url, twice            -> ok, ok
          #   set-url on no remote      -> error: No such remote 'origin'
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin https://github.com/ggml-org/llama.cpp.git
          else
            git remote add origin https://github.com/ggml-org/llama.cpp.git
          fi
          if ! git cat-file -e "$LLAMA_SHA^{commit}" 2>/dev/null; then
            echo "fetching $LLAMA_SHA"
            git fetch -q --depth 1 origin "$LLAMA_SHA"
          else
            echo "$LLAMA_SHA already in the restored clone; skipping the fetch"
          fi
          git checkout -q --detach "$LLAMA_SHA"
          git submodule update --init --recursive || true
          cd - >/dev/null
          GOT=$(cd src-llama && git rev-parse HEAD)
          echo "llama.cpp pinned: $GOT"
          if [ "$GOT" != "$LLAMA_SHA" ]; then
            echo "::error::llama.cpp is at $GOT, not $LLAMA_SHA. The wrapper and the headers will disagree."
            exit 1
          fi

          # ASSERT THE PIN TOOK, AT THE HEADER LEVEL. A wrong tree compiles the
          # WRONG API and fails twenty minutes later in a different job with an
          # error that names no cause. Counting the symbols the wrapper needs:
          #   3018a11e7 -> 4 matches
          #   b636228c   -> 0 matches   (the old `--branch b4581` pin)
          for SYM in llama_get_memory llama_memory_clear llama_memory_seq_pos_max; do
            if ! grep -q "$SYM" src-llama/include/llama.h; then
              echo "::error::$SYM is absent from include/llama.h at $GOT. The wrapper will not compile against this tree."
              exit 1
            fi
            echo "  header has $SYM"
          done
          if ! grep -q GGML_BACKEND_DEVICE_TYPE_IGPU src-llama/ggml/include/ggml-backend.h; then
            echo "::error::GGML_BACKEND_DEVICE_TYPE_IGPU absent at $GOT"
            exit 1
          fi
          echo "  header has GGML_BACKEND_DEVICE_TYPE_IGPU"

      - name: Build all three targets
        run: |
          set -euo pipefail
          # THREE TARGETS, ONE LOOP, AND THE TABLE IS PRINTED FIRST.
          #
          # aarch64-apple-ios        the device. An iOS device is arm64 and has
          #                           been since the iPhone 5s.
          # aarch64-apple-ios-sim    the Apple Silicon simulator.
          # x86_64-apple-ios         the Intel simulator. NOT OPTIONAL: the
          #                           macos-latest image was an Intel runner on run
          #                           36664200219, which produced
          #                             ld: found architecture 'arm64',
          #                               required architecture 'x86_64'
          #                           and turned every gs_* into an undefined
          #                           symbol. Both simulator slices are therefore
          #                           built and lipos together, so the framework is
          #                           correct on either kind of Mac.
          #
          # SAME FLAGS AS ANDROID-DEPS, because the wrapper does not care which
          # platform it is on and a CLI target would be handed to rustc as a link
          # input:
          #   LLAMA_BUILD_APP / COMMON / UI are ON BY DEFAULT at this commit.
          #   LLAMA_BUILD_APP ON built bin/llama and failed with
          #     ld: error: unable to find library -lllama-server-impl
          # GGML_LLAMAFILE=OFF because gs-ffi is C/Rust and a ggml file format
          # reader is not part of it.
          #
          # GGML_BLAS=OFF, and this is not cosmetic. Run 36725021214 left two
          # unrelated groups undefined at the iOS link:
          #
          #   "_cblas_sgemm$NEWLAPACK$ILP64", referenced from
          #      ggml_backend_blas_graph_compute in libggml-blas.a
          #   "_vDSP_maxv", "_vDSP_vadd", "_vDSP_vdiv", "_vDSP_vmul",
          #   "_vDSP_vsadd", "_vDSP_vsmsa", "_vDSP_vsmul", "_vDSP_vsub",
          #      all referenced from libggml-cpu.a(ops.cpp.o)
          #
          # Two different things. libggml-blas.a wants an external BLAS, which is
          # an ALTERNATIVE to ggml's own CPU kernels rather than a dependency of
          # them, and llama.cpp has no need of a second full backend in a phone
          # binary. So the backend is not built. The vDSP symbols are Apple's
          # vector library, which ggml-cpu.a calls UNCONDITIONALLY on Apple
          # targets -- there is no flag for that, so
          # native/crates/gs-ffi/build.rs links -framework Accelerate instead.
          # Both, and they are not substitutes for one another.
          #
          # THIS COMMENT IS HERE, NOT INSIDE THE CMAKE CALL, BECAUSE OF RUN
          # 36728962757:
          #
          #   .../_temp/a65912d8-....sh: line 96: -DGGML_BLAS=OFF: command not found
          #   ##[error]Process failed with exit code 127.
          #
          # The flag was written directly below `-DGGML_LLAMAFILE=OFF \`. A `#`
          # is not a continuation: bash reads the continued line, sees it starts
          # with `#`, and treats the whole physical line as a comment -- discarding
          # the trailing backslash with it. The cmake command therefore ended at
          # -DGGML_LLAMAFILE=OFF, the next non-comment line was parsed as a
          # command, and the flag never reached cmake at all. A flag with a
          # comment wedged into a backslash continuation is a SYNTAX error wearing
          # a flag's clothes.
          #
          # GGML_METAL is left ON (the default on Apple silicon) rather than
          # forced OFF. Nothing here can assert a GPU is present -- these are
          # static archives linked into a library, and whether Metal is used at
          # run time is ggml's decision on the device. So the build keeps the
          # backend the platform ships, and the TESTS assert on what the engine
          # reports, which is the only thing that can actually be checked.
          # WHY libtool AND NOT lipo, IN FULL, BECAUSE lipo LOOKS RIGHT.
          #
          # `lipo -create A B -output C` is how you build a universal file from
          # slices of DIFFERENT architectures. It refuses same-architecture
          # inputs, because a fat file of two slices that agree on architecture
          # has nothing to discriminate:
          #
          #     fatal error: lipo: .../dist/ios/device/libgs_ffi.a and
          #     .../native/prebuilts/ios-arm64/lib/libllama.a have the same
          #     architectures (arm64) and can't be in the same fat output file
          #                                                        (36735809161)
          #
          # So the fatten step was never going to work for ANY slice. It was
          # unreachable rather than correct: until 36735809161 the cargo link
          # failed first -- Metal, then Accelerate, then __chkstk_darwin -- and
          # the xcframework job never reached this line. A step that has never
          # executed is not a step that works, which is why the verify steps
          # around it read architectures out of the bytes rather than trusting
          # that the merge happened.
          #
          # Folding several single-architecture static archives into one is an
          # ARCHIVE MERGE, and on Apple platforms that is libtool's operation:
          #
          #     libtool -static -o OUT IN1 IN2 IN3
          #
          # Per slice, then the one legitimate lipo use afterwards:
          #
          #     device      libtool -static   arm64 archives   -> arm64
          #     sim arm64   libtool -static   arm64 archives   -> arm64
          #     sim x86_64  libtool -static   x86_64 archives  -> x86_64
          #     simulator   lipo -create      the two above    -> fat, two archs
          #
          # That last one is correct precisely because aarch64-apple-ios-sim and
          # x86_64-apple-ios ARE different architectures. Which is the
          # distinction this whole note exists to keep straight.

          cat <<'TABLE'
            triple                 dir                            arch   sysroot
            aarch64-apple-ios      build-aarch64-apple-ios        arm64  iphoneos
            aarch64-apple-ios-sim  build-aarch64-apple-ios-sim    arm64  iphonesimulator
            x86_64-apple-ios       build-x86_64-apple-ios         x86_64 iphonesimulator
          TABLE

          # THE DIRECTORY IS NAMED FROM THE TRIPLE, NOT FROM THE ARCH.
          #
          # The first version keyed it on ARCH alone, and two of the three rows
          # share an architecture:
          #
          #     arm64  iphoneos
          #     arm64  iphonesimulator      <- same arch, DIFFERENT platform
          #     x86_64 iphonesimulator
          #
          # so the second `rm -rf "build-arm64"` deleted the DEVICE build before
          # anything verified it, and the verify step then looked for
          # build-iossim, a name the loop never produced:
          #
          #     === build-arm64 ===
          #     6 archives; llama, ggml, ggml-cpu and ggml-base all present
          #     === build-iossim ===
          #     find: build-iossim: No such file or directory
          #
          # And iphoneos and iphonesimulator are not interchangeable even at the
          # same architecture: a device slice linked into a simulator build is a
          # load failure at run time with no build error at all.
          while read -r TRIPLE ARCH SYSROOT; do
            [ -n "$TRIPLE" ] || continue
            echo "=== $TRIPLE ($ARCH, $SYSROOT) ==="
            rm -rf "build-$TRIPLE"
            cmake -S src-llama -B "build-$TRIPLE" \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_ARCHITECTURES="$ARCH" \
              -DCMAKE_OSX_SYSROOT="$SYSROOT" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DLLAMA_BUILD_TESTS=OFF \
              -DLLAMA_BUILD_EXAMPLES=OFF \
              -DLLAMA_BUILD_SERVER=OFF \
              -DLLAMA_BUILD_APP=OFF \
              -DLLAMA_BUILD_COMMON=OFF \
              -DLLAMA_BUILD_UI=OFF \
              -DGGML_BLAS=OFF \
              -DGGML_LLAMAFILE=OFF \
              -G Ninja 2>&1 | tee "configure-$TRIPLE.log"
            cmake --build "build-$TRIPLE" -j"$(sysctl -n hw.ncpu)" 2>&1 | tee "build-$TRIPLE.log"
            echo "=== archives for $TRIPLE ==="
            find "build-$TRIPLE" -name '*.a' | sort
          done <<'TARGETS'
            aarch64-apple-ios       arm64  iphoneos
            aarch64-apple-ios-sim   arm64  iphonesimulator
            x86_64-apple-ios        x86_64 iphonesimulator
          TARGETS

      - name: Verify each target's archives, from the bytes
        run: |
          set -euo pipefail
          # lipo -info is the check, and it is asserted per target: an archive
          # that does not exist is reported by `find` as no output at all, which
          # is easy to read as "nothing to do".
          # `find`, NOT A GLOB. A cmake build writes each archive next to its
          # SOURCE, not into one output directory, so the runner produced
          #
          #     build-arm64/ggml/src/libggml-base.a
          #     build-arm64/ggml/src/libggml-cpu.a
          #     build-arm64/ggml/src/libggml.a
          #     build-arm64/src/libllama.a
          #
          # and `"$DIR"/*.a` matched NONE of them. Every one of those had just
          # been built -- [209/209] Linking CXX static library src/libllama.a --
          # so this was a check looking in the wrong place, not a build failure.
          #
          # BY NAME, NOT BY COUNT: four copies of one library would satisfy a
          # count check and link nothing.
          check () {
            DIR="$1"; ARCH="$2"
            echo "=== $DIR ==="
            MAP=$(find "$DIR" -name '*.a' | sort)
            if [ -z "$MAP" ]; then
              echo "::error::$DIR has no .a files at all:"
              find "$DIR" -maxdepth 3 -type d | sed -n '1,20p' | sed 's/^/    /'
              exit 1
            fi
            echo "$MAP" | sed 's/^/    /'
            N=$(echo "$MAP" | wc -l | tr -d ' ')
            for NAME in llama ggml ggml-cpu ggml-base; do
              A=$(echo "$MAP" | grep -E "/lib$NAME\.a$" | sed -n '1p')
              if [ -z "$A" ]; then
                echo "::error::$DIR has no lib$NAME.a. $MAP"
                exit 1
              fi
              echo "  lib$NAME.a  $(stat -f%z "$A") bytes  $(lipo -info "$A" | tr -d '\n')"
              lipo -info "$A" | grep -q "$ARCH" || {
                echo "::error::$A does not contain $ARCH: $(lipo -info "$A")"
                exit 1
              }
            done
            echo "  $N archives; llama, ggml, ggml-cpu and ggml-base all present and $ARCH"
          }
          mkdir -p native/prebuilts/ios-arm64 native/prebuilts/ios-arm64-sim native/prebuilts/ios-x86_64-sim
          check build-aarch64-apple-ios      arm64
          check build-aarch64-apple-ios-sim  arm64
          check build-x86_64-apple-ios       x86_64

      - name: Package in the shape gs-ffi/build.rs requires
        run: |
          set -euo pipefail
          # THE CONTRACT, from native/crates/gs-ffi/build.rs:
          #   <root>/include/llama.h    line 105, the test that enables llama
          #   <root>/ggml-include/      line 112, the PACKAGE ggml layout
          #   <root>/lib/*.a            line 196, link-search
          #
          # ggml/include is ALSO copied into include/, because a build TREE puts
          # the ggml headers there and build.rs adds both layouts. Copying both
          # costs nothing and covers whichever shape is handed over -- the
          # mistake android-deps made once, where adding only the build-tree path
          # produced
          #   native/prebuilts/android-x86_64/include/llama.h:4:10: fatal
          #   error: 'ggml.h' file not found
          for PAIR in "build-aarch64-apple-ios:ios-arm64" \
                      "build-aarch64-apple-ios-sim:ios-arm64-sim" \
                      "build-x86_64-apple-ios:ios-x86_64-sim"; do
            SRC="${PAIR%%:*}"
            DST="native/prebuilts/${PAIR##*:}"
            echo "=== $SRC -> $DST ==="
            mkdir -p "$DST/lib" "$DST/include" "$DST/ggml-include"
            # find, for the same reason as the verify step above: the archives
            # are at $SRC/ggml/src/libggml.a and $SRC/src/libllama.a, not at
            # $SRC/*.a. A flat `for A in "$SRC"/*.a` copies nothing and the
            # package then fails build.rs's include/llama.h or link check much
            # later, naming neither.
            N=0
            while read -r A; do
              cp "$A" "$DST/lib/"
              N=$((N+1))
            done <<< "$(find "$SRC" -name '*.a')"
            if [ "$N" -lt 4 ]; then
              echo "::error::$DST got $N archive(s); llama needs at least libllama.a libggml.a libggml-cpu.a libggml-base.a"
              exit 1
            fi
            echo "  copied $N archives"
            cp -r src-llama/include/. "$DST/include/"
            cp -r src-llama/ggml/include/. "$DST/include/"
            cp -r src-llama/ggml/include/. "$DST/ggml-include/"
            # The headers are the same for every target; copy them once from the
            # source tree rather than three times from a build dir.
            test -f "$DST/include/llama.h" || { echo "FAIL: no include/llama.h in $DST"; exit 1; }
            test -f "$DST/ggml-include/ggml.h" || { echo "FAIL: no ggml-include/ggml.h in $DST"; exit 1; }
            echo "  $(ls "$DST/lib" | wc -l | tr -d ' ') archives, $(ls "$DST/include" | wc -l | tr -d ' ') headers"
            find "$DST" -type f | sort | sed -n '1,12p'
          done
          echo "=== all three packages ==="
          du -sh native/prebuilts/ios-*

      - name: Upload the three llama.cpp packages
        uses: actions/upload-artifact@v4
        with:
          name: llamacpp-ios
          path: native/prebuilts/ios-*
          if-no-files-found: error
          retention-days: 14
