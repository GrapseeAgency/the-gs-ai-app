name: Font evaluation

# Measures a candidate typeface against the numbers the reference actually has,
# before anyone edits a single line of app code.
#
# The two numbers that decide acceptance (see docs/TYPOGRAPHY.md):
#   * width of "Good morning," at matched cap height, relative to the shipped
#     Poppins SemiBold — the reference sits at 0.824;
#   * x-height / cap height — the reference sits at ~0.85.
#
# Both are scale-free ratios, so this needs no app build and no device: it
# downloads an OFL family, instantiates the four weights the UI uses, and prints
# the table. Nothing is written back to the repository — vendoring is a separate,
# reviewed commit.

on:
  workflow_dispatch:
    inputs:
      families:
        description: Comma-separated Google Fonts family names
        default: "Manrope,Outfit,Figtree,DM Sans,Inter Tight,Hanken Grotesk,Karla"
        required: true

permissions:
  contents: read

jobs:
  measure:
    name: Measure candidate faces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tooling
        run: pip install --quiet --disable-pip-version-check fonttools pillow

      - name: Fetch, instantiate and measure
        env:
          FAMILIES: ${{ inputs.families }}
        run: |
          set -euo pipefail
          mkdir -p fonts
          # Two dead ends before this one, both recorded because they cost runs:
          # fonts.google.com/download now answers with HTML instead of the zip; the
          # CSS API's legacy-User-Agent trick (TTF instead of woff2) returned no TTF
          # URL at all for any family. The google/fonts repository is the actual
          # source of truth for these files, so ask its contents API for the .ttf in
          # ofl/<slug>/ and instantiate a 600 weight when only the variable file is
          # there.
          printf '%s' "$FAMILIES" | tr ',' '\n' | while IFS= read -r FAM; do
            [ -n "$FAM" ] || continue
            SLUG=$(printf '%s' "$FAM" | tr '[:upper:]' '[:lower:]' | tr -d ' ')
            mkdir -p "fonts/$FAM"
            echo "::group::$FAM (ofl/$SLUG)"
            LIST=$(curl -fsSL --retry 3 -H "Accept: application/vnd.github+json" \
                     "https://api.github.com/repos/google/fonts/contents/ofl/$SLUG" || true)
            if [ -z "$LIST" ]; then
              echo "::warning::$FAM: no ofl/$SLUG directory"
              echo "::endgroup::"
              continue
            fi
            # Upright only — the same trap that vendored the italic cut. A family
            # directory can hold both `X[wght].ttf` and `X-Italic[wght].ttf`, and
            # measuring the slanted one produces a width that describes a face the
            # app will not draw.
            URL=$(printf '%s' "$LIST" | python3 -c "import json,sys;d=json.load(sys.stdin);t=[i['download_url'] for i in d if i['name'].lower().endswith('.ttf') and 'italic' not in i['name'].lower()];print(([u for u in t if '%5B' in u or '[' in u] or t or [''])[0])" || true)
            if [ -z "$URL" ]; then
              echo "::warning::$FAM: no .ttf in ofl/$SLUG"
              echo "::endgroup::"
              continue
            fi
            NAME=$(basename "$URL" | python3 -c "import sys,urllib.parse;print(urllib.parse.unquote(sys.stdin.read().strip()))")
            curl -fsSL --retry 3 "$URL" -o "fonts/$FAM/$NAME"
            echo "  $NAME ($(wc -c < "fonts/$FAM/$NAME") bytes)"
            case "$NAME" in
              *"[wght]"*)
                fonttools varLib.instancer "fonts/$FAM/$NAME" wght=600 \
                  -o "fonts/$FAM/SemiBold-600.ttf" >/dev/null
                echo "  instantiated 600 from the variable file"
                ;;
              *)
                cp "fonts/$FAM/$NAME" "fonts/$FAM/SemiBold-600.ttf"
                ;;
            esac
            echo "::endgroup::"
          done

          python3 - <<'PY'
          import glob, os
          from PIL import Image, ImageDraw, ImageFont

          # The normaliser has to be a face that is not the one under test, and it has
          # to be present: this used to point at android/app/src/main/res/font/
          # poppins_semibold.ttf, which stopped existing the day Poppins was replaced
          # by Inter Tight — the next eval died on "cannot open resource" before it
          # printed a row. It is now downloaded as part of the run.
          candidates = sorted(glob.glob("fonts/Poppins/SemiBold-600.ttf"))
          if not candidates:
              raise SystemExit("::error::this eval needs Poppins in --families; it is "
                               "the denominator of every width ratio")
          POPPINS = candidates[0]

          def band(path, glyph, size=240):
              f = ImageFont.truetype(path, size)
              im = Image.new("L", (900, 600), 0)
              ImageDraw.Draw(im).text((40, 40), glyph, font=f, fill=255)
              bb = im.getbbox()
              return bb[3] - bb[1]

          base_f = ImageFont.truetype(POPPINS, 1000)
          base_cap = band(POPPINS, "H")
          base_wcap = base_f.getlength("Good morning,") / base_cap

          rows = [("Poppins SemiBold (shipped)", 1.0, band(POPPINS, "o") / base_cap, "baseline")]
          for fam in sorted(glob.glob("fonts/*/")):
              name = os.path.basename(fam.rstrip("/"))
              p = os.path.join(fam, "SemiBold-600.ttf")
              if not os.path.isfile(p):
                  rows.append((name, None, None, "not fetched"))
                  continue
              f = ImageFont.truetype(p, 1000)
              cap = band(p, "H")
              ratio = (f.getlength("Good morning,") / cap) / base_wcap
              xcap = band(p, "o") / cap
              ok_w, ok_x = 0.80 <= ratio <= 0.85, xcap >= 0.82
              rows.append((name, ratio, xcap, "PASS" if ok_w and ok_x else ("width" if not ok_w else "x-height")))

          print(f"{'face':26s} {'width/Poppins':>13s} {'x/cap':>7s}  verdict")
          print(f"{'-'*26} {'-'*13} {'-'*7}  {'-'*12}")
          for name, ratio, xcap, verdict in rows:
              r = f"{ratio:.3f}" if ratio is not None else "-"
              x = f"{xcap:.3f}" if xcap is not None else "-"
              print(f"{name[:26]:26s} {r:>13s} {x:>7s}  {verdict}")
          print()
          print("reference (measured from the sheet): width 0.824, x/cap 0.850")
          print("accept: width 0.80-0.85 AND x/cap >= 0.82")
          PY

      - name: Summary
        if: always()
        run: |
          {
            echo "### Font evaluation"
            echo ""
            echo "Acceptance (from \`docs/TYPOGRAPHY.md\`): width 0.80–0.85 of Poppins at matched cap height, x-height/cap ≥ 0.82."
            echo "The reference measures 0.824 and 0.850."
          } >> "$GITHUB_STEP_SUMMARY"
