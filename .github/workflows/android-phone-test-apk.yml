name: Android phone test APK pre-release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-phone-test-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  phone-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Use runner's installed Chrome for build-time original frame capture
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -x "$CHROME"
          "$CHROME" --version
          echo "GS_AVATAR_CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Reuse verified unchanged native runtime from stable v0.86.29
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/stable-native
          gh release download v0.86.29 --repo "$GITHUB_REPOSITORY" --pattern 'GS-AI-App-v0.86.29.apk' --dir /tmp/stable-native
          STABLE=/tmp/stable-native/GS-AI-App-v0.86.29.apk
          echo '12db2b5f6f25054f5740c450786a7f01f7a285b5985b3aefe5b322615a7d7b3c  /tmp/stable-native/GS-AI-App-v0.86.29.apk' | sha256sum -c -
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            DEST=android/app/src/main/jniLibs/$ABI/libgs_ffi.so
            mkdir -p "$(dirname "$DEST")"
            unzip -p "$STABLE" "lib/$ABI/libgs_ffi.so" > "$DEST"
            test -s "$DEST"
          done
      # Physical-device streaming audit: build app sources at bc69a6f (workflow-only trigger).
      - name: Assemble optimized signed phone test APK
        working-directory: android
        run: gradle :app:assembleRelease -PgsTestVersion=0.86.29-phone-test.5 --max-workers=2 --stacktrace
      - name: Verify APK signing, identity, native libraries and original native animation assets
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p dist
          "$TOOLS/aapt2" dump badging "$APK" > dist/android-verification.txt
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" >> dist/android-verification.txt
          grep -q "package: name='com.grapsee.gsai'" dist/android-verification.txt
          grep -q "versionName='0.86.29-phone-test.5'" dist/android-verification.txt
          grep -qi 'b1ffd75dd410c84bd9467e418c419cd377d57569ae7ac5e26b778e6418b1a483' dist/android-verification.txt
          if grep -q application-debuggable dist/android-verification.txt; then exit 1; fi
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -p "$APK" "lib/$ABI/libgs_ffi.so" > /tmp/test-ffi.so
            cmp /tmp/test-ffi.so "android/app/src/main/jniLibs/$ABI/libgs_ffi.so"
          done
          python3 - "$APK" <<'PY'
          import hashlib, json, sys, zipfile, struct
          with zipfile.ZipFile(sys.argv[1]) as z:
              prefix = "assets/bot-avatar/native/"
              meta = json.loads(z.read(prefix+"manifest.json"))
              assert meta["source"] == "bot-avatars" and meta["version"] == "0.2.2"
              assert (meta["frameSize"],meta["frames"],meta["fps"]) == (144,180,30)
              assert len(meta["animations"]) == 8
              for shape in ("clover","flower","triangle","square"):
                  for state in ("default","working"):
                      key = shape+"-"+state
                      animation = meta["animations"][key]
                      assert animation["distinctFrames"] >= (135 if state == "working" else 50)
                      for kind in ("atlas","poster"):
                          data = z.read(prefix+key+"-"+kind+".png")
                          assert hashlib.sha256(data).hexdigest() == animation[kind+"Sha256"]
                          assert data[:8] == b"\x89PNG\r\n\x1a\n"
                          assert struct.unpack(">II",data[16:24]) == ((1728,2160) if kind=="atlas" else (144,144))
              assert "assets/bot-avatar/avatar.bundle.js" not in z.namelist()
          open("dist/avatar-provenance.json","w").write(json.dumps(meta,indent=2)+"\n")
          PY
          cp "$APK" dist/GS-AI-App-streaming-audit.apk
          (cd dist && sha256sum GS-AI-App-streaming-audit.apk > SHA256SUMS.txt)
          printf 'Source commit: %s\nNative libraries: unchanged v0.86.29 release, verified SHA256 and ABI payloads\nVisual animation verification: pending, test build only\n' "$GITHUB_SHA" > dist/build-provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gs-ai-streaming-audit-apk
          path: dist/
          if-no-files-found: error
      - name: Publish separate test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="phone-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > /tmp/avatar-release-notes.md <<'NOTES'
          Experimental Android APK from main for physical-phone testing of all current native UI changes. **Not a stable release; visual/animation verification is still pending.**

          - Native response streaming optical-front experiment. Includes frame-paced append rendering, a shaped-text reveal and measured live-edge following. Visual acceptance remains pending.
          - Native Android playback of lossless frames captured directly from bot-avatars@0.2.2, targeting 30 FPS. No avatar WebView or manually redrawn shapes.
          - Native avatar now replaces the spinner inside the active response status card, with no duplicate exterior avatar.
          - Native Android chromatic metal-fx shader port with gravity-driven ring deformation. The upstream separate halo and reflections are not implemented; visual fidelity is pending phone verification.
          - Removed response status from composer and changed Stop to an icon-only control.
          - Two-row chat composer with Agent shortcuts and real response-mode selector.
          - Native colorful Border Beam port on the home Generate button.
          - Native mono Voice Ring and existing experimental Voice Position support (licensed distance model not bundled).
          - ArgentUI v0.4.1 original native shader port: thin, restrained component rims; not all custom borders covered yet. Performance and visual fidelity unverified. API 26–32 static same-field fallback.
          - Original procedural avatar engine is used at build time; native playback on the phone.
          - Optimized release variant, existing application ID and signing certificate.
          - Unchanged native runtime libraries reused from verified v0.86.29.
          - Same versionCode as stable v0.86.29. Back up important data before testing.

          Stable v0.86.29 remains the latest stable release. No iOS artifact included.
          NOTES
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Android streaming audit $GITHUB_RUN_ID (experimental)" --notes-file /tmp/avatar-release-notes.md --prerelease --latest=false
