[package]
name = "gs-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# crate-type MUST be declared under [lib], not [package]. Under [package] cargo
# silently reports crate_types: ['lib'] and emits only the rlib, which is how the
# mobile artifacts went missing the first time. [lib] is unambiguous.
[lib]
name = "gs_ffi"
# cdylib  -> libgs_ffi.so for Android (JVM System.loadLibrary)
# staticlib -> libgs_ffi.a for the iOS xcframework
# rlib    -> the workspace binaries keep linking it exactly as before
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
# Compiles src/jni.rs on a non-Android host so it is type-checked by `cargo
# check` and `cargo test` rather than only by the cross-compile job. The
# `Java_*` exports are still not emitted on a desktop build: the module below is
# also gated on the target.
jni-typecheck = []

[dependencies]
gs-common = { workspace = true }
tracing   = { workspace = true }

# Not target-gated. The `jni` crate is pure Rust (jni-sys has no C component),
# so it costs a few seconds of compile time on a desktop build and buys the
# ability to type-check src/jni.rs on any host:
#     cargo check -p gs-ffi --features jni-typecheck
# That check exists because src/jni.rs is `#[cfg(target_os = "android")]` by
# default, and 9 type errors in it shipped unnoticed until the arm64 build ran.
# A blind spot that only an NDK can see is a blind spot.
jni = "0.21"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
