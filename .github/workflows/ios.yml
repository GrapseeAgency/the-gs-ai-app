          done

      - name: Check the reference pages' copy inventory on both platforms
        if: always()
        run: |
          set -euo pipefail
          # Section and row titles are asserted against both platforms' sources;
          # the render test above proves something was drawn, this proves the
          # mock's inventory is still what is being drawn.
          python3 scripts/check_sheets_copy_parity.py
          python3 scripts/check_sheets_copy_parity.py --self-test

      - name: Measure the reference pages against their card contract
        if: always()
        run: |
          set -euo pipefail
          # The iOS captures are the same 393x852 canvas as Android's, so the
          # same card law applies: title ink, lit rim, seven inbox cards, six
          # provider cards, and each page's own card count. This is the iOS half
          # of `check_sheets_render.py`; Android runs it against its Roborazzi
          # renders and this step against the windowed simulator captures.
          DIR=ios/build/nexly-renders
          for pair in alerts:nexly-alerts-ios \
                      inbox:nexly-inbox-ios \
                      security:nexly-security-ios \
                      subscription:nexly-subscription-ios \
                      help:nexly-help-ios \
                      connected:nexly-integrations-ios \
                      model:nexly-model-ios \
                      history:nexly-chat-history-ios \
                      voice:nexly-voice-ios \
                      data:nexly-data-export-ios \
                      new-chat:nexly-new-chat-ios \
                      model-picker:nexly-model-picker-ios; do
            screen=${pair%%:*}
            stem=${pair##*:}
            PNG="$DIR/$stem-393x852.png"
            test -s "$PNG" \
              || { echo "::error::$PNG was not produced — nothing to measure"; exit 1; }
            python3 scripts/check_sheets_render.py \
              --render "$PNG" --screen "$screen" --platform ios \
              --label "ios-$screen"
          done
          # Non-vacuity, as on Android: shift the header, paint out a card rim
          # and bridge two cards; every gated probe must go red.
          for pair in alerts:nexly-alerts-ios \
                      inbox:nexly-inbox-ios \
                      security:nexly-security-ios \
                      subscription:nexly-subscription-ios \
                      help:nexly-help-ios \
                      connected:nexly-integrations-ios \
                      model:nexly-model-ios \
                      history:nexly-chat-history-ios \
                      voice:nexly-voice-ios \
                      data:nexly-data-export-ios \
                      new-chat:nexly-new-chat-ios \
                      model-picker:nexly-model-picker-ios; do
            screen=${pair%%:*}
            stem=${pair##*:}
            python3 scripts/check_sheets_render.py \
              --render "$DIR/$stem-393x852.png" --screen "$screen" \
              --platform ios --self-test
          done

      - name: Measure the Settings trio against its pixel contract
        if: always()
        run: |
          set -euo pipefail
          # The captures above were gated on EXISTENCE only, which is how a
          # settings card can go flat, a lit rim stop painting or the peach CTA
          # come back as glass while the job stays green. This blocks on the
          # mock's own numbers (docs/reference/settings/settings-geometry.json):
          # the card's composite against the ground actually under it — read out
          # of the shipped backdrop, identical bytes on both platforms — its lit
          # rim, and the CTA's saturation. Probes hang off the rim they FIND, so
          # iOS's safe-area difference cannot shift what is measured.
          # This step is if: always(), so prove the artifact exists first: a
          # missing PNG must be a named error, not the script's opaque exit 2.
          DIR=ios/build/nexly-renders
          for pair in hub:nexly-settings-ios profile:nexly-profile-ios memory:nexly-memory-ios; do
            screen=${pair%%:*}
            stem=${pair##*:}
            for w in 393x852 360x780; do
              PNG="$DIR/$stem-$w.png"
              test -s "$PNG" \
                || { echo "::error::$PNG was not produced — nothing to measure"; exit 1; }
              python3 scripts/check_settings_render.py \
                --render "$PNG" --screen "$screen" --label "ios-$screen-$w" \
                --platform ios \
                --backdrop "ios/App/Assets.xcassets/GSHomeBackdrop.imageset/gs-home-backdrop.png"
            done
          done
          # The gate's own non-vacuity: paint each card flat onto its ground,
          # bury its rim and desaturate the pill, and every gated probe must go
          # red on the doctored copy. A probe that cannot fail is not a gate.
          for pair in hub:nexly-settings-ios profile:nexly-profile-ios memory:nexly-memory-ios; do
            screen=${pair%%:*}
            stem=${pair##*:}
            python3 scripts/check_settings_render.py \
              --render "$DIR/$stem-393x852.png" --screen "$screen" --self-test \
              --platform ios \
              --backdrop "ios/App/Assets.xcassets/GSHomeBackdrop.imageset/gs-home-backdrop.png"
          done

      - name: Upload the Nexly chat response render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexly-chat-render-ios
          path: |
            ios/build/nexly-renders/*.png
            ios/build/nexly-renders/*-scroll.json
          if-no-files-found: error
          retention-days: 30

      - name: The menu harness ran, and left its captures
        if: always()
        run: |
          set -euo pipefail
          # The 29 menu rows were drawn by UIKit's menu chrome, which decides
          # whether a Label's icon is drawn at all — the one thing no static
          # check can see. MenuChromeTests opens every real menu and measures
          # the ink beside each title; this step proves the harness RAN (a
          # skipped or never-started test leaves no log line) and exports the
          # captures it left. Both halves are the gate: a capture with no test
          # is a screenshot of nothing, and a test with no capture cannot be
          # read by a human afterwards.
          LOG=ios/build/xcodebuild-test.log
          # EXPORT FIRST, assert after. A step that fails before exporting
          # throws away the very captures and numbers the failure has to be
          # read from (run 40130252859 produced none).
          DIR=ios/build/menu-chrome
          rm -rf "$DIR"; mkdir -p "$DIR"
          xcrun xcresulttool export attachments \
            --path ios/build/GSApp-tests.xcresult --output-path "$DIR/raw" \
            > "$DIR/export.log" 2>&1 || { echo "::error::xcresulttool could not export the attachments"; cat "$DIR/export.log"; }
          python3 - "$DIR" <<'PY'
          import glob, json, os, re, shutil, sys
          root = sys.argv[1]
          raw = os.path.join(root, "raw")
          path = os.path.join(raw, "manifest.json")
          if not os.path.exists(path):
              print("no manifest at", path)
              sys.exit(0)
          manifest = json.load(open(path))
          groups = manifest if isinstance(manifest, list) else [manifest]
          kept = []
          for group in groups:
              for a in group.get("attachments", []):
                  name = a.get("suggestedHumanReadableName") or ""
                  # Xcode appends `_<n>_<uuid>` and an extension to the name
                  # given to the attachment (run 40134206951 produced
                  # `menu-x_0_UUID.png.png`, run 40139415325 `report.json`),
                  # so the NAME is normalised first and matched after.
                  base = re.sub(r"(_\d+_[0-9A-Fa-f-]{36})?\.(png|jpe?g|json)$", "", name)
                  if base != "report" and not base.startswith("menu-"):
                      continue
                  if base == "report":
                      dst = os.path.join(root, "report.json")
                  else:
                      ext = os.path.splitext(a.get("exportedFileName", ""))[1] or ".png"
                      dst = os.path.join(root, base + ext)
                  shutil.copyfile(os.path.join(raw, a["exportedFileName"]), dst)
                  kept.append(os.path.basename(dst))
          print("exported:", ", ".join(sorted(kept)) or "nothing")
          PY
          if [ -s "$DIR/report.json" ]; then
            echo "=== the harness's own numbers ==="
            cat "$DIR/report.json"
          fi
          if ! grep -q "Test Case '-\[GsChatUITests.MenuChromeTests testEveryMenuPutsItsGlyphInTheLeadingSlot\]' passed" "$LOG"; then
            echo "::error::MenuChromeTests did not pass in this run — the menu gate is not live"
            grep -E "MenuChromeTests|MENU-|MEASURE |error: -\[" "$LOG" | head -60 || true
            exit 1
          fi
          for n in chats-row-context chats-row-swipe-leading chats-row-swipe-trailing \
                   user-bubble-context assistant-bubble-context drawer-recent-context; do
            ls "$DIR/menu-$n".* >/dev/null 2>&1 \
              || { echo "::error::menu-$n is missing — the menu harness opened no such menu"; exit 1; }
          done
          test -s "$DIR/report.json" || { echo "::error::report.json missing — no measurements were written"; exit 1; }
          # The only menus this build cannot open are the two header ones: their
          # contextMenus sit on buttons that consume the long press as their
          # action. Any OTHER menu that stops opening must fail this gate — a
          # skip list that can grow is how a gate turns itself off.
          python3 - "$DIR/report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          allowed = {"chat-header-sparkle", "chat-header-menu"}
          unreachable = set(report.get("unreachableMenus", []))
          print("unreachable (accepted):", sorted(unreachable) or "none")
          extra = sorted(unreachable - allowed)
          if extra:
              print(f"::error::menus that should have opened did not: {extra}")
              sys.exit(1)
          PY

      - name: Upload the menu-chrome captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-chrome-ios
          path: ios/build/menu-chrome/*
          if-no-files-found: warn
          retention-days: 30

      - name: Package — zip unsigned simulator .app
        run: |
          # XcodeGen's default PRODUCT_NAME = target name → the built bundle
          # is App.app (overriding PRODUCT_NAME desyncs the auto TEST_HOST).
          APP_PATH="ios/build/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH" || { echo "::error::Compiled App.app not found"; exit 1; }
          cd "$(dirname "$APP_PATH")"
          zip -qry "$GITHUB_WORKSPACE/ios/build/GSApp-simulator-debug.zip" App.app
          ls -l "$GITHUB_WORKSPACE/ios/build/GSApp-simulator-debug.zip"

      - name: Archive — unsigned Release xcarchive (packaging evidence)
        run: |
          set -o pipefail
          rm -rf ios/build/GSApp.xcarchive
          xcodebuild archive \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -archivePath ios/build/GSApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ios/build/xcodebuild-archive.log

      - name: Summarise results
        if: always()
        run: |
          APP_BUILT=$([ -d ios/build/DerivedData/Build/Products/Debug-iphonesimulator/App.app ] && echo "YES" || echo "NO")
          ARCHIVED=$([ -d ios/build/GSApp.xcarchive ] && echo "YES" || echo "NO")
          TESTS=$(grep -Eo "Test Suite 'All tests' (passed|failed)" ios/build/xcodebuild-test.log 2>/dev/null | sed -n '1p' || echo "n/a")
          # A GREEN SUITE LINE DOES NOT SAY WHICH SUITES RAN. The drawer's iOS
          # behaviour lives in DrawerLogicTests and its captures in
          # DrawerRenderTests; if either stops being collected the summary still
          # reads "passed" and the drawer is untested. Named here, for the same
          # reason android-app.yml names its two classes.
          for suite in DrawerLogicTests DrawerRenderTests; do
            if ! grep -q "Test Suite '$suite' passed" ios/build/xcodebuild-test.log; then
              echo "::error::$suite did not pass -- the drawer's iOS evidence is missing"
              exit 1
            fi
          done
          {
            echo "## iOS CI summary"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Runner | \`${RUNNER_NAME}\` (${RUNNER_OS} ${ImageOS:-}) |"
            echo "| Xcode | \`${XCODE_VERSION:-unknown}\` |"
            echo "| App target compiled | ${APP_BUILT} |"
            echo "| XCTest result | ${TESTS} |"
            echo "| Unsigned xcarchive | ${ARCHIVED} |"
            echo "| Code signing | disabled by design (unsigned artifacts) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact (unsigned simulator app)
        uses: actions/upload-artifact@v4
        with:
          name: GSApp-simulator-debug-${{ github.sha }}
          path: ios/build/GSApp-simulator-debug.zip
          if-no-files-found: error

      - name: Upload unsigned Release xcarchive
        uses: actions/upload-artifact@v4
        with:
          name: GSApp-xcarchive-unsigned-${{ github.sha }}
          path: ios/build/GSApp.xcarchive
          if-no-files-found: error

      # LAST, after every artifact is built and uploaded. The gate is blocking —
      # a red here fails the job — but it used to sit between Test and Package,
      # so a probe drift cost the .app and the .xcarchive too, and the run that
      # needed inspecting was the one with nothing to inspect. Judgment goes
      # after evidence, in this job as well as in android-app.yml.
      - name: Measure the iOS render against the reference
        run: |
          set -euo pipefail
          DIR=ios/build/home-renders
          python3 scripts/check_home_render.py \
            --reference assets/reference/home-reference.png \
            --render "$DIR/home-ios-393x852.png" --probe-set ios --label ios-393

      - name: Measure the Explore dock against its pixel contract
        run: |
          set -euo pipefail
          # The Explore renders were gated on existence only, which is why the
          # page could look done with the dock never painted. This blocks on
          # the capsule hairline and the lit pill's saturation, both measured
          # off the CI renders (shared-contracts/explore-geometry.json), and
          # re-runs the gate's non-vacuity doctoring on the same capture.
          python3 scripts/check_explore_render.py \
            --render ios/build/nexly-renders/nexly-explore-ios-393x852.png \
            --platform ios --label ios-393
          python3 scripts/check_explore_render.py \
            --render ios/build/nexly-renders/nexly-explore-ios-393x852.png \
            --self-test

      - name: Measure the drawer against its reference sheet
        run: |
          set -euo pipefail
          python3 scripts/check_drawer_render.py \
            --render ios/build/home-renders/drawer-ios-393x852.png \
            --home ios/build/home-renders/home-ios-393x852.png \
            --same-frame ios/build/home-renders/drawer-ios-500chats-393x852.png \
            --probe-set ios --label ios-drawer

      # The drawer gate's own non-vacuity, executed every run: eight doctored
      # frames, each caught by the check that owns it, and the real frame passing.
      - name: The drawer gate can still fail
        run: |
          set -euo pipefail
          python3 scripts/test_drawer_render_gate.py \
            --render ios/build/home-renders/drawer-ios-393x852.png --home ios/build/home-renders/home-ios-393x852.png

      - name: The drawer's type and geometry agree across platforms
        run: |
          set -euo pipefail
          python3 .github/scripts/check_drawer_type_parity.py

      - name: The drawer's structure (lazy list, no per-frame sort, no shadow)
        run: |
          set -euo pipefail
          python3 scripts/check_drawer_structure.py --self-test

      - name: The icon catalogue (1,611 geometries, 5,466 names, both platforms)
        run: |
          set -euo pipefail
          python3 scripts/check_icon_catalogue.py --self-test

      - name: The drawer in dark mode
        run: |
          set -euo pipefail
          python3 scripts/check_drawer_dark.py \
            --render ios/build/home-renders/drawer-ios-393x852-dark.png \
            --home ios/build/home-renders/home-ios-393x852-dark.png \
            --label ios-drawer-dark

      - name: The faces are upright and named for their weight
        run: |
          set -euo pipefail
          python3 scripts/check_font_faces.py

      - name: The dark page holds up
        run: |
          set -euo pipefail
          python3 scripts/check_home_dark.py \
            --render ios/build/home-renders/home-ios-393x852-dark.png \
            --label ios-dark

      # The gate's own non-vacuity, executed every run: flat page, cards painted
      # out, hairline erased, frame shifted, probes slipped, backdrop dimmed. A
      # green pixel gate that cannot fail has certified nothing, so the proof is a
      # step rather than a paragraph in a commit message.
      - name: The pixel gate can still fail
        run: |
          set -euo pipefail
          python3 scripts/test_home_render_gate.py \
            --render ios/build/home-renders/home-ios-393x852.png \
            --probe-set ios

      - name: Upload full xcodebuild logs (failure diagnostics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ github.run_id }}
          path: ios/build/*.log
          if-no-files-found: ignore

      # The .xcresult holds the accessibility snapshot XCUITest takes at a
      # failure. Without it a UI-test red says "the page did not open" and
      # nothing about which page DID: run 41019419509's inbox failure took a
      # second run to localise because only text logs were uploaded.
      - name: Upload the XCTest result bundle (failure diagnostics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult-${{ github.run_id }}
          path: |
            ios/build/GSApp-tests.xcresult
            ios/build/GSApp-genui.xcresult
            ios/build/GSApp-react-keyboard.xcresult
          if-no-files-found: ignore

  response-section-review:
    needs: ios-build-test
    if: always()
    uses: ./.github/workflows/review-native-response-sections.yml
    with:
      platform: ios
      artifact: nexly-chat-render-ios
