name: Authentic Android bot-avatars WebView

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/app/src/main/java/com/grapsee/gsai/ui/components/GsBotAvatar.kt'
      - 'android/app/src/main/assets/bot-avatar/**'
      - 'android/app/src/androidTest/java/com/grapsee/gsai/BotAvatarWebViewDeviceTest.kt'
      - 'scripts/native-avatar/**'
      - '.github/workflows/android-avatar-screens.yml'
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/java/com/grapsee/gsai/ui/components/GsBotAvatar.kt'
      - 'android/app/src/main/assets/bot-avatar/**'
      - 'android/app/src/androidTest/java/com/grapsee/gsai/BotAvatarWebViewDeviceTest.kt'
      - 'scripts/native-avatar/**'
      - '.github/workflows/android-avatar-screens.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentic-native-avatar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install original npm bot-avatars and React
        run: npm install --prefix scripts/native-avatar --no-audit --no-fund
      - name: Bundle actual bot-avatars package into APK assets
        run: node scripts/native-avatar/build.mjs
      - name: Require nonempty authentic runtime
        run: |
          test -s android/app/src/main/assets/bot-avatar/index.html
          test "$(wc -c < android/app/src/main/assets/bot-avatar/avatar.bundle.js)" -gt 20000
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check actual Android WebView canvas and animated frames
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-native-bot-avatar.sh
      - name: Preserve screenshots, actual JS bundle and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authentic-bot-avatars-android
          path: |
            native-avatar-evidence/*.png
            android/app/src/main/assets/bot-avatar/avatar.bundle.js
            android/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 30
