name: Android benchmark

# perf-4 — chat screen frame-budget evidence on the emulator (API 34).
# Thresholds are decided on the RAW numbers (frameDurationCpuMs lists,
# timeToInitialDisplayMs), never softened inside the harness.

on:
  workflow_dispatch: {}
  push:
    branches: ['main']
    paths:
      - 'android/app/**'
      - 'android/benchmark/**'
      - '.github/workflows/android-benchmark.yml'

permissions:
  contents: read

jobs:
  chat-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM (run 38704622804 booted without it and never completed)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run chat screen macrobenchmark on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd android && bash -c 'set -o pipefail; gradle :benchmark:connectedCheck --no-daemon --stacktrace 2>&1 | tee ../benchmark-raw.log'
      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-benchmark-raw
          path: |
            benchmark-raw.log
            android/benchmark/build/outputs/**
          if-no-files-found: warn
