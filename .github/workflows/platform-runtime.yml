name: Platform runtime contracts

on:
  pull_request:
    paths:
      - 'android/app/**'
      - 'shared-contracts/**'
      - '.github/workflows/platform-runtime.yml'
      - 'scripts/check_platform_runtime_results.py'
      - 'scripts/publish_response_section_frames.py'
      - '.github/workflows/review-native-response-sections.yml'
  push:
    branches: [main]
    paths:
      - 'android/app/**'
      - 'shared-contracts/**'
      - '.github/workflows/platform-runtime.yml'
      - 'scripts/check_platform_runtime_results.py'
      - 'scripts/publish_response_section_frames.py'
      - '.github/workflows/review-native-response-sections.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep different revisions independent: a runner stranded before setup on
  # an obsolete revision must not prevent the corrected revision from running.
  group: platform-runtime-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Observe notifications, background continuation, long press and haptic dispatch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd android && bash -o pipefail -c 'gradle :app:testDebugUnitTest --tests com.grapsee.gsai.ui.chat.content.CalcHonestyTest --tests com.grapsee.gsai.ui.chat.content.ContentBlocksTest --tests "com.grapsee.gsai.ui.chat.NexlyChatScreenshotTest.sectionReference*" -PgsShots=true :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.grapsee.gsai.PlatformRuntimeTest --no-daemon --stacktrace 2>&1 | tee ../platform-runtime.log'
      - name: Require all six actual response-section frames
        if: always()
        run: |
          python3 - <<'PYFRAMES'
          from pathlib import Path
          expected = ['01-dashboard', '02-structured-launch', '03-react-code', '04-citations', '05-data-grid', '06-interactive-charts']
          for section in expected:
              image = Path('android/app/build/screenshots') / ('genui-reference-android-' + section + '-393x852.png')
              if not image.is_file() or image.stat().st_size < 20000:
                  raise SystemExit('Missing actual native section frame: ' + str(image))
          print('All six actual Android section frames captured; visual review remains required')
          PYFRAMES
      - name: Require every runtime test (no skipped or empty reports)
        if: always()
        run: |
          python3 scripts/check_platform_runtime_results.py --self-test
          python3 scripts/check_platform_runtime_results.py android/app/build/outputs/androidTest-results/connected
      - name: Publish causal diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('platform-runtime.log')
          if p.exists():
              lines = p.read_text(errors='replace').splitlines()
              errors = [s for s in lines if s.startswith(('e:', 'Caused by:', 'Execution failed')) or 'FAIL' in s or 'Exception' in s]
              for line in errors[-30:]:
                  print('::error::' + line[:2000].replace('%', '%25').replace('\r', '%0D'))
          PY
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-platform-runtime
          path: |
            platform-runtime.log
            android/app/build/screenshots/genui-reference-*.png
            android/app/build/screenshots/genui-reference-*-scroll.json
            android/app/build/outputs/androidTest-results/connected/**
            android/app/build/reports/androidTests/connected/**
          if-no-files-found: error

  response-section-review:
    needs: android
    if: always()
    uses: ./.github/workflows/review-native-response-sections.yml
    with:
      platform: android
      artifact: android-platform-runtime
