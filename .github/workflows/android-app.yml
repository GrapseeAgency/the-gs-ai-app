name: android-app

# Compiles the Android app module and runs its unit tests.
#
# WHY THIS EXISTS
#
# Three defects in a row shipped in Kotlin that no compiler on any machine had
# looked at, because there is no Kotlin compilation anywhere in this repo's CI:
#
#   * LocalContext.current read inside a coroutine lambda (composable-only value)
#   * a property assigned from outside the object that declares it (private set)
#   * a key constant referenced but never declared
#
# The same class of defect already cost the JNI bridge nine type errors, for the
# same reason: code guarded behind a cfg or a directory that nothing builds. The
# fix then and here is the same one -- make the compiler see it.
#
# The native library is NOT built here. android-native.yml produces the four
# .so artifacts; this job compiles and tests the Kotlin against the module's
# existing configuration, so a failure is a Kotlin failure and not a native one.
#
# There is no gradle wrapper JAR in the repo (only gradle-wrapper.properties),
# so the runner's gradle is used. That is a real limitation of the repo and is
# recorded rather than papered over: a wrapper would make builds reproducible
# across machines, and its absence is a follow-up, not a solved problem.

on:
  workflow_dispatch:
  push:
    branches: [native-runtime]
    paths:
      - 'android/**'
      # THE LINT JOB IN HERE INSPECTS THESE PATHS, SO THESE PATHS MUST TRIGGER IT.
      #
      # The filter was `android/**` alone, which meant the five lints added to this
      # workflow -- two of which read .github/workflows/*.yml and all of which read
      # .github/scripts/ -- could only ever run in response to a commit that had
      # ALREADY broken something they inspect. Wiring a lint into a workflow whose
      # trigger excludes the lint's own inputs is the same defect as not writing the
      # lint: a check that cannot run cannot fail.
      #
      # Found by reading the trigger AFTER wiring the lints, which is the order that
      # made it visible. Writing them and assuming they were now enforced is exactly
      # the assumption this repository keeps having to unpick.
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'native/cpp/**'
      - 'native/crates/**'
  pull_request:
    branches: [native-runtime]
    paths:
      - 'android/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'native/cpp/**'
      - 'native/crates/**'

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: 8.9

jobs:
  compile:
    name: compile + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Braces balance, which sounds like something the compiler does and does.
      # It does -- but three separate attempts to check one Kotlin file's balance
      # by hand each gave a DIFFERENT WRONG ANSWER first:
      #
      #   s.count('{') vs s.count('}')     IMBALANCED on a file the build had
      #                                    compiled, because a JSON spec inside
      #                                    a string contributes one of each and
      #                                    the totals land differently
      #   a per-line scanner               still wrong, because a Kotlin "..."
      #                                    literal may span LINES
      #   no /* */ or 'c' handling        still wrong
      #
      # So the only way to hand-count a 1500-line file with JSON in it is to read
      # it, and "I read it and it looks fine" is a guess wearing the costume of a
      # check. The scanner is verified in BOTH directions against fixtures, and
      # reports a file the compiler accepted as the SCANNER's failure -- because
      # a 1500-line Kotlin file with JSON in it is not exactly short, and an
      # automated check that is never wrong about clean files is a check nobody
      # has watched fail.
      #
      # It does not replace the compiler. Ten seconds here against a build that
      # would find the same thing in five minutes, and the value is that the
      # wrong answer never gets acted on.
      - name: Braces balance in every Kotlin source
        run: |
          set -euo pipefail
          mapfile -t KT < <(
            find android/app/src ios -name '*.kt' -o -name '*.kts' 2>/dev/null | sort
          )
          echo "checking ${#KT[@]} Kotlin source(s)"
          test "${#KT[@]}" -gt 0 || {
            echo "FAIL: found no Kotlin sources; the find pattern is wrong and this"
            echo "FAIL: step would pass by checking nothing."
            exit 1
          }
          python3 .github/scripts/check_kt_braces.py "${KT[@]}"

      # The one escape with no legitimate use in Kotlin. Narrow on purpose: a
      # general "unsupported escape" scan reports 64 false positives across this
      # tree, because backslashes are literal inside raw strings and inside
      # comments, and this tree is full of regexes written both ways.
      #
      # Added after android-release 37229157857 failed on
      #   SendFailureNoticeTest.kt:67:14 Unsupported escape sequence
      # from a "\\`accumulated\\`" written into a string literal. Verified by
      # reintroducing that exact token and confirming this reports it at 67:14
      # and 67:27 -- the same position the Kotlin compiler gave.
      - name: No escaped backticks in Kotlin string literals
        run: |
          set -euo pipefail
          mapfile -t KTB < <(
            find android/app/src -name '*.kt' 2>/dev/null | sort
          )
          echo "checking ${#KTB[@]} Kotlin source(s)"
          test "${#KTB[@]}" -gt 0 || {
            echo "FAIL: found no Kotlin sources; the find pattern is wrong and"
            echo "FAIL: this step would pass by checking nothing."
            exit 1
          }
          python3 .github/scripts/check_kt_escaped_backtick.py "${KTB[@]}"

      # Guards the v0.71.2 perf fix: the local path replayed a FINISHED answer
      # with delay(26) per word, ~4.9s of dead air per reply. The engine returns
      # a completed String, so any delay in ChatRepository is simulated
      # streaming. Scoped to that one file on purpose -- real retry backoff is
      # legitimate and lives in ApiClient.
      #
      # Verified non-vacuously: restoring the typewriter makes this exit 1, and
      # it stays 0 on the fix's own comment, which quotes `delay(26)` to explain
      # what was removed. Comments are exempt for that reason.
      - name: No artificial per-chunk delay in the chat send path
        run: |
          set -euo pipefail
          CR=android/app/src/main/java/com/grapsee/gsai/data/repository/ChatRepository.kt
          test -f "$CR" || {
            echo "FAIL: $CR is gone; this step would pass by checking nothing."
            exit 1
          }
          python3 .github/scripts/check_no_fake_streaming_delay.py "$CR"

      # A brace counter cannot see a missing field name, and a file-wide
      # "is this field declared anywhere?" cannot either -- `ttft` IS declared,
      # by two other row classes in the same file. The read has to be bound to
      # the class in the scope that reads it, which is what this does.
      #
      # Added after android-app 36956809627 failed on
      #   DeviceVerificationTest.kt:2089:39 Unresolved reference 'ttft'
      # where BRow's field is ttftMs. Kotlin is the authority and it caught this
      # in five minutes; this catches it without a round trip, and was itself
      # verified by reintroducing the exact bug on a copy and confirming the
      # script rejects it.
      # FIVE LINTS THAT WERE FILES AND NOTHING ELSE.
      #
      # Each of these was written during this session to stop a defect class from
      # recurring, and each was run BY HAND from a shell. None of them was invoked
      # by any workflow. A lint nothing executes is a comment with a shebang: it
      # cannot fail a build, cannot stop a commit, and cannot tell anyone it exists
      # except the person who wrote it.
      #
      # That is the same defect as the three CI gates found in the audit -- a check
      # that cannot fail -- arrived at from the other direction. It was also caught
      # by a NAIVE CHECK, which is worth recording: the first audit of this asked
      # `grep -l <lint> .github/workflows/*.yml | wc -l` and reported
      # check_workflow_var_scope as wired, because the string appears in a COMMENT
      # in android-release.yml. Five were unwired, not four, and the extra one was
      # found by a substring match standing in for an invocation.
      #
      # All five run here, in the job that already lints, so there is one place to
      # look. Each was verified non-vacuous by re-injecting the defect it was
      # written for.
      - name: Lints that only existed as files until now
        run: |
          set -euo pipefail
          mapfile -t KTL < <(find android/app/src -name '*.kt' 2>/dev/null | sort)
          test "${#KTL[@]}" -gt 0 || {
            echo "FAIL: no Kotlin sources found; the find pattern is wrong and these"
            echo "FAIL:lints would pass by checking nothing."
            exit 1
          }
          mapfile -t WFL < <(ls .github/workflows/*.yml)
          test "${#WFL[@]}" -gt 0 || {
            echo "FAIL: no workflow files found."
            exit 1
          }
          mapfile -t CPPS < <(find native/cpp -name '*.cpp' -o -name '*.h' 2>/dev/null | sort)
          test "${#CPPS[@]}" -gt 0 || {
            echo "FAIL: no C++ sources found; check_error_code_conventions would pass"
            echo "FAIL:by checking nothing."
            exit 1
          }
          echo "  ${#KTL[@]} Kotlin, ${#WFL[@]} workflow, ${#CPPS[@]} C++ file(s)"

          echo "--- format specifiers match argument counts"
          python3 .github/scripts/check_kt_format_specs.py "${KTL[@]}"

          echo "--- imports resolve, none unused, no unimported framework type"
          # ALL THREE SOURCE SETS, not just main. Test files import test-local
          # helpers (WireServer, Elf64) and the benchmark suite lives under
          # src/test; resolving against main alone reported 23 unresolvable imports
          # that were all resolvable in their own source set.
          python3 .github/scripts/check_kt_imports.py "${KTL[@]}" \
            --src android/app/src/main/java/com/grapsee/gsai \
            --src android/app/src/androidTest/java/com/grapsee/gsai \
            --src android/app/src/test/java/com/grapsee/gsai

          echo "--- bool results are not consumed as ABI error codes"
          python3 .github/scripts/check_error_code_conventions.py "${CPPS[@]}"

          echo "--- every run: block's variables are in scope"
          python3 .github/scripts/check_workflow_var_scope.py "${WFL[@]}"

          echo "--- no comment between backslash-continued lines"
          python3 .github/scripts/check_shell_continuations.py "${WFL[@]}"

          echo "--- every workflow that runs a script is triggered by changes to it"
          python3 .github/scripts/check_workflow_trigger_covers_scripts.py "${WFL[@]}"

      # `grep` EXITS 1 WHEN IT MATCHES NOTHING. That is an answer, not an error, and
      # under `set -e` an unguarded grep that correctly finds nothing kills the script.
      #
      # This is not theoretical. The device suite's test-count gate never executed
      # across three ~70-minute runs:
      #
      #     set -e                                                    # line 393
      #     IGNORED=$(grep -rhcE '^[[:space:]]*@Ignore\b' .../*.kt | awk '{s+=$1} ...')
      #
      # This repository has ZERO @Ignore annotations, so grep correctly exited 1,
      # pipefail promoted it, set -e killed the script on the assignment -- one line
      # before the gate's first echo -- and every run reported only:
      #
      #     connectedDebugAndroidTest exit: 1
      #     === dumping logcat (test exit was 2) ===
      #
      # Reproduced without a runner, and it is the SAME SHAPE as the `grep -q` SIGPIPE
      # trap this repository has hit three times, inverted: there a grep that
      # SUCCEEDED killed the step, here a grep that correctly found NOTHING does.
      #
      # Swept over every .sh under .github/scripts and every workflow run block, so
      # the blast radius is measured rather than assumed: 9 sites, of which one was
      # `GOT=$(nm -D ... | grep -oE 'gs_ffi_mobile_...')` -- a .so exporting none of
      # those symbols is the defect the step exists to catch, and it died silently on
      # the assignment instead of reaching the comparison that names the shortfall.
      #
      # NOTE (deliberately not silenced): the lint reports bare pipelines ending in
      # grep as ::warning::, not ::error::. In those the grep may BE the assertion, and
      # wrapping it in `|| true` would disable a real check. They are surfaced so the
      # missing diagnostic is visible, not so they can be suppressed.
      - name: No unguarded `grep` after `set -e`
        run: |
          set -euo pipefail
          mapfile -t SHL < <(ls .github/scripts/*.sh)
          test "${#SHL[@]}" -gt 0 || {
            echo "FAIL: no .github/scripts/*.sh found, so half this check would pass"
            echo "FAIL:by inspecting nothing."
            exit 1
          }
          # WFL IS BUILT HERE, NOT INHERITED. The first version of this step read
          # ${WFL[@]} from the other lint step, and check_workflow_var_scope.py -- my
          # own lint -- flagged it: each `run:` block is its own shell. Caught before
          # dispatch by the lint that exists for exactly this, which is the first time
          # in this session one of these lints has caught the step that added it.
          mapfile -t WFL < <(ls .github/workflows/*.yml)
          test "${#WFL[@]}" -gt 0 || {
            echo "FAIL: no workflow files found, so the other half of this check"
            echo "FAIL:would pass by inspecting nothing."
            exit 1
          }
          python3 .github/scripts/check_set_e_grep_traps.py "${SHL[@]}" "${WFL[@]}"

      - name: Row field reads name fields the row declares
        run: |
          set -euo pipefail
          mapfile -t KTT < <(
            find android/app/src -name '*.kt' 2>/dev/null | sort
          )
          echo "checking ${#KTT[@]} Kotlin source(s) for unbound row field reads"
          test "${#KTT[@]}" -gt 0 || {
            echo "FAIL: found no Kotlin sources; the find pattern is wrong and this"
            echo "FAIL: step would pass by checking nothing."
            exit 1
          }
          python3 .github/scripts/check_row_fields.py "${KTT[@]}"

      # The ABI is written down in TWO places that are not the same list on
      # purpose: the full set in .github/scripts/gs_mobile_abi.txt, and an
      # eleven-symbol non-diffusion subset inline in ios-native.yml, because the
      # iOS device slice is not required to carry the sd_* entry points.
      #
      # "They are supposed to agree" was not enforced by anything, and the
      # android-native floor was a hand-written `-ge 17` with a comment claiming
      # it matched the ABI. It did not: it would have kept passing at 17 while the
      # ABI was 18, because a floor cannot notice a set growing. The floor and the
      # per-symbol comparison now both read the .txt, and this lint checks that
      # the iOS subset is a real, non-empty subset of it.
      # CAN A GREEN IN THIS SUITE MEAN ANYTHING?
      #
      # Two narrow checks, each verified by PLANTING the defect it exists for and
      # watching it get caught. A @Test with no assertion that can fail is a test
      # that cannot fail; an assertion whose condition cannot be false is not an
      # assertion. Both were worth writing because both had already been true in
      # this repository's history in a different form -- two tests skipped
      # precisely because the library was broken (run 36971941114), which made
      # "the library does not load" a green.
      #
      # The step asserts a non-zero @Test count FIRST, because a scan handed the
      # wrong paths examines nothing and exits 0. That is the shape of failure
      # this repository pays for most often.
      - name: Every test can fail, and every assertion is load-bearing
        run: |
          set -euo pipefail
          mapfile -t KTT < <(find android/app/src/androidTest -name '*.kt' 2>/dev/null | sort)
          echo "checking ${#KTT[@]} instrumented-test source(s)"
          test "${#KTT[@]}" -gt 0 || {
            echo "FAIL: found no androidTest sources; the find pattern is wrong and"
            echo "FAIL: this step would pass by checking nothing."
            exit 1
          }
          # `{ ... || true; }` so a file with no @Test cannot kill the step: this COUNTS
          # annotations to decide whether the lint below has anything to check, and a
          # count of zero is a legitimate answer, not a failure. Found by
          # check_set_e_grep_traps.py. Note this is the same shape as the bug that
          # stopped run-instrumented.sh's test-count gate from ever executing.
          NTESTS=$( { grep -h -o '@Test' "${KTT[@]}" || true; } | wc -l | tr -d ' ')
          echo "  $NTESTS @Test annotation(s) across ${#KTT[@]} file(s)"
          test "$NTESTS" -gt 0 || {
            echo "FAIL: no @Test found. Either the suite is empty or the extractor"
            echo "FAIL: stopped matching, and both must be a red run."
            exit 1
          }
          python3 .github/scripts/check_tests_can_fail.py "${KTT[@]}"

      - name: The two ABI lists agree
        run: |
          set -euo pipefail
          python3 .github/scripts/check_abi_lists_agree.py

      - name: Install the Android SDK
        run: |
          set -euo pipefail
          # The image ships ANDROID_HOME with no cmdline-tools, and sdkmanager is
          # therefore not on PATH. Every workflow that assumed otherwise failed
          # with "sdkmanager: command not found".
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools "$SDK/cmdline-tools/latest"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # compileSdk/targetSdk 35, minSdk 26. Installed explicitly rather than
          # letting the Gradle plugin pick a build-tools version, because an
          # unpinned one makes a failure unreproducible.
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "sdk: $(ls "$SDK/platforms")"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compile the Kotlin
        working-directory: android
        run: |
          set -euo pipefail
          # PIN THE GRADLE, DO NOT BORROW THE RUNNER'S. The runner image ships a
          # Gradle far newer than any AGP 8.x tolerates -- raw, run 37282692340:
          #     Plugin 'com.android.internal.application' relies on
          #     'org.gradle.api.problems.internal.InternalProblems', a Gradle
          #     internal API that was removed in Gradle 9.6.0.
          # ...with the runner on Gradle 9.8.0. The repo carries no
          # gradle-wrapper.jar BY DESIGN (no committed binaries), so the
          # wrapper is GENERATED here from the runner's own Gradle and then
          # every invocation goes through ./gradlew, which downloads the
          # distribution the properties file pins (gradle-8.13-bin.zip).
          # The generated jar lives only on the runner; nothing binary lands
          # in the repository.
          gradle wrapper --gradle-version 8.13 --distribution-type bin --no-daemon \
            || { echo "::error::could not generate the Gradle 8.13 wrapper"; exit 1; }
          ./gradlew --version | sed -n '1,9p'
          grep -q "Gradle 8.13" <(./gradlew --version 2>/dev/null) \
            || { echo "::error::the wrapper did not resolve Gradle 8.13"; exit 1; }
          # --no-daemon because a runner has one process and gradle's daemon
          # survives the step and eats the next one.
          # --info, because at the default level Gradle reports only
          #   Compilation error. See log for more details
          # and the actual `e: file://...` lines never reach the job log.
          # Raw, run 36383562738. That is the same defect as every other
          # swallowed diagnostic in this repo's history: a build that fails
          # without saying why, which costs a full re-run to diagnose.
          # --console=plain so the lines are not wrapped in ANSI box drawing.
          # BOTH source sets. Compiling only the main one let a completely
          # non-compiling androidTest file pass for as long as nobody ran the
          # emulator:
          #     .kt:10:12 Unresolved reference 'junit'.
          #     .kt:109:6  Unresolved reference 'Test'.
          # A source set that is never compiled is a source set nobody is
          # checking, and the instrumented tests are the whole point of the
          # device run.
          ./gradlew --no-daemon --console=plain --info --stacktrace \
            :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin 2>&1 | tee compile.log
          # Echo the diagnostics on their own, so a failure is legible without
          # scrolling a 4000-line --info log.
          echo "=== kotlin diagnostics ==="
          grep -E '^e: |^w: .*(GsNative|Model|Local|Device)' compile.log | sed -n '1,80p' || true
          echo "=== (end) ==="
          # Fail on gradle's status, not on grep's.
          test "${PIPESTATUS[0]}" -eq 0
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          # The Kotlin module references GsNative's JNI surface only through
          # `external fun` declarations, so the .so is not needed to compile.
          # Lint cannot see that, so the check is disabled for this job and
          # re-enabled by android-native.yml's own build.
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

      - name: Unit tests
        working-directory: android
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
        continue-on-error: true

      - name: Report
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### android-app"
            echo "compileDebugKotlin: see the step above"
            echo "note: no gradle wrapper JAR is committed, so the runner's"
            echo "      gradle $GRADLE_VERSION is used. Builds are therefore not"
            echo "      reproducible across machines until a wrapper is added."
          } >> "$GITHUB_STEP_SUMMARY"
