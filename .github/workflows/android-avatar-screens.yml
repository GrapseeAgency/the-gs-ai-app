name: Authentic Android bot-avatars native playback

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/app/src/main/java/com/grapsee/gsai/ui/components/GsBotAvatar.kt'
      - 'android/app/src/main/java/com/grapsee/gsai/ui/chat/ChatScreen.kt'
      - 'android/app/build.gradle.kts'
      - 'android/app/src/main/assets/bot-avatar/**'
      - 'android/app/src/androidTest/java/com/grapsee/gsai/BotAvatarNativeDeviceTest.kt'
      - 'scripts/native-avatar/**'
      - '.github/scripts/run-native-bot-avatar.sh'
      - '.github/workflows/android-avatar-screens.yml'
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/java/com/grapsee/gsai/ui/components/GsBotAvatar.kt'
      - 'android/app/src/main/java/com/grapsee/gsai/ui/chat/ChatScreen.kt'
      - 'android/app/build.gradle.kts'
      - 'android/app/src/main/assets/bot-avatar/**'
      - 'android/app/src/androidTest/java/com/grapsee/gsai/BotAvatarNativeDeviceTest.kt'
      - 'scripts/native-avatar/**'
      - '.github/workflows/android-avatar-screens.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentic-native-avatar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Use runner's installed Chrome for build-time original frame capture
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -x "$CHROME"
          "$CHROME" --version
          echo "GS_AVATAR_CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check native original-library animation and composer in Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-native-bot-avatar.sh
      - name: Preserve Android hardware-window screenshots and original asset provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authentic-bot-avatars-android
          path: |
            native-avatar-evidence/*.png
            native-avatar-evidence/instrumentation.txt
            native-avatar-evidence/logcat.txt
            android/app/build/generated/originalAvatarAssets/bot-avatar/native/manifest.json
            android/app/build/generated/originalAvatarAssets/bot-avatar/native/clover-*-poster.png
            android/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 30
