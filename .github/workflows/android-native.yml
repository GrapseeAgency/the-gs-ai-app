name: android-native

# Cross-compiles libgs_ffi.so for the four Android ABIs and attaches one
# artifact per ABI. Binaries are artifacts, never git: the repo carries source
# only.
#
# The mobile build is PORTABLE-ONLY by design. ONNX Runtime, llama.cpp and
# Tesseract have no drop-in prebuilts for arm64 Android, and a 300 MB decode
# engine inside a phone binary is not the product. gs-ffi detects an Android
# target in build.rs and links only the portable C++ surface, whose
# backend-dependent entry points report GS_ERR_UNAVAILABLE with a reason.
# That is what the host app's local-first routing checks.

on:
  workflow_dispatch:
    inputs:
      deps_run_id:
        description: >-
          android-deps run to take the prebuilt packages from. BLANK means "the
          most recent successful one", which is what a push does.
        required: false
        default: ""
        type: string
      native_run_id:
        description: >-
          Reserved, for symmetry with android-device.yml, which takes a
          android-native run id. This workflow cannot consume its own run id, so
          the input exists to be explicit about that rather than to be used.
        required: false
        default: ""
        type: string
  push:
    branches: [native-runtime]
    paths:
      - 'native/**'
      - '.github/workflows/android-native.yml'
      - '.cargo/config.toml'
concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMDLINE_VERSION: 11076708
  NDK_VERSION: 25.2.9519653
  # Consumed by gs-ffi/build.rs on the desktop only; the Android target path
  # ignores it and compiles portable-only.
  GS_ALLOW_MISSING_ONNX: "1"

jobs:
  build:
    name: ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triple: aarch64-linux-android
            target: aarch64-linux-android
          - abi: armeabi-v7a
            # NOT armv7a-linux-androideabi. That is the Clang target
            # triple; the sysroot DIRECTORY is named arm-linux-androideabi.
            # The runner listed it for us, run 36648181332:
            #     aarch64-linux-android  arm-linux-androideabi
            #     i686-linux-android      x86_64-linux-android
            # and then failed on the path we asked for instead:
            #     ls: cannot access .../usr/lib/armv7a-linux-androideabi
            #     ::error::libc++_shared.so still absent from the documented path
            triple: arm-linux-androideabi
            target: armv7-linux-androideabi
          - abi: x86_64
            triple: x86_64-linux-android
            target: x86_64-linux-android
          - abi: x86
            triple: i686-linux-android
            target: i686-linux-android

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The JNI bridge is `#[cfg(target_os = "android")]` by default, so a type
      # error in it is invisible to `cargo test` and to `cargo build` on a host.
      # That is not theoretical: nine E0308 errors sat in src/jni.rs until the
      # arm64 build ran (run 36374643605). This step is the fix for the blind
      # spot — a few seconds of host compilation, before the NDK is even
      # installed. It needs no ONNX and no llama.cpp, so it is the cheapest
      # possible place to catch the class of error that was invisible.
      - name: Type-check the JNI bridge on the host
        working-directory: native
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo check -p gs-ffi --features jni-typecheck

      - name: Install Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add ${{ matrix.target }}
          rustc --version

      # ATTEMPT 1 FAILED HERE. Raw error from run 36345064039, job arm64-v8a:
      #   /home/runner/work/_temp/f7d0910b-....sh: line 6: sdkmanager: command not found
      #   ##[error]Process completed with exit code 127.
      # The image ships an ANDROID_HOME with no command-line tools, so sdkmanager
      # is absent and every one of the four ABIs failed identically. Installed
      # from the Google zip rather than assuming the image provides it.
      - name: Install Android command-line tools and NDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd /tmp
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_VERSION}_latest.zip"
          unzip -q "commandlinetools-linux-${CMDLINE_VERSION}_latest.zip"
          # The zip unpacks cmdline-tools/, but the SDK requires the
          # *latest/* layout or every sdkmanager invocation fails.
          mv cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          echo "ANDROID_HOME=$SDK_ROOT"   >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          # Both names, same path. The image ships NDK 27.3.13750724 and
          # cargo-ndk 4 resolves the disagreement by preferring whichever
          # variable it sees, which silently built against an NDK this job did
          # not install:
          #   warning: Environment variable `ANDROID_NDK_HOME =
          #     "/home/runner/android-sdk/ndk/25.2.9519653"` doesn't match
          #     `ANDROID_NDK_ROOT = "/usr/local/lib/android/sdk/ndk/27.3.13750724"`
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          # Assert the tool exists BEFORE relying on it. The previous failure
          # was a missing binary discovered three steps later.
          command -v sdkmanager
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "ndk;$NDK_VERSION" "platform-tools" >/dev/null
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" >/dev/null

          test -d "$SDK_ROOT/ndk/$NDK_VERSION" || {
            echo "NDK $NDK_VERSION missing"; exit 1; }
          ls "$SDK_ROOT/ndk/$NDK_VERSION/toolchains/llvm/prebuilt"

      - name: Install cargo-ndk
        run: |
          set -euo pipefail
          cargo install cargo-ndk --locked
          cargo ndk --version

      - name: Fetch the cross-compiled llama.cpp for this ABI
        env:
          GH_TOKEN: ${{ github.token }}
          DEPS_RUN_ID: ${{ github.event.inputs.deps_run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # Downloaded from THE SPECIFIC RUN that triggered this one, via the REST
          # API rather than `gh run download` (which only ever sees the latest run
          # of a workflow and would be a race against the next android-deps push).
          #
          # Without this the .so is PORTABLE-ONLY: it links, it exports all 10
          # mobile symbols, and every generation call answers GS_ERR_UNAVAILABLE.
          # The tests would then "pass" by asserting that nothing works, which is
          # the opposite of what they are for. So this fails the job.
          # On workflow_dispatch there is no triggering run, so fall back to the
          # most recent completed android-deps run. Without the fallback the job
          # is unreachable by hand, and "I can only run it the way CI runs it" is
          # not a usable property.
          if [ -z "$DEPS_RUN_ID" ] || [ "$DEPS_RUN_ID" = "0" ]; then
            DEPS_RUN_ID=$(
              curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/android-deps.yml/runs?per_page=1&status=success" \
              | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["workflow_runs"][0]["id"]))'
            )
            echo "dispatch: using the latest successful android-deps run"
          fi
          echo "deps run: $DEPS_RUN_ID"
          mkdir -p native/prebuilts/android-${{ matrix.abi }} /tmp/artifact
          ARTIFACT_ID=$(
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$DEPS_RUN_ID/artifacts" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((str(a["id"]) for a in d.get("artifacts",[]) if a["name"]=="llamacpp-${{ matrix.abi }}"), ""))'
          )
          if [ -z "$ARTIFACT_ID" ]; then
            echo "FAIL: the llamacpp-${{ matrix.abi }} artifact is not in run $DEPS_RUN_ID."
            echo "      Available:"
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$DEPS_RUN_ID/artifacts" \
              | python3 -c 'import json,sys; [print("       ",a["name"],a["size_in_bytes"],"bytes") for a in json.load(sys.stdin).get("artifacts",[])]' 
            echo "      Without it the app is portable-only and these tests cannot"
            echo "      test generation at all."
            exit 1
          fi
          echo "artifact id: $ARTIFACT_ID"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/artifact/llamacpp.zip
          ls -la /tmp/artifact/llamacpp.zip
          echo "=== what kind of file did the API hand back? ==="
          file /tmp/artifact/llamacpp.zip
          # GitHub's artifact API returns a ZIP. Raw, first device run:
          #     tar: This does not look like a tar archive
          #     tar: Exiting with failure status due to previous errors
          #     ##[error]Process completed with exit code 2.
          # It used to be a tarball wrapped in a zip. Uploaded a directory
          # instead, and this handles both shapes anyway because the cost of
          # guessing wrong is a 40-minute emulator run.
          if unzip -l /tmp/artifact/llamacpp.zip >/dev/null 2>&1; then
            echo "zip: unzipping"
            rm -rf /tmp/artifact/x && mkdir -p /tmp/artifact/x
            unzip -o -q /tmp/artifact/llamacpp.zip -d /tmp/artifact/x
            # A tarball inside the zip is still possible; unwrap it.
            T=$(find /tmp/artifact/x -name '*.tar.gz' | sed -n '1p')
            if [ -n "$T" ]; then
              echo "zip contained a tarball: $T"
              tar -xzf "$T" -C native/prebuilts/android-${{ matrix.abi }}
            else
              cp -r /tmp/artifact/x/. native/prebuilts/android-${{ matrix.abi }}/
            fi
          elif tar -tzf /tmp/artifact/llamacpp.zip >/dev/null 2>&1; then
            echo "gzip: untarring"
            tar -xzf /tmp/artifact/llamacpp.zip -C native/prebuilts/android-${{ matrix.abi }}
          else
            echo "FAIL: the artifact is neither a zip nor a gzip tarball"
            file /tmp/artifact/llamacpp.zip
            head -c 200 /tmp/artifact/llamacpp.zip | cat -v | sed -n '1,5p'
            exit 1
          fi
          echo "=== prebuilt contents ==="
          find native/prebuilts/android-${{ matrix.abi }} -type f | sort | sed -n '1,30p'
          # THE ARCHIVE MUST ACTUALLY BE THIS ABI, NOT JUST PRESENT.
          # android-deps was green, assert_arch_member.sh passed, and the
          # CMake-reported architecture was aarch64 -- all true, and all
          # irrelevant, because this job was never given arm64 archives.
          for A in native/prebuilts/android-${{ matrix.abi }}/lib/*.a; do
            M=$(python3 -c 'import struct,sys
          d=open(sys.argv[1],"rb").read(); off=8; n=0; bad=0
          # Compare e_machine NUMBERS, not names.
          #
          # These were two separate dicts -- MACH mapped e_machine to a name
          # and WANT mapped the ABI to a name -- and the x86 entry disagreed:
          #
          #     MACH = {0x03: "i386",  0x3e: "x86-64",  0x28: "ARM",  0xb7: "AArch64"}
          #     WANT = {..., "x86": "i686"}
          #
          # "i386" != "i686", so EVERY object in a correct x86 build was counted
          # wrong. Raw, run 36648181332, job 109675949671:
          #
          #     libggml-base.a: 9 objects, 9 wrong-architecture
          #     ::error::libggml-base.a in the x86 package is not x86
          #
          # and the artifact was fine. Downloaded and read directly:
          #
          #     libggml-base.a  objects=9    {i386: 9}
          #     libggml-cpu.a   objects=14   {i386: 14}
          #     libggml.a       objects=2    {i386: 2}
          #     libllama.a      objects=169  {i386: 169}
          #     every object in every archive under vx/lib is i386
          #
          # A check whose two halves can drift is the same defect as the
          # CMAKE_SYSTEM_PROCESSOR gate it replaced, only inverted: that one
          # could not fail, this one could only fail. One table, one
          # comparison, and no name on either side of it.
          E_MACHINE={"arm64-v8a":0xb7,"armeabi-v7a":0x28,"x86_64":0x3e,"x86":0x03}[sys.argv[2]]
          NAMES={0x03:"i386",0x3e:"x86-64",0x28:"ARM",0xb7:"AArch64"}
          while off+60<=len(d):
              h=d[off:off+60]
              if h[58:60]!=b"\x60\n": break
              try: sz=int(h[48:58].decode().strip())
              except ValueError: break
              b=d[off+60:off+60+sz]
              if b[:4]==b"\x7fELF":
                  n+=1
                  if struct.unpack_from("<H",b,18)[0]!=E_MACHINE: bad+=1
              off+=60+sz+(sz%2)
          if n==0: print("0 objects -- not an ar archive, refusing to pass"); sys.exit(3)
          print("%d objects, %d wrong-architecture (want %s)" % (n,bad,NAMES.get(E_MACHINE)))' "$A" "${{ matrix.abi }}")
            echo "  $(basename $A): $M"
            case "$M" in *" 0 wrong-architecture (want "*) ;; *) echo "::error::$(basename $A) in the ${{ matrix.abi }} package is not ${{ matrix.abi }}: $M"; exit 1 ;; esac
          done
          test -f native/prebuilts/android-${{ matrix.abi }}/include/llama.h || {
            echo "FAIL: no include/llama.h in the prebuilt package"; exit 1; }
          test -d native/prebuilts/android-${{ matrix.abi }}/lib || {
            echo "FAIL: no lib/ in the prebuilt package"; exit 1; }
          echo "total: $(du -sh native/prebuilts/android-${{ matrix.abi }} | cut -f1)"
          # The archives must be x86_64, not arm64. The emulator is x86_64 and an
          # arm64 .so is rejected by the linker, which turns every test into a
          # SKIP rather than a FAIL.
          for a in native/prebuilts/android-${{ matrix.abi }}/lib/*.a; do
            echo "  $(basename "$a"): $(file -b "$a")"
          done

          # THE VARIABLE THAT WAS NEVER SET. build.rs reads GS_LLAMA_PREBUILT and
          # requires include/llama.h under it. Nothing in this workflow set it, so
          # llama_root was None and the job published a PORTABLE-ONLY library:
          #     warning: gs-ffi@0.1.0: portable mobile build: CLIP, OCR and
          #     llama.cpp are NOT compiled in
          # It exported all ten mobile symbols and passed every size and symbol
          # gate in the repo. Only a call on a device could tell.
          echo "GS_LLAMA_PREBUILT=$GITHUB_WORKSPACE/native/prebuilts/android-${{ matrix.abi }}" >> "$GITHUB_ENV"
          echo "GS_LLAMA_PREBUILT=$GITHUB_WORKSPACE/native/prebuilts/android-${{ matrix.abi }}"

      # =========================================================================
      # THE SAME BUG, TWICE, IN A SECOND VARIABLE.
      #
      # GS_LLAMA_PREBUILT was, for a long time, read by build.rs and set by nobody
      # -- the library published PORTABLE-ONLY while exporting every symbol and
      # passing every gate in this file. GS_SD_PREBUILT is the same shape and was
      # still unset when this step was written.
      #
      # The evidence, from the green android-native run 36956136615 at head
      # 2188f66. Only the third line appears; the other two are the ones that
      # would have appeared if the variable had been set:
      #
      #     (no) cargo:warning=linking stable-diffusion.cpp in-process from ...
      #     (no) cargo:warning=GS_SD_PREBUILT=... has no include/stable-diffusion.h
      #     YES cargo:warning=portable sd_wrapper: procedural path only.
      #
      # The absence of the middle line is the diagnosis: build.rs only prints it
      # when the variable is PRESENT and the contents are wrong. Neither branch
      # printing means the variable was never set at all, so `have_sd` stayed
      # false, GS_SD_HAVE_SDCPP was undefined, and gs_sd_generate returned
      # GS_ERR_UNAVAILABLE.
      #
      # And nothing downloaded the artifact in the first place: the fetch step
      # above pulls `llamacpp-<abi>` and only that.
      # =========================================================================
      - name: Fetch the cross-compiled stable-diffusion.cpp for this ABI
        env:
          GH_TOKEN: ${{ github.token }}
          DEPS_RUN_ID: ${{ github.event.inputs.deps_run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          ABI_NAME='${{ matrix.abi }}'
          SD_ROOT="native/prebuilts/sd-android-$ABI_NAME"
          WANT="stablediffusion-$ABI_NAME"

          if [ -z "$DEPS_RUN_ID" ] || [ "$DEPS_RUN_ID" = "0" ]; then
            DEPS_RUN_ID=$(
              curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/android-deps.yml/runs" \
              | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["workflow_runs"][0]["id"]))'
            )
          fi
          echo "deps run: $DEPS_RUN_ID, looking for artifact: $WANT"

          LIST=$(mktemp)
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$DEPS_RUN_ID/artifacts" -o "$LIST"
          # A SCRIPT, NOT `python3 -c`, AND THIS IS THE THIRD TIME.
          #
          # The inline version died at parse time, before executing a statement:
          #   File "<string>", line 2
          #   import json,sys
          #   IndentationError: unexpected indent
          #   ##[error]Process completed with exit code 1.
          #
          # Inside a YAML `run: |` block the block indentation is stripped and
          # what reaches the shell is a quoted string whose first line is empty
          # and whose second is indented. `python3 -c` sees a program that begins
          # with a newline and then an indented line.
          #
          # ios-native.yml records the same trap with a different symptom -- a
          # body line at column 0 ENDED the block scalar and the remainder parsed
          # as YAML mapping keys -- and fixed it the same way, with
          # pick_simulator_udid.py. A multi-line program inside a YAML block
          # scalar is a FILE, not an argument.
          SD_ID=$(python3 "$GITHUB_WORKSPACE/.github/scripts/print_artifact_id.py" \
                  "$LIST" "$WANT")
          echo "artifact id: ${SD_ID:-<none>}"

          if [ -z "$SD_ID" ]; then
            # THREE NAMED CAUSES, because "not found" is a symptom and each cause
            # needs a different fix. The available list is printed so the reader
            # can tell "built under another name" from "not built at all".
            echo "::error::$WANT is not in deps run $DEPS_RUN_ID. Artifacts present:"
            # --list, not another inline `python3 -c`. This one happens to work
            # today, and that is exactly why it is going: its correctness depends
            # on how YAML's block scalar happens to strip the indentation, which
            # is not a property anyone can see in the file. See
            # .github/scripts/print_artifact_id.py for the whole story.
            python3 "$GITHUB_WORKSPACE/.github/scripts/print_artifact_id.py" \
                    --list "$LIST"
            echo "::error::One of three things is true, and they need different fixes:"
            echo "::error::  1. android-deps.yml's stablediffusion job did not build this ABI."
            echo "::error::     It now builds a matrix of [arm64-v8a, x86_64] only, so"
            echo "::error::     armeabi-v7a and x86 legitimately have no such artifact."
            echo "::error::  2. The job failed. Check its conclusion before assuming otherwise."
            echo "::error::  3. deps_run_id points at a run from BEFORE that matrix existed,"
            echo "::error::     when the artifact was named stablediffusion-arm64 for every ABI."
            # x86_64 IS THE ABI THE DEVICE JOB RUNS, and the whole point of this
            # step is that a device test must not run against a library that
            # cannot generate. Failing closed HERE is what turns "the .so was
            # portable-only" into a red job instead of a green job and a test that
            # asserts nothing works.
            if [ "$ABI_NAME" = "x86_64" ] || [ "$ABI_NAME" = "arm64-v8a" ]; then
              echo "::error::$ABI_NAME needs this package; the .so would publish without it and"
              echo "::error::every diffusion test on the device would assert against a build that"
              echo "::error::cannot generate. Failing here instead."
              exit 1
            fi
            echo "::warning::$ABI_NAME has no stable-diffusion package by design, so this .so"
            echo "::warning::is PORTABLE-ONLY for diffusion: gs_sd_generate will return"
            echo "::warning::GS_ERR_UNAVAILABLE and say so, and gs_sd_render_svg is unaffected."
            echo "GS_SD_PREBUILT=" >> "$GITHUB_ENV"
            exit 0
          fi

          mkdir -p "$SD_ROOT" /tmp/sdartifact
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SD_ID/zip" \
            -o /tmp/sdartifact/sd.zip
          ls -la /tmp/sdartifact/sd.zip
          file /tmp/sdartifact/sd.zip
          rm -rf /tmp/sdartifact/x && mkdir -p /tmp/sdartifact/x
          unzip -o -q /tmp/sdartifact/sd.zip -d /tmp/sdartifact/x
          T=$(find /tmp/sdartifact/x -name '*.tar.gz' | sed -n '1p')
          if [ -n "$T" ]; then
            echo "zip contained a tarball: $T"
            tar -xzf "$T" -C "$SD_ROOT"
          else
            cp -r /tmp/sdartifact/x/. "$SD_ROOT"/
          fi

          echo "=== $SD_ROOT contents ==="
          find "$SD_ROOT" -type f | sort | sed -n '1,30p' | sed 's/^/    /'

          # THE HEADER IS THE PART build.rs ACTUALLY NEEDS, and the part that was
          # missing for weeks while the job stayed green. Asserted here so its
          # absence is a named failure at the fetch rather than a silent fall
          # through to the portable branch.
          test -f "$SD_ROOT/include/stable-diffusion.h" || {
            echo "::error::$SD_ROOT has no include/stable-diffusion.h. build.rs will take the"
            echo "::error::portable branch and gs_sd_generate will answer GS_ERR_UNAVAILABLE."
            echo "::error::package contents:"; find "$SD_ROOT" -type f | sed 's/^/::error::    /'
            exit 1
          }
          echo "header: $(wc -c < "$SD_ROOT/include/stable-diffusion.h") bytes"

          # ALL FOUR ARCHIVES, because build.rs links them in a fixed order:
          # stable-diffusion -> ggml -> ggml-cpu -> ggml-base. A missing base
          # archive produces a wall of undefined ggml symbols that names neither
          # the cause nor the file, so it is checked here where the cause is known.
          MISSING=""
          for A in libstable-diffusion libggml libggml-cpu libggml-base; do
            test -f "$SD_ROOT/lib/lib$A.a" || MISSING="$MISSING $A.a"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::$SD_ROOT/lib is missing:$MISSING"
            echo "::error::The link order is stable-diffusion, ggml, ggml-cpu, ggml-base; a"
            echo "::error::missing member of that chain surfaces as undefined ggml symbols"
            echo "::error::in the .so with nothing to name the cause."
            echo "::error::present:"; ls -1 "$SD_ROOT/lib" 2>/dev/null | sed 's/^/::error::    /'
            exit 1
          fi
          for A in "$SD_ROOT"/lib/*.a; do
            echo "  $(basename "$A"): $(file -b "$A" | cut -c1-90)"
          done

          # SAME ARCHITECTURE GATE THE LLAMA ARCHIVES GET. An arm64 archive
          # unpacked into an x86_64 build links into a .so the emulator refuses
          # to load, and every device test becomes a skip rather than a failure.
          case "$ABI_NAME" in
            arm64-v8a)  NAMES="AArch64 aarch64" ;;
            x86_64)     NAMES="X86-64 x86-64" ;;
            armeabi-v7a) NAMES="ARM" ;;
            x86)        NAMES="Intel 80386" ;;
          esac
          WANT_RE=$(printf '%s' "$NAMES" | tr ' ' '\n' | paste -sd'|')
          BAD=0
          for A in "$SD_ROOT"/lib/*.a; do
            if file -b "$A" | grep -Eq "$WANT_RE"; then
              echo "  OK   $(basename "$A") is $ABI_NAME"
            else
              echo "  WRONG $(basename "$A"): $(file -b "$A" | cut -c1-80)"
              BAD=$((BAD+1))
            fi
          done
          test "$BAD" -eq 0 || {
            echo "::error::$BAD archive(s) in $SD_ROOT are not $ABI_NAME."
            exit 1
          }

          echo "GS_SD_PREBUILT=$GITHUB_WORKSPACE/$SD_ROOT" >> "$GITHUB_ENV"
          echo "GS_SD_PREBUILT=$GITHUB_WORKSPACE/$SD_ROOT"
          echo "diffusion is IN-PROCESS for $ABI_NAME: no subprocess, no sd-cli"

      - name: Build libgs_ffi.so
        working-directory: native
        env:
          # THE NDK CLANG WRAPPER AS THE LINKER DRIVER, PER TRIPLE.
          #
          # rust-lld rejects VALID aarch64 Android objects:
          #     ld: error: .../android-arm64-v8a/lib/libllama.a(llama.cpp.o)
          #     is incompatible with aarch64linux
          # The archives are not at fault. Parsed out of the package from run
          # 36519820938: libllama.a objects=169 {'AArch64': 169}, and the member
          # ld names is llama.cpp.o ELF64 LSB OSABI 0 REL AArch64 e_flags 0x0.
          # "aarch64linux" is the collapsed triple rust-lld reports; it refuses
          # an object whose flags the NDK's own driver accepts. The fix is the NDK
          # driver, not the bytes.
          #
          # Environment variables, NOT native/.cargo/config.toml: that file is
          # checked in and a hardcoded /mnt/new_volume/android-ndk/... path does
          # not exist on a runner.
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang
          CARGO_TARGET_I686_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android24-clang
        run: |
          set -euo pipefail
          # THE LINKER MUST EXIST AND BE THE RIGHT TRIPLE. A wrong path is not a
          # link error, it is "linker not found" minutes in -- or worse, a silent
          # fallback to rust-lld and this identical error all over again.
          WANT_LINKER=""
          case "${{ matrix.target }}" in
            aarch64-linux-android)   WANT_LINKER="aarch64-linux-android24-clang" ;;
            armv7-linux-androideabi) WANT_LINKER="armv7a-linux-androideabi24-clang" ;;
            x86_64-linux-android)    WANT_LINKER="x86_64-linux-android24-clang" ;;
            i686-linux-android)      WANT_LINKER="i686-linux-android24-clang" ;;
          esac
          LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$WANT_LINKER"
          echo "linker: $LINKER"
          if [ ! -x "$LINKER" ]; then
            echo "::error::$WANT_LINKER is not executable at $LINKER"
            ls -l "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/" | sed -n '1,25p'
            exit 1
          fi
          echo "  linker -dumpmachine: $("$LINKER" -dumpmachine)"

          # cargo-ndk sets CC_*_ANDROID_LINKER and friends for the targets it is
          # given. There is no `cargo ndk env` subcommand and no ndk-env file to
          # source: attempt 2 failed with
          #     error: no such command: `env`
          #     help: a command with a similar name exists: `new`
          # THE LINKER'S OWN VERBOSE OUTPUT, CAPTURED.
          #
          # The build fails with exactly one line of diagnosis:
          #     error: could not compile `gs-ffi` (lib) due to 1 previous error
          # and the error itself does not appear in the job log. cc-rs and cargo
          # both swallow it, so the only way to see which archive is being opened,
          # in what order, and which symbol fails to resolve is to ask the linker.
          #
          # -v is a link-arg, so it reaches the linker that rustc invokes and not
          # the compiler. It is passed via RUSTFLAGS rather than CARGO_ENCODED_*
          # because it must apply to every target of this cross build, including
          # the C++ cdylib that cc-rs produced.
          # -v captures the linker diagnostics; --allow-shlib-undefined stops a
          # companion whose symbols resolve at load time being rejected at link
          # time. RUSTFLAGS is EXTENDED, not overwritten: the previous form
          # dropped anything a caller had set.
          RUSTFLAGS="${{ env.RUSTFLAGS }} -C link-arg=-v -C link-arg=-Wl,--allow-shlib-undefined" \
            cargo ndk \
              -t ${{ matrix.target }} \
              -o "$GITHUB_WORKSPACE/dist/android/${{ matrix.abi }}" \
              build --release -p gs-ffi --lib 2>&1 | tee "$GITHUB_WORKSPACE/build-${{ matrix.abi }}.log"

          # ATTEMPT 5. cargo-ndk printed
          #     Copying libraries to .../dist/android/arm64-v8a
          # and then copied NOTHING, so the verify step died on
          #     MISSING: .../dist/android/arm64-v8a/libgs_ffi.so
          # with no indication of where the library actually went. Rather than
          # trust the copy, find the artifact and place it explicitly -- and say
          # which path it came from, so the next failure is diagnosable from the
          # log instead of requiring a re-run.
          # SHIP THE COMPANION. Raw, run 36425439967, the first run to execute a
          # test with the library actually in the APK:
          #     java.lang.UnsatisfiedLinkError: dlopen failed: library
          #     "libc++_shared.so" not found: needed by
          #     .../base.apk!/lib/x86_64/libgs_ffi.so
          #
          # Attempt 1 was `-C link-arg=-static-libstdc++`, which does not even
          # parse here:
          #     error: unexpected argument '-C' found
          # cargo ndk has no `--` passthrough for rustc flags.
          #
          # Shipping it is the correct answer anyway, not a fallback: this app
          # links onnxruntime, Tesseract/Leptonica and stable-diffusion.cpp, all
          # of which are C++ and all of which will need libc++_shared.so. An APK
          # for this product carries it regardless of what gs-ffi does.
          DIST="$GITHUB_WORKSPACE/dist/android/${{ matrix.abi }}"

          # THE DOCUMENTED PATH. NO find. NO ELF-MACHINE MATCH.
          #
          #   $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/<triple>/libc++_shared.so
          #
          # This is a fixed, documented, stable location in every NDK. Three runs
          # were spent trying to DISCOVER the file -- first a hardcoded path under
          # $ANDROID_NDK_ROOT (which points at a nonexistent ndk/27.3... because
          # this workflow sets ANDROID_NDK_HOME and ANDROID_NDK_ROOT to different
          # versions), then `find -type f` (which filters out the symlink), then
          # `find` plus a readelf Machine comparison. Every one of them was a
          # search for something whose address is written down.
          #
          # ANDROID_NDK_HOME, not ANDROID_NDK_ROOT: step 5 sets both and they
          # disagree, and this workflow's own comment records that.
          SYSLIB="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          CPP="$SYSLIB/${{ matrix.triple }}/libc++_shared.so"
          echo "NDK       : $ANDROID_NDK_HOME"
          echo "sysroot   : $SYSLIB"
          echo "companion : $CPP"
          ls -ld "$ANDROID_NDK_HOME" "$SYSLIB" 2>&1 | sed -n '1,4p' || true

          if [ ! -f "$CPP" ]; then
            # The install is broken, not our path. Prove that with ls rather than
            # asserting it, then reinstall once.
            echo "=== NOT AT THE DOCUMENTED PATH. What is actually in the sysroot: ==="
            ls -1 "$SYSLIB" 2>&1 | sed -n '1,30p' || true
            echo "=== and in the triple directory we expected ==="
            ls -la "$SYSLIB/${{ matrix.triple }}" 2>&1 | sed -n '1,30p' || true
            echo "=== reinstalling the NDK once ==="
            yes | sdkmanager --install "ndk;$NDK_VERSION" >/dev/null 2>&1 || true
            if [ ! -f "$CPP" ]; then
              echo "::error::libc++_shared.so still absent from the documented path after reinstalling the NDK."
              echo "  $CPP"
              echo "Raw listing above is the evidence. The NDK install is broken."
              exit 1
            fi
          fi

          cp "$CPP" "$DIST/libc++_shared.so"
          ls -l "$DIST/"
          echo "  readelf says it is a $(readelf -h "$DIST/libc++_shared.so" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p') shared object"

          # COMPLETENESS, NOT A GUESS. A JNI library that will not dlopen without
          # a second .so is not self-contained, and the missing companion is
          # invisible until System.loadLibrary on a device: the APK builds, the
          # install succeeds, the ELF machine is right, and only dlopen reveals
          # it. So read the DT_NEEDED of what was just built and require that
          # every non-system dependency is physically present beside it.
          #
          # This is deliberately not "is libc++_shared there" -- that was the
          # previous assertion and it would have passed a library missing some
          # other companion. Anything dlopen would need must be in this directory.
          echo "=== DT_NEEDED completeness check ==="
          MISSING=""
          for NEED in $(readelf -d "$DIST/libgs_ffi.so" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p'); do
            case "$NEED" in
              libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libz.so|libjnigraphics.so|libEGL.so|libGLESv2.so|libOpenSLES.so|libnativewindow.so)
                echo "  system  $NEED" ;;
              *)
                if [ -f "$DIST/$NEED" ]; then
                  echo "  present $NEED"
                else
                  echo "  MISSING $NEED"
                  MISSING="$MISSING $NEED"
                fi ;;
            esac
          done
          if [ -n "$MISSING" ]; then
            echo "::error::libgs_ffi.so needs$MISSING and none is in $DIST."
            echo "The APK would build, install, and then fail at System.loadLibrary."
            exit 1
          fi
          echo "  every dlopen dependency is accounted for"

          # REFUSE TO SHIP A PORTABLE LIBRARY. This is the check whose absence
          # let a portable-only .so reach a device, export ten symbols, and pass
          # every build-time gate in the repository. build.rs already announces
          # this condition; the workflow just never read the announcement.
          # POSITIVE CHECK ONLY. This used to be
          #     grep -q 'portable mobile build' && exit 1
          # which could NEVER pass: build.rs printed that line unconditionally for
          # every mobile target, before attempting the llama.cpp linkage, so it
          # proved only "the target is mobile". It is gone from build.rs now; the
          # gate asserts the positive fact instead.
          if ! grep -q 'WITH a llama.cpp backend' "$GITHUB_WORKSPACE/build-${{ matrix.abi }}.log"; then
            echo "::error::the build log does not confirm a llama.cpp backend was linked."
            grep -iE 'llama|backend|prebuilt' "$GITHUB_WORKSPACE/build-${{ matrix.abi }}.log" | sed -n '1,20p' || true
            exit 1
          fi
          echo "  build log confirms a llama.cpp backend is compiled in"

          TRI="${{ matrix.target }}"
          DEST="$GITHUB_WORKSPACE/dist/android/${{ matrix.abi }}"
          mkdir -p "$DEST"
          FOUND=""
          for CANDIDATE in \
            "$DEST/libgs_ffi.so" \
            "target/$TRI/release/libgs_ffi.so" \
            "target/$TRI/release/deps/libgs_ffi.so"; do
            if [ -f "$CANDIDATE" ]; then FOUND="$CANDIDATE"; break; fi
          done
          if [ -z "$FOUND" ]; then
            echo "MISSING: libgs_ffi.so for $TRI. What is actually there:"
            find target -name 'libgs_ffi*' -o -name '*.so' | sed -n '1,40p' || true
            echo "--- and the crate types gs-ffi declares ---"
            sed -n '/^\[lib\]/,/^\[/p' crates/gs-ffi/Cargo.toml
            exit 1
          fi
          echo "found: $FOUND"
          if [ "$FOUND" != "$DEST/libgs_ffi.so" ]; then
            cp "$FOUND" "$DEST/libgs_ffi.so"
            echo "copied to $DEST/libgs_ffi.so"
          fi
          file "$DEST/libgs_ffi.so"
          # A cdylib that exists but exports nothing loads and fails at the
          # first call, so the ABI is asserted, not assumed.
          N=$(nm -D --defined-only "$DEST/libgs_ffi.so" | grep -c 'gs_ffi_mobile_' || true)
          ABI="$GITHUB_WORKSPACE/.github/scripts/gs_mobile_abi.txt"
          WANT_N=$(grep -cve '^[[:space:]]*#' -e '^[[:space:]]*$' "$ABI")
          echo "gs_ffi_mobile_* exported: $N, ABI declares: $WANT_N"
          # The floor is DERIVED from the declared ABI, not written down beside
          # it. It used to be a literal 17 with a comment saying it "matches the
          # ABI", which it did not -- and a floor cannot notice a set growing, so
          # it would have gone on passing at 17 while the ABI was 18.
          #
          # A floor is still the right check HERE because this is the cheap step
          # that runs before the expensive one: a cdylib that exports nothing
          # loads and then fails at the first call, and that deserves to fail
          # fast. The floor cannot establish the ABI -- the full per-symbol
          # comparison in the verify step below does that, from the same file.
          [ "$N" -ge "$WANT_N" ] || {
            echo "::error::the .so exports $N gs_ffi_mobile_* entry points; the ABI declares $WANT_N"
            echo "::error::declared in $ABI -- add new symbols there, not to a number in this file"
            exit 1; }

      - name: Verify the artifact
        run: |
          set -euo pipefail
          SO="$GITHUB_WORKSPACE/dist/android/${{ matrix.abi }}/libgs_ffi.so"
          test -f "$SO" || { echo "MISSING: $SO"; exit 1; }
          echo "=== file ==="
          file "$SO"
          stat -c '%s bytes' "$SO"
          # A .so with no exported symbols loads and fails at the first call, so
          # the ABI is asserted, not assumed.
          echo "=== exported ABI ==="
          nm -D --defined-only "$SO" | grep -oE 'gs_[A-Za-z_0-9]+' | sort -u
          # ELEVEN PER-SYMBOL CHECKS, AND A FLOOR THAT WAS GOING QUIETLY LOOSE.
          #
          # This was `[ "$N" -ge 8 ]` against an ABI of TEN symbols, so the floor
          # was already 2 under. Adding seven image-generation entry points made
          # the ABI SEVENTEEN and the floor NINE under -- which is the failure
          # mode Item 4's CI audit is for: a gate that keeps passing while the
          # thing it guards gets bigger. A floor count can also pass with the
          # WRONG symbols present, which a per-symbol check cannot.
          #
          # Every symbol is named, read out of the .so, and the names are compared
          # as a SET. Read from the source rather than remembered: the whole
          # stable-diffusion ABI was nearly misnamed as `stable_diffusion_*` when
          # the pinned upstream header was actually fetched.
          # The SAME file the floor check read, so the two cannot disagree. The
          # inline list this replaced was a second copy of the ABI in a
          # different format, and the floor beside it was a third copy as a
          # number -- three places to update, which is three chances to update
          # two of them.
          ABI="$GITHUB_WORKSPACE/.github/scripts/gs_mobile_abi.txt"
          [ -r "$ABI" ] || { echo "::error::the ABI list $ABI is missing or unreadable"; exit 1; }
          WANT=$(grep -ve '^[[:space:]]*#' -e '^[[:space:]]*$' "$ABI" | sed 's/^/gs_ffi_mobile_/' | sort -u)
          GOT=$(nm -D --defined-only "$SO" | grep -oE 'gs_ffi_mobile_[A-Za-z_0-9]+' | sort -u)
          echo "expected $(printf '%s\n' "$WANT" | wc -l | tr -d ' ') symbols, found $(printf '%s\n' "$GOT" | wc -l | tr -d ' ')"
          MISSING=$(comm -23 <(printf '%s\n' "$WANT") <(printf '%s\n' "$GOT"))
          UNEXPECTED=$(comm -13 <(printf '%s\n' "$WANT") <(printf '%s\n' "$GOT"))
          if [ -n "$MISSING" ]; then
            echo "::error::the DEVICE .so does not export:"
            printf '%s\n' "$MISSING" | sed 's/^/    /'
            exit 1
          fi
          if [ -n "$UNEXPECTED" ]; then
            # Reported, not fatal. An extra export is a compatibility question,
            # not a broken build, and failing on it would make the gate
            # impossible to extend without editing this file first.
            echo "::warning::the .so exports gs_ffi_mobile_* symbols this check does"
            echo "::warning::not know about -- add them to .github/scripts/gs_mobile_abi.txt deliberately:"
            printf '%s\n' "$UNEXPECTED" | sed 's/^/    /'
          fi
          echo "all $(printf '%s\n' "$WANT" | wc -l | tr -d ' ') expected gs_ffi_mobile_* symbols present"

          # THE LIBRARY MUST NOT BE ABLE TO RUN A SHELL.
          #
          # The image path is in-process now -- the old one spawned `sd-cli` from a
          # path on a developer machine, which a phone has neither of -- and this is
          # the check that says so about the SHIPPED ARTIFACT rather than about the
          # source. The device test c2 pins the same fact from the other side: it
          # parses .dynsym on the device and can establish WHICH symbols are
          # imported, but not WHO CALLS them, because nm and objdump do not exist on
          # an Android device. The split is by what each place can actually prove.
          #
          # The claim is NOT "no process-creating symbol". Measured on the x86_64
          # build from run 36877377145, the shipped library imports three:
          #
          #     execlp, fork, waitpid
          #
          # all called from exactly one place -- ggml_print_backtrace, which forks
          # `addr2line` to symbolise a stack trace when ggml is about to abort. That
          # is the crash path, not the image path, and it is in a library this
          # project does not own and would not want to lose, because it is what
          # makes a crash log worth reading.
          #
          # The claim IS that the SET is exactly those three and each has exactly
          # one caller -- so a dependency that starts spawning is NAMED, not
          # absorbed.
          bash "$GITHUB_WORKSPACE/.github/scripts/check_no_process_spawn.sh" "$SO"
          # The JNI entry points must be present or the Kotlin bridge cannot
          # bind at all.
          JNI=$(nm -D --defined-only "$SO" | grep -c 'Java_com_grapsee_gsai_native_GsNative_' || true)
          echo "JNI entry points: $JNI"
          case "${{ matrix.abi }}" in
            arm64-v8a)   ARCH="aarch64" ;;
            armeabi-v7a) ARCH="ARM" ;;
            x86_64)      ARCH="x86-64" ;;
            x86)         ARCH="Intel 80386" ;;
          esac
          file "$SO" | grep -q "$ARCH" || {
            echo "FAIL: $ARCH not in: $(file "$SO")"; exit 1; }
          echo "VERIFIED: ${{ matrix.abi }} = $ARCH with the mobile ABI"

      - name: Upload the build and link logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.abi }}
          path: |
            build-*.log
            ${{ runner.temp }}/link.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload libgs_ffi.so
        uses: actions/upload-artifact@v4
        with:
          name: libgs_ffi-${{ matrix.abi }}
          path: dist/android/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 14
