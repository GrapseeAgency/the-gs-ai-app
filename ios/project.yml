name: GSApp
options:
  bundleIdPrefix: com.grapsee
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: "NO"
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grapsee.gsai
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: GS AI
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSSpeechRecognitionUsageDescription: GS turns your voice into text for your prompts when you hold the voice orb.
        NSMicrophoneUsageDescription: GS uses the microphone when you hold the voice orb to talk.
  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    dependencies:
      - target: App
schemes:
  GSApp:
    build:
      targets:
        App: all
    test:
      targets:
        - AppTests
