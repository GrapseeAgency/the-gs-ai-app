<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body,#root{width:100%;height:100%;margin:0;padding:0;background:transparent;overflow:hidden}
#root{position:relative;pointer-events:none}
/* Override layout only, never the library's drawing or animation. The vendor
   canvas is already overscanned; map ALL of its backing pixels to the slot.
   Inline negative offsets/margins are inappropriate in a dedicated viewport. */
#root canvas{
  display:block!important;
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  margin:0!important;
  padding:0!important;
  transform:none!important;
  translate:none!important;
  box-sizing:border-box!important;
}
</style>
<script defer src="./avatar.bundle.js"></script>
</head><body><div id="root" aria-hidden="true"></div></body></html>
