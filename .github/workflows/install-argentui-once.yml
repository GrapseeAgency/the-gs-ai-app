name: Install ArgentUI once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-argentui-once.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install published package and documented peer
        run: |
          npm install --save-exact --ignore-scripts --no-audit --no-fund argentui@0.4.1 @paper-design/shaders-react@0.0.76
          npm ls argentui @paper-design/shaders-react --depth=0
          bun install --lockfile-only --ignore-scripts
          node -e 'const p=require("./package.json"); if(p.dependencies.argentui!=="0.4.1") process.exit(1)'
      - name: Commit dependency files only and remove this one-shot installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json bun.lock
          git rm .github/workflows/install-argentui-once.yml
          git diff --cached --stat
          git commit -m "chore: install ArgentUI and its shader peer"
          git push origin HEAD:main
